<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cangling Test __VERSION__</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      background: #12141a; color: #ece7dc;
    }
    main {
      width: min(560px, calc(100vw - 32px));
      background: #1a1d27; border: 1px solid #2c3240; border-radius: 16px;
      padding: 32px 28px; text-align: center;
    }
    .kicker { letter-spacing: 0.16em; text-transform: uppercase; color: #8d93a5; font-size: 12px; }
    h1 { margin: 10px 0 6px; font-size: 20px; font-weight: 650; }
    .ver {
      margin: 22px 0 8px; font-size: 64px; line-height: 1; font-weight: 750;
      color: #e2a03a; letter-spacing: 0.02em;
    }
    p { color: #8d93a5; font-size: 14px; line-height: 1.55; }
    code { color: #ece7dc; }
  </style>
</head>
<body>
  <main>
    <div class="kicker">cangling-test</div>
    <h1>当前镜像版本</h1>
    <div class="ver">__VERSION__</div>
    <p>若升级成功，刷新本页应看到新的版本号。<br/>也可访问 <code>/version</code> 获取纯文本版本。</p>
  </main>
</body>
</html>
