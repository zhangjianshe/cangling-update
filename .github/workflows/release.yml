name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: cangling-update-linux-amd64
            extra_apt: ""
          - target: aarch64-unknown-linux-gnu
            asset: cangling-update-linux-arm64
            # 同时安装交叉编译器和 arm64 架构专属的 C 标准库头文件，解决 libsqlite3-sys 等依赖编译报错
            extra_apt: gcc-aarch64-linux-gnu libc6-dev-arm64-cross

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross linker
        if: matrix.extra_apt != ''
        run: |
          # 1. 彻底删除系统默认的所有 apt 源配置文件（包括 ubuntu.sources 等），防止 azure 源残留卡顿
          sudo rm -f /etc/apt/sources.list.d/*.sources
          sudo rm -f /etc/apt/sources.list.d/*.list
          
          # 2. 重新写入干净的主源
          sudo tee /etc/apt/sources.list << 'EOF'
          deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          EOF
          
          # 3. 更新并安装
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.extra_apt }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-${{ matrix.target }}
          cache-on-failure: true

      - name: Build release
        env:
          CARGO_TERM_COLOR: always
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          # 显式告知交叉编译器 arm64 头文件的路径，确保内置 C 源码（如 sqlite3）能够正确编译
          CFLAGS_aarch64_unknown_linux_gnu: "-I/usr/aarch64-linux-gnu/include"
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/cangling-update"
          dst="dist/${{ matrix.asset }}"
          cp "$src" "$dst"
          chmod +x "$dst"
          
          # 修复 sha256sum 输出格式，使其只包含文件名，避免路径污染
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          
          file "$dst"
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/cangling-update-linux-amd64
            dist/cangling-update-linux-amd64.sha256
            dist/cangling-update-linux-arm64
            dist/cangling-update-linux-arm64.sha256
          fail_on_unmatched_files: true