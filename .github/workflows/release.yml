name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: cangling-update-linux-amd64
          - target: aarch64-unknown-linux-musl
            asset: cangling-update-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-${{ matrix.target }}
          cache-on-failure: true

      - name: Build release
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/cangling-update"
          dst="dist/${{ matrix.asset }}"
          cp "$src" "$dst"
          chmod +x "$dst"
          
          # 修复 sha256sum 输出格式，使其只包含文件名，避免路径污染
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          
          file "$dst"
          ldd "$dst" 2>&1 || true
          if ! file "$dst" | grep -Eq 'statically linked|static-pie'; then
            echo "expected a static musl binary" >&2
            exit 1
          fi
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error


  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/cangling-update-linux-amd64
            dist/cangling-update-linux-amd64.sha256
            dist/cangling-update-linux-arm64
            dist/cangling-update-linux-arm64.sha256
          fail_on_unmatched_files: true
      - name: Upload to soft.cangling.cn
        run: |
          # output a version.txt
          echo "${{ github.ref_name }}" > dist/version.txt
          # Upload AMD64 binary
          curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
            -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
            -F "token=26deab4218cf40d3a611f87fd4dd9018" \
            -F "version=latest" \
            -F "name=cangling-update" \
            -F "summary=Automatic release for version ${{ github.ref_name }}" \
            -F "os=linux" \
            -F "arch=amd64" \
            -F "file=@dist/cangling-update-linux-amd64"
          
          # Upload ARM64 binary
          curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
            -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
            -F "token=26deab4218cf40d3a611f87fd4dd9018" \
            -F "version=latest" \
            -F "name=cangling-update" \
            -F "summary=Automatic release for version ${{ github.ref_name }}" \
            -F "os=linux" \
            -F "arch=arm64" \
            -F "file=@dist/cangling-update-linux-arm64"
          
           # Upload Version
          curl -k -X POST "https://soft.cangling.cn:22002/api/v1/software/upload" \
            -H "API-TOKEN: ${{ secrets.CANGLING_TOKEN }}" \
            -F "token=26deab4218cf40d3a611f87fd4dd9018" \
            -F "version=latest" \
            -F "name=cangling-update-version" \
            -F "summary=${{ github.ref_name }}" \
            -F "os=linux" \
            -F "arch=arm64" \
            -F "file=@dist/version.txt"
