name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: cangling-update-linux-amd64
            extra_apt: ""
          - target: aarch64-unknown-linux-gnu
            asset: cangling-update-linux-arm64
            extra_apt: gcc-aarch64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross linker
        if: matrix.extra_apt != ''
        run: |
          # 替换为标准主源，解决 azure 镜像源偶尔限速/卡顿的问题
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.extra_apt }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-${{ matrix.target }}
          cache-on-failure: true

      - name: Build release
        env:
          CARGO_TERM_COLOR: always
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/cangling-update"
          dst="dist/${{ matrix.asset }}"
          cp "$src" "$dst"
          chmod +x "$dst"
          
          # 修复 sha256sum 输出格式，使其只包含文件名，避免路径污染
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          
          file "$dst"
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/cangling-update-linux-amd64
            dist/cangling-update-linux-amd64.sha256
            dist/cangling-update-linux-arm64
            dist/cangling-update-linux-arm64.sha256
          fail_on_unmatched_files: true