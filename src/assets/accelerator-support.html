<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU/NPU/DCU 集成支持表</title>
<style>body{margin:0;font:15px system-ui;color:#17283d;background:#f6f8fc}main{margin:24px auto;max-width:1500px;padding:24px;background:white;border:1px solid #dbe4f0;border-radius:8px}h1{font-size:24px}p{color:#64748b;line-height:1.7}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:12px;text-align:left;border-bottom:1px solid #dbe4f0;vertical-align:top}th{background:#f0f5fb}td{line-height:1.6}a{color:#2563eb}.error{color:#b91c1c}</style>
<main><a href="../">返回控制台</a><h1>GPU/NPU/DCU 集成支持表</h1><p>首批支持 NVIDIA、海光。设备发现、插件注册、容器访问和算法兼容性是不同的验证阶段；本表不把“可诊断”视为已完成集成。内核驱动和固件需预先安装，离线包统一存放于 cangling-repo/accelerators。</p><p id="message">正在加载支持表…</p><div style="overflow:auto"><table><thead><tr><th>设备 / 型号</th><th>CPU 架构</th><th>操作系统</th><th>资源名</th><th>自动操作范围与前提</th><th>验证记录</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
(async()=>{const message=document.getElementById('message');try{const url=new URL('../api/k3s/accelerator-integration/catalog',location.href);const res=await fetch(url,{credentials:'same-origin'});if(!res.ok)throw Error(res.status===401?'登录已过期，请返回控制台登录后刷新。':'加载失败：HTTP '+res.status);const data=await res.json();const rows=document.getElementById('rows');for(const p of data.profiles){const tr=document.createElement('tr');const fields=[p.name+'：'+p.models.join('、'),p.architectures.join(' / ')||'待确认',p.systems.join('；'),p.resources.join('、')||'待确认',(p.automatic?'检查与有限修复':'仅诊断 / 待适配')+'；'+p.requirements.join('；'),p.validation];for(const text of fields){const td=document.createElement('td');td.textContent=text;tr.append(td);}rows.append(tr);}message.textContent='修复前会展示目标节点、离线包和操作计划；已正常集成的节点无需修改。';}catch(e){message.className='error';message.textContent=e.message;}})();
</script></html>
