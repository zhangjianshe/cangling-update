    async function waitCanglingJarJob(id, successPrefix = "") {
      if (canglingJarJobWatch === id) return;
      if (canglingJarJobWatch) throw new Error("已有 JAR 任务正在运行");
      canglingJarJobWatch = id;
      const online = $("#cangling-jar-online");
      const remove = $("#cangling-jar-delete");
      if (online) online.disabled = true;
      if (remove) remove.disabled = true;
      const sync = $("#cangling-jar-sync");
      const upload = $("#cangling-jar-select");
      if (sync) sync.disabled = true;
      if (upload) upload.disabled = true;
      setCanglingJarProgressPhase("sync");
      showProgress("cangling-jar-prog", true);
      try {
        while (true) {
          const job = await api("/api/jobs/" + id);
          setCanglingJarProgressPhase(job.phase === "jar-download" ? "upload" : job.phase === "jar-verify" ? "check" : "sync");
          renderProgress("cangling-jar-prog", job);
          if (job.done) {
            if (job.error) throw new Error(job.error);
            flash("ok", successPrefix + (job.message || "JAR 同步完成"));
            return job;
          }
          await new Promise((resolve) => setTimeout(resolve, 500));
        }
      } catch (error) {
        await showCanglingJarProgressError(error.message);
        error.canglingJarProgressShown = true;
        throw error;
      } finally {
        canglingJarJobWatch = "";
        if (online) online.disabled = false;
        updateCanglingJarDeleteState();
        if (sync) sync.disabled = false;
        if (upload) upload.disabled = false;
        showProgress("cangling-jar-prog", false);
        await loadCanglingJars();
      }
    }

    async function syncCanglingJars() {
      try {
        const job = await api("/api/cangling/apps/jars/sync", { method: "POST" });
        await waitCanglingJarJob(job.id);
      } catch (error) {
        if (!error.canglingJarProgressShown) await showCanglingJarProgressError(error.message);
        flash("err", "同步 JAR 失败：" + error.message);
      }
    }

    async function sha256JarFile(file, onProgress) {
      if (!window.CanglingSha256) throw new Error("SHA-256 模块未加载，请刷新页面重试");
      const digest = new window.CanglingSha256();
      const chunkSize = 4 * 1024 * 1024;
      let offset = 0;
      while (offset < file.size) {
        const end = Math.min(offset + chunkSize, file.size);
        digest.update(new Uint8Array(await file.slice(offset, end).arrayBuffer()));
        offset = end;
        if (onProgress) onProgress(offset);
        await new Promise((resolve) => setTimeout(resolve, 0));
      }
      return digest.hex();
    }

    async function preflightCanglingJars(files) {
      const total = files.reduce((sum, file) => sum + (file.size || 0), 0);
      let completed = 0;
      const checks = [];
      setCanglingJarProgressPhase("check");
      showProgress("cangling-jar-prog", true);
      for (const file of files) {
        const base = completed;
        renderProgress("cangling-jar-prog", { message: `正在校验 ${file.name}…`, percent: total ? Math.round(base / total * 100) : 0, current: base, total });
        const sha256 = await sha256JarFile(file, (current) => {
          const loaded = base + current;
          renderProgress("cangling-jar-prog", { message: `正在校验 ${file.name}…`, percent: total ? Math.round(loaded / total * 100) : 100, current: loaded, total });
        });
        completed += file.size || 0;
        checks.push({ name: file.name, size: file.size || 0, sha256 });
      }
      renderProgress("cangling-jar-prog", { message: "正在与服务器 JAR 比较…", percent: 100, current: total, total });
      return api("/api/cangling/apps/jars/preflight", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ files: checks }),
      });
    }

    async function uploadCanglingJars(fileList) {
      const files = Array.from(fileList || []);
      const input = $("#cangling-jar-file");
      if (!files.length) return;
      const invalid = files.find((file) => !/\.jar$/i.test(file.name));
      if (invalid) {
        flash("err", `${invalid.name} 不是 JAR 包`);
        if (input) input.value = "";
        return;
      }
      const names = new Set();
      const duplicate = files.find((file) => names.has(file.name) || !names.add(file.name));
      if (duplicate) {
        flash("err", `不能同时上传两个同名文件：${duplicate.name}`);
        if (input) input.value = "";
        return;
      }
      try {
        const preflight = await preflightCanglingJars(files);
        const statuses = new Map((preflight.files || []).map((item) => [item.name, item]));
        const changed = files.filter((file) => !(statuses.get(file.name) || {}).same);
        const skipped = files.length - changed.length;
        if (!changed.length) {
          const job = await api("/api/cangling/apps/jars/sync", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ files: files.map((file) => file.name) }),
          });
          await waitCanglingJarJob(job.id, `${skipped} 个 JAR 与服务器一致，已跳过上传；`);
          return;
        }
        const form = new FormData();
        form.append("sync_names", JSON.stringify(files.map((file) => file.name)));
        changed.forEach((file) => form.append("files", file, file.name));
        const total = changed.reduce((sum, file) => sum + (file.size || 0), 0);
        setCanglingJarProgressPhase("upload");
        showProgress("cangling-jar-prog", true);
        renderProgress("cangling-jar-prog", { message: skipped ? `${skipped} 个相同文件已跳过，正在上传其余 JAR…` : "正在上传 JAR 包…", percent: 0, current: 0, total });
        const result = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.upload.onprogress = (event) => {
            if (event.lengthComputable) renderProgress("cangling-jar-prog", { message: skipped ? `${skipped} 个相同文件已跳过，正在上传其余 JAR…` : "正在上传 JAR 包…", percent: Math.round(event.loaded / event.total * 100), current: event.loaded, total: event.total });
          };
          xhr.onload = () => {
            let payload = {};
            try { payload = JSON.parse(xhr.responseText || "{}"); } catch { payload = { error: xhr.responseText }; }
            if (xhr.status >= 400) reject(new Error(payload.error || xhr.statusText));
            else resolve(payload);
          };
          xhr.onerror = () => reject(new Error("上传连接失败"));
          xhr.open("POST", appPath("/api/cangling/apps/jars/upload"));
          xhr.send(form);
        });
        if (!result.syncJob || !result.syncJob.id) throw new Error("服务器未创建同步任务");
        renderProgress("cangling-jar-prog", { message: "上传完成，准备同步到其他节点…", percent: 100, current: total, total });
        await waitCanglingJarJob(result.syncJob.id, skipped ? `${skipped} 个相同 JAR 已跳过上传；` : "");
      } catch (error) {
        if (!error.canglingJarProgressShown) await showCanglingJarProgressError(error.message);
        flash("err", "上传 JAR 失败：" + error.message);
      } finally {
        if (input) input.value = "";
        showProgress("cangling-jar-prog", false);
      }
    }

    function stopCanglingRuntimePoll() {
      if (canglingRuntimePoll.timer) {
        clearInterval(canglingRuntimePoll.timer);
        canglingRuntimePoll.timer = null;
      }
    }

    function canglingRuntimeEvent(pod, events) {
      const metadata = pod.metadata || {};
      const matches = (events || []).filter((event) => {
        const involved = event.involvedObject || {};
        return involved.uid === metadata.uid || (involved.kind === "Pod" && involved.name === metadata.name);
      });
      matches.sort((left, right) => {
        const time = (event) => new Date(event.eventTime || event.lastTimestamp || event.metadata && event.metadata.creationTimestamp || 0).getTime();
        const warning = (event) => event.type === "Warning" ? 1 : 0;
        return warning(right) - warning(left) || time(right) - time(left);
      });
      return matches[0] || null;
    }

    function canglingEventTime(event) {
      if (!event) return "—";
      return fmtDateTime(event.eventTime || event.lastTimestamp || event.metadata && event.metadata.creationTimestamp || "");
    }

    function canglingPodDiagnosis(pod, events) {
      const status = pod.status || {};
      const statuses = [...(status.initContainerStatuses || []), ...(status.containerStatuses || [])];
      let waitingFallback = null;
      for (const container of statuses) {
        const waiting = container.state && container.state.waiting;
        if (waiting) {
          const diagnosis = { reason: waiting.reason || "等待启动", message: waiting.message || "容器正在等待启动" };
          if (!["ContainerCreating", "PodInitializing"].includes(waiting.reason)) return diagnosis;
          waitingFallback = diagnosis;
        }
        const terminated = container.state && container.state.terminated;
        if (terminated && terminated.exitCode !== 0) return { reason: terminated.reason || `退出 ${terminated.exitCode}`, message: terminated.message || `容器退出码 ${terminated.exitCode}` };
      }
      const scheduled = (status.conditions || []).find((item) => item.type === "PodScheduled" && item.status === "False");
      if (scheduled) return { reason: scheduled.reason || "无法调度", message: scheduled.message || "Pod 尚未分配到节点" };
      const event = canglingRuntimeEvent(pod, events);
      if (event && (event.type === "Warning" || status.phase !== "Running")) {
        return { reason: event.reason || event.type || "事件", message: event.message || "K3s 报告了异常事件" };
      }
      if (waitingFallback) return waitingFallback;
      const containers = status.containerStatuses || [];
      if (status.phase === "Running" && containers.length && containers.every((item) => item.ready)) return { reason: "运行正常", message: "所有容器均已就绪" };
      return { reason: status.reason || status.phase || "等待状态", message: status.message || "正在等待 K3s 更新运行状态" };
    }

    function renderCanglingRuntime() {
      const root = $("#cangling-runtime-root");
      if (!root) return;
      const data = state.canglingRuntime;
      if (!data) {
        root.innerHTML = `<div class="empty db-loading"><span class="spin"></span>正在读取应用运行状态…</div>`;
        return;
      }
      const deployments = data.deployments || [];
      const deploymentRows = deployments.map((item, index) => {
        const metadata = item.metadata || {}, spec = item.spec || {}, status = item.status || {};
        const desired = spec.replicas == null ? 1 : spec.replicas;
        const ready = status.readyReplicas || 0;
        const available = status.availableReplicas || 0;
        const ok = desired > 0 && ready >= desired;
        const condition = (status.conditions || []).slice().reverse().find((entry) => entry.status === "False" || entry.type === "Progressing") || {};
        const namespace = metadata.namespace || state.canglingConfig && state.canglingConfig.namespace || "cangling";
        const pending = canglingDeploymentRestarts.has(namespace + "/" + metadata.name);
        const blocked = !metadata.name || desired === 0 || spec.paused || metadata.deletionTimestamp;
        const restartHint = desired === 0 ? "副本数为 0，请先扩容后再重启" : spec.paused ? "部署已暂停，请先恢复后再重启" : metadata.deletionTimestamp ? "工作负载正在删除" : "滚动重启该工作负载的全部 Pod";
        return `<tr><td class="runtime-status"><span class="dot ${ok ? "online" : "offline"}"></span>${ok ? "已就绪" : "未就绪"}</td><td class="k3s-resource-name runtime-name">${esc(metadata.name || "—")}</td><td class="runtime-count">${ready}/${desired}</td><td class="runtime-count">${available}</td><td class="runtime-reason">${esc(condition.reason || (ok ? "运行正常" : "等待 Pod 就绪"))}</td><td class="runtime-time">${esc(fmtDateTime(metadata.creationTimestamp))}</td><td class="runtime-actions"><button type="button" class="btn" data-cangling-deployment-restart="${index}" title="${esc(restartHint)}" ${pending || blocked ? "disabled" : ""}>${pending ? "处理中…" : "重启"}</button></td></tr>`;
      }).join("");
      root.innerHTML = `
        <div class="k3s-summary">
          <div class="k3s-stat"><span>Deployment</span><strong>${deployments.filter((item) => { const spec = item.spec || {}; return (item.status && item.status.readyReplicas || 0) >= (spec.replicas == null ? 1 : spec.replicas); }).length}/${deployments.length}</strong></div>
          <div class="k3s-stat"><span>更新时间</span><strong>${esc(fmtDateTime(data.checkedAt))}</strong></div>
        </div>
        <div class="cangling-section-head"><h3>工作负载</h3><p class="hint">Deployment 的期望、就绪及可用副本</p></div>
        <div class="cangling-table-wrap"><table class="cluster-table cangling-runtime-table"><thead><tr><th class="runtime-status">状态</th><th class="runtime-name">名称</th><th class="runtime-count">就绪/期望</th><th class="runtime-count">可用</th><th class="runtime-reason">说明</th><th class="runtime-time">创建时间</th><th class="runtime-actions">操作</th></tr></thead><tbody>${deploymentRows || '<tr><td colspan="7" class="empty">当前命名空间没有 Deployment</td></tr>'}</tbody></table></div>`;
      root.querySelectorAll("[data-cangling-deployment-restart]").forEach((button) => {
        button.onclick = () => restartCanglingDeployment(deployments[Number(button.dataset.canglingDeploymentRestart)]);
      });
    }

    async function restartCanglingDeployment(item) {
      const metadata = item && item.metadata || {};
      const spec = item && item.spec || {};
      const namespace = metadata.namespace || state.canglingConfig && state.canglingConfig.namespace || "cangling";
      const name = metadata.name;
      const key = namespace + "/" + name;
      if (!name || spec.replicas === 0 || spec.paused || metadata.deletionTimestamp || canglingDeploymentRestarts.has(key)) return;
      canglingDeploymentRestarts.add(key);
      renderCanglingRuntime();
      try {
        if (!(await confirmDialog(`确定滚动重启工作负载 ${namespace}/${name}？将按部署策略重新创建该工作负载的全部 Pod，单副本服务可能短暂不可用。`, { danger: true, confirmText: "重启" }))) return;
        await api("/api/k3s/workloads/deployments/" + encodeURIComponent(namespace) + "/" + encodeURIComponent(name) + "/restart", { method: "POST" });
        flash("ok", `已请求滚动重启 ${name}，就绪状态将自动刷新`);
        await loadCanglingRuntime(true);
      } catch (error) {
        flash("err", `重启工作负载 ${name} 失败：${error.message}`);
      } finally {
        canglingDeploymentRestarts.delete(key);
        renderCanglingRuntime();
      }
    }

    function renderCanglingDiagnosis() {
      const root = $("#cangling-diagnosis-root");
      if (!root) return;
      const data = state.canglingRuntime;
      if (!data) {
        root.innerHTML = `<div class="empty db-loading"><span class="spin"></span>正在读取事件…</div>`;
        return;
      }
      const pods = data.pods || [];
      const events = data.events || [];
      const healthyPods = pods.filter((pod) => {
        const statuses = pod.status && pod.status.containerStatuses || [];
        return pod.status && pod.status.phase === "Running" && statuses.length > 0 && statuses.every((item) => item.ready);
      }).length;
      const podRows = pods.map((pod, index) => {
        const metadata = pod.metadata || {}, status = pod.status || {};
        const containers = status.containerStatuses || [];
        const ready = containers.filter((item) => item.ready).length;
        const restarts = containers.reduce((sum, item) => sum + (item.restartCount || 0), 0);
        const diagnosis = canglingPodDiagnosis(pod, events);
        const latestEvent = canglingRuntimeEvent(pod, events);
        const ok = status.phase === "Running" && containers.length > 0 && ready === containers.length;
        return `<tr><td class="runtime-status"><span class="dot ${ok ? "online" : status.phase === "Failed" ? "offline" : "pending"}"></span>${esc(status.phase || "Unknown")}</td><td class="k3s-resource-name runtime-name">${esc(metadata.name || "—")}</td><td class="runtime-node">${esc(status.nodeName || "未调度")}</td><td class="runtime-count">${ready}/${containers.length}</td><td class="runtime-count">${restarts}</td><td class="runtime-reason"><strong class="${ok ? "ok" : "bad"}">${esc(diagnosis.reason)}</strong><div class="hint" title="${esc(diagnosis.message)}">${esc(diagnosis.message)}</div></td><td class="runtime-time">${esc(canglingEventTime(latestEvent))}</td><td class="runtime-actions"><button type="button" class="btn" data-cangling-runtime-pod="${index}">事件 / 日志</button></td></tr>`;
      }).join("");
      root.innerHTML = `
        <div class="k3s-summary">
          <div class="k3s-stat"><span>Pod 就绪</span><strong>${healthyPods}/${pods.length}</strong></div>
          <div class="k3s-stat"><span>异常 Pod</span><strong class="${healthyPods === pods.length ? "ok" : "bad"}">${pods.length - healthyPods}</strong></div>
          <div class="k3s-stat"><span>更新时间</span><strong>${esc(fmtDateTime(data.checkedAt))}</strong></div>
        </div>
        <div class="cangling-table-wrap"><table class="cluster-table cangling-runtime-table"><thead><tr><th class="runtime-status">阶段</th><th class="runtime-name">Pod</th><th class="runtime-node">节点</th><th class="runtime-count">就绪</th><th class="runtime-count">重启</th><th class="runtime-reason">原因</th><th class="runtime-time">最近事件</th><th class="runtime-actions">操作</th></tr></thead><tbody>${podRows || '<tr><td colspan="8" class="empty">当前命名空间没有 Pod；可能尚未应用 cangling.yaml</td></tr>'}</tbody></table></div>`;
      root.querySelectorAll("[data-cangling-runtime-pod]").forEach((button) => {
        button.onclick = () => openCanglingRuntimePod(pods[Number(button.dataset.canglingRuntimePod)]);
      });
    }

    async function loadCanglingRuntime(quiet = false) {
      if (canglingRuntimePoll.inflight || state.canglingTab !== "run" || ["jars", "data-init"].includes(state.canglingRunTab)) return;
      canglingRuntimePoll.inflight = true;
      const activeRunTab = state.canglingRunTab;
      const root = $("#cangling-" + activeRunTab + "-root");
      if (!quiet && root) root.innerHTML = `<div class="empty db-loading"><span class="spin"></span>正在读取应用运行状态…</div>`;
      try {
        const namespace = state.canglingConfig && state.canglingConfig.namespace || "cangling";
        state.canglingRuntime = await api("/api/cangling/apps/runtime?namespace=" + encodeURIComponent(namespace));
        if (activeRunTab !== state.canglingRunTab || state.canglingTab !== "run") return;
        if (activeRunTab === "containers") renderCanglingContainers();
        else if (activeRunTab === "diagnosis") renderCanglingDiagnosis();
        else if (["services", "configs"].includes(activeRunTab)) renderCanglingResources(activeRunTab);
        else renderCanglingRuntime();
      } catch (error) {
        if (state.canglingTab === "run" && activeRunTab === state.canglingRunTab) {
          if (root) root.innerHTML = `<div class="empty bad">读取运行状态失败：${esc(error.message)}<div style="margin-top:12px"><button type="button" class="btn" id="cangling-runtime-retry">重试</button></div></div>`;
          const retry = $("#cangling-runtime-retry");
          if (retry) retry.onclick = () => loadCanglingRuntime(false);
        }
      } finally {
        canglingRuntimePoll.inflight = false;
        if (state.canglingTab === "run" && activeRunTab !== state.canglingRunTab) loadCanglingRuntime(false);
      }
    }

    function canglingContainerRows() {
      const pods = state.canglingRuntime && state.canglingRuntime.pods || [];
      const services = state.canglingRuntime && state.canglingRuntime.services || [];
      const rows = [];
      for (const pod of pods) {
        const metadata = pod.metadata || {}, spec = pod.spec || {}, status = pod.status || {};
        const labels = metadata.labels || {};
        const podServices = services.filter((service) => {
          const selector = service.spec && service.spec.selector || {};
          const entries = Object.entries(selector);
          return entries.length > 0 && entries.every(([name, value]) => labels[name] === value);
        }).map((service) => {
          const ports = (service.spec && service.spec.ports || []).map((port) => `${port.port}${port.targetPort && String(port.targetPort) !== String(port.port) ? `→${port.targetPort}` : ""}`).join(", ");
          return { name: service.metadata && service.metadata.name || "", ports };
        });
        const volumes = new Map((spec.volumes || []).map((volume) => [volume.name, volume]));
        const statuses = new Map((status.containerStatuses || []).map((item) => [item.name, item]));
        for (const container of spec.containers || []) {
          const current = statuses.get(container.name) || {};
          const stateName = current.state && (current.state.running ? "运行中" : current.state.waiting ? current.state.waiting.reason || "等待中" : current.state.terminated ? current.state.terminated.reason || "已退出" : "未知") || "尚未启动";
          const configMaps = new Set(), secrets = new Set();
          for (const source of container.envFrom || []) {
            if (source.configMapRef && source.configMapRef.name) configMaps.add(source.configMapRef.name);
            if (source.secretRef && source.secretRef.name) secrets.add(source.secretRef.name);
          }
          for (const env of container.env || []) {
            const source = env.valueFrom || {};
            if (source.configMapKeyRef && source.configMapKeyRef.name) configMaps.add(source.configMapKeyRef.name);
            if (source.secretKeyRef && source.secretKeyRef.name) secrets.add(source.secretKeyRef.name);
          }
          for (const mount of container.volumeMounts || []) {
            const volume = volumes.get(mount.name) || {};
            if (volume.configMap && volume.configMap.name) configMaps.add(volume.configMap.name);
            if (volume.secret && volume.secret.secretName) secrets.add(volume.secret.secretName);
            for (const source of volume.projected && volume.projected.sources || []) {
              if (source.configMap && source.configMap.name) configMaps.add(source.configMap.name);
              if (source.secret && source.secret.name) secrets.add(source.secret.name);
            }
          }
          rows.push({
            pod: metadata.name || "",
            namespace: metadata.namespace || "cangling",
            node: spec.nodeName || "未调度",
            name: container.name || "",
            image: container.image || "",
            ready: !!current.ready,
            state: stateName,
            restarts: current.restartCount || 0,
            services: podServices,
            configMaps: [...configMaps].sort(),
            secrets: [...secrets].sort(),
          });
        }
      }
      return rows.sort((left, right) => left.name.localeCompare(right.name, "zh-CN") || left.pod.localeCompare(right.pod, "zh-CN"));
    }

    function renderCanglingContainers() {
      const root = $("#cangling-containers-root");
      if (!root) return;
      const rows = canglingContainerRows();
      root.innerHTML = `<div class="cangling-table-wrap"><table class="cluster-table cangling-container-table"><thead><tr><th>状态</th><th>容器名称</th><th>Pod</th><th>节点</th><th>镜像</th><th>重启</th><th class="container-actions">操作</th></tr></thead><tbody>${rows.map((item, index) => `<tr><td><span class="dot ${item.ready ? "online" : "offline"}"></span>${esc(item.state)}</td><td class="k3s-resource-name">${esc(item.name)}</td><td>${esc(item.pod)}</td><td>${esc(item.node)}</td><td class="cangling-container-image" title="${esc(item.image)}">${esc(item.image)}</td><td>${item.restarts}</td><td class="container-actions">${/postgres|postgis|polardb/i.test(item.image + " " + item.name) ? `<button type="button" class="btn" data-cangling-container-db="${index}">数据库管理</button>` : ""}<button type="button" class="btn" data-cangling-container-enter="${index}">进入容器</button><button type="button" class="btn" data-cangling-container-logs="${index}">查看日志</button><button type="button" class="btn danger" data-cangling-container-restart="${index}">重启</button></td></tr>`).join("") || '<tr><td colspan="7" class="empty">cangling 命名空间中没有容器</td></tr>'}</tbody></table></div>`;
      root.querySelectorAll("[data-cangling-container-db]").forEach(button => button.onclick = async () => {
        const item = rows[Number(button.dataset.canglingContainerDb)];
        button.disabled = true;
        button.textContent = "连接检测中…";
        const originHash = location.hash;
        try {
          const base = "/api/k3s/db/" + encodeURIComponent(item.namespace) + "/" + encodeURIComponent(item.pod);
          const meta = await api(base + "/meta?" + new URLSearchParams({service: item.name, engine: "postgres"}));
          if (!(meta.engines || []).includes("postgres")) throw new Error("该容器未检测到可用的 PostgreSQL 连接");
          if (location.hash !== originHash) return;
          location.hash = "#/k3s-db/" + [item.namespace, item.pod, item.name].map(encodeURIComponent).join("/");
        } catch (error) {
          flash("err", "连接数据库失败：" + error.message);
        } finally {
          button.disabled = false;
          button.textContent = "数据库管理";
        }
      });
      root.querySelectorAll("[data-cangling-container-enter]").forEach((button) => button.onclick = () => openCanglingContainerTerminal(rows[Number(button.dataset.canglingContainerEnter)]));
      root.querySelectorAll("[data-cangling-container-logs]").forEach((button) => button.onclick = () => openCanglingContainerLogs(rows[Number(button.dataset.canglingContainerLogs)]));
      root.querySelectorAll("[data-cangling-container-restart]").forEach((button) => button.onclick = () => restartCanglingContainer(rows[Number(button.dataset.canglingContainerRestart)]));
    }

    function renderCanglingResources(kind) {
      const root = $(`#cangling-${kind}-root`);
      if (!root) return;
      const data = state.canglingRuntime || {};
      const items = kind === "services" ? (data.services || []) : [
        ...(data.configMaps || []).map((resource) => ({ ...resource, resourceKind: "ConfigMap" })),
        ...(data.secrets || []).map((resource) => ({ ...resource, resourceKind: "Secret" })),
      ];
      items.sort((a, b) => (a.metadata?.name || "").localeCompare(b.metadata?.name || ""));
      const rows = items.map((item, index) => {
        const name = item.metadata?.name || "";
        const detail = kind === "services"
          ? (item.spec?.ports || []).map((port) => `${port.name || "端口"} ${port.port} → ${port.targetPort || port.port}/${port.protocol || "TCP"}`).join("、")
          : (item.resourceKind === "Secret" ? item.keys : Object.keys(item.data || {})).join("、");
        const ip = (item.spec?.clusterIPs || []).join(", ") || item.spec?.clusterIP || "—";
        return `<tr><td><button type="button" class="btn" data-cangling-resource="${index}">${esc(name)}</button></td><td>${esc(kind === "services" ? item.spec?.type || "ClusterIP" : item.resourceKind)}</td>${kind === "services" ? `<td>${esc(ip)}</td>` : ""}<td>${esc(detail || "—")}</td></tr>`;
      });
      root.innerHTML = `<div class="cangling-table-wrap"><table class="cluster-table"><thead><tr><th>名称</th><th>类型</th>${kind === "services" ? "<th>IP</th>" : ""}<th>${kind === "services" ? "端口" : "配置键"}</th></tr></thead><tbody>${rows.join("") || `<tr><td colspan="${kind === "services" ? 4 : 3}" class="empty">暂无资源</td></tr>`}</tbody></table></div>`;
      root.querySelectorAll("[data-cangling-resource]").forEach((button) => {
        button.onclick = () => openCanglingResourceDetail(items[Number(button.dataset.canglingResource)], kind);
      });
    }

    async function openCanglingResourceDetail(item, kind) {
      if (!item) return;
      closeDialog();
      const token = dialog.resourceToken;
      const type = kind === "services" ? "Service" : item.resourceKind;
      const name = item.metadata?.name || "—";
      const namespace = item.metadata?.namespace || state.canglingConfig?.namespace || "cangling";
      const keys = type === "ConfigMap" ? Object.keys(item.data || {}).sort() : [];
      const selectedKey = keys.length === 1 ? 0 : -1;
      const ip = (item.spec?.clusterIPs || []).join(", ") || item.spec?.clusterIP || "—";
      const detail = type === "Service" ? { spec: item.spec || {}, status: item.status || {} } :
        type === "Secret" ? { type: item.type, keys: item.keys || [] } :
        { data: item.data || {}, binaryDataKeys: Object.keys(item.binaryData || {}) };
      const content = (index) => type === "ConfigMap" && index >= 0
        ? String(item.data[keys[index]] ?? "") : JSON.stringify(detail, null, 2);
      const summary = type === "Service" ? `类型：${item.spec?.type || "ClusterIP"} · IP：${ip}` :
        `类型：${type} · ${type === "Secret" ? (item.keys || []).length : keys.length} 个键`;
      $("#dialog-modal").classList.add("resource-detail-modal");
      $("#dialog-title").textContent = `${type} · ${name}`;
      $("#dialog-body").innerHTML = `<div class="resource-detail">
        <div class="resource-detail-meta"><span>命名空间 <strong>${esc(namespace)}</strong></span><span>${esc(summary)}</span><span>创建时间 <strong>${esc(fmtDateTime(item.metadata?.creationTimestamp))}</strong></span></div>
        <div class="resource-detail-toolbar"><p class="hint">只读详情 · 可选择并复制编辑器中的内容</p>${type === "ConfigMap" && keys.length ? `<select id="resource-detail-key" aria-label="选择配置键"><option value="-1">全部数据（JSON）</option>${keys.map((key, index) => `<option value="${index}" ${index === selectedKey ? "selected" : ""}>${esc(key)}</option>`).join("")}</select>` : ""}</div>
        <div class="resource-detail-editor"><div id="resource-detail-ace" aria-label="${esc(type)} 只读内容"></div></div>
      </div>`;
      $("#dialog").hidden = false;
      setDialogAction(null, null);
      $("#dialog-foot").hidden = false;
      try {
        await loadAce();
        if (token !== dialog.resourceToken || $("#dialog").hidden) return;
        const el = $("#resource-detail-ace");
        if (!el) return;
        const editor = window.ace.edit(el, {
          mode: type === "ConfigMap" && selectedKey >= 0 ? "ace/mode/text" : "ace/mode/json",
          theme: aceThemeName(), useWorker: false, fontSize: 14, tabSize: 2,
          wrap: true, showPrintMargin: false, readOnly: true, highlightActiveLine: false,
          fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace',
        });
        dialog.resourceEditor = editor;
        editor.setValue(content(selectedKey), -1);
        editor.setReadOnly(true);
        const selector = $("#resource-detail-key");
        if (selector) selector.onchange = () => {
          const index = Number(selector.value);
          editor.session.setMode(index >= 0 ? "ace/mode/text" : "ace/mode/json");
          editor.setValue(content(index), -1);
        };
        if (window.ResizeObserver) {
          dialog.resourceResizeObs = new ResizeObserver(() => editor.resize());
          dialog.resourceResizeObs.observe(el);
        }
        editor.resize();
      } catch (error) {
        if (token !== dialog.resourceToken) return;
        destroyResourceEditor();
        $("#dialog-body .resource-detail-editor").innerHTML = `<pre class="resource-detail-fallback">${esc(content(selectedKey))}</pre>`;
      }
    }

    async function openCanglingContainerLogs(item) {
      closeDialog();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("narrow");
      $("#dialog-title").textContent = "容器日志 · " + item.name;
      $("#dialog-body").innerHTML = '<div class="k3s-log-terminal" id="cangling-container-log"></div>';
      $("#dialog").hidden = false;
      await renderK3sPodLogs($("#cangling-container-log"), item.namespace, item.pod, item.name);
    }

    async function openCanglingContainerTerminal(item) {
      closeDialog();
      try {
        await loadXterm();
        if (document.fonts && document.fonts.load) await document.fonts.load('15px "Iosevka Term"');
      } catch (error) {
        flash("err", error.message);
        return;
      }
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("narrow");
      $("#dialog-title").textContent = "容器终端 · " + item.name;
      $("#dialog-body").innerHTML = '<div class="term" id="cangling-container-term"></div>';
      $("#dialog").hidden = false;
      const term = new window.Terminal({ cursorBlink: true, fontSize: 15, fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace', theme: termTheme() });
      const Fit = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);
      const fit = Fit ? new Fit() : null;
      if (fit) term.loadAddon(fit);
      term.open($("#cangling-container-term"));
      if (fit) fit.fit();
      dialog.term = term;
      dialog.fit = fit;
      const qs = "?container=" + encodeURIComponent(item.name) + "&cols=" + (term.cols || 80) + "&rows=" + (term.rows || 24) + (sessionToken() ? "&token=" + encodeURIComponent(sessionToken()) : "");
      const ws = new WebSocket(appWebSocket("/api/k3s/pods/" + encodeURIComponent(item.namespace) + "/" + encodeURIComponent(item.pod) + "/exec" + qs));
      ws.binaryType = "arraybuffer";
      dialog.ws = ws;
      ws.onmessage = (event) => term.write(typeof event.data === "string" ? event.data : new Uint8Array(event.data));
      ws.onerror = () => term.writeln("\r\n连接失败");
      ws.onclose = () => term.writeln("\r\n连接已关闭");
      term.onData((data) => { if (ws.readyState === 1) ws.send(data); });
      const resize = () => {
        if (fit) fit.fit();
        if (ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
      };
      dialog.onResize = resize;
      window.addEventListener("resize", resize);
      setTimeout(resize, 50);
      term.focus();
    }

    async function restartCanglingContainer(item) {
      if (!(await confirmDialog(`重启容器会删除 Pod ${item.pod}，控制器将自动重新创建。是否继续？`, { danger: true, confirmText: "重启" }))) return;
      try {
        await api("/api/k3s/pods/" + encodeURIComponent(item.namespace) + "/" + encodeURIComponent(item.pod), { method: "DELETE" });
        flash("ok", `已请求重启 ${item.name}，正在等待 Pod 重新创建`);
        await loadCanglingRuntime(true);
      } catch (error) {
        flash("err", "重启容器失败：" + error.message);
      }
    }

    async function openCanglingRuntimePod(pod) {
      const metadata = pod && pod.metadata || {};
      const namespace = metadata.namespace || state.canglingConfig && state.canglingConfig.namespace || "cangling";
      const name = metadata.name || "";
      const base = "/api/k3s/resources/pods/" + encodeURIComponent(namespace) + "/" + encodeURIComponent(name);
      closeDialog();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("narrow");
      $("#dialog-title").textContent = "Pod · " + name;
      $("#dialog-body").innerHTML = `<div class="empty db-loading"><span class="spin"></span>正在读取事件与日志入口…</div>`;
      $("#dialog").hidden = false;
      try {
        const [detail, yaml, events] = await Promise.all([api(base), api(base + "/yaml"), api(base + "/events")]);
        renderK3sDetail({ id: "pods", label: "Pod" }, namespace, detail, yaml.text || "", events.items || []);
      } catch (error) {
        $("#dialog-body").innerHTML = `<div class="flash err" style="margin:16px">${esc(error.message)}</div>`;
      }
    }

    function selectCanglingTab(tab) {
      const tabs = ["cluster", "environment", "secrets", "deployment", "yaml", "run"];
      const selected = tabs.includes(tab) ? tab : "cluster";
      state.canglingTab = selected;
      if (selected !== "run") state.canglingDeployTab = selected;
      $("#cangling-deploy-nav").hidden = selected === "run";
      document.querySelectorAll("[data-cangling-mode]").forEach(button => {
        const active = button.dataset.canglingMode === (selected === "run" ? "status" : "deploy");
        button.classList.toggle("primary", active);
        button.setAttribute("aria-pressed", String(active));
      });
      document.querySelectorAll("[data-cangling-tab]").forEach((button) => {
        const active = button.dataset.canglingTab === selected;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
        button.tabIndex = active ? 0 : -1;
      });
      document.querySelectorAll("[data-cangling-tab-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.canglingTabPanel !== selected;
      });
      if (selected === "secrets") mountCanglingNginxEditor();
      stopCanglingRuntimePoll();
      if (selected !== "run" && canglingDataInitPoll.timer) {
        clearInterval(canglingDataInitPoll.timer);
        canglingDataInitPoll.timer = null;
      }
      if (selected === "run") {
        selectCanglingRunTab(state.canglingRunTab);
        canglingRuntimePoll.timer = setInterval(() => loadCanglingRuntime(true), 5000);
      }
      if (selected === "yaml" && canglingYamlEdit.editor) setTimeout(() => canglingYamlEdit.editor.resize(), 0);
    }

    function selectCanglingRunTab(tab) {
      const tabs = ["jars", "data-init", "runtime", "diagnosis", "containers", "services", "configs"];
      state.canglingRunTab = tabs.includes(tab) ? tab : "containers";
      if (state.canglingRunTab !== "data-init" && canglingDataInitPoll.timer) {
        clearInterval(canglingDataInitPoll.timer);
        canglingDataInitPoll.timer = null;
      }
      document.querySelectorAll("[data-cangling-run-tab]").forEach((button) => {
        const active = button.dataset.canglingRunTab === state.canglingRunTab;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
        button.tabIndex = active ? 0 : -1;
      });
      document.querySelectorAll("[data-cangling-run-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.canglingRunPanel !== state.canglingRunTab;
      });
      if (state.canglingTab === "run") {
        if (state.canglingRunTab === "jars") loadCanglingJars();
        else if (state.canglingRunTab === "data-init") loadCanglingDataInit();
        else loadCanglingRuntime(false);
      }
    }

    async function loadCanglingDataInit() {
      if (canglingDataInitPoll.inflight || state.canglingTab !== "run" || state.canglingRunTab !== "data-init") return;
      canglingDataInitPoll.inflight = true;
      try {
        const data = await api("/api/cangling/apps/data-init");
        const job = data.job;
        const button = $("#cangling-data-init-start");
        const status = $("#cangling-data-init-status");
        const progress = $("#cangling-data-init-progress");
        const percent = $("#cangling-data-init-percent");
        const output = $("#cangling-data-init-output");
        if (!button || !status || !progress || !percent || !output) return;
        button.disabled = !data.available || Boolean(job && !job.done);
        status.className = job && job.error ? "flash err" : job && job.done ? "flash ok" : "hint";
        status.textContent = job ? job.message : data.available
          ? "基础数据包已就绪，点击按钮导入 ai:china 行政区划图层组及全球 ETOPO DEM。"
          : "未找到基础数据包：" + data.packagePath;
        progress.hidden = !job || job.done;
        percent.hidden = !job || job.done;
        if (job && !job.done) {
          progress.value = job.percent || 0;
          percent.textContent = `${job.percent || 0}%`;
        }
        output.textContent = (data.output || []).join("\n");
        output.hidden = !data.output || !data.output.length;
        const base = await api("/api/cangling/apps/base-init");
        const baseJob = base.job;
        const baseButton = $("#cangling-base-init-start");
        const baseStatus = $("#cangling-base-init-status");
        const baseProgress = $("#cangling-base-init-progress");
        const basePercent = $("#cangling-base-init-percent");
        const baseOutput = $("#cangling-base-init-output");
        baseButton.disabled = !base.available || Boolean(baseJob && !baseJob.done);
        baseStatus.className = baseJob && baseJob.error ? "flash err" : baseJob && baseJob.done ? "flash ok" : "hint";
        baseStatus.textContent = baseJob ? baseJob.message : base.available
          ? "初始化脚本已就绪；目标为 cis-postgis 中的 cl-base 数据库。"
          : (base.reason || "未找到可用的 SQL 脚本：" + base.jarPath);
        baseProgress.hidden = !baseJob || baseJob.done;
        basePercent.hidden = !baseJob || baseJob.done;
        if (baseJob && !baseJob.done) {
          baseProgress.value = baseJob.percent || 0;
          basePercent.textContent = `${baseJob.percent || 0}%`;
        }
        baseOutput.textContent = (base.output || []).join("\n");
        baseOutput.hidden = !base.output || !base.output.length;
        const region = await api("/api/cangling/apps/region-init");
        const regionJob = region.job;
        const regionButton = $("#cangling-region-init-start");
        const regionStatus = $("#cangling-region-init-status");
        const regionProgress = $("#cangling-region-init-progress");
        const regionPercent = $("#cangling-region-init-percent");
        const regionOutput = $("#cangling-region-init-output");
        if (!regionButton || !regionStatus || !regionProgress || !regionPercent || !regionOutput) return;
        regionButton.disabled = !region.available || Boolean(regionJob && !regionJob.done);
        regionStatus.className = regionJob && regionJob.error ? "flash err" : regionJob && regionJob.done ? "flash ok" : "hint";
        regionStatus.textContent = regionJob ? regionJob.message : region.available
          ? [...((region.pending || []).length ? ["可初始化：" + region.pending.join("、")] : []), ...((region.indexRepairs || []).length ? ["需补建空间索引：" + region.indexRepairs.join("、")] : [])].join("；")
          : (region.reason || "未找到行政区划数据包：" + region.packagePath);
        regionProgress.hidden = !regionJob || regionJob.done;
        regionPercent.hidden = !regionJob || regionJob.done;
        if (regionJob && !regionJob.done) {
          regionProgress.value = regionJob.percent || 0;
          regionPercent.textContent = `${regionJob.percent || 0}%`;
        }
        regionOutput.textContent = (region.output || []).join("\n");
        regionOutput.hidden = !region.output || !region.output.length;
        if (((job && !job.done) || (baseJob && !baseJob.done) || (regionJob && !regionJob.done)) && !canglingDataInitPoll.timer) {
          canglingDataInitPoll.timer = setInterval(loadCanglingDataInit, 1200);
        } else if ((!job || job.done) && (!baseJob || baseJob.done) && (!regionJob || regionJob.done) && canglingDataInitPoll.timer) {
          clearInterval(canglingDataInitPoll.timer);
          canglingDataInitPoll.timer = null;
        }
      } catch (error) {
        const status = $("#cangling-data-init-status");
        if (status) { status.className = "flash err"; status.textContent = "读取初始化状态失败：" + error.message; }
      } finally {
        canglingDataInitPoll.inflight = false;
      }
    }

    async function startCanglingDataInit() {
      const button = $("#cangling-data-init-start");
      button.disabled = true;
      try {
        await api("/api/cangling/apps/data-init", { method: "POST" });

        flash("err", "导入基础数据失败：" + error.message);
        await loadCanglingDataInit();

        const status = $("#cangling-base-init-status");
        status.className = "flash err";

        button.disabled = false;

    }

    async function startCanglingRegionInit() {
      const button = $("#cangling-region-init-start");

    function bindCanglingTabs() {
      const buttons = Array.from(document.querySelectorAll("[data-cangling-tab]"));
      buttons.forEach((button, index) => {
        button.onclick = () => selectCanglingTab(button.dataset.canglingTab);
        button.onkeydown = (event) => {
          let next = null;
          if (event.key === "ArrowRight") next = (index + 1) % buttons.length;
          else if (event.key === "ArrowLeft") next = (index - 1 + buttons.length) % buttons.length;
          else if (event.key === "Home") next = 0;
          else if (event.key === "End") next = buttons.length - 1;
          if (next === null) return;
          event.preventDefault();
          selectCanglingTab(buttons[next].dataset.canglingTab);
          buttons[next].focus();
        };
      });
      const runButtons = Array.from(document.querySelectorAll("[data-cangling-run-tab]"));
      runButtons.forEach((button, index) => {
        button.onclick = () => selectCanglingRunTab(button.dataset.canglingRunTab);
        button.onkeydown = (event) => {
          let next = null;
          if (event.key === "ArrowRight") next = (index + 1) % runButtons.length;
          else if (event.key === "ArrowLeft") next = (index - 1 + runButtons.length) % runButtons.length;
          else if (event.key === "Home") next = 0;
          else if (event.key === "End") next = runButtons.length - 1;
          if (next === null) return;
          event.preventDefault();
          selectCanglingRunTab(runButtons[next].dataset.canglingRunTab);
          runButtons[next].focus();
        };
      });
      selectCanglingTab(state.canglingTab);
    }

      canglingNginxEdit.version++;

        canglingNginxEdit.resizeObs = null;
      }
      if (canglingNginxEdit.editor) {
        try { canglingNginxEdit.editor.destroy(); } catch {}
        canglingNginxEdit.editor = null;
      }
    }

    async function mountCanglingNginxEditor() {
      if (canglingNginxEdit.editor) {
        canglingNginxEdit.editor.resize();
        return;
      }
      if (canglingNginxEdit.loading) return;
      const el = $("#cangling-nginx-ace");
      const fallback = $("#cangling-nginx-fallback");
      if (!el || !fallback) return;
      const version = canglingNginxEdit.version;
      canglingNginxEdit.loading = true;
      try {
        await loadAce();
        if (version !== canglingNginxEdit.version || !el.isConnected) return;
        el.hidden = false;
        fallback.hidden = true;
        const editor = window.ace.edit(el, {
          mode: "ace/mode/nginx", theme: aceThemeName(), useWorker: false,
          fontSize: 14, tabSize: 2, useSoftTabs: true, wrap: false,
          showPrintMargin: false,
          fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace',
        });
        canglingNginxEdit.editor = editor;
        editor.setValue(fallback.value, -1);
        if (window.ResizeObserver) {
          canglingNginxEdit.resizeObs = new ResizeObserver(() => editor.resize());
          canglingNginxEdit.resizeObs.observe(el);
        }
        editor.resize();
      } catch (error) {
        if (version !== canglingNginxEdit.version) return;
        el.hidden = true;
        fallback.hidden = false;
        flash("err", `ACE 编辑器加载失败，已切换到普通文本框：${error.message}`);
      } finally {
        if (version === canglingNginxEdit.version) canglingNginxEdit.loading = false;
      }
    }

    function readCanglingConfig() {
      const config = JSON.parse(JSON.stringify(state.canglingConfig || {}));
      document.querySelectorAll("[data-cangling-global]").forEach((input) => {
        const field = input.dataset.canglingGlobal;
        config[field] = input.value.trim();
      });
      CANGLING_STORAGE_ROOTS.forEach((item) => {
        const type = document.querySelector(`[data-cangling-storage-type="${item.storage}"]`);
        const input = document.querySelector(`[data-cangling-storage-path="${item.storage}"]`);
        const mapped = document.querySelector(`[data-cangling-storage-mapped="${item.storage}"]`);
        const storageType = type && type.value === "nfs" ? "nfs" : "local";
        const source = input ? input.value.trim() : "";
        config[item.path] = mapped ? mapped.value.trim() : canglingDefaultPath(item.path, config.namespace);
        if (storageType === "nfs") {
          const parsed = parseCanglingNfsPath(source);
          config[item.storage] = { type: "nfs", server: parsed.server, source };
        } else {
          config[item.storage] = { type: "local", server: "", source };
        }
      });
      config.environment = readCanglingKeyValues("environment", "环境变量");
      config.secrets = readCanglingKeyValues("secrets", "密钥");
      config.nginxConfig = canglingNginxEdit.editor ? canglingNginxEdit.editor.getValue() : $("#cangling-nginx-fallback")?.value ?? config.nginxConfig;
      document.querySelectorAll("[data-cangling-app]").forEach((row) => {
        const app = config.applications[Number(row.dataset.canglingApp)];
        if (!app) return;
        row.querySelectorAll("[data-cangling-app-field]").forEach((input) => {
          const field = input.dataset.canglingAppField;
          if (field === "replicas") app[field] = Number(input.value);
          else if (field === "ports") app[field] = input.value.split(/[，,\s]+/).map((value) => Number(value)).filter((value) => Number.isInteger(value) && value > 0 && value <= 65535);
          else app[field] = input.value.trim();
        });
      });
      state.canglingConfig = config;
      return config;
    }

      const button = $("#cangling-import-images");

        if (button) button.textContent = "正在启动…";
        const started = await api("/api/cangling/apps/images/import", { method: "POST" });
        openCanglingImageImportDialog(started.job_id);
      } catch (error) {
        flash("err", "导入苍灵应用镜像失败：" + error.message);
      } finally {
        if (button) { button.disabled = false; button.textContent = "导入镜像"; }
      }

    async function openCanglingImageImportDialog(jobId) {
      const watch = ++state.canglingImageImportWatch;
      closeDialog();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("image-import-modal");
      $("#dialog-title").textContent = "导入苍灵应用镜像";
      $("#dialog-body").innerHTML = `<div class="image-import-panel">
          <div class="image-import-state" id="cangling-image-import-state"><span class="image-import-spinner" aria-hidden="true"></span><div class="image-import-state-copy"><strong id="cangling-image-import-title">正在导入镜像</strong><span id="cangling-image-import-message">正在准备离线镜像包…</span></div></div>
          <dl class="image-import-details"><dt>目标节点</dt><dd id="cangling-image-import-node">—</dd><dt>CPU 架构</dt><dd id="cangling-image-import-arch">—</dd><dt>镜像包</dt><dd id="cangling-image-import-package">—</dd></dl>
          <div class="image-import-progress" id="cangling-image-import-progress"><div class="progress-meta"><strong>总体进度</strong><span id="cangling-image-import-percent">0%</span></div><div class="progress"><span id="cangling-image-import-bar"></span></div><p class="image-import-note">程序会自动选择 amd64 或 arm64 资源，并依次导入对应节点的 K3s containerd 仓库。</p></div>
        </div>`;
      setDialogAction("后台运行", closeDialog);
      $("#dialog").hidden = false;
      try {
        while (true) {
          const job = await api("/api/jobs/" + encodeURIComponent(jobId));
          if (watch !== state.canglingImageImportWatch) return;
          const total = Number(job.total || 0);
          const current = Number(job.current || 0);
          const percent = total > 0 ? Math.min(100, Math.round(current * 100 / total)) : 0;
          const message = $("#cangling-image-import-message");
          const percentNode = $("#cangling-image-import-percent");
          const bar = $("#cangling-image-import-bar");
          const match = String(job.message || "").match(/正在向\s+(.+?)\s+导入\s+(.+?)（(amd64|arm64)）/);
          if (match) {
            const node = $("#cangling-image-import-node"), packageNode = $("#cangling-image-import-package"), arch = $("#cangling-image-import-arch");
            if (node) node.textContent = match[1];
            if (packageNode) { packageNode.textContent = match[2]; packageNode.title = match[2]; }
            if (arch) arch.textContent = match[3];
          }
          if (message) message.textContent = job.message || "正在导入…";
          if (percentNode) percentNode.textContent = percent + "%";
          if (bar) bar.style.width = percent + "%";
          if (job.done) {
            if (job.error) throw new Error(job.error);
            if (percentNode) percentNode.textContent = "100%";
            if (bar) bar.style.width = "100%";
            const stateNode = $("#cangling-image-import-state"), title = $("#cangling-image-import-title");
            if (stateNode) stateNode.classList.add("done");
            if (title) title.textContent = "镜像导入完成";
            if (message) message.textContent = job.message || "苍灵应用镜像已导入全部在线节点";
            const progress = $("#cangling-image-import-progress");
            if (progress) progress.hidden = true;
            flash("ok", job.message || "苍灵应用镜像已导入全部在线节点");
            break;
          }
          await new Promise((resolve) => setTimeout(resolve, 800));
        }
      } catch (error) {
        if (watch !== state.canglingImageImportWatch) return;
        const stateNode = $("#cangling-image-import-state"), title = $("#cangling-image-import-title"), message = $("#cangling-image-import-message");
        if (stateNode) stateNode.classList.add("error");
        if (title) title.textContent = "镜像导入失败";
        if (message) message.textContent = error.message;
        flash("err", "导入苍灵应用镜像失败：" + error.message);
      }
    }

    async function generateCanglingYaml() {
      const button = $("#cangling-generate");

    function currentCanglingYaml() {
      return canglingYamlEdit.editor ? canglingYamlEdit.editor.getValue() : state.canglingYaml;
    }

    function canglingYamlDiff(previous, next) {
      const before = previous.split("\n"), after = next.split("\n");
      let start = 0;
      while (start < before.length && start < after.length && before[start] === after[start]) start += 1;
      let beforeEnd = before.length - 1, afterEnd = after.length - 1;
      while (beforeEnd >= start && afterEnd >= start && before[beforeEnd] === after[afterEnd]) { beforeEnd -= 1; afterEnd -= 1; }
      if (start === before.length && start === after.length) return "";
      const removed = before.slice(start, beforeEnd + 1).slice(0, 160).map((line) => `- ${line}`);
      const added = after.slice(start, afterEnd + 1).slice(0, 160).map((line) => `+ ${line}`);
      const truncated = beforeEnd - start + 1 > 160 || afterEnd - start + 1 > 160;
      return [`@@ 第 ${start + 1} 行附近 @@`, ...removed, ...added, ...(truncated ? ["… 差异过长，仅显示前 160 行"] : [])].join("\n");
    }

    function updateCanglingYamlActions() {
      const yaml = currentCanglingYaml();
      const hasYaml = !!yaml.trim();
      const dirty = yaml !== canglingYamlEdit.savedYaml;
      const download = $("#cangling-yaml-download"), graph = $("#cangling-yaml-graph"), save = $("#cangling-yaml-save"), apply = $("#cangling-yaml-apply");
      if (download) download.disabled = !hasYaml;
      if (graph) graph.disabled = !hasYaml;
      if (save) save.disabled = !hasYaml || !dirty;
      if (apply) apply.disabled = !hasYaml || dirty || !canglingYamlEdit.currentVersion;
      const diff = $("#cangling-yaml-diff");
      if (diff) {
        const text = canglingYamlEdit.savedYaml ? canglingYamlDiff(canglingYamlEdit.savedYaml, yaml) : "";
        diff.textContent = text;
        diff.hidden = !text;
      }
    }

    function renderCanglingVersions(versions) {
      const list = $("#cangling-yaml-version-list");
      const stateText = $("#cangling-yaml-version-state");
      if (!list || !stateText) return;
      stateText.textContent = versions.length ? ` · ${versions.length} 个版本` : " · 尚无已保存版本";
      list.innerHTML = versions.map((version) => `<button type="button" class="btn cangling-yaml-version ${version.id === (canglingYamlEdit.viewingVersion || canglingYamlEdit.currentVersion) ? "active" : ""}" data-cangling-yaml-version="${esc(version.id)}" title="${esc(fmtDateTime(version.createdAt))} · ${fmtBytes(version.bytes)}"><span>${esc(fmtDateTime(version.createdAt))}</span>${version.applied ? "<em>已应用</em>" : ""}</button>`).join("");
      list.querySelectorAll("[data-cangling-yaml-version]").forEach((button) => {
        button.onclick = () => loadCanglingManifestVersion(button.dataset.canglingYamlVersion);
      });
    }

    async function loadCanglingManifestHistory(attempt = 0) {
      try {
        const history = await api("/api/cangling/apps/manifests");
        canglingYamlEdit.savedYaml = history.currentYaml || "";
        canglingYamlEdit.currentVersion = history.currentVersion || "";
        canglingYamlEdit.appliedVersion = history.appliedVersion || "";
        renderCanglingVersions(history.versions || []);
        if (history.currentYaml) {
          state.canglingYaml = history.currentYaml;
          await renderCanglingYamlEditor("cangling.yaml", history.currentYaml, []);
          if (canglingYamlEdit.editor) canglingYamlEdit.editor.setReadOnly(false);
          const status = $("#cangling-yaml-status");
          if (status) status.textContent = `已加载当前保存版本 ${history.currentVersion}${history.currentVersion === history.appliedVersion ? "（已应用）" : "（尚未应用）"}`;
        }
        updateCanglingYamlActions();
      } catch (error) {
        if (attempt < 2 && /failed to fetch|load failed|network/i.test(error.message || "")) {
          const stateText = $("#cangling-yaml-version-state");
          if (stateText) stateText.textContent = ` · 连接中断，正在进行第 ${attempt + 1} 次重试…`;
          await new Promise((resolve) => setTimeout(resolve, 700 * (attempt + 1)));
          return loadCanglingManifestHistory(attempt + 1);
        }
        const stateText = $("#cangling-yaml-version-state");
        if (stateText) stateText.textContent = " · 读取失败：" + error.message;
        const list = $("#cangling-yaml-version-list");
        if (list) {
          list.innerHTML = '<button type="button" class="btn" id="cangling-yaml-version-retry">重新读取</button>';
          $("#cangling-yaml-version-retry").onclick = () => loadCanglingManifestHistory();
        }
      }
    }

    async function loadCanglingManifestVersion(version) {
      try {
        const result = await api("/api/cangling/apps/manifests/" + encodeURIComponent(version));
        canglingYamlEdit.viewingVersion = version;
        document.querySelectorAll("[data-cangling-yaml-version]").forEach((button) => button.classList.toggle("active", button.dataset.canglingYamlVersion === version));

        if (status) status.textContent = `正在查看历史版本 ${version}；如需设为当前版本，请点击“覆盖保存”。`;
        updateCanglingYamlActions();
      } catch (error) {
        flash("err", "读取 YAML 版本失败：" + error.message);

      const yaml = currentCanglingYaml();

        ? "将用编辑器中的内容覆盖当前 cangling.yaml，并自动保留为一个新版本。是否继续？"

    function renderCanglingDependencyGraph(graph) {
      const view = $("#cangling-yaml-graph-view");
      if (!view) return;
      const nodes = Array.isArray(graph.nodes) ? graph.nodes : [];
      const edges = Array.isArray(graph.edges) ? graph.edges : [];
      const groups = [
        { title: "工作负载", kinds: ["Deployment", "DaemonSet", "StatefulSet"], x: 40, color: "var(--accent-emphasis)" },
        { title: "服务", kinds: ["Service"], x: 400, color: "var(--success-emphasis)" },
        { title: "配置与存储", kinds: ["ConfigMap", "Secret", "PersistentVolumeClaim"], x: 760, color: "#8250df" },
      ];
      const width = 1080, nodeWidth = 270, nodeHeight = 48, rowHeight = 68;
      const positions = new Map();
      let maxRows = 1;
      groups.forEach((group) => {
        const members = nodes.filter((node) => group.kinds.includes(node.kind));
        maxRows = Math.max(maxRows, members.length);
        members.forEach((node, index) => positions.set(node.id, { x: group.x, y: 54 + index * rowHeight, color: group.color, node }));
      });
      const height = Math.max(560, 90 + maxRows * rowHeight);
      const edgeSvg = edges.map((edge) => {
        const from = positions.get(edge.from), to = positions.get(edge.to);
        if (!from || !to) return "";
        const forward = from.x <= to.x;
        const x1 = forward ? from.x + nodeWidth : from.x;
        const x2 = forward ? to.x : to.x + nodeWidth;
        const y1 = from.y + nodeHeight / 2, y2 = to.y + nodeHeight / 2;
        const bend = Math.max(70, Math.abs(x2 - x1) * .45);
        const path = `M ${x1} ${y1} C ${x1 + (forward ? bend : -bend)} ${y1}, ${x2 + (forward ? -bend : bend)} ${y2}, ${x2} ${y2}`;
        const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2 - 5;
        return `<g><path d="${path}" fill="none" stroke="${edge.inferred ? "var(--muted)" : "var(--accent)"}" stroke-width="1.8" ${edge.inferred ? 'stroke-dasharray="6 5"' : ""} marker-end="url(#cangling-graph-arrow)"/><text x="${midX}" y="${midY}" text-anchor="middle" fill="var(--muted)" font-size="11">${esc(edge.relation)}</text></g>`;
      }).join("");
      const nodeSvg = Array.from(positions.values()).map(({ x, y, color, node }) => `<g><title>${esc(node.kind)} · ${esc(node.namespace)}/${esc(node.name)}${node.defined ? "" : " · YAML 中未定义"}</title><rect x="${x}" y="${y}" width="${nodeWidth}" height="${nodeHeight}" rx="6" fill="var(--bg-3)" stroke="${color}" stroke-width="${node.defined ? 1.5 : 1}" ${node.defined ? "" : 'stroke-dasharray="5 4"'}/><text x="${x + 14}" y="${y + 20}" fill="var(--text)" font-size="13" font-weight="600">${esc(node.name)}</text><text x="${x + 14}" y="${y + 37}" fill="var(--muted)" font-size="11">${esc(node.kind)} · ${esc(node.namespace)}</text></g>`).join("");
      const headings = groups.map((group) => `<text x="${group.x}" y="30" fill="var(--text)" font-size="14" font-weight="600">${group.title}</text>`).join("");
      const warnings = Array.isArray(graph.warnings) && graph.warnings.length ? ` · ${graph.warnings.map((item) => esc(item)).join("；")}` : "";
      view.innerHTML = `<div class="cangling-graph-summary">共 ${nodes.length} 个资源节点、${edges.length} 条关系${warnings}<div class="cangling-graph-legend"><span><i class="cangling-graph-line"></i>明确关系</span><span><i class="cangling-graph-line inferred"></i>根据容器配置推断的服务调用</span></div></div><svg class="cangling-graph-canvas" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="cangling.yaml 依赖关系图"><defs><marker id="cangling-graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker></defs>${headings}${edgeSvg}${nodeSvg}</svg>`;
    }

    async function applyCanglingYaml() {
      const yaml = currentCanglingYaml();
      if (!yaml.trim()) {
        flash("err", "请先生成 cangling.yaml");
        return;
      }
      if (!(await confirmDialog("将把编辑器中的当前 cangling.yaml 应用到 K3s 集群。现有同名资源将被更新，是否继续？", {
        confirmText: "应用到集群",
      }))) return;
      const apply = $("#cangling-yaml-apply");
      const generate = $("#cangling-generate");
      const download = $("#cangling-yaml-download");
      if (apply) { apply.disabled = true; apply.textContent = "正在部署…"; }
      if (generate) generate.disabled = true;
      if (download) download.disabled = true;
      try {
        const config = readCanglingConfig();
        await api("/api/cangling/apps/config", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(config),
        });
        const result = await api("/api/cangling/apps/apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ yaml }),
        });
        await loadCanglingManifestHistory();
        const status = $("#cangling-yaml-status");
        if (status) status.innerHTML = `<strong>${esc(result.message || "部署完成")}</strong> · 已处理 ${Number(result.resources || 0)} 个资源`;
        showCanglingApplyResult(true, result.message || "cangling.yaml 已应用到 K3s 集群", "完整应用配置已保存。\n" + (result.output || "kubectl apply 已完成"), result.resources || 0);
      } catch (error) {
        showCanglingApplyResult(false, "部署 cangling.yaml 失败", error.message, 0);
      } finally {
        if (apply) apply.textContent = "应用到集群";
        if (generate) generate.disabled = false;
        updateCanglingYamlActions();
      }
    }

    function downloadCanglingYaml(filename, yaml) {
      const blob = new Blob([yaml], { type: "application/yaml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename || "cangling.yaml";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function loadK3s(first) {
      if (k3sPoll.inflight) return;
      k3sPoll.inflight = true;
      try {
        if (first || !state.k3sStatus) {
          const [status, namespaces] = await Promise.all([
            api("/api/k3s/status"),
            api("/api/k3s/namespaces"),
          ]);
          state.k3sStatus = status;
          state.k3sNamespaces = (namespaces.items || []).map((item) => item.metadata && item.metadata.name).filter(Boolean);
        }
        const meta = k3sResourceMeta();
        const namespace = meta.scoped ? state.k3sNamespace : "_cluster";
        const result = await api("/api/k3s/resources?kind=" + encodeURIComponent(meta.id) + "&namespace=" + encodeURIComponent(namespace));
        state.k3sItems = result.items || [];
        if (first || !document.getElementById("k3s-resource-list")) renderK3sLayout();
        else renderK3sTable();
      } catch (e) {
        const root = $("#k3s-root");
        if (root) root.innerHTML = `<div class="card"><h3>K3s 暂不可用</h3><p class="hint">${esc(e.message)}</p><button class="btn" id="k3s-retry">重试</button></div>`;
        const retry = $("#k3s-retry");
        if (retry) retry.onclick = () => loadK3s(true);
      } finally {
        k3sPoll.inflight = false;
      }
    }

    function k3sVersion() {
      const version = state.k3sStatus && state.k3sStatus.version || {};
      return version.serverVersion && version.serverVersion.gitVersion
        || version.clientVersion && version.clientVersion.gitVersion || "—";
    }

    function renderK3sLayout() {
      const root = $("#k3s-root");
      if (!root) return;
      const status = state.k3sStatus || {};
      const meta = k3sResourceMeta();
      const namespaceOptions = [
        `<option value="_all" ${state.k3sNamespace === "_all" ? "selected" : ""}>所有命名空间</option>`,
        ...state.k3sNamespaces.map((name) => `<option value="${esc(name)}" ${state.k3sNamespace === name ? "selected" : ""}>${esc(name)}</option>`)
      ].join("");
      const groups = [...new Set(K3S_RESOURCES.map((item) => item.group))];
      const typeOptions = groups.map((group) => `<optgroup label="${esc(group)}">${K3S_RESOURCES
        .filter((item) => item.group === group)
        .map((item) => `<option value="${item.id}" ${item.id === state.k3sKind ? "selected" : ""}>${esc(item.label)}</option>`)
        .join("")}</optgroup>`).join("");
      const summary = $("#k3s-summary");
      if (summary) summary.innerHTML = `<div class="k3s-summary">
        <div class="k3s-stat"><span>版本</span><strong>${esc(k3sVersion())}</strong></div>
        <div class="k3s-stat"><span>节点</span><strong>${status.readyNodes || 0}/${status.nodes || 0}</strong></div>
        <div class="k3s-stat"><span>Pod</span><strong>${status.pods || 0}</strong></div>
        <div class="k3s-stat"><span>异常</span><strong class="${status.unhealthyPods ? "bad" : "ok"}">${status.unhealthyPods || 0}</strong></div>
      </div>`;
      root.innerHTML = `
        <div class="k3s-toolbar">
          <div class="field"><label>命名空间</label><select id="k3s-namespace" ${meta.scoped ? "" : "disabled"}>${namespaceOptions}</select></div>
          <div class="field"><label>资源类型</label><select id="k3s-kind">${typeOptions}</select></div>
          <div class="field"><label>资源</label><input id="k3s-resource" type="text" value="${esc(state.k3sResource)}" placeholder="输入资源名称过滤" autocomplete="off" /></div>
          <button type="button" class="btn" id="k3s-refresh">刷新</button>

        state.k3sResource = "";
        await loadK3s(true);
      };
      $("#k3s-resource").oninput = (event) => {
        state.k3sResource = event.target.value;
        renderK3sTable();
      };
      $("#k3s-refresh").onclick = () => loadK3s(true);
      renderK3sTable();
    }

    function k3sAge(timestamp) {
      if (!timestamp) return "—";
      let seconds = Math.max(0, Math.floor((Date.now() - new Date(timestamp).getTime()) / 1000));
      if (seconds < 60) return seconds + "秒";
      if (seconds < 3600) return Math.floor(seconds / 60) + "分";
      if (seconds < 86400) return Math.floor(seconds / 3600) + "时";
      return Math.floor(seconds / 86400) + "天";
    }

    function k3sItemSummary(item) {
      const kind = state.k3sKind;
      const spec = item.spec || {}, status = item.status || {};
      if (kind === "pods") {
        const containers = status.containerStatuses || [];
        return {
          status: status.phase || "Unknown",
          detail: containers.filter((container) => container.ready).length + "/" + containers.length,
          extra: containers.reduce((sum, container) => sum + (container.restartCount || 0), 0) + " 次重启",
        };
      }
      if (["deployments", "statefulsets", "daemonsets"].includes(kind)) {
        const desired = kind === "daemonsets" ? status.desiredNumberScheduled : (spec.replicas == null ? 1 : spec.replicas);
        const ready = kind === "daemonsets" ? status.numberReady : status.readyReplicas;
        return { status: Number(ready || 0) >= Number(desired || 0) ? "Ready" : "Progressing", detail: (ready || 0) + "/" + (desired || 0), extra: "可用 " + (status.availableReplicas || status.currentNumberScheduled || 0) };
      }
      if (kind === "jobs") return { status: status.failed ? "Failed" : status.succeeded ? "Complete" : "Running", detail: (status.succeeded || 0) + "/" + (spec.completions || 1), extra: "失败 " + (status.failed || 0) };
      if (kind === "cronjobs") return { status: spec.suspend ? "Suspended" : "Active", detail: spec.schedule || "—", extra: "活动 " + ((status.active || []).length) };
      if (kind === "services") return { status: spec.type || "ClusterIP", detail: spec.clusterIP || "—", extra: (spec.ports || []).map((port) => port.port + "/" + (port.protocol || "TCP")).join(", ") || "—" };
      if (kind === "ingresses") return { status: (status.loadBalancer && status.loadBalancer.ingress || []).length ? "Ready" : "Pending", detail: (spec.rules || []).map((rule) => rule.host || "*").join(", ") || "—", extra: spec.ingressClassName || "—" };
      if (kind === "persistentvolumeclaims") return { status: status.phase || "Pending", detail: spec.volumeName || "—", extra: spec.resources && spec.resources.requests && spec.resources.requests.storage || "—" };
      if (kind === "persistentvolumes") return { status: status.phase || "Unknown", detail: spec.capacity && spec.capacity.storage || "—", extra: spec.storageClassName || "—" };
      if (kind === "nodes") {
        const ready = (status.conditions || []).some((condition) => condition.type === "Ready" && condition.status === "True");
        return { status: ready ? "Ready" : "NotReady", detail: status.nodeInfo && status.nodeInfo.kubeletVersion || "—", extra: spec.podCIDR || "—" };
      }
      if (kind === "storageclasses") return { status: item.metadata && item.metadata.annotations && item.metadata.annotations["storageclass.kubernetes.io/is-default-class"] === "true" ? "Default" : "Ready", detail: item.provisioner || "—", extra: item.reclaimPolicy || "—" };
      if (kind === "configmaps") return { status: "Ready", detail: Object.keys(item.data || {}).length + " 项", extra: "—" };
      return { status: "Ready", detail: "—", extra: "—" };
    }

    function k3sNodeLabels(item) {
      const metadata = item && item.metadata || {};
      const labels = metadata.labels || {};
      return {
        nodeId: labels["cangling.cn/node-id"] || metadata.name || "",
        pool: labels["cangling.cn/pool"] || "",
        hasNodeId: !!labels["cangling.cn/node-id"],
      };
    }

    function k3sNodeLabel(value, emptyText, implicit = false, variant = "node-id") {
      if (!value) return `<span class="k3s-node-label placeholder">${esc(emptyText)}</span>`;
      const className = variant === "pool" ? "k3s-node-label pool" : "k3s-node-label";
      return `<span class="${className}"${implicit ? ` title="尚未保存标签，当前使用节点名称"` : ""}>${esc(value)}${implicit ? '<small class="default-mark">默认</small>' : ""}</span>`;
    }

    function renderK3sTable() {
      const box = $("#k3s-resource-list");
      if (!box) return;
      const query = state.k3sResource.trim().toLowerCase();
      const items = state.k3sItems.filter((item) => {
        const metadata = item.metadata || {};
        return !query || String(metadata.name || "").toLowerCase().includes(query);
      });
      const isNodes = state.k3sKind === "nodes";
      const rows = items.map((item, index) => {
        const metadata = item.metadata || {};
        const summary = k3sItemSummary(item);
        const good = ["Ready", "Running", "Succeeded", "Complete", "Active", "Default"].includes(summary.status);
        const bad = ["Failed", "NotReady"].includes(summary.status);
        if (isNodes) {
          const labels = k3sNodeLabels(item);
          return `<tr data-k3s-index="${index}">
            <td><span class="dot ${good ? "online" : bad ? "offline" : "pending"}"></span>${esc(summary.status)}</td>
            <td class="k3s-resource-name">${esc(metadata.name || "—")}</td>
            <td>${k3sNodeLabel(labels.nodeId, "使用节点名称", !labels.hasNodeId)}</td>
            <td>${k3sNodeLabel(labels.pool, "未分组", false, "pool")}</td>
            <td>${esc(summary.detail)}</td>
            <td>${esc(summary.extra)}</td>
            <td>${k3sAge(metadata.creationTimestamp)}</td>
            <td class="k3s-node-actions"><button type="button" class="btn" data-k3s-node-edit="${index}">编辑标签</button></td>
          </tr>`;
        }
        return `<tr data-k3s-index="${index}">
          <td><span class="dot ${good ? "online" : bad ? "offline" : "pending"}"></span>${esc(summary.status)}</td>
          <td>${esc(metadata.namespace || "—")}</td>
          <td class="k3s-resource-name">${esc(metadata.name || "—")}</td>
          <td>${esc(summary.detail)}</td>
          <td>${esc(summary.extra)}</td>

        <tbody>${rows || `<tr><td colspan="${isNodes ? 8 : 6}" class="empty">没有匹配的资源</td></tr>`}</tbody>

        row.onclick = () => openK3sDetail(items[Number(row.dataset.k3sIndex)]);

        button.onclick = (event) => {
          event.stopPropagation();
          openK3sNodeLabels(items[Number(button.dataset.k3sNodeEdit)]);

    async function openK3sDetail(item) {
      const metadata = item.metadata || {};
      const kind = k3sResourceMeta();
      const namespace = metadata.namespace || "_cluster";
      const base = "/api/k3s/resources/" + encodeURIComponent(kind.id) + "/" + encodeURIComponent(namespace) + "/" + encodeURIComponent(metadata.name);
      closeDialog();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("narrow");

      $("#dialog-body").innerHTML = `<div class="empty db-loading"><span class="spin"></span>加载资源详情…</div>`;
      $("#dialog").hidden = false;
      try {
        const [detail, yaml, events] = await Promise.all([
          api(base), api(base + "/yaml"), api(base + "/events"),
        ]);
        renderK3sDetail(kind, namespace, detail, yaml.text || "", events.items || []);
      } catch (e) {
        $("#dialog-body").innerHTML = `<div class="flash err" style="margin:16px">${esc(e.message)}</div>`;
      }
