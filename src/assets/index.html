  <script>
    (function () {
      var key = "cangling-update-theme";
      var saved = localStorage.getItem(key);
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();

  <style>

    .plist { overflow: auto; padding: 6px 10px 18px; }

      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;

    .pitem:hover { background: var(--bg-3); }
    .pitem.active { background: var(--bg-active); border-color: var(--accent-emphasis); }
    .pitem .n { font-weight: 600; display: block; }

    main { min-width: 0; overflow: auto; padding: 22px 26px 40px; }
    .btn {
      border: 1px solid var(--line); background: var(--bg-3); color: var(--text);
      padding: 7px 12px;

    .btn:hover { background: var(--bg-2); border-color: var(--line-hover); }
    .btn.primary { background: var(--success-emphasis); color: var(--on-emphasis); border-color: var(--success-emphasis); font-weight: 600; }
    .btn.primary:hover { background: var(--success-hover); border-color: var(--success-hover); }

    .btn.ghost { background: transparent; }

      opacity: 1;
      animation: btn-working 0.9s ease-in-out infinite;
    }
    @keyframes btn-working { 50% { opacity: 0.55; } }
    .compose-op { color: var(--accent); font-weight: 600; }
    .compose-op[hidden] { display: none !important; }
    .card {
      background: var(--bg-2); border: 1px solid var(--line);
      padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 12px; color: var(--muted); font-size: 16px; font-weight: 600; }
    .tabs {
      display: flex; flex-wrap: wrap; gap: 0;
      border-bottom: 1px solid var(--line); margin: 0 0 16px; padding: 0;
    }
    .tab {
      display: inline-flex; align-items: center; gap: 8px;
      border: 0; border-bottom: 2px solid transparent; border-radius: 0;
      background: transparent; color: var(--muted);
      padding: 10px 16px; margin-bottom: -1px; font-weight: 600;
    }
    .tab-ico { flex: 0 0 auto; display: block; }
    .tab:hover { color: var(--text); background: transparent; }
    .tab.active {
      color: var(--text); border-bottom-color: var(--accent-emphasis); background: transparent;
    }
    .tab.active:hover { background: transparent; }
    .tab:focus-visible { outline: 2px solid var(--accent-emphasis); outline-offset: -2px; }
    .tab-panel[hidden] { display: none !important; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    label { display: block; color: var(--muted); margin: 0 0 6px; }

      padding: 9px 11px; outline: none;
    }
    input[type=text]:focus, input[type=password]:focus, textarea:focus { border-color: var(--accent-emphasis); box-shadow: 0 0 0 3px var(--bg-active); }
    textarea { min-height: 72px; resize: vertical; }
    .field { margin-bottom: 12px; }
    .title-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    .title-row h2 {
      margin: 0 0 4px; font-size: 26px; font-weight: 650;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .title-row h2 .pill { font-size: 16px; }
    .path { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); padding: 3px 9px;
      color: var(--muted); background: var(--bg-3);
    }
    .pill.latest { color: var(--on-emphasis); background: var(--success-emphasis); border-color: var(--success-emphasis); font-weight: 600; }
    .drop {
      border: 1px dashed var(--line); padding: 28px 16px; text-align: center;
      color: var(--muted); background: var(--bg-drop);
    }
    .drop.over { border-color: var(--accent-emphasis); color: var(--text); background: var(--bg-drop-over); }
    .filelist { margin: 12px 0 0; padding: 0; list-style: none; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .filelist li { padding: 4px 0; color: var(--text); }
    .progress-wrap { margin-top: 14px; }
    .progress-wrap[hidden] { display: none !important; }
    .progress-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .progress-sub { color: var(--muted); margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
    .progress { height: 10px; background: var(--progress-bg); overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 0; background: var(--success-emphasis); transition: width 0.15s linear; }
    .progress.unknown > span { width: 32%; animation: prog-slide 1.1s ease-in-out infinite; }
    @keyframes prog-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 700; }
    th:last-child, td:last-child:not(.empty) { text-align: right; }
    td:last-child .row { justify-content: flex-end; }
    .empty { color: var(--muted); padding: 28px 8px; text-align: center; }
    .flash { margin: 0 0 14px; padding: 10px 12px; }
    .flash.err { background: var(--flash-err-bg); color: var(--flash-err-text); border: 1px solid var(--flash-err-line); }
    .flash.ok { background: var(--flash-ok-bg); color: var(--flash-ok-text); border: 1px solid var(--flash-ok-line); }
    pre.logs {
      margin: 0; max-height: 280px; overflow: auto; background: var(--log-bg);
      padding: 12px; font-family: "Iosevka Term", "Iosevka Terminal", ui-monospace, monospace; white-space: pre-wrap; color: var(--log-text);
      border: 1px solid var(--line);
    }
    :root[data-theme="dark"] {
      --ansi-0:#484f58; --ansi-1:#ff7b72; --ansi-2:#3fb950; --ansi-3:#d29922;
      --ansi-4:#58a6ff; --ansi-5:#bc8cff; --ansi-6:#39c5cf; --ansi-7:#f0f6fc;
      --ansi-8:#6e7681; --ansi-9:#ffa198; --ansi-10:#56d364; --ansi-11:#e3b341;
      --ansi-12:#79c0ff; --ansi-13:#d2a8ff; --ansi-14:#56d4dd; --ansi-15:#ffffff;
    }
    :root[data-theme="light"] {
      --ansi-0:#1f2328; --ansi-1:#cf222e; --ansi-2:#1a7f37; --ansi-3:#9a6700;
      --ansi-4:#0969da; --ansi-5:#8250df; --ansi-6:#1b7c83; --ansi-7:#6e7781;
      --ansi-8:#656d76; --ansi-9:#a40e26; --ansi-10:#116329; --ansi-11:#7d4e00;
      --ansi-12:#0550ae; --ansi-13:#6639ba; --ansi-14:#1b7c83; --ansi-15:#1f2328;
    }
    .ansi-b { font-weight: 700; }
    .ansi-d { opacity: 0.62; }
    .ansi-i { font-style: italic; }
    .ansi-u { text-decoration: underline; }
    .ansi-fg-0{color:var(--ansi-0)} .ansi-fg-1{color:var(--ansi-1)} .ansi-fg-2{color:var(--ansi-2)} .ansi-fg-3{color:var(--ansi-3)}
    .ansi-fg-4{color:var(--ansi-4)} .ansi-fg-5{color:var(--ansi-5)} .ansi-fg-6{color:var(--ansi-6)} .ansi-fg-7{color:var(--ansi-7)}
    .ansi-fg-8{color:var(--ansi-8)} .ansi-fg-9{color:var(--ansi-9)} .ansi-fg-10{color:var(--ansi-10)} .ansi-fg-11{color:var(--ansi-11)}
    .ansi-fg-12{color:var(--ansi-12)} .ansi-fg-13{color:var(--ansi-13)} .ansi-fg-14{color:var(--ansi-14)} .ansi-fg-15{color:var(--ansi-15)}
    .ansi-bg-0{background:var(--ansi-0)} .ansi-bg-1{background:var(--ansi-1)} .ansi-bg-2{background:var(--ansi-2)} .ansi-bg-3{background:var(--ansi-3)}
    .ansi-bg-4{background:var(--ansi-4)} .ansi-bg-5{background:var(--ansi-5)} .ansi-bg-6{background:var(--ansi-6)} .ansi-bg-7{background:var(--ansi-7)}
    .ansi-bg-8{background:var(--ansi-8)} .ansi-bg-9{background:var(--ansi-9)} .ansi-bg-10{background:var(--ansi-10)} .ansi-bg-11{background:var(--ansi-11)}
    .ansi-bg-12{background:var(--ansi-12)} .ansi-bg-13{background:var(--ansi-13)} .ansi-bg-14{background:var(--ansi-14)} .ansi-bg-15{background:var(--ansi-15)}
    .hint { color: var(--muted); line-height: 1.5; }
    .hint-soft { color: var(--subtle); font-size: 14px; word-break: break-all; }
    label.check {
      display: flex; align-items: flex-start; gap: 8px;
      margin: 10px 0 0; cursor: pointer; color: var(--muted); line-height: 1.45;
    }
    label.check input { margin-top: 3px; flex: 0 0 auto; }
    .gate {
      min-height: 100%; display: grid; place-items: center; padding: 24px;
    }
    .gate .card { width: min(420px, 100%); }
    .gate[hidden], .app[hidden] { display: none !important; }
    #who { color: var(--text); }
    .overlay {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(1, 4, 9, 0.65);
      display: grid; place-items: center; padding: 20px;
    }
    :root[data-theme="light"] .overlay { background: rgba(31, 35, 40, 0.45); }
    .overlay[hidden] { display: none !important; }
    .modal {
      width: min(1080px, 100%); height: min(78vh, 820px);

      display: flex; flex-direction: column; min-height: 0;
    }

      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px; border-bottom: 1px solid var(--line); flex: 0 0 auto;

    .modal.compose-modal { width: min(1180px, 100%); height: min(88vh, 940px); }

      flex: 1; min-height: 0; display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    .compose-edit-top {
      grid-column: 1 / -1; grid-row: 1;
      padding: 8px 14px; border-bottom: 1px solid var(--line);
    }

      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    }
    .compose-edit-top .path { font-size: 14px; }
    .compose-edit-flash { margin: 8px 0 0; }
    .compose-edit-flash[hidden] { display: none !important; }
    .compose-edit-main {
      grid-column: 1; grid-row: 2;
      position: relative; min-width: 0; min-height: 0;
      border-right: 1px solid var(--line);
      background: var(--log-bg);
    }
    #compose-ace {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    .compose-edit-main .ace_editor {
      font-family: "Iosevka Term", "Iosevka Terminal", ui-monospace, monospace;
      font-size: 16px; line-height: 1.5;
      font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0;
    }
    .compose-edit-main .ace_editor,
    .compose-edit-main .ace_editor * { border-radius: 0 !important; }

      grid-column: 1 / -1; grid-row: 3;
      padding: 10px 14px; border-top: 1px solid var(--line);

      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 12px 16px;
      align-items: center;
    }

      display: flex; align-items: center; gap: 8px;

    }

      flex: 1; min-width: 0; width: auto; margin: 0;
    }

      margin: 0; align-items: center; white-space: nowrap;
    }
    .compose-edit-actions .check input { margin-top: 0; }
    .compose-edit-hist {
      grid-column: 2; grid-row: 2;
      min-height: 0; overflow: auto; padding: 10px 10px 12px;
      background: var(--bg-2);
    }
    .compose-edit-hist h4 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }

      width: 100%; text-align: left; border: 1px solid transparent;
      background: transparent; color: var(--text); padding: 8px; margin-bottom: 6px;
    }
    .rev-item:hover { background: var(--bg-3); }
    .rev-item.active { background: var(--bg-active); border-color: var(--accent-emphasis); }
    .rev-item .rev-h { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-weight: 600; flex-wrap: wrap; }
    .rev-item .rev-n { display: block; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rev-item .rev-t { display: block; color: var(--subtle); margin-top: 2px; font-size: 13px; }
    @font-face {
      font-family: "Iosevka Term";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local("Iosevka Term"), local("Iosevka Term Regular"),
           local("IosevkaTermNerdFontMono"), local("IosevkaTerm Nerd Font Mono"),
           url("/vendor/iosevka-term-regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Iosevka Term";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: local("Iosevka Term Bold"), local("IosevkaTermNerdFontMono Bold"),
           url("/vendor/iosevka-term-bold.woff2") format("woff2");
    }
    .modal-body .term {
      flex: 1; min-height: 0; padding: 0; background: var(--log-bg);
    }
    .modal-body .term .xterm, .modal-body .term .xterm-viewport { height: 100%; }
    .modal-body pre.logs {
      flex: 1; max-height: none; margin: 0; border: 0;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 240px; }
      .modal { height: min(90vh, 820px); }
      .compose-edit {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) auto minmax(160px, 28%);
      }
      .compose-edit-main { border-right: 0; border-bottom: 1px solid var(--line); }
      .compose-edit-actions { grid-template-columns: 1fr; }
      .compose-edit-actions .btn { justify-self: start; }
      .compose-edit-hist { grid-column: 1; grid-row: 4; }
    }
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="card">
      <div class="gate-brand">
        <span class="mark mark-lg" aria-hidden="true">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="6" fill="currentColor"/>
            <path fill="#fff" d="M16 6.4 23.2 14h-4.3v5.2h-5.8V14H8.8z"/>
            <rect x="8" y="21.4" width="16" height="2.5" rx="1.2" fill="#fff"/>
            <rect x="10.4" y="24.8" width="11.2" height="2.2" rx="1.1" fill="#fff" opacity=".72"/>
          </svg>
        </span>
        <h3 id="gate-title">登录 <span class="app-ver">v__APP_VERSION__</span></h3>
      </div>
      <p class="hint" id="gate-hint">2 小时无操作将自动退出。忘记密码请在主机执行 <code>cangling-update reset-password</code>。</p>
      <div id="gate-flash" hidden></div>
      <div class="field"><label>用户名</label><input id="gate-user" type="text" autocomplete="username" /></div>
      <div class="field"><label>密码</label><input id="gate-pass" type="password" autocomplete="current-password" /></div>
      <div class="field" id="gate-pass2-wrap" hidden>
        <label>确认密码</label><input id="gate-pass2" type="password" autocomplete="new-password" />
      </div>
      <div class="row">
        <button class="btn primary" id="gate-submit" type="button">登录</button>
        <button type="button" class="btn" id="gate-theme">浅色</button>
      </div>
    </div>
  </div>
  <div class="app" id="app" hidden>
    <header>
      <a class="brand" href="/" title="返回首页">
        <span class="mark" title="系统更新" aria-hidden="true">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="6" fill="currentColor"/>
            <path fill="#fff" d="M16 6.4 23.2 14h-4.3v5.2h-5.8V14H8.8z"/>
            <rect x="8" y="21.4" width="16" height="2.5" rx="1.2" fill="#fff"/>
            <rect x="10.4" y="24.8" width="11.2" height="2.2" rx="1.1" fill="#fff" opacity=".72"/>
          </svg>
        </span>
        <div>
          <h1>系统更新 <span class="app-ver">v__APP_VERSION__</span></h1>
          <small>主机 Docker Compose 系统管理 · 返回首页</small>
        </div>
      </a>
      <div class="header-right">
        <div class="meta" id="meta">加载中…</div>
        <span id="who"></span>
        <button type="button" class="btn" id="btn-logout">退出</button>
        <button type="button" class="btn" id="theme-toggle" aria-label="切换深色或浅色主题">浅色</button>
      </div>
    </header>
    <div class="shell">
      <aside>
        <div class="aside-head">
          <h2>项目</h2>
          <button class="btn primary" id="btn-new">新建</button>
        </div>
        <div class="plist" id="plist"><div class="empty">暂无项目</div></div>
      </aside>
      <main id="main"></main>
    </div>
  </div>
  <div class="overlay" id="dialog" hidden>
    <div class="modal" id="dialog-modal">
      <div class="modal-head">
        <h3 id="dialog-title">窗口</h3>
        <div class="row">
          <button type="button" class="btn" id="dialog-extra" hidden>刷新</button>
          <button type="button" class="btn" id="dialog-close">关闭</button>
        </div>
      </div>
      <div class="modal-body" id="dialog-body"></div>
    </div>
  </div>
  <script>
    const state = { meta: null, projects: [], current: null, versions: [], compose: null, files: [], busy: null, user: null, needsSetup: false, projectTab: "containers" };
    const PROJECT_TABS = [
      {
        id: "import",
        label: "系统升级",
        icon: '<svg class="tab-ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Zm5.03-3.47 3.25-3.25a.75.75 0 0 0-1.06-1.06L8.75 8.19V2a.75.75 0 0 0-1.5 0v6.19L5.03 6.22a.75.75 0 0 0-1.06 1.06l3.25 3.25a.75.75 0 0 0 1.06 0Z"/></svg>',
      },
      {
        id: "containers",
        label: "应用容器",
        icon: '<svg class="tab-ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7.998 1.02c.31 0 .614.08.884.232l5.522 3.213a1.75 1.75 0 0 1 .876 1.518v6.034a1.75 1.75 0 0 1-.876 1.518l-5.522 3.213a1.75 1.75 0 0 1-1.768 0L1.592 13.535a1.75 1.75 0 0 1-.876-1.518V5.983a1.75 1.75 0 0 1 .876-1.518L7.114 1.252A1.75 1.75 0 0 1 7.998 1.02M8 2.5 2.75 5.55v5.9L8 14.5l5.25-3.05v-5.9Z"/></svg>',
      },
      {
        id: "versions",
        label: "版本切换",
        icon: '<svg class="tab-ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M5.22 14.78a.75.75 0 0 0 1.06-1.06L4.56 12h8.69a.75.75 0 0 0 0-1.5H4.56l1.72-1.72a.75.75 0 0 0-1.06-1.06l-3 3a.75.75 0 0 0 0 1.06Zm5.56-6.5a.75.75 0 1 1-1.06-1.06l1.72-1.72H2.75a.75.75 0 0 1 0-1.5h8.69L9.72 2.28a.75.75 0 0 1 1.06-1.06l3 3a.75.75 0 0 1 0 1.06Z"/></svg>',
      },
    ];
    const dialog = { ws: null, term: null, fit: null, onResize: null, xtermReady: null, aceReady: null, confirmClose: null };
    const composePoll = { timer: null, inflight: false };
    const metaPoll = { timer: null, inflight: false };
    const KIND = { baseline: "基线", update: "升级", "pre-rollback": "回滚前快照" };
    const COMPOSE_REV_KIND = { baseline: "基线", save: "保存", restore: "恢复", external: "外部变更" };
    const composeEdit = { kind: "compose", etag: "", disk: "", filename: "", selected: null, busy: false, editor: null, resizeObs: null };
    const FILE_EDIT = {
      compose: {
        title: "编辑 Compose 文件",
        file: (id) => "/api/projects/" + id + "/compose/file",
        rev: (id, rid) => "/api/projects/" + id + "/compose/revisions/" + encodeURIComponent(rid),
        restore: (id, rid) => "/api/projects/" + id + "/compose/revisions/" + encodeURIComponent(rid) + "/restore",
        defaultName: "docker-compose.yml",
        missing: "文件还不存在，保存后将创建 docker-compose.yml",
        restoreMsg: "确定把此历史版本写回磁盘上的 Compose 文件？",
        mode: "ace/mode/yaml",
      },
      env: {
        title: "编辑环境变量",
        file: (id) => "/api/projects/" + id + "/env/file",
        rev: (id, rid) => "/api/projects/" + id + "/env/revisions/" + encodeURIComponent(rid),
        restore: (id, rid) => "/api/projects/" + id + "/env/revisions/" + encodeURIComponent(rid) + "/restore",
        defaultName: ".env",
        missing: "",
        restoreMsg: "确定把此历史版本写回磁盘上的 .env 文件？",
        mode: "ace/mode/ini",
      },
    };
    const COMPOSE = { plugin: "插件", standalone: "独立程序", missing: "未安装" };
    const IDLE_MS = 2 * 60 * 60 * 1000;
    let lastActivity = Date.now();

    const $ = (sel, el = document) => el.querySelector(sel);
    const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function touchActivity() { lastActivity = Date.now(); }
    ["click", "keydown", "mousemove", "scroll"].forEach((ev) => {
      window.addEventListener(ev, touchActivity, { passive: true });
    });
    setInterval(() => {
      if (state.user && Date.now() - lastActivity >= IDLE_MS) {
        logout("已超过 2 小时无操作，请重新登录");
      }
    }, 15000);

    async function api(path, opts = {}) {
      const res = await fetch(path, { credentials: "same-origin", ...opts });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
      if (res.status === 401) {
        showGate((data && data.error) || "请先登录或登录已过期");
        throw new Error((data && data.error) || "请先登录或登录已过期");
      }
      if (!res.ok) throw new Error((data && data.error) || res.statusText);
      touchActivity();
      return data;
    }

    function flash(kind, msg) {
      const box = $("#flash");
      if (!box) return;
      box.className = "flash " + kind;
      box.textContent = msg;
      box.hidden = false;
    }

    function gateFlash(kind, msg) {
      const box = $("#gate-flash");
      box.className = "flash " + kind;
      box.textContent = msg;
      box.hidden = !msg;
    }

    function showGate(message) {
      state.user = null;
      $("#app").hidden = true;
      $("#gate").hidden = false;
      $("#who").textContent = "";
      renderGate();
      if (message) gateFlash("err", message);
    }

    function renderGate() {
      const setup = state.needsSetup;
      $("#gate-title").innerHTML = (setup ? "初始化管理员" : "登录") +
        ' <span class="app-ver">v__APP_VERSION__</span>';
      $("#gate-hint").innerHTML = setup
        ? "首次使用请设置管理员账号。之后 2 小时无操作将自动退出。"
        : "2 小时无操作将自动退出。忘记密码请在主机执行 <code>cangling-update reset-password</code>。";
      $("#gate-pass2-wrap").hidden = !setup;
      $("#gate-submit").textContent = setup ? "创建并进入" : "登录";
      $("#gate-pass").autocomplete = setup ? "new-password" : "current-password";
    }

    async function enterApp(user) {
      state.user = user;
      state.needsSetup = false;
      $("#gate").hidden = true;
      $("#app").hidden = false;
      $("#who").textContent = user.username;
      touchActivity();
      await loadMeta();
      await refreshProjects();
      route();
    }

    function dockerLabel(d) {
      if (!d) return "未检测到";
      if (d.available) return esc(d.version || "正常");
      if (d.version) return "守护进程未就绪";
      return "未检测到";
    }

    function renderMetaBar(m) {
      const dockerOk = !!(m.docker && m.docker.available);
      $("#meta").innerHTML =
        `<span>程序 <b>v${esc(m.version)}</b></span>` +
        `<span>${esc(m.os)} / <b>${esc(m.arch)}</b></span>` +
        `<span>docker <b class="${dockerOk ? "ok" : "bad"}">${dockerLabel(m.docker)}</b> · compose ${esc(COMPOSE[m.docker.compose] || m.docker.compose)}</span>` +
        `<span>数据库 <b>${esc(m.db_path)}</b></span>`;
    }

    async function loadMeta() {
      try {
        state.meta = await api("/api/meta");
        renderMetaBar(state.meta);
        if (state.meta.docker && state.meta.docker.available) stopMetaPoll();
        else startMetaPoll();
      } catch (e) {
        $("#meta").innerHTML = `<span class="bad">${esc(e.message)}</span>`;
        startMetaPoll();
      }
    }

    function startMetaPoll() {
      if (metaPoll.timer) return;
      metaPoll.timer = setInterval(async () => {
        if (!state.user || metaPoll.inflight) return;
        metaPoll.inflight = true;
        try { await loadMeta(); } catch {}
        metaPoll.inflight = false;
      }, 3000);
    }

    function stopMetaPoll() {
      if (metaPoll.timer) {
        clearInterval(metaPoll.timer);
        metaPoll.timer = null;
      }
    }

    async function submitGate() {
      const username = $("#gate-user").value.trim();
      const password = $("#gate-pass").value;
      try {
        if (state.needsSetup) {
          const again = $("#gate-pass2").value;
          if (password !== again) throw new Error("两次输入的密码不一致");
          const user = await api("/api/auth/setup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          await enterApp(user);
        } else {
          const user = await api("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          await enterApp(user);
        }
      } catch (e) {
        gateFlash("err", e.message);
      }
    }

    async function logout(message) {
      stopComposePoll();
      stopMetaPoll();
      closeDialog();
      try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } catch {}
      state.user = null;
      state.projects = [];
      state.current = null;
      showGate(message || "已退出");
    }

    async function boot() {
      try {
        const st = await fetch("/api/auth/status", { credentials: "same-origin" }).then((r) => r.json());
        state.needsSetup = !!st.needs_setup;
        if (st.user) {
          await enterApp(st.user);
          return;
        }
      } catch {}
      showGate();
    }

    async function refreshProjects() {
      state.projects = await api("/api/projects");
      renderList();
    }

    function renderList() {
      const root = $("#plist");
      if (!state.projects.length) {
        root.innerHTML = `<div class="empty">暂无项目</div>`;
        return;
      }
      root.innerHTML = "";
      for (const p of state.projects) {
        const b = document.createElement("button");
        b.className = "pitem" + (state.current && state.current.id === p.id ? " active" : "");
        b.innerHTML = `<span class="n">${esc(p.name)}</span><span class="d">${esc((p.description || "").trim() || "（无说明）")}</span>`;
        b.onclick = () => { location.hash = "#/p/" + p.id; };
        root.appendChild(b);
      }
    }

    function route() {
      stopComposePoll();
      closeDialog();
      const hash = location.hash || "#/";
      if (hash === "#/new") return renderNew();
      const m = hash.match(/^#\/p\/([^/]+)$/);
      if (m) return openProject(m[1]);
      renderHome();
    }

    function renderHome() {
      state.current = null;
      renderList();
      $("#main").innerHTML = `
        <div class="title-row">
          <div>
            <h2>主机升级</h2>
            <div class="path">绑定 Docker Compose 目录，导入镜像包或 JAR，并保留可回滚版本。</div>
          </div>
        </div>
        <div class="card">
          <h3>使用说明</h3>
          <p class="hint">
            1. 新建项目，指向本机上已存在且包含 compose.yaml / docker-compose.yml 的绝对路径目录。<br/>
            2. 上传 <code>.tar.gz</code> 镜像包和/或 <code>.jar</code>。镜像会 <code>docker load</code> 并打成 <code>:latest</code>；JAR 按文件名替换 compose 里挂载的文件（如 <code>./jars/cis-server-1.0.0.jar</code>），并强制重建对应服务。<br/>
            3. 可在版本列表中恢复任意历史快照，同时会重新加载该版本保存的镜像包。目录做 <b>全量备份</b>（含 PostGIS 等数据目录）。备份前请先停止应用，页面会提示并默认先 Compose Down。
          </p>
          <button class="btn primary" onclick="location.hash='#/new'">新建项目</button>
        </div>
        <div id="orphan-box"></div>`;
      loadOrphans("orphan-box");
    }

    function renderNew() {
      state.current = null;
      renderList();
      $("#main").innerHTML = `
        <div class="title-row"><div><h2>新建项目</h2><div class="path">绑定本机上的 Compose 应用目录</div></div></div>
        <div id="flash" hidden></div>
        <div class="card">
          <div class="field"><label>名称</label><input id="f-name" type="text" placeholder="边缘网关" /></div>
          <div class="field"><label>说明</label><textarea id="f-desc" placeholder="选填"></textarea></div>
          <div class="field"><label>主机目录（绝对路径）</label><input id="f-dir" type="text" placeholder="/opt/apps/gateway" autocomplete="off" /></div>
          <div class="hint" id="dir-hint">目录必须已存在于本机，并且包含 Compose 文件。</div>
          <p class="hint">创建时会全量备份该目录（含数据库数据）。正在运行的应用可能锁住文件，导致备份失败或不完整。</p>
          <label class="check"><input type="checkbox" id="f-stop" checked /> 备份前先执行 Compose Down（推荐）。备份结束后会再启动。</label>
          <div class="progress-wrap" id="create-prog" hidden>
            <div class="progress-meta"><span id="create-prog-msg">准备中</span><span id="create-prog-pct">0%</span></div>
            <div class="progress" id="create-prog-bar"><span></span></div>
            <div class="progress-sub" id="create-prog-sub"></div>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="btn" id="btn-check">检查目录</button>
            <button class="btn primary" id="btn-create">创建</button>
          </div>
        </div>
        <div id="orphan-box"></div>`;
      $("#btn-check").onclick = checkDir;
      $("#btn-create").onclick = createProject;
      $("#f-dir").addEventListener("blur", checkDir);
      $("#f-dir").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          checkDir();
        }
      });
      loadOrphans("orphan-box");
    }

    async function checkDir() {
      const input = $("#f-dir");
      const hint = $("#dir-hint");
      if (!input || !hint) return;
      const directory = input.value.trim();
      if (!directory) {
        hint.textContent = "目录必须已存在于本机，并且包含 Compose 文件。";
        return;
      }
      hint.textContent = "正在检查目录…";
      try {
        const r = await api("/api/validate-directory", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ directory }),
        });
        if ($("#f-dir") && $("#f-dir").value.trim() !== directory) return;
        hint.innerHTML = r.ok
          ? `已找到 <b>${esc(r.compose_file)}</b> · 镜像：${r.images.length ? r.images.map(esc).join(", ") : "（未声明）"} · JAR：${r.jar_mounts && r.jar_mounts.length ? r.jar_mounts.map(j => esc(j.basename)).join(", ") : "（无）"}`
          : `<span class="bad">${esc(r.warning || "不是 Compose 目录")}</span>`;
      } catch (e) {
        if ($("#f-dir") && $("#f-dir").value.trim() !== directory) return;
        hint.innerHTML = `<span class="bad">${esc(e.message)}</span>`;
      }
    }

    function fmtBytes(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + " B";
      if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
      if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
      return (n / 1073741824).toFixed(2) + " GB";
    }

    function xterm256(n) {
      n = n & 255;
      if (n < 16) return n;
      if (n < 232) {
        n -= 16;
        const v = [0, 95, 135, 175, 215, 255];
        return "rgb(" + v[Math.floor(n / 36)] + "," + v[Math.floor((n % 36) / 6)] + "," + v[n % 6] + ")";
      }
      const g = 8 + (n - 232) * 10;
      return "rgb(" + g + "," + g + "," + g + ")";
    }

    function applySgr(st, raw) {
      const parts = raw.length ? raw.split(";") : ["0"];
      for (let p = 0; p < parts.length; p++) {
        const n = parseInt(parts[p], 10);
        const code = isNaN(n) ? 0 : n;
        if (code === 0) { st.b = st.d = st.i = st.u = st.inv = 0; st.fg = st.bg = null; }
        else if (code === 1) { st.b = 1; st.d = 0; }
        else if (code === 2) st.d = 1;
        else if (code === 3) st.i = 1;
        else if (code === 4) st.u = 1;
        else if (code === 7) st.inv = 1;
        else if (code === 21 || code === 22) { st.b = 0; st.d = 0; }
        else if (code === 23) st.i = 0;
        else if (code === 24) st.u = 0;
        else if (code === 27) st.inv = 0;
        else if (code === 39) st.fg = null;
        else if (code === 49) st.bg = null;
        else if (code >= 30 && code <= 37) st.fg = code - 30;
        else if (code >= 90 && code <= 97) st.fg = code - 90 + 8;
        else if (code >= 40 && code <= 47) st.bg = code - 40;
        else if (code >= 100 && code <= 107) st.bg = code - 100 + 8;
        else if (code === 38 || code === 48) {
          const kind = parseInt(parts[++p], 10);
          let color = null;
          if (kind === 5) color = xterm256(parseInt(parts[++p], 10) || 0);
          else if (kind === 2) {
            const r = parseInt(parts[++p], 10) || 0;
            const g = parseInt(parts[++p], 10) || 0;
            const b = parseInt(parts[++p], 10) || 0;
            color = "rgb(" + r + "," + g + "," + b + ")";
          }
          if (code === 38) st.fg = color;
          else st.bg = color;
        }
      }
    }

    function ansiToHtml(raw) {
      raw = String(raw ?? "");
      const st = { b: 0, d: 0, i: 0, u: 0, inv: 0, fg: null, bg: null };
      let out = "";
      const paint = (s) => {
        if (!s) return;
        const cls = [];
        if (st.b) cls.push("ansi-b");
        if (st.d) cls.push("ansi-d");
        if (st.i) cls.push("ansi-i");
        if (st.u) cls.push("ansi-u");
        let fg = st.inv ? (st.bg == null ? "var(--log-bg)" : st.bg) : st.fg;
        let bg = st.inv ? (st.fg == null ? "var(--log-text)" : st.fg) : st.bg;
        let style = "";
        if (typeof fg === "number") cls.push("ansi-fg-" + fg);
        else if (fg) style += "color:" + fg + ";";
        if (typeof bg === "number") cls.push("ansi-bg-" + bg);
        else if (bg) style += "background:" + bg + ";";
        const body = esc(s);
        if (!cls.length && !style) { out += body; return; }
        out += "<span" + (cls.length ? " class=\"" + cls.join(" ") + "\"" : "") +
          (style ? " style=\"" + style + "\"" : "") + ">" + body + "</span>";
      };
      let i = 0, buf = "";
      const flush = () => { paint(buf); buf = ""; };
      while (i < raw.length) {
        const code = raw.charCodeAt(i);
        if (code === 0x1b && i + 1 < raw.length) {
          const n = raw[i + 1];
          if (n === "[") {
            let j = i + 2;
            while (j < raw.length) {
              const cc = raw.charCodeAt(j);
              j++;
              if (cc >= 0x40 && cc <= 0x7e) break;
            }
            flush();
            if (raw[j - 1] === "m") applySgr(st, raw.slice(i + 2, j - 1).replace(/^[?-]/, ""));
            i = j;
            continue;
          }
          if (n === "]") {
            let j = i + 2;
            while (j < raw.length) {
              if (raw.charCodeAt(j) === 0x07) { j++; break; }
              if (raw.charCodeAt(j) === 0x1b && raw[j + 1] === "\\") { j += 2; break; }
              j++;
            }
            flush();
            i = j;
            continue;
          }
          flush();
          i += 2;
          continue;
        }
        if (code === 0x9b) {
          let j = i + 1;
          while (j < raw.length) {
            const cc = raw.charCodeAt(j);
            j++;
            if (cc >= 0x40 && cc <= 0x7e) break;
          }
          flush();
          if (raw[j - 1] === "m") applySgr(st, raw.slice(i + 1, j - 1));
          i = j;
          continue;
        }
        buf += raw[i++];
      }
      flush();
      return out;
    }

    function setLogs(el, text) {
      if (!el) return;
      el.innerHTML = ansiToHtml(text || "（无输出）");
    }

    function showProgress(prefix, on) {
      const wrap = document.getElementById(prefix);
      if (wrap) wrap.hidden = !on;
    }

    function renderProgress(prefix, job) {
      const wrap = document.getElementById(prefix);
      if (!wrap) return;
      wrap.hidden = false;
      const msg = document.getElementById(prefix + "-msg");
      const pct = document.getElementById(prefix + "-pct");
      const bar = document.querySelector("#" + prefix + "-bar");
      const fill = bar ? bar.querySelector("span") : null;
      const sub = document.getElementById(prefix + "-sub");
      const unknown = !job.total;
      if (bar) bar.classList.toggle("unknown", unknown && !job.done);
      if (msg) msg.textContent = job.message || job.phase || "处理中";
      if (pct) pct.textContent = unknown && !job.done ? "…" : (job.percent || 0) + "%";
      if (fill && !unknown) fill.style.width = (job.percent || 0) + "%";
      if (sub) {
        const msg = job.message || "";
        if (/索引|提交 Git/.test(msg)) {
          sub.textContent = job.total ? (job.current + " / " + job.total + " 个文件") : "";
        } else {
          sub.textContent = job.total
            ? fmtBytes(job.current) + " / " + fmtBytes(job.total)
            : "";
        }
      }
    }

    function watchJob(id, prefix) {
      let timer = setInterval(async () => {
        try {
          const job = await api("/api/jobs/" + id);
          renderProgress(prefix, job);
          if (job.done) {
            clearInterval(timer);
            timer = null;
          }
        } catch {}
      }, 400);
      return () => { if (timer) clearInterval(timer); };
    }

    async function loadOrphans(boxId) {
      const box = document.getElementById(boxId);
      if (!box) return;
      try {
        const items = await api("/api/orphans");
        if (!items.length) {
          box.innerHTML = "";
          return;
        }
        box.innerHTML = `
          <div class="card">
            <h3>未完成的备份残留</h3>
            <p class="hint">首次备份或升级失败时，磁盘上可能留下没有项目/版本记录的目录，平时列表里看不到。可在此查看并清理。</p>
            <table>
              <thead><tr><th>编号</th><th>大小</th><th>时间</th><th>路径</th><th></th></tr></thead>
              <tbody>${items.map(o => `<tr>
                <td class="path">${esc(o.id)}</td>
                <td>${fmtBytes(o.bytes || 0)}</td>
                <td>${esc((o.modified || "").replace("T", " ").slice(0, 19) || "—")}</td>
                <td class="path">${esc(o.path)}</td>
                <td><button class="btn danger" data-orphan="${esc(o.id)}">清理</button></td>
              </tr>`).join("")}</tbody>
            </table>
          </div>`;
        for (const b of box.querySelectorAll("[data-orphan]")) {
          b.onclick = async () => {
            if (!confirm("确定删除这份残留备份？")) return;
            try {
              const oid = b.getAttribute("data-orphan") || "";
              await api("/api/orphans/" + encodeURIComponent(oid), { method: "DELETE" });
              await loadOrphans(boxId);
            } catch (e) {
              flash("err", e.message);
            }
          };
        }
      } catch (e) {
        box.innerHTML = `<div class="flash err">${esc(e.message)}</div>`;
      }
    }

    async function createProject() {
      const stopFirst = $("#f-stop") ? $("#f-stop").checked : true;
      if (!confirm(
        "将全量备份该目录（包含 PostGIS 等数据库文件）。\n" +
        (stopFirst ? "会先停止 Compose，备份完成后再启动。\n" : "请先手动停止当前应用，否则备份可能失败或不完整。\n") +
        "确定继续？"
      )) return;
      const btn = $("#btn-create");
      let stop = () => {};
      try {
        btn.disabled = true;
        const job = await api("/api/jobs", { method: "POST" });
        showProgress("create-prog", true);
        renderProgress("create-prog", { message: "正在建立基线快照…", percent: 0, current: 0, total: 0 });
        stop = watchJob(job.id, "create-prog");
        const body = {
          name: $("#f-name").value,
          description: $("#f-desc").value,
          directory: $("#f-dir").value,
          job_id: job.id,
          stop_compose: stopFirst,
        };
        const p = await api("/api/projects", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),

    function applyComposeStatus(compose) {
      state.compose = compose;
      const body = $("#compose-svc-body");
      if (!body) return;
      const rows = composeServiceRows(compose.services);
      body.innerHTML = rows || `<tr><td colspan="5" class="empty">未报告运行中的服务</td></tr>`;
      bindComposeServiceButtons();
      const err = $("#compose-err");
      if (err) {
        if (compose.error) {
          err.hidden = false;
          err.textContent = compose.error;

          err.hidden = true;
          err.textContent = "";

    function syncEnvButton(compose) {
      const row = $("#btn-edit-compose") && $("#btn-edit-compose").parentElement;
      if (!row) return;
      let btn = $("#btn-edit-env");
      if (compose.env_file) {
        if (!btn) {
          btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn";
          btn.id = "btn-edit-env";
          btn.textContent = "环境变量";
          btn.onclick = openEnvEditor;
          const op = $("#compose-op");
          row.insertBefore(btn, op || null);

        btn.disabled = !!state.busy;
        btn.hidden = false;

        btn.remove();

    function stopComposePoll() {
      if (composePoll.timer) {
        clearInterval(composePoll.timer);
        composePoll.timer = null;
      }
    }

    function startComposePoll() {
      stopComposePoll();
      if (!state.current) return;
      composePoll.timer = setInterval(refreshComposeStatus, 2000);
    }

    async function refreshComposeStatus() {
      if (!state.current || state.busy || composePoll.inflight) return;
      composePoll.inflight = true;
      try {
        const compose = await api("/api/projects/" + state.current.id + "/compose");
        const prev = JSON.stringify({
          services: (state.compose && state.compose.services) || [],
          error: (state.compose && state.compose.error) || "",
          env_file: (state.compose && state.compose.env_file) || "",
        });
        const next = JSON.stringify({
          services: compose.services || [],
          error: compose.error || "",
          env_file: compose.env_file || "",
        });
        if (prev !== next) applyComposeStatus(compose);
        if (compose.available && state.meta && !(state.meta.docker && state.meta.docker.available)) {
          loadMeta();
        }
      } catch {}
      composePoll.inflight = false;
    }

    function currentProjectTab() {
      return PROJECT_TABS.some((t) => t.id === state.projectTab) ? state.projectTab : "containers";
    }

    function applyProjectTab(tab) {
      if (tab) state.projectTab = tab;
      const cur = currentProjectTab();
      for (const btn of document.querySelectorAll("[data-tab]")) {
        const on = btn.getAttribute("data-tab") === cur;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-selected", on ? "true" : "false");
        btn.tabIndex = on ? 0 : -1;
      }
      for (const panel of document.querySelectorAll("[data-panel]")) {
        panel.hidden = panel.getAttribute("data-panel") !== cur;
      }

    function addFiles(list) {
      for (const f of list) state.files.push(f);
      const ul = $("#filelist");
      ul.innerHTML = state.files.map(f => `<li>${esc(f.name)} · ${(f.size / 1048576).toFixed(1)} MB</li>`).join("");
    }

    function setBusy(kind) {
      state.busy = kind;
      const ids = ["btn-update", "btn-snap", "btn-up", "btn-down", "btn-restart", "btn-edit-compose", "btn-edit-env", "btn-del", "btn-refresh"];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el) el.disabled = true;
      }
      for (const el of document.querySelectorAll("[data-restore]")) {
        el.disabled = true;
        if (kind === "restore") el.textContent = "恢复中…";
      }
      for (const el of document.querySelectorAll("[data-svc-restart], [data-term], [data-svc-logs]")) {
        el.disabled = true;
      }
    }

    function clearBusy() {
      state.busy = null;
    }

    async function runUpdate(snapshotOnly) {
      if (state.busy) {
        flash("err", "正在处理中，请勿重复操作");
        return;
      }
      if (!snapshotOnly && !state.files.length) {
        flash("err", "请至少选择一个镜像包或 JAR，或使用「仅备份当前目录」。");
        return;
      }
      const stopFirst = $("#f-stop") ? $("#f-stop").checked : true;
      if (!confirm(
        "将全量备份当前目录（包含数据库数据）。\n" +
        (stopFirst ? "会先停止 Compose，再备份。\n" : "请先手动停止当前应用，否则备份可能失败或不完整。\n") +
        "确定继续？"
      )) {
        return;
      }
      let stop = () => {};
      setBusy("update");
      try {
        const job = await api("/api/jobs", { method: "POST" });
        const fd = new FormData();
        fd.append("note", $("#note").value || (snapshotOnly ? "目录快照" : ""));
        fd.append("stop_compose", stopFirst ? "true" : "false");
        fd.append("restart", snapshotOnly
          ? (stopFirst ? "true" : "false")
          : ($("#restart") && $("#restart").checked ? "true" : "false"));
        fd.append("job_id", job.id);
        if (!snapshotOnly) for (const f of state.files) fd.append("files", f, f.name);

        const totalBytes = snapshotOnly ? 0 : state.files.reduce((s, f) => s + (f.size || 0), 0);
        showProgress("prog", true);
        renderProgress("prog", {
          message: snapshotOnly ? "正在备份当前目录…" : "正在上传文件…",
          percent: 0,
          current: 0,
          total: totalBytes,
        });
        stop = watchJob(job.id, "prog");

        const data = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable || snapshotOnly) return;
            renderProgress("prog", {
              message: "正在上传文件…",
              percent: Math.round(e.loaded / e.total * 100),
              current: e.loaded,
              total: e.total,
            });
          };
          xhr.onload = () => {
            let payload = {};
            try { payload = JSON.parse(xhr.responseText || "{}"); } catch { payload = { error: xhr.responseText }; }
            if (xhr.status === 401) {
              showGate((payload && payload.error) || "请先登录或登录已过期");
              reject(new Error((payload && payload.error) || "请先登录"));
              return;
            }
            if (xhr.status >= 400) reject(new Error(payload.error || xhr.statusText));
            else resolve(payload);
          };
          xhr.onerror = () => reject(new Error("上传失败"));
          xhr.open("POST", "/api/projects/" + state.current.id + "/updates");
          xhr.send(fd);
        });
        flash("ok", `已将 ${data.version.label} 发布为最新版。`);
        state.files = [];
        state.projectTab = "versions";
        clearBusy();
        await openProject(state.current.id);
        flash("ok", `已将 ${data.version.label} 发布为最新版。`);
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);
      } finally {
        stop();
      }
    }

    async function restore(versionId) {
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      const stopFirst = $("#f-stop") ? $("#f-stop").checked : true;
      if (!confirm(
        "确定恢复此版本？恢复前会先全量备份当前目录。\n" +
        (stopFirst ? "会先停止 Compose，再备份并恢复。\n" : "请先手动停止当前应用。\n") +
        "确定继续？"
      )) return;
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      setBusy("restore");
      flash("ok", "正在恢复，请稍候…");
      let stop = () => {};
      try {
        const job = await api("/api/jobs", { method: "POST" });
        showProgress("op-prog", true);
        renderProgress("op-prog", { message: "正在备份当前目录…", percent: 0, current: 0, total: 0 });
        stop = watchJob(job.id, "op-prog");
        const data = await api("/api/projects/" + state.current.id + "/rollback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            version_id: versionId,
            restart: $("#restart") ? $("#restart").checked : true,
            stop_compose: stopFirst,
            job_id: job.id,
          }),
        });
        clearBusy();
        state.projectTab = "versions";
        await openProject(state.current.id);
        flash("ok", "已恢复 " + data.version.label + "，并标记为当前最新版。");
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);
      } finally {
        stop();
      }
    }

          state.compose = await api("/api/projects/" + state.current.id + "/compose");

      if (!state.current || !name) return;
      if (state.busy) {
        flash("err", "正在处理中，请稍后再重启该服务");
        return;
      }

      const btn = document.querySelector('[data-svc-restart="' + CSS.escape(name) + '"]');
      const idle = btn ? btn.textContent : "重启";
      if (btn) {
        btn.disabled = true;
        btn.textContent = "重启中…";
        btn.classList.add("working");
      }
      flash("ok", "正在重启 " + name + "…");
      try {
        await api(
          "/api/projects/" + state.current.id + "/compose/restart/" + encodeURIComponent(name),
          { method: "POST" }

        await refreshComposeStatus();

        flash("err", e.message);

    function loadXterm() {
      if (window.Terminal && window.FitAddon) return Promise.resolve();
      if (dialog.xtermReady) return dialog.xtermReady;
      dialog.xtermReady = new Promise((resolve, reject) => {
        if (!document.getElementById("xterm-css")) {

          css.rel = "stylesheet";
          css.href = "/vendor/xterm.css";
          document.head.appendChild(css);
        }
        const s1 = document.createElement("script");
        s1.src = "/vendor/xterm.js";
        s1.onload = () => {
          const s2 = document.createElement("script");
          s2.src = "/vendor/xterm-addon-fit.js";
          s2.onload = resolve;
          s2.onerror = () => reject(new Error("无法加载 xterm-addon-fit.js"));
          document.head.appendChild(s2);

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) {
          resolve();
          return;
        }
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("无法加载 " + src));
        document.head.appendChild(s);
      });
    }

    function loadAce() {
      if (window.ace) return Promise.resolve();
      if (dialog.aceReady) return dialog.aceReady;
      dialog.aceReady = (async () => {
        await loadScriptOnce("/vendor/ace/ace.js");
        if (!window.ace) throw new Error("无法加载 Ace 编辑器");
        window.ace.config.set("basePath", "/vendor/ace");
        window.ace.config.set("loadWorkerFromBlob", false);
        await Promise.all([
          loadScriptOnce("/vendor/ace/mode-yaml.js"),
          loadScriptOnce("/vendor/ace/mode-ini.js"),
          loadScriptOnce("/vendor/ace/theme-github.js"),
          loadScriptOnce("/vendor/ace/theme-github_dark.js"),
          loadScriptOnce("/vendor/ace/ext-searchbox.js"),
        ]);
      })();
      return dialog.aceReady;
    }

    function destroyAceEditor() {
      if (composeEdit.resizeObs) {
        try { composeEdit.resizeObs.disconnect(); } catch {}
        composeEdit.resizeObs = null;
      }
      if (composeEdit.editor) {
        try { composeEdit.editor.destroy(); } catch {}
        composeEdit.editor = null;
      }
    }

    function mountAceEditor() {
      destroyAceEditor();
      const el = $("#compose-ace");
      if (!el || !window.ace) return;
      const spec = fileEditSpec();
      const editor = window.ace.edit(el, {
        mode: spec.mode,
        theme: aceThemeName(),
        useWorker: false,
        fontSize: 16,
        tabSize: 2,
        useSoftTabs: true,
        wrap: false,
        showPrintMargin: false,
        fadeFoldWidgets: true,
        scrollPastEnd: 0.4,
        fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace',
      });
      editor.commands.addCommand({
        name: "saveFile",
        bindKey: { win: "Ctrl-S", mac: "Command-S" },
        exec: () => saveComposeFile(),
      });
      editor.focus();
      composeEdit.editor = editor;
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          if (composeEdit.editor) composeEdit.editor.resize();
        });
        ro.observe(el);
        composeEdit.resizeObs = ro;
      }
    }

    function setComposeSource(text) {
      if (composeEdit.editor) composeEdit.editor.setValue(text ?? "", -1);
    }

    function applyComposeFile(data, selectedId) {
      const spec = fileEditSpec();
      composeEdit.etag = data.etag || "";
      composeEdit.disk = data.content || "";
      composeEdit.filename = data.filename || spec.defaultName;
      composeEdit.selected = selectedId || null;
      if (selectedId == null) setComposeSource(data.content || "");
      const meta = $("#compose-edit-meta");
      if (meta) {
        const mismatch = data.exists && data.revisions && data.revisions.length && !data.matches_latest
          ? "磁盘内容与最近一次保存不一致"
          : "";
        const rev = data.current_rev_no ? "r" + data.current_rev_no : "尚无历史";
        meta.innerHTML = `<span class="path">${esc(data.path || composeEdit.filename)}</span>` +
          `<span>${esc(rev)}</span>` +
          (!data.exists && spec.missing ? `<span>${esc(spec.missing)}</span>` : "") +
          (mismatch ? `<span class="bad">${esc(mismatch)}</span>` : "");
      }
      renderComposeRevisions(data, selectedId);
    }

    function renderComposeRevisions(data, selectedId) {
      const box = $("#compose-rev-list");
      if (!box) return;
      const revs = data.revisions || [];
      if (!revs.length) {
        box.innerHTML = `<div class="empty">保存后会出现历史版本</div>`;
        return;
      }
      box.innerHTML = revs.map((r) => {
        const onDisk = r.etag === data.etag;
        const active = selectedId ? r.id === selectedId : onDisk;
        return `<button type="button" class="rev-item${active ? " active" : ""}" data-rev="${esc(r.id)}">
          <span class="rev-h">r${r.rev_no} ${esc(COMPOSE_REV_KIND[r.kind] || r.kind)}${onDisk ? ` <span class="pill latest">当前</span>` : ""}</span>
          <span class="rev-n">${esc(r.note || "（无备注）")}</span>
          <span class="rev-t">${esc((r.created_at || "").replace("T", " ").slice(0, 19))} · ${fmtBytes(r.bytes || 0)}</span>
          ${onDisk ? "" : `<span class="row" style="margin-top:6px;justify-content:flex-start"><span class="btn" data-restore-rev="${esc(r.id)}">恢复此版本</span></span>`}
        </button>`;
      }).join("");
      for (const b of box.querySelectorAll("[data-rev]")) {
        b.onclick = (e) => {
          if (e.target.closest("[data-restore-rev]")) return;
          loadComposeRevision(b.getAttribute("data-rev"));
        };
      }
      for (const b of box.querySelectorAll("[data-restore-rev]")) {
        b.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          restoreComposeRevision(b.getAttribute("data-restore-rev"));
        };
      }
    }

            <button type="button" class="btn primary" id="btn-compose-save">保存</button>

    async function loadComposeRevision(revId) {
      if (!state.current || !revId || composeEdit.busy) return;
      if (composeDirty() && !confirm("编辑器里有未保存的修改，确定加载此版本到编辑器？")) return;
      try {
        const rev = await api(fileEditSpec().rev(state.current.id, revId));
        setComposeSource(rev.content || "");
        composeEdit.selected = rev.id;
        const items = document.querySelectorAll(".rev-item");
        for (const el of items) {
          el.classList.toggle("active", el.getAttribute("data-rev") === rev.id);
        }
        if (rev.etag === composeEdit.etag) {
          composeEditFlash("", "");
        } else {
          composeEditFlash("ok", "已载入 r" + rev.rev_no + "，保存或点「恢复此版本」才会写入磁盘");
        }
      } catch (e) {
        composeEditFlash("err", e.message);
      }
    }

    async function saveComposeFile() {
      if (!state.current || composeEdit.busy || !composeEdit.editor) return;
      composeEdit.busy = true;
      const btn = $("#btn-compose-save");
      if (btn) btn.disabled = true;
      composeEditFlash("ok", "正在保存…");
      try {
        const data = await api(fileEditSpec().file(state.current.id), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: composeEdit.editor.getValue(),
            note: ($("#compose-note") && $("#compose-note").value) || "",
            recreate: $("#compose-recreate") ? $("#compose-recreate").checked : false,
            expected_etag: composeEdit.etag,
          }),
        });
        applyComposeFile(data, null);
        if ($("#compose-note")) $("#compose-note").value = "";
        let msg = data.unchanged ? "内容和磁盘一致，未写入新版本" : "已保存 r" + (data.current_rev_no || "");
        if (data.recreate_log) msg += "。已尝试启动 Compose。";
        composeEditFlash("ok", msg);
        refreshComposeStatus();
      } catch (e) {
        composeEditFlash("err", e.message);
      } finally {
        composeEdit.busy = false;
        if (btn) btn.disabled = false;
      }
    }

    async function restoreComposeRevision(revId) {
      if (!state.current || !revId || composeEdit.busy) return;
      if (composeDirty() && !confirm("编辑器里有未保存的修改，确定用此历史版本覆盖磁盘上的文件？")) return;
      else if (!composeDirty() && !confirm(fileEditSpec().restoreMsg)) return;
      composeEdit.busy = true;
      composeEditFlash("ok", "正在恢复…");
      try {
        const data = await api(
          fileEditSpec().restore(state.current.id, revId),
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              recreate: $("#compose-recreate") ? $("#compose-recreate").checked : false,
            }),
          }
        );
        applyComposeFile(data, null);
        composeEditFlash("ok", "已恢复并保存为 r" + (data.current_rev_no || "") + (data.recreate_log ? "。已尝试启动 Compose。" : ""));
        refreshComposeStatus();
      } catch (e) {
        composeEditFlash("err", e.message);
      } finally {
        composeEdit.busy = false;
      }
    }

    async function openTerm(name) {
      if (!state.current || !name) return;
      closeDialog();
      try {
        await loadXterm();
        if (document.fonts && document.fonts.load) {
          await document.fonts.load('15px "Iosevka Term"');
          await document.fonts.load('bold 15px "Iosevka Term"');
        }
      } catch (e) {
        flash("err", e.message);
        return;
      }
      $("#dialog-title").textContent = "终端 · " + name;
      $("#dialog-extra").hidden = true;
      $("#dialog-body").innerHTML = `<div class="term" id="term"></div>`;
      $("#dialog").hidden = false;
      const term = new window.Terminal({
        cursorBlink: true,
        fontSize: 15,
        fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace',
        theme: termTheme(),
      });
      const Fit = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);
      const fit = Fit ? new Fit() : null;
      if (fit) term.loadAddon(fit);
      term.open($("#term"));
      if (fit) fit.fit();
      dialog.term = term;
      dialog.fit = fit;

      const proto = location.protocol === "https:" ? "wss" : "ws";
      const qs = "?cols=" + (term.cols || 80) + "&rows=" + (term.rows || 24);
      const ws = new WebSocket(
        proto + "://" + location.host + "/api/projects/" + state.current.id +
        "/compose/exec/" + encodeURIComponent(name) + qs
      );
      ws.binaryType = "arraybuffer";
      dialog.ws = ws;
      ws.onmessage = (ev) => {
        if (typeof ev.data === "string") term.write(ev.data);
        else term.write(new Uint8Array(ev.data));
      };
      ws.onerror = () => term.writeln("\r\n连接失败");
      ws.onclose = () => term.writeln("\r\n连接已关闭");
      term.onData((data) => {
        if (ws.readyState === 1) ws.send(data);
      });
      const sendResize = () => {
        if (fit) fit.fit();
        if (ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      };
      dialog.onResize = sendResize;
      window.addEventListener("resize", sendResize);
      setTimeout(sendResize, 50);
      term.focus();
    }

    function renderTheme() {

    function toggleTheme() {
      const next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);
      renderTheme();
      applyAceTheme();
    }
    $("#theme-toggle").onclick = toggleTheme;
    $("#gate-theme").onclick = toggleTheme;
    renderTheme();

    $("#dialog-close").onclick = () => {
      if (dialog.confirmClose && !dialog.confirmClose()) return;
      closeDialog();
    };
    $("#btn-new").onclick = () => location.hash = "#/new";
    $("#btn-logout").onclick = () => logout();
    $("#gate-submit").onclick = submitGate;
    ["gate-user", "gate-pass", "gate-pass2"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("keydown", (e) => { if (e.key === "Enter") submitGate(); });
    });
    window.addEventListener("hashchange", route);
    boot();
  </script>
</body>
</html>
