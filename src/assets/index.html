  <script>
    (function () {
      var key = "cangling-update-theme";
      var saved = localStorage.getItem(key);
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    /* Primer / GitHub color system */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117;
      --bg-header: #010409;
      --bg-2: #161b22;
      --bg-3: #212830;
      --bg-input: #0d1117;
      --bg-drop: #151b23;
      --bg-drop-over: #388bfd1a;
      --bg-active: #388bfd1a;
      --line: #3d444d;
      --line-muted: #212830;
      --line-hover: #656c76;
      --text: #f0f6fc;
      --muted: #9198a1;
      --subtle: #656c76;
      --on-emphasis: #ffffff;
      --accent: #4493f8;
      --accent-emphasis: #1f6feb;
      --success: #3fb950;
      --success-emphasis: #238636;
      --success-hover: #2ea043;
      --danger: #f85149;
      --danger-emphasis: #da3633;
      --flash-err-bg: #f851491a;
      --flash-err-text: #f85149;
      --flash-err-line: #f8514966;
      --flash-ok-bg: #2ea04326;
      --flash-ok-text: #3fb950;
      --flash-ok-line: #2ea04366;
      --danger-bg: #f851491a;
      --danger-text: #f85149;
      --danger-line: #f8514966;
      --log-bg: #010409;
      --log-text: #f0f6fc;
      --progress-bg: #212830;
      --progress-check: #4493f8;
      --progress-upload: #d29922;
      --shadow: 0 0 0 1px #3d444d;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --bg-header: #f6f8fa;
      --bg-2: #ffffff;
      --bg-3: #f6f8fa;
      --bg-input: #ffffff;
      --bg-drop: #f6f8fa;
      --bg-drop-over: #ddf4ff;
      --bg-active: #ddf4ff;
      --line: #d1d9e0;
      --line-muted: #d8dee4;
      --line-hover: #8c959f;
      --text: #1f2328;
      --muted: #59636e;
      --subtle: #818b98;
      --on-emphasis: #ffffff;
      --accent: #0969da;
      --accent-emphasis: #0969da;
      --success: #1a7f37;
      --success-emphasis: #1f883d;
      --success-hover: #1c8139;
      --danger: #d1242f;
      --danger-emphasis: #cf222e;
      --flash-err-bg: #ffebe9;
      --flash-err-text: #d1242f;
      --flash-err-line: #ff818266;
      --flash-ok-bg: #dafbe1;
      --flash-ok-text: #1a7f37;
      --flash-ok-line: #4ac26b66;
      --danger-bg: #ffebe9;
      --danger-text: #d1242f;
      --danger-line: #ff818266;
      --log-bg: #f6f8fa;
      --log-text: #1f2328;
      --progress-bg: #d1d9e0;
      --progress-check: #0969da;
      --progress-upload: #bf8700;
      --shadow: 0 1px 0 rgba(31, 35, 40, 0.04);
    }
    * { box-sizing: border-box; border-radius: 6px; }
    /* 结构分割线保持直角，按钮/面板仍保留圆角 */
    header, aside, .tabs, table, th, td,
    .db-split, .db-objects, .db-data, .db-rowfilter, .db-pager,
    .modal-head, .modal-foot {
      border-radius: 0;
    }
    * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: var(--line-hover); }
    ::-webkit-scrollbar-corner { background: transparent; }
    html { font-size: 16px; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Noto Sans CJK SC", Helvetica, Arial, sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    a.brand { text-decoration: none; color: inherit; }
    .app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; overflow: hidden; }
    header {

    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .top-nav {
      display: flex; align-items: center; align-self: stretch; gap: 4px;
      margin-left: 18px; flex-shrink: 0;
    }
    header .top-nav .btn {
      height: auto; padding: 0 12px; border: 0; border-bottom: 2px solid transparent;
      border-radius: 0; background: transparent; color: var(--muted);
      font-size: 16px; font-weight: 500;
      transition: color .12s ease, border-color .12s ease;
    }
    header .top-nav .btn:hover {
      border-bottom-color: transparent; background: transparent; color: var(--text);
    }
    header .top-nav .btn.active {
      border-bottom-color: var(--accent-emphasis); background: transparent; color: var(--text); font-weight: 600;
    }
    .top-nav .btn svg { display: block; width: 16px; height: 16px; flex: 0 0 auto; }
    .mark {
      width: 32px; height: 32px; flex: 0 0 auto;

    .mark svg { width: 100%; height: 100%; display: block; }

    .topbar-logo {
      display: block; width: 140px; height: 40px;
      color: #24292f;
    }
    :root[data-theme="dark"] .topbar-logo { color: #f0f6fc; }
    .topbar-logo .logo-accent { fill: #1a7f37; }
    :root[data-theme="dark"] .topbar-logo .logo-accent { fill: #3fb950; }
    .gate-brand { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
    .gate-brand h3 { margin: 0; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; font-weight: 650; }
    .brand small { display: block; color: var(--muted); margin-top: 1px; }
    .brand .brand-version { font-size: 12px; line-height: 1.2; }
    .app-ver {
      display: inline-block; margin-left: 8px; padding: 1px 8px;
      border: 1px solid var(--line); background: var(--bg-3); color: var(--muted);
      font-size: 16px; font-weight: 500; vertical-align: middle;
    }
    .header-right { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; justify-content: flex-end; }
    header .btn {
      height: 34px; display: inline-flex; align-items: center; box-sizing: border-box;
    }
    .user-menu-wrap { position: relative; }
    .user-menu-panel {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 42;
      width: 180px; padding: 6px;
      background: var(--bg-2); border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .user-menu-panel[hidden] { display: none !important; }
    .user-menu-panel .btn {
      width: 100%; height: 34px; justify-content: flex-start;
      border-color: transparent; background: transparent;
    }
    .user-menu-panel .btn:hover { background: var(--bg-3); }
    .user-menu-panel .btn.danger { color: var(--danger-text); }
    .user-menu-who {
      padding: 7px 10px 9px; margin-bottom: 4px; border-bottom: 1px solid var(--line);
      color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-meta.warn { border-color: var(--danger-line); color: var(--danger-text); }
    .meta-panel {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
      width: min(420px, calc(100vw - 32px));
      padding: 12px 14px;
      background: var(--bg-2); border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .meta-panel[hidden] { display: none !important; }
    .meta-panel h3 {
      margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted);
    }
    .meta {
      color: var(--muted); display: flex; flex-direction: column; gap: 8px;
    }
    .meta-row {
      display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px;
      align-items: start; font-size: 13px; line-height: 1.4;
    }
    .meta-row span { color: var(--muted); }
    .meta-row b {
      color: var(--text); font-weight: 600; word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .ok { color: var(--success); }
    .bad { color: var(--danger); }
    .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; }
    aside {
      border-right: 1px solid var(--line); background: var(--bg-2);
      display: flex; flex-direction: column; min-height: 0;
    }
    .plist { overflow: auto; padding: 12px 8px 16px; flex: 1; min-height: 0; }
    .aside-foot { flex: 0 0 auto; padding: 12px; border-top: 1px solid var(--line); }
    .aside-foot .btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .app[data-section="cluster"] .shell,
    .app[data-section="k3s"] .shell,
    .app[data-section="cangling"] .shell,
    .app[data-section="images"] .shell,
    .app[data-section="certificates"] .shell,
    .app[data-section="install-resources"] .shell,
    .app[data-section="storage"] .shell { grid-template-columns: 1fr; }
    .app[data-section="cluster"] aside,
    .app[data-section="k3s"] aside,
    .app[data-section="cangling"] aside,
    .app[data-section="images"] aside,
    .app[data-section="certificates"] aside,
    .app[data-section="install-resources"] aside,
    .app[data-section="storage"] aside { display: none; }
    .app[data-section="traffic"] .shell { grid-template-columns: 1fr; }
    .app[data-section="traffic"] aside { display: none; }
    .traffic-header { display:flex; gap:20px; align-items:flex-end; justify-content:space-between; margin-bottom:14px; }
    .traffic-header h2 { margin:0; white-space:nowrap; }
    .traffic-toolbar { display:flex; gap:10px; align-items:end; justify-content:flex-end; flex-wrap:wrap; margin-left:auto; }
    .traffic-toolbar .field { margin:0; min-width:150px; }
    .traffic-toolbar label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
    .traffic-toolbar input[type="date"] {
      height:36px; padding:0 10px; color:var(--text); background:var(--bg-3);
      border:1px solid var(--line-muted); border-radius:7px; outline:none;
      box-shadow:none; transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .traffic-toolbar input[type="date"]:hover { border-color:var(--line); background:var(--bg-input); }
    .traffic-toolbar input[type="date"]:focus {
      border-color:color-mix(in srgb, var(--accent) 55%, transparent);
      box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
      background:var(--bg-input);
    }
    .traffic-toolbar input[type="date"]::-webkit-calendar-picker-indicator { opacity:.58; cursor:pointer; }
    .traffic-report { max-width:1600px; margin:0 auto; padding:8px 12px 40px; }
    .traffic-report-title { margin:0; color:var(--text); font-size:30px; line-height:1.25; font-weight:700; letter-spacing:-.02em; }
    .traffic-report-summary { margin:12px 0 38px; color:var(--muted); font-size:16px; line-height:1.6; }
    .traffic-grid { display:grid; grid-template-columns:1fr 1fr; column-gap:88px; row-gap:68px; }
    .traffic-chart { min-width:0; padding:0; background:transparent; border:0; border-radius:0; }
    .traffic-chart h3 { margin:0 0 12px; color:var(--text); font-size:20px; line-height:1.4; font-weight:700; }
    .traffic-chart svg { width:100%; height:310px; overflow:visible; border-radius:0; }
    .traffic-chart-note { margin:-4px 0 8px; color:var(--muted); font-size:12px; line-height:1.5; }
    .traffic-guide { margin-top:14px; padding:12px 14px; border:1px solid var(--line-muted); border-radius:7px; background:var(--bg-3); }
    .traffic-guide summary { cursor:pointer; font-weight:600; color:var(--text); }
    .traffic-guide h4 { margin:14px 0 6px; }
    .traffic-guide pre { margin:6px 0 0; max-height:260px; overflow:auto; white-space:pre; font-size:11px; line-height:1.55; }
    @media(max-width:1100px){.traffic-grid{column-gap:36px}.traffic-report-title{font-size:26px}}
    @media(max-width:900px){.traffic-header{align-items:flex-start;flex-direction:column}.traffic-toolbar{justify-content:flex-start;margin-left:0}.traffic-grid{grid-template-columns:1fr;row-gap:44px}.traffic-report{padding-inline:0}.traffic-report-summary{margin-bottom:30px}.traffic-chart svg{height:280px}}
    .pitem {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
      color: var(--text); padding: 6px 8px; margin-bottom: 2px; border-radius: 6px;
    }
    .pitem:hover { background: var(--bg-3); }
    .pitem.active { background: var(--bg-active); }
    .pitem .n-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .pitem .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 14px; line-height: 1.4; }
    .pitem-version { flex: 0 0 auto; padding: 1px 5px; border-radius: 5px; color: var(--on-emphasis); background: var(--success-emphasis); font-size: 10px; font-weight: 600; line-height: 1.5; }
    .pitem .d { display: block; width: 100%; min-width: 0; color: var(--muted); margin-top: 1px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-list-item { position: relative; display: flex; align-items: stretch; margin-bottom: 2px; }
    .host-row { cursor: pointer; }
    .host-row:hover td { background: var(--bg-3); }
    .host-actions { display: flex; gap: 6px; white-space: nowrap; }
    .host-actions .btn { padding: 4px 8px; }
    .project-list-item .pitem { min-width: 0; margin-bottom: 0; padding-right: 34px; }
    .project-more { position: absolute; top: 50%; right: 5px; width: 26px; height: 26px; padding: 0; transform: translateY(-50%); border: 0; border-radius: 5px; color: var(--muted); background: transparent; font-size: 18px; line-height: 1; }
    .project-more:hover, .project-more[aria-expanded="true"] { color: var(--text); background: var(--bg-active); }
    .project-item-menu { position: absolute; z-index: 30; top: calc(100% - 2px); right: 4px; min-width: 150px; padding: 5px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    .project-item-menu[hidden] { display: none; }
    .project-item-menu button { width: 100%; padding: 7px 9px; border: 0; border-radius: 5px; text-align: left; color: var(--danger); background: transparent; }
    .project-item-menu button:hover { background: var(--bg-3); }
    .project-item-menu button:disabled { opacity: .5; cursor: not-allowed; }
    .project-upgrade-summary { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .project-upgrade-summary h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 18px; }
    .project-upgrade-summary h2 .pill { font-size: 12px; }
    .top-nav .btn { display: inline-flex; align-items: center; gap: 6px; }
    .cluster-table { width: 100%; border-collapse: collapse; }
    .cluster-table th, .cluster-table td {
      text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .cluster-table th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    :is(.cluster-table, .cangling-storage-table, .cangling-app-table, .cangling-kv-table) tr > :first-child { padding-left: 0; }
    :is(.cluster-table, .cangling-storage-table, .cangling-app-table, .cangling-kv-table) tr > :last-child { padding-right: 0; }
    .k3s-summary { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; margin-left: auto; }
    .k3s-stat {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--bg-2);

    }
    .k3s-stat span { color: var(--muted); font-size: 12px; }
    .k3s-stat strong { font-size: 12px; font-weight: 650; }

    function sessionToken() {
      try { return sessionStorage.getItem(SESSION_KEY) || ""; } catch (_) { return ""; }

      } catch (_) {}
    }
    function takeUrlSessionToken() {
      try {
        const u = new URL(location.href);
        const token = (u.searchParams.get("token") || u.searchParams.get("access_token") || "").trim();
        if (!token) return "";
        u.searchParams.delete("token");
        u.searchParams.delete("access_token");
        const qs = u.searchParams.toString();
        history.replaceState({}, "", u.pathname + (qs ? "?" + qs : "") + u.hash);
        return token;
      } catch (_) {
        return "";
      }
    }
    function withAuth(opts = {}) {
      const headers = Object.assign({}, opts.headers || {});

      return Object.assign({ credentials: "same-origin" }, opts, { headers });
    }

    async function submitChangePassword() {
      const box = $("#pw-flash");

      };
      const oldPassword = $("#pw-old").value;

      try {

          body: JSON.stringify({ old_password: oldPassword, new_password: newPassword }),
        });
        const synced = (data && data.synced) || [];
        const failed = (data && data.failed) || [];
        let msg = "密码已修改，请重新登录。";
        if (synced.length) msg += " 已同步节点：" + synced.join("、") + "。";

      }));
      drop.addEventListener("drop", (event) => {
        if (input.disabled) return;
        const files = event.dataTransfer && event.dataTransfer.files;
        if (!files || files.length !== 1) {
          showError("一次只能拖入一个 cangling-update 程序");
          return;
        }
        setFile(files[0]);
      });
      remove.onclick = clearFile;
      drop.focus();
      online.onclick = submitOnlineSelfUpdate;
      api("/api/self-update/online").then((info) => {
        onlineStatus.textContent = info.can_upgrade
          ? `发现新版本 v${info.latest_version}（${info.arch}）`

        online.textContent = info.can_upgrade ? `在线下载 v${info.latest_version}` : "已是最新";
        online.disabled = !info.can_upgrade;
      }).catch((error) => {
        onlineStatus.textContent = "无法获取线上版本：" + error.message;
        online.textContent = "重新检查";
        online.disabled = false;
        online.onclick = openSelfUpdate;
      });
    }

    async function submitOnlineSelfUpdate() {
      const input = $("#self-update-file");
      const drop = $("#self-update-drop");
      const remove = $("#self-update-remove");
      const online = $("#self-update-online");
      const action = $("#dialog-extra");
      const box = $("#self-update-flash");
      const progress = $("#self-update-progress");
      const progressTrack = $("#self-update-progress-track");
      const progressBar = $("#self-update-progress-bar");
      const progressPct = $("#self-update-progress-pct");
      if (!online || online.disabled) return;
      action.disabled = true;
      online.disabled = true;
      input.disabled = true;
      if (remove) remove.disabled = true;
      if (drop) drop.classList.add("is-disabled");
      box.hidden = true;
      progress.hidden = false;
      progressTrack.classList.add("checking");
      progressBar.style.width = "32%";
      progressPct.textContent = "下载中";
      $("#self-update-progress-msg").textContent = "正在下载并校验更新包";
      try {
        const payload = await api("/api/self-update/online", { method: "POST" });
        progressTrack.classList.remove("checking");
        progressBar.style.width = "100%";
        progressPct.textContent = "完成";
        $("#self-update-progress-msg").textContent = "更新完成，正在重启服务";
        box.className = "flash ok";
        box.textContent = `已从 v${payload.current_version} 在线更新到 v${payload.uploaded_version}，服务正在重启…`;
        box.hidden = false;
        setTimeout(() => location.reload(), 4000);
      } catch (error) {
        progress.hidden = true;
        progressTrack.classList.remove("checking");
        progressBar.style.width = "0";
        box.className = "flash err";
        box.textContent = error.message || "在线更新失败";
        box.hidden = false;
        online.disabled = false;
        input.disabled = false;
        if (remove) remove.disabled = false;
        if (drop) drop.classList.remove("is-disabled");
        action.disabled = !(input.files && input.files[0]);
      }
    }

    function submitSelfUpdate() {
      const input = $("#self-update-file");
      const file = input && input.files && input.files[0];
      const box = $("#self-update-flash");
      const action = $("#dialog-extra");
      const progress = $("#self-update-progress");
      const progressTrack = $("#self-update-progress-track");
      const progressBar = $("#self-update-progress-bar");
      const progressPct = $("#self-update-progress-pct");
      const remove = $("#self-update-remove");
      const show = (kind, message) => {
        box.className = "flash " + kind;
        box.textContent = message;
        box.hidden = false;
      };
      const setBusy = (busy) => {
        action.disabled = busy;
        input.disabled = busy;
        if (remove) remove.disabled = busy;
        if (drop) drop.classList.toggle("is-disabled", busy);
      };
      const fail = (message) => {
        progress.hidden = true;
        progressTrack.classList.remove("checking");
        progressBar.style.width = "0";
        show("err", message);
        setBusy(false);
      };
      if (!file) {
        show("err", "请选择要上传的 cangling-update 程序");
        return;
      }
      const drop = $("#self-update-drop");
      setBusy(true);
      box.hidden = true;
      progress.hidden = false;
      progressTrack.classList.remove("checking");
      progressBar.style.width = "0";
      progressPct.textContent = "0%";
      $("#self-update-progress-msg").textContent = "正在上传";
      const data = new FormData();
      data.append("file", file, file.name);
      const xhr = new XMLHttpRequest();
      xhr.open("POST", appPath("/api/self-update"));
      const token = sessionToken();
      if (token) xhr.setRequestHeader("Authorization", "Bearer " + token);
      xhr.upload.onprogress = (event) => {
        if (!event.lengthComputable) return;
        const pct = Math.round(event.loaded * 100 / event.total);
        progressPct.textContent = pct + "%";
        progressBar.style.width = pct + "%";
      };
      xhr.upload.onload = () => {
        $("#self-update-progress-msg").textContent = "正在校验程序";
        progressPct.textContent = "校验中";
        progressTrack.classList.add("checking");
      };
      xhr.onerror = () => {
        fail("上传失败：网络连接中断");
      };
      xhr.onload = () => {
        let payload = {};
        try { payload = JSON.parse(xhr.responseText || "{}"); } catch (_) { payload = { error: xhr.responseText }; }
        if (xhr.status === 401) {
          showGate(payload.error || "请先登录或登录已过期");
          return;
        }
        if (xhr.status < 200 || xhr.status >= 300) {
          fail(payload.error || xhr.statusText || "更新失败");
          return;
        }
        progressTrack.classList.remove("checking");
        $("#self-update-progress-msg").textContent = "校验通过，正在重启服务";
        progressPct.textContent = "完成";
        progressBar.style.width = "100%";
        show("ok", `已从 v${payload.current_version} 更新到 v${payload.uploaded_version}，服务正在重启…`);
        setTimeout(() => location.reload(), 4000);
      };
      xhr.send(data);
    }

    async function startHostTrust() {
      const hosts = state.managedHosts || [];
      if (hosts.length < 2) { flash("err", "至少需要定义两台主机才能建立互信"); return; }
      if (!(await confirmDialog(`将为当前 ${hosts.length} 台主机检查或生成 ED25519 密钥，并把所有公钥分发到每台主机。确定继续？`))) return;
      const button = $("#btn-host-trust");
      if (button) { button.disabled = true; button.textContent = "正在建立互信…"; }
      try {
        const job = await api("/api/hosts/trust", { method: "POST" });
        const poll = async () => {
          try {
            const current = await api("/api/jobs/" + encodeURIComponent(job.id));
            if (button) button.textContent = current.done ? "主机互信" : `${current.message || "正在建立互信"} ${current.percent || 0}%`;
            if (!current.done) { setTimeout(poll, 1000); return; }
            if (button) button.disabled = false;
            flash(current.error ? "err" : "ok", current.error || current.message || "主机互信已建立");
          } catch (error) {
            if (button) { button.disabled = false; button.textContent = "主机互信"; }
            flash("err", error.message);
          }
        };
        poll();
      } catch (error) {
        if (button) { button.disabled = false; button.textContent = "主机互信"; }
        flash("err", error.message);
      }
    }

    async function loadInitStatus() {
      const body = $("#cluster-init-body");
      if (!body || initPoll.inflight) return;
      initPoll.inflight = true;
      try {
        const init = await api("/api/cluster/init/status");
        const previous = state.initStatus;
        state.initStatus = init;
        renderInitStatus(init);
        if (state.clusterStatus) updateClusterOverview(state.clusterStatus);
        if (previous && previous.running && !init.running) {
          const failed = (init.steps || []).filter(step => step.state === "failed");
          const action = init.mode === "check" ? "检查并修复" : "集群初始化";
          if (init.error || failed.length) {
            flash("err", `${action}完成，${failed.length} 个步骤失败：${init.error || "请查看下方执行记录"}`);
          } else {
            const succeeded = (init.steps || []).filter(step => step.state === "ok").length;
            flash("ok", `${action}完成，${succeeded} 个步骤全部成功`);
          }
          setTimeout(() => { loadCluster(); }, 0);
        }
      } catch (e) {
        body.innerHTML = `<p class="hint">${esc(e.message)}</p>`;
      } finally {
        initPoll.inflight = false;
      }
    }

    function initStatusSelectionActive(body) {
      if (initPoll.selecting) return true;
      const selection = window.getSelection && window.getSelection();
      if (!selection || selection.isCollapsed || !selection.rangeCount) return false;
      return !initPoll.selectionHandled
        && (body.contains(selection.anchorNode) || body.contains(selection.focusNode));
    }

    function renderInitStatus(init) {
      const body = $("#cluster-init-body");
      if (!body) return;
      // Replacing innerHTML destroys the browser's current text selection.
      // Keep polling in the background, but defer painting while the user is
      // dragging over or has selected initialization/check output.
      if (initStatusSelectionActive(body)) return;
      if (!init.running && !init.started_at) {
        stopInitPoll();
        body.innerHTML = `<p class="hint">尚未初始化。确认集群名称和数据目录后点击「初始化 / 检查修复」。</p>`;
        return;
      }
      if (!init.running) stopInitPoll();
      const badgeMap = { pending: "待执行", running: "进行中", ok: "成功", failed: "失败" };
      const clsMap = { ok: "ok", failed: "bad", running: "", pending: "" };
      const rows = (init.steps || []).map(s => `
        <tr>
          <td class="path">${esc(s.node)}</td>
          <td>${s.role === "master" ? "主节点" : "工作节点"}</td>
          <td>${esc(s.package)}</td>
          <td><span class="${clsMap[s.state] || ""}">${badgeMap[s.state] || esc(s.state)}</span></td>
          <td>${s.elapsed_ms ? s.elapsed_ms + " ms" : "—"}</td>
          <td>${s.output ? `<pre class="task-log" style="max-height:140px">${esc(s.output)}</pre>` : "—"}</td>
        </tr>`).join("");
      body.innerHTML = `
        ${init.error ? `<p class="hint"><span class="bad">${esc(init.error)}</span></p>` : ""}
        ${init.running ? `<p class="hint">${init.mode === "check" ? "正在检查并修复" : "正在初始化"}集群「${esc(init.cluster_name)}」…</p>` : ""}
        <table class="cluster-table">
          <thead><tr><th>节点</th><th>角色</th><th>软件</th><th>状态</th><th>耗时</th><th>输出</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6" class="hint">暂无步骤</td></tr>`}</tbody>
        </table>`;
    }

    document.addEventListener("pointerdown", (event) => {
      const inside = !!(event.target && event.target.closest && event.target.closest("#cluster-init-body"));
      initPoll.selecting = inside;
      // A click outside the result area means the previous selection no longer
      // needs protection (notably when starting another check).
      initPoll.selectionHandled = !inside;
    });
    document.addEventListener("pointerup", () => { initPoll.selecting = false; });
    document.addEventListener("pointercancel", () => { initPoll.selecting = false; });
    document.addEventListener("copy", () => {
      const body = $("#cluster-init-body");
      const selection = window.getSelection && window.getSelection();
      if (body && selection && !selection.isCollapsed
          && (body.contains(selection.anchorNode) || body.contains(selection.focusNode))) {
        initPoll.selectionHandled = true;
      }
    });

    function clusterHasK3s() {
      const hosts = state.managedHosts || [];
      const master = hosts.find(host => host.role === "master") || hosts.find(host => host.kind === "local");
      const software = master && master.host_info && Array.isArray(master.host_info.software)
        ? master.host_info.software : [];
      const k3s = software.find(item => item.name === "k3s");
      return !!(k3s && k3s.version && k3s.version !== "未安装");
    }

    function updateClusterActionButton(initialized = clusterHasK3s()) {
      const button = $("#btn-cluster-action");

      button.textContent = initialized ? "检查并修复" : "初始化集群";
      button.title = initialized
        ? "已检测到 K3s，将检查各节点并修复缺失项"
        : "未检测到 K3s，将执行首次集群初始化";
    }

    async function startClusterAction() {
      if (clusterHasK3s()) return startClusterCheck();
      return startClusterInit();

    async function startClusterInit() {
      const nameEl = $("#cluster-name");
      const name = (nameEl && nameEl.value || "").trim();
      const k3sDataDir = (($("#cluster-k3s-data-dir") || {}).value || "").trim();
      if (!name) { flash("err", "请填写集群名称"); return; }
      if (!(await confirmDialog(`未检测到 K3s，将初始化集群「${name}」并安装各节点基线软件。确定继续？`))) return;
      const btn = $("#btn-cluster-action");
      if (btn) btn.disabled = true;
      try {
        await api("/api/cluster/init", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, k3s_data_dir: k3sDataDir }),
        });
        state.initStatus = { ...(state.initStatus || {}), running: true, mode: "init" };
        flash("ok", "已开始初始化集群，请稍候…");
        await loadInitStatus();
        initPoll.timer = setInterval(() => { loadInitStatus(); }, 3000);
      } catch (e) {
        flash("err", e.message);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

        await loadInitStatus();
        initPoll.timer = setInterval(() => { loadInitStatus(); }, 3000);

        flash("err", e.message);
      } finally {
        if (btn) btn.disabled = false;
      }

    function hostnameValidationMessage(name) {
      if (!name) return "请输入新的主机名称";
      if (name.length > 253) return "主机名称总长度不能超过 253 个字符";
      if (!name.split(".").every(label => label.length <= 63 && /^[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$/.test(label))) {
        return "每段需为 1–63 个字母、数字或短横线，且不能以短横线开头或结尾";
      }
      return "";
    }

    function openLocalHostnameForm(host) {
      closeDialog();
      $("#dialog-modal").classList.add("password-modal");
      $("#dialog-title").textContent = "修改主机名称";
      setDialogAction("保存修改", saveLocalHostname);
      $("#dialog-body").innerHTML = `<form class="password-form hostname-form" id="hostname-form" novalidate>
        <p class="hostname-current">当前名称 <strong>${esc(host.name || "—")}</strong></p>
        <div class="field">
          <label for="local-hostname">新主机名称</label>
          <input id="local-hostname" type="text" value="${esc(host.name || "")}" placeholder="例如：master-01" maxlength="253" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="hostname-help hostname-error" />
          <p class="hostname-help" id="hostname-help">支持字母、数字和短横线，可用点分隔；每段最多 63 个字符。</p>
          <p class="hostname-error" id="hostname-error" aria-live="polite" hidden></p>
        </div>
        <div class="hostname-note"><strong>修改后立即生效</strong><p>此操作将更新本机的系统主机名称，IP 地址保持不变。依赖旧主机名的访问地址或服务配置需同步更新。</p></div>
        <div id="host-form-flash" role="alert" hidden></div>
      </form>`;
      const input = $("#local-hostname");
      const button = $("#dialog-extra");
      input.dataset.original = (host.name || "").trim();
      const validate = () => {
        const message = hostnameValidationMessage(input.value.trim());

        input.setAttribute("aria-invalid", String(!!message));
        button.disabled = !!message || input.value.trim() === input.dataset.original;
      };
      input.oninput = validate;
      $("#hostname-form").onsubmit = event => {
        event.preventDefault();
        if (!button.disabled) saveLocalHostname();
      };
      validate();
      $("#dialog").hidden = false;
      input.focus();
      input.select();

    async function saveLocalHostname() {
      const button = $("#dialog-extra");
      const input = $("#local-hostname");
      if (!input || button.disabled) return;
      const box = $("#host-form-flash");
      const name = input.value.trim();
      if (hostnameValidationMessage(name) || name === input.dataset.original) return;
      button.disabled = true;
      button.textContent = "正在保存…";
      input.disabled = true;
      box.hidden = true;
      try {
        await api("/api/hosts/local/hostname", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        });
      } catch (error) {
        if ($("#local-hostname") !== input) return;
        box.className = "flash err";
        box.textContent = error.message;
        box.hidden = false;
        button.textContent = "保存修改";
        button.disabled = false;
        input.disabled = false;
        input.focus();
        return;
      }
      if ($("#local-hostname") === input) closeDialog();
      flash("ok", `主机名称已修改为“${name}”`);
      try { await loadCluster(); } catch (error) { flash("err", `主机名称已修改，刷新主机列表失败：${error.message}`); }

    async function openHostTerminal(id) {
      const host = (state.managedHosts || []).find(item => item.id === id);
      if (!host) return;
      closeDialog();
      try {
        await loadXterm();
        if (document.fonts && document.fonts.load) await document.fonts.load('15px "Iosevka Term"');
      } catch (error) { flash("err", error.message); return; }
      $("#dialog-title").textContent = "终端 · " + host.name;
      $("#dialog-body").innerHTML = `<div class="term" id="term"></div>`;
      $("#dialog").hidden = false;
      const term = new window.Terminal({ cursorBlink: true, fontSize: 15, fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace', theme: termTheme() });
      const Fit = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);
      const fit = Fit ? new Fit() : null;
      if (fit) term.loadAddon(fit);
      term.open($("#term"));
      if (fit) fit.fit();
      dialog.term = term; dialog.fit = fit;
      const qs = "?cols=" + (term.cols || 80) + "&rows=" + (term.rows || 24) + (sessionToken() ? "&token=" + encodeURIComponent(sessionToken()) : "");
      const ws = new WebSocket(appWebSocket("/api/hosts/" + encodeURIComponent(id) + "/terminal" + qs));
      ws.binaryType = "arraybuffer"; dialog.ws = ws;
      ws.onmessage = event => term.write(typeof event.data === "string" ? event.data : new Uint8Array(event.data));
      ws.onerror = () => term.writeln("\r\n连接失败");
      ws.onclose = () => term.writeln("\r\n连接已关闭");
      term.onData(data => { if (ws.readyState === 1) ws.send(data); });
      const resize = () => { if (fit) fit.fit(); if (ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows })); };
      dialog.onResize = resize; window.addEventListener("resize", resize); setTimeout(resize, 50); term.focus();
    }

      </div>`;
      const loadingView = main.firstElementChild;
      try {
        const [config, storages, nodes] = await Promise.all([
          state.canglingConfig || api("/api/cangling/apps/config"),
          api("/api/storages").catch(() => state.storages || []),
          api("/api/cluster/nodes").catch(() => state.clusterNodes || []),
        ]);
        if (location.hash !== "#/cangling" || main.firstElementChild !== loadingView) return;
        let runtime = null;
        let detectionError = "";
        try {
          runtime = await api("/api/cangling/apps/runtime?namespace=" + encodeURIComponent(config.namespace || "cangling"));
        } catch (error) { detectionError = error.message; }
        if (location.hash !== "#/cangling" || main.firstElementChild !== loadingView) return;
        const deployed = !!(runtime && (runtime.deployments || []).length);
        state.canglingRuntime = runtime;
        state.canglingTab = deployed ? "run" : "cluster";
        state.canglingRunTab = "containers";
        if (!deployed) state.canglingDeployTab = "cluster";
        state.canglingConfig = config;
        state.storages = storages || [];
        state.clusterNodes = nodes || [];
        renderCanglingAppsForm();
        if (detectionError) flash("err", "暂时无法确认部署状态，已打开应用部署：" + detectionError);
      } catch (e) {
        if (location.hash !== "#/cangling" || main.firstElementChild !== loadingView) return;
        main.innerHTML = `<div class="cangling-page"><div class="title-row"><div><h2>苍灵应用</h2></div></div><div class="card"><h3>无法读取部署模板</h3><p class="hint">${esc(e.message)}</p><button type="button" class="btn" id="cangling-retry">重试</button></div></div>`;
        const retry = $("#cangling-retry");
        if (retry) retry.onclick = () => { state.canglingConfig = null; renderCanglingApps(); };
      }
    }

    function canglingField(label, field, value, type = "text", hint = "") {
      return `<div class="field"><label for="cangling-${field}">${esc(label)}</label><input id="cangling-${field}" data-cangling-global="${esc(field)}" type="${type}" value="${esc(value)}" autocomplete="${type === "password" ? "new-password" : "off"}" />${hint ? `<p class="hint">${esc(hint)}</p>` : ""}</div>`;
    }

    const CANGLING_PATH_ROOTS = {
      sharedRoot: "/opt/cl/share",
      localRoot: "/opt/cl/local",
      coreRoot: "/opt/cl/core",
      jarRoot: "/opt/cangling/jars",
    };

    const CANGLING_STORAGE_ROOTS = [
      { label: "核心数据", detail: "数据库与服务状态", path: "coreRoot", storage: "coreStorage", defaultType: "local" },
      { label: "本地数据", detail: "缓存与高性能临时数据", path: "localRoot", storage: "localStorage", defaultType: "local" },
      { label: "外部共享存储", detail: "跨节点业务数据", path: "sharedRoot", storage: "sharedStorage", defaultType: "nfs" },
    ];

    function canglingStorageRows(config) {
      return CANGLING_STORAGE_ROOTS.map((item) => {
        const storage = config[item.storage] || { type: item.defaultType, server: "", source: "" };
        const type = storage.type === "nfs" ? "nfs" : "local";
        const mappedPath = config[item.path] || canglingDefaultPath(item.path, config.namespace);
        const value = storage.source || (type === "nfs" ? `${storage.server || config.hostIp || ""}:${mappedPath}` : mappedPath);
        const placeholder = type === "nfs" ? "例如 192.168.3.121:/path/dir" : "/data/actual/path";
        return `<tr data-cangling-storage-row="${esc(item.storage)}">
          <td class="cangling-storage-kind"><strong>${esc(item.label)}</strong><span>${esc(item.detail)}</span></td>
          <td class="cangling-storage-type"><select data-cangling-storage-type="${esc(item.storage)}"><option value="local" ${type === "local" ? "selected" : ""}>本地目录</option><option value="nfs" ${type === "nfs" ? "selected" : ""}>NFS</option></select></td>
          <td class="cangling-storage-path"><div class="cangling-global-select"><input data-cangling-storage-path="${esc(item.storage)}" type="text" value="${esc(value)}" placeholder="${esc(placeholder)}" spellcheck="false" />${item.storage === "sharedStorage" ? '<button type="button" class="btn" id="cangling-shared-storage-select">选择存储</button>' : ""}</div></td>
          <td class="cangling-storage-mapped"><input id="cangling-${esc(item.path)}" data-cangling-storage-mapped="${esc(item.storage)}" type="text" value="${esc(mappedPath)}" readonly aria-label="${esc(item.label)}映射到本地位置" /></td>
        </tr>`;
      }).join("");
    }

    const CANGLING_AUTO_STORAGE_PATHS = {
      sharedStorage: ["np4", "algo_tools", "cldata", "np4-resource-images"],
      coreStorage: ["postgis/17", "broker", "tile-config"],
      localStorage: ["cangling-map/data", "cangling-map/cache", "cangling-map/geodata", "tiledata", "nginx-log", "ibcache", "ibbackup", "base-logs"],
    };

    const CANGLING_WRITABLE_LOCAL_PATHS = {
      coreStorage: ["broker", "tile-config"],
      localStorage: ["cangling-map/data", "cangling-map/cache", "cangling-map/geodata", "tiledata"],
    };

    function joinCanglingStoragePath(root, child) {
      return `${String(root || "").replace(/\/+$/, "")}/${child}`;
    }

    function canglingStoragePlanRows(config) {
      const rows = [];
      for (const item of CANGLING_STORAGE_ROOTS) {
        const storage = config[item.storage] || { type: item.defaultType, source: "", server: "" };
        const type = storage.type === "nfs" ? "nfs" : "local";
        let root = storage.source || config[item.path] || "";
        let target = "所有集群节点";
        let owner = "10001:10001";
        let mode = "0775";
        let children = CANGLING_WRITABLE_LOCAL_PATHS[item.storage] || [];
        if (type === "nfs") {
          try {
            const parsed = parseCanglingNfsPath(root);
            root = parsed.path;
            target = parsed.server;
          } catch {
            target = storage.server || "NFS 服务器";
            root = root.replace(/^.*?:/, "");
          }
          owner = "root:root";
          mode = "0777";
          children = CANGLING_AUTO_STORAGE_PATHS[item.storage] || [];
        }
        for (const child of children) {
          rows.push({ type: type === "nfs" ? "NFS 目录" : "本地可写目录", path: joinCanglingStoragePath(root, child), target, owner, mode });
        }
      }
      return rows.map((row) => `<tr><td>${esc(row.type)}</td><td><code>${esc(row.path)}</code></td><td>${esc(row.target)}</td><td><code>${esc(row.owner)}</code></td><td><code>${esc(row.mode)}</code></td></tr>`).join("");
    }

    function renderCanglingStoragePlan() {
      const body = $("#cangling-storage-plan-rows");
      if (body && state.canglingConfig) body.innerHTML = canglingStoragePlanRows(state.canglingConfig) || '<tr><td colspan="5" class="empty">当前配置不需要预先创建目录</td></tr>';
    }

    function parseCanglingNfsPath(value) {
      const match = String(value || "").trim().match(/^(.+):(\/.*)$/);
      if (!match) throw new Error("NFS 路径格式应为 服务器:/导出路径，例如 192.168.3.121:/path/dir");
      return { server: match[1].trim(), path: match[2].trim() };
    }

    function bindCanglingStorageActions() {
      document.querySelectorAll("[data-cangling-storage-type]").forEach((select) => {
        select.onchange = () => {
          const field = select.dataset.canglingStorageType;
          const input = document.querySelector(`[data-cangling-storage-path="${field}"]`);
          if (!input) return;
          if (select.value === "nfs") {
            if (!/^.+:\//.test(input.value.trim())) input.value = `${state.canglingConfig.hostIp || "192.168.3.121"}:${input.value.trim()}`;
            input.placeholder = "例如 192.168.3.121:/path/dir";
          } else {
            const match = input.value.trim().match(/^.+:(\/.*)$/);
            if (match) input.value = match[1];
            input.placeholder = "/data/actual/path";
          }
          if (state.canglingConfig && state.canglingConfig[field]) {
            state.canglingConfig[field].type = select.value === "nfs" ? "nfs" : "local";
            state.canglingConfig[field].source = input.value.trim();
          }
          renderCanglingStoragePlan();
        };
      });
      document.querySelectorAll("[data-cangling-storage-path]").forEach((input) => {
        input.oninput = () => {
          const field = input.dataset.canglingStoragePath;
          if (state.canglingConfig && state.canglingConfig[field]) {
            state.canglingConfig[field].source = input.value.trim();
            if (state.canglingConfig[field].type === "nfs") {
              try { state.canglingConfig[field].server = parseCanglingNfsPath(input.value).server; } catch {}
            }
          }
          renderCanglingStoragePlan();
        };
      });
      const picker = $("#cangling-shared-storage-select");
      if (picker) picker.onclick = openCanglingSharedStoragePicker;
    }

    function canglingStorageServer(storage) {
      if (storage.server) return storage.server;
      const node = (state.clusterNodes || []).find((item) => item.id === storage.host_id);
      if (node && node.host && node.host.primary_ip) return node.host.primary_ip;
      if (node && node.addr) return String(node.addr).replace(/^https?:\/\//, "").split(":")[0];
      if (!storage.host_id && state.canglingConfig) return state.canglingConfig.hostIp || "";
      return "";
    }

    function canglingStorageNfsSource(storage) {
      if (!storage || storage.protocol !== "nfs") return "";
      const server = canglingStorageServer(storage);
      const path = storage.kind === "host_share" ? (storage.path || storage.share) : storage.share;
      return server && path && path.startsWith("/") ? `${server}:${path}` : "";
    }

    function openCanglingSharedStoragePicker() {
      const candidates = (state.storages || []).filter((storage) => storage.protocol === "nfs");
      closeDialog();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("narrow");
      $("#dialog-title").textContent = "选择外部共享存储";
      const rows = candidates.map((storage, index) => {
        const source = canglingStorageNfsSource(storage);
        const status = storage.status === "deployed" || storage.status === "shared" ? "已部署" : storage.status === "mounted" ? "已挂载" : "已定义";
        return `<button type="button" class="cangling-node-picker-item" data-cangling-storage-choice="${index}" ${source ? "" : "disabled"}><span><strong>${esc(storage.name)}</strong><small>${esc(storage.kind === "host_share" ? "主机 NFS 共享" : "外部 NFS 存储")} · ${esc(status)}</small></span><code>${esc(source || "无法确定共享主机地址")}</code></button>`;
      }).join("");
      $("#dialog-body").innerHTML = `<div class="cangling-node-picker"><p class="cangling-node-picker-head">选择后将自动填写 NFS 服务器与导出路径；生成 YAML 时，各业务子目录会挂载到该共享根目录下。</p><div class="cangling-node-picker-list">${rows || '<div class="empty">“存储”模块中还没有 NFS 存储，请先添加并部署 NFS 存储。</div>'}</div></div>`;
      $("#dialog").hidden = false;
      setDialogAction(null, null);
      $("#dialog-foot").hidden = false;
      document.querySelectorAll("[data-cangling-storage-choice]").forEach((button) => {
        button.onclick = () => {
          const storage = candidates[Number(button.dataset.canglingStorageChoice)];
          const source = canglingStorageNfsSource(storage);
          if (!source) return;
          const type = document.querySelector('[data-cangling-storage-type="sharedStorage"]');
          const input = document.querySelector('[data-cangling-storage-path="sharedStorage"]');
          if (type) type.value = "nfs";
          if (input) input.value = source;
          if (state.canglingConfig) state.canglingConfig.sharedStorage = { type: "nfs", server: canglingStorageServer(storage), source };
          renderCanglingStoragePlan();
          closeDialog();
          flash("ok", `已选择共享存储“${storage.name}”：${source}`);
        };
      });
    }

    function canglingDefaultPath(field, namespace) {
      const root = CANGLING_PATH_ROOTS[field];
      if (field === "jarRoot") return root || "";
      return root && namespace ? `${root}/${namespace}` : root || "";
    }

    function rewriteCanglingNamespacedPath(value, previous, next) {
      for (const root of Object.values(CANGLING_PATH_ROOTS)) {
        const oldPrefix = `${root}/${previous}`;
        if (value === oldPrefix || value.startsWith(`${oldPrefix}/`)) return `${root}/${next}${value.slice(oldPrefix.length)}`;
      }
      return value;
    }

    function updateCanglingNamespacePaths(previous, next) {
      const config = state.canglingConfig;
      if (!config || !previous || !next || previous === next) return;
      Object.entries(CANGLING_PATH_ROOTS).forEach(([field, root]) => {
        const input = $(`#cangling-${field}`);
        if (!input) return;
        const item = CANGLING_STORAGE_ROOTS.find((entry) => entry.path === field);
        const storage = item && config[item.storage] || { type: "local", server: "", source: "" };
        const sourceInput = item && document.querySelector(`[data-cangling-storage-path="${item.storage}"]`);
        const combined = sourceInput ? sourceInput.value.trim() : storage.source || "";
        const nfs = storage.type === "nfs" ? combined.match(/^(.+):(\/.*)$/) : null;
        const current = nfs ? nfs[2] : combined;
        const oldMapped = canglingDefaultPath(field, previous);
        const updated = canglingDefaultPath(field, next);
        if (sourceInput && (current === root || current === oldMapped)) {
          sourceInput.value = nfs ? `${nfs[1]}:${updated}` : updated;
          storage.source = sourceInput.value;
        }
        input.value = updated;
        config[field] = updated;
      });
      (config.applications || []).forEach((app, index) => {
        app.storage = rewriteCanglingNamespacedPath(app.storage || "", previous, next);
        const cell = document.querySelector(`[data-cangling-storage="${index}"]`);
        if (cell) cell.textContent = app.storage || "—";
      });
    }

    function canglingKeyValueRow(kind, name = "", value = "", secret = false) {
      return `<tr data-cangling-kv-row>
        <td class="cangling-kv-key"><input data-cangling-kv-key type="text" value="${esc(name)}" placeholder="VARIABLE_NAME" spellcheck="false" /></td>
        <td><input data-cangling-kv-value type="text" value="${esc(value)}" placeholder="变量值" autocomplete="off" spellcheck="false" /></td>
        <td class="cangling-kv-actions${secret ? " with-random" : ""}"><div class="cangling-kv-actions-inner">${secret ? `<button type="button" class="btn small" data-cangling-kv-random aria-label="为 ${esc(name || "密钥")} 生成随机值">随机生成</button>` : ""}<button type="button" class="btn small" data-cangling-kv-delete aria-label="删除${kind === "secrets" ? "密钥" : "环境变量"}">删除</button></div></td>
      </tr>`;
    }

    function canglingKeyValueRows(kind, values, secret = false) {
      const entries = Object.entries(values || {}).sort(([left], [right]) => left.localeCompare(right));
      return entries.length
        ? entries.map(([name, value]) => canglingKeyValueRow(kind, name, value, secret)).join("")
        : `<tr data-cangling-kv-empty><td colspan="3" class="cangling-kv-empty">暂无配置</td></tr>`;
    }

    const CANGLING_ENVIRONMENT_GROUPS = [
      { id: "database", title: "数据库", hint: "PostgreSQL / PostGIS 连接与 Schema", names: ["JDBC_DRIVER_NAME", "JDBC_URL_PREFIX", "JDBC_DEFAULT_DB", "JDBC_SCHEMA", "POSTGIS_USER", "POSTGIS_MVT_USER"] },
      { id: "messaging", title: "消息服务", hint: "Broker、Kafka 及 MQTT 端口", prefixes: ["CL_BROKER_"], names: ["HOST_KAFKA", "KAFKA_PORT"] },
      { id: "services", title: "服务地址", hint: "CIS、地图、GeoServer 与前端访问地址", names: ["AI_WEB", "AI_MAP", "HOST_GEOSERVER_URL", "GEOSERVER_FRONT", "MAP_FRONT", "CL_SERVER_URL", "SERVER_URL"] },
      { id: "runtime", title: "CIS 运行参数", hint: "命名空间、主题、功能开关与部署自动值", names: ["TZ", "HOST", "AI_K8S_NAMESPACE", "AI_THEME", "IM_THEME", "AI_IMAGE_PREFIX", "ENABLE_DOC", "CIS_MONGO_MIGRATION_ENABLED", "WEB_PORT"] },
      { id: "storage", title: "存储路径", hint: "共享、本地缓存与应用数据目录", names: ["DATA_PATH", "VOLUME_DEFAULT_PATH", "IB_CACHE_PATH", "AI_IM_PATH", "CL_BASE_PATH"] },
      { id: "tile", title: "地图与瓦片", hint: "cangling-map 与 cangling-tile 配置", names: ["TILE_CACHE_URL"], prefixes: ["CANGLING_TILE_"] },
    ];

    function canglingEnvironmentGroup(name) {
      return CANGLING_ENVIRONMENT_GROUPS.find((group) =>
        (group.names || []).includes(name) || (group.prefixes || []).some((prefix) => name.startsWith(prefix))
      );
    }

    function canglingEnvironmentRows(values) {
      const entries = Object.entries(values || {}).sort(([left], [right]) => left.localeCompare(right));
      const groups = CANGLING_ENVIRONMENT_GROUPS.map((group) => ({ ...group, entries: [] }));
      const custom = { id: "custom", title: "其他与自定义", hint: "兼容配置或用户自行添加的变量", entries: [] };
      entries.forEach((entry) => {
        const matched = canglingEnvironmentGroup(entry[0]);
        const target = matched ? groups.find((group) => group.id === matched.id) : custom;
        target.entries.push(entry);
      });
      return [...groups, custom].map((group) => `
        <section class="cangling-environment-group">
          <div class="cangling-environment-group-head"><h4>${esc(group.title)}</h4><p>${esc(group.hint)}</p></div>
          <div class="cangling-table-wrap cangling-kv-wrap"><table class="cangling-kv-table"><thead><tr><th>变量名</th><th>值</th><th></th></tr></thead><tbody id="cangling-environment-${group.id}-rows">${group.entries.length ? group.entries.map(([name, value]) => canglingKeyValueRow("environment", name, value, false)).join("") : '<tr data-cangling-kv-empty><td colspan="3" class="cangling-kv-empty">暂无配置</td></tr>'}</tbody></table></div>
        </section>`).join("");
    }

    function bindCanglingKeyValueActions() {
      document.querySelectorAll("[data-cangling-kv-random]").forEach((button) => {
        button.onclick = () => {
          const row = button.closest("[data-cangling-kv-row]");
          if (!row) return;
          const name = row.querySelector("[data-cangling-kv-key]").value.trim();
          const input = row.querySelector("[data-cangling-kv-value]");
          input.value = randomCanglingSecret(name);
          input.focus();
          input.select();
        };
      });
      document.querySelectorAll("[data-cangling-kv-delete]").forEach((button) => {
        button.onclick = () => {
          const row = button.closest("[data-cangling-kv-row]");
          const body = row && row.parentElement;
          if (row) row.remove();
          if (body && !body.querySelector("[data-cangling-kv-row]")) {
            body.innerHTML = `<tr data-cangling-kv-empty><td colspan="3" class="cangling-kv-empty">暂无配置</td></tr>`;
          }
        };
      });
    }

    function secureRandomIndex(max) {
      if (!window.crypto || !window.crypto.getRandomValues) throw new Error("当前浏览器不支持安全随机数");
      const ceiling = Math.floor(0x100000000 / max) * max;
      const value = new Uint32Array(1);
      do window.crypto.getRandomValues(value); while (value[0] >= ceiling);
      return value[0] % max;
    }

    function secureRandomCharacters(alphabet, length) {
      return Array.from({ length }, () => alphabet[secureRandomIndex(alphabet.length)]).join("");
    }

    function randomCanglingSecret(name) {
      if (name.toUpperCase().includes("TOKEN")) {
        const bytes = new Uint8Array(20);
        window.crypto.getRandomValues(bytes);
        return Array.from(bytes, (value) => value.toString(16).padStart(2, "0")).join("");
      }
      const groups = ["ABCDEFGHJKLMNPQRSTUVWXYZ", "abcdefghijkmnopqrstuvwxyz", "23456789", "!@#$%^&*_-+="];
      const alphabet = groups.join("");
      const characters = groups.map((group) => group[secureRandomIndex(group.length)]);
      characters.push(...secureRandomCharacters(alphabet, 20));
      for (let index = characters.length - 1; index > 0; index -= 1) {
        const target = secureRandomIndex(index + 1);
        [characters[index], characters[target]] = [characters[target], characters[index]];
      }
      return characters.join("");
    }

    function addCanglingKeyValue(kind, secret = false) {
      const body = kind === "environment" ? $("#cangling-environment-custom-rows") : $(`#cangling-${kind}-rows`);
      if (!body) return;
      const empty = body.querySelector("[data-cangling-kv-empty]");
      if (empty) empty.remove();
      body.insertAdjacentHTML("beforeend", canglingKeyValueRow(kind, "", "", secret));
      bindCanglingKeyValueActions();
      const row = body.lastElementChild;
      if (row) row.querySelector("[data-cangling-kv-key]").focus();
    }

    function readCanglingKeyValues(kind, label) {
      const result = {};
      document.querySelectorAll(`#cangling-${kind}-rows [data-cangling-kv-row]`).forEach((row) => {
        const name = row.querySelector("[data-cangling-kv-key]").value.trim();
        const value = row.querySelector("[data-cangling-kv-value]").value;
        if (!name) throw new Error(`${label}名称不能为空`);
        if (Object.prototype.hasOwnProperty.call(result, name)) throw new Error(`${label} ${name} 重复`);
        result[name] = value;
      });
      return result;
    }

    function canglingAppRows(group) {
      const apps = (state.canglingConfig && state.canglingConfig.applications || []).filter((app) => app.group === group);
      return apps.map((app) => {
        const index = state.canglingConfig.applications.indexOf(app);
        const deployment = app.workload === "Deployment";
        return `<tr data-cangling-app="${index}">
          <td class="cangling-app-name"><strong>${esc(app.title)}</strong><span>${esc(app.id)}</span></td>
          <td><span class="pill">${esc(app.workload)}</span></td>
          ${group === "entry" ? `<td class="cangling-service-ref"><strong>ClusterIP</strong><span>${esc(app.id)}:${Number((app.ports || [])[0]) || "—"}</span></td>` : ""}
          <td class="cangling-image-cell"><input data-cangling-app-field="image" type="text" value="${esc(app.image)}" placeholder="镜像名称:版本" aria-label="${esc(app.title)}镜像名称和版本" /></td>
          ${group === "single" ? "" : `<td>${deployment ? `<input data-cangling-app-field="replicas" type="number" min="1" max="100" value="${Number(app.replicas) || 1}" aria-label="${esc(app.title)}副本数" />` : "每节点 1 个"}</td>`}
          <td>${deployment ? `<div class="cangling-node-field"><input data-cangling-app-field="node" type="text" value="${esc(app.node)}" aria-label="${esc(app.title)}部署节点" readonly /><button type="button" class="btn" data-cangling-node-select="${index}">选择节点</button></div>` : '<span class="hint">所有可调度节点</span>'}</td>
          <td class="cangling-ports-cell"><input data-cangling-app-field="ports" type="text" value="${esc((app.ports || []).join(", "))}" aria-label="${esc(app.title)}端口" /></td>
          <td class="cangling-storage" data-cangling-storage="${index}">${esc(app.storage || "—")}</td>
        </tr>`;
      }).join("");
    }

    function canglingSelectedNodes(value) {
      return String(value || "").split(/[，,\s]+/).map((node) => node.trim()).filter(Boolean);
    }

    function canglingNodeInfo(item) {
      const metadata = item.metadata || {}, status = item.status || {}, labels = metadata.labels || {};
      const ready = (status.conditions || []).some((condition) => condition.type === "Ready" && condition.status === "True");
      const roles = Object.keys(labels)
        .filter((name) => name.startsWith("node-role.kubernetes.io/"))
        .map((name) => name.slice("node-role.kubernetes.io/".length) || "worker");
      const addresses = status.addresses || [];
      const address = addresses.find((entry) => entry.type === "InternalIP") || addresses.find((entry) => entry.type === "ExternalIP");
      return {
        name: metadata.name || "",
        nodeId: labels["cangling.cn/node-id"] || metadata.name || "",
        pool: labels["cangling.cn/pool"] || "",
        ready,
        role: roles.join(", ") || "worker",
        address: address && address.address || "—",
        version: status.nodeInfo && status.nodeInfo.kubeletVersion || "—",
      };
    }

    async function syncCanglingHostFromEntryNode({ quiet = false } = {}) {
      if (!state.canglingHostAuto || !state.canglingConfig) return;
      const syncId = ++state.canglingHostSync;
      const entry = canglingEntryApplication();
      const input = $("#cangling-hostIp");
      const status = $("#cangling-host-status");
      const refresh = $("#cangling-host-refresh");
      const selected = canglingSelectedNodes(entry && entry.node)[0];
      if (!selected) {
        if (status) status.textContent = "请先为统一入口选择一个节点。";
        return;
      }
      if (refresh) refresh.disabled = true;
      if (status) status.textContent = `正在读取 ${selected} 的节点地址…`;
      try {
        const result = await api("/api/k3s/resources?kind=nodes&namespace=_cluster");
        const nodes = (result.items || []).map(canglingNodeInfo);
        const node = nodes.find((item) => item.nodeId === selected || item.name === selected);
        if (!node || !node.address || node.address === "—") throw new Error(`找不到入口节点 ${selected} 的 InternalIP`);
        const currentEntry = canglingEntryApplication();
        const currentSelected = canglingSelectedNodes(currentEntry && currentEntry.node)[0];
        if (!state.canglingHostAuto || syncId !== state.canglingHostSync || currentSelected !== selected) return;
        state.canglingConfig.hostIp = node.address;
        if (input) input.value = node.address;
        if (status) status.textContent = `已跟随统一入口节点 ${node.nodeId} · ${node.address}`;
      } catch (error) {
        if (!state.canglingHostAuto || syncId !== state.canglingHostSync) return;
        if (status) status.textContent = `自动获取失败：${error.message}`;
        if (!quiet) flash("err", `入口主机地址自动获取失败：${error.message}`);
      } finally {
        if (refresh && syncId === state.canglingHostSync) refresh.disabled = !state.canglingHostAuto;
