    function renderK3sDetail(kind, namespace, detail, yaml, events) {
      const metadata = detail.metadata || {}, spec = detail.spec || {};
      const containers = (spec.containers || spec.template && spec.template.spec && spec.template.spec.containers || []);
      const canRestart = ["deployments", "statefulsets", "daemonsets"].includes(kind.id) && namespace !== "_cluster";
      const fixedSingleton = metadata.name === "cangling-broker";
      const canScale = ["deployments", "statefulsets"].includes(kind.id) && namespace !== "_cluster" && !fixedSingleton;
      const actions = [
        canRestart ? '<button type="button" class="btn" id="k3s-restart">滚动重启</button>' : "",
        canScale ? '<button type="button" class="btn" id="k3s-scale">调整副本</button>' : "",
        kind.id === "pods" ? '<button type="button" class="btn danger" id="k3s-delete-pod">删除 Pod</button>' : "",
      ].join("");
      const eventText = events.length ? events.map((event) => {
        const when = event.eventTime || event.lastTimestamp || event.metadata && event.metadata.creationTimestamp || "";
        return "[" + fmtDateTime(when) + "] " + (event.type || "") + " " + (event.reason || "") + "\n" + (event.message || "");
      }).join("\n\n") : "暂无事件";
      $("#dialog-body").innerHTML = `<div class="k3s-detail">
        <div class="k3s-detail-head">
          <div><h4>${esc(metadata.name)}</h4><div class="hint">${esc(namespace === "_cluster" ? "集群级资源" : namespace)} · ${esc(detail.kind || kind.label)}</div></div>
          <div class="k3s-detail-actions">${actions}</div>
        </div>
        <div class="k3s-detail-grid">
          <div><span>UID：</span>${esc(metadata.uid || "—")}</div>
          <div><span>创建时间：</span>${esc(fmtDateTime(metadata.creationTimestamp))}</div>
          <div><span>容器：</span>${esc(containers.map((container) => container.name).join(", ") || "—")}</div>
          <div><span>镜像：</span>${esc(containers.map((container) => container.image).join(", ") || "—")}</div>
          ${fixedSingleton ? '<div><span>副本策略：</span>固定单实例 · Recreate</div>' : ""}
        </div>
        <div class="k3s-detail-tabs">
          <button type="button" class="btn active" data-k3s-detail-tab="yaml">YAML</button>
          <button type="button" class="btn" data-k3s-detail-tab="events">事件</button>
          ${kind.id === "pods" ? '<button type="button" class="btn" data-k3s-detail-tab="logs">日志</button>' : ""}
        </div>
        <div class="k3s-code" id="k3s-detail-content">${esc(yaml)}</div>
      </div>`;
      document.querySelectorAll("[data-k3s-detail-tab]").forEach((button) => {
        button.onclick = async () => {
          document.querySelectorAll("[data-k3s-detail-tab]").forEach((item) => item.classList.toggle("active", item === button));
          const content = $("#k3s-detail-content");
          const tab = button.dataset.k3sDetailTab;
          if (tab === "logs") {
            const container = containers[0] && containers[0].name || "";
            await renderK3sPodLogs(content, namespace, metadata.name, container);
            return;
          }
          disposeDialogTerminal();
          content.className = "k3s-code";
          content.textContent = tab === "events" ? eventText : yaml;
        };
      });
      const restart = $("#k3s-restart");
      if (restart) restart.onclick = async () => {
        if (!(await confirmDialog("确定滚动重启 " + metadata.name + "？"))) return;
        await k3sOperate("/api/k3s/workloads/" + kind.id + "/" + namespace + "/" + metadata.name + "/restart", { method: "POST" });
      };
      const scale = $("#k3s-scale");
      if (scale) scale.onclick = async () => {
        const current = spec.replicas == null ? 1 : spec.replicas;
        openK3sScaleDialog(kind, namespace, metadata.name, current);
      };
      const remove = $("#k3s-delete-pod");
      if (remove) remove.onclick = async () => {
        if (!(await confirmDialog("确定删除 Pod " + metadata.name + "？控制器可能会自动重新创建。", { danger: true }))) return;
        await k3sOperate("/api/k3s/pods/" + namespace + "/" + metadata.name, { method: "DELETE" });
      };
    }

    async function renderK3sPodLogs(content, namespace, pod, container) {
      disposeDialogTerminal();
      const token = dialog.k3sLogToken;
      content.className = "k3s-log-terminal";
      content.textContent = "";
      try {
        await loadXterm();
        if (document.fonts && document.fonts.load) await document.fonts.load('13px "Iosevka Term"');
        if (token !== dialog.k3sLogToken || !content.isConnected) return;
        const term = new window.Terminal({
          cursorBlink: false,
          disableStdin: true,
          convertEol: true,
          scrollback: 5000,
          fontSize: 13,
          lineHeight: 1.25,
          fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace',
          theme: termTheme(),
        });
        const Fit = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);
        const fit = Fit ? new Fit() : null;
        if (fit) term.loadAddon(fit);
        term.open(content);
        dialog.term = term;
        dialog.fit = fit;
        const resize = () => {
          if (fit && token === dialog.k3sLogToken && dialog.term === term) fit.fit();
        };
        dialog.onResize = resize;
        window.addEventListener("resize", resize);
        setTimeout(resize, 0);
        term.writeln("\x1b[2m正在读取 Pod 日志…\x1b[0m");
        const result = await api("/api/k3s/pods/" + encodeURIComponent(namespace) + "/" + encodeURIComponent(pod) + "/logs?tail=500&container=" + encodeURIComponent(container));
        if (token !== dialog.k3sLogToken || dialog.term !== term) return;
        term.reset();
        const text = result.text || "\x1b[2m暂无日志\x1b[0m";
        term.write(text);
        if (!text.endsWith("\n")) term.write("\r\n");
        term.scrollToBottom();
      } catch (error) {
        if (token !== dialog.k3sLogToken || !content.isConnected) return;
        if (dialog.term) dialog.term.writeln(`\r\n\x1b[31m${error.message}\x1b[0m`);
        else {
          content.className = "k3s-code";
          content.textContent = error.message;
        }
      }
    }

    function openK3sScaleDialog(kind, namespace, name, current) {
      closeDialog();
      const modal = $("#dialog-modal");

        <div class="flash err" id="k3s-scale-error" hidden></div>
      </div>`;

        const replicas = Number($("#k3s-replicas").value);

          error.textContent = "副本数必须是 0 到 1000 的整数";
          error.hidden = false;
          return;
        }
        await k3sOperate("/api/k3s/workloads/" + kind.id + "/" + namespace + "/" + name + "/scale", {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ replicas }),
        });

      $("#dialog").hidden = false;
      $("#k3s-replicas").focus();
      $("#k3s-replicas").select();
    }

    async function k3sOperate(url, options) {
      try {
        const result = await api(url, options);
        closeDialog();
        flash("ok", result.message || "操作已提交");
        await loadK3s(true);

        const scaleError = $("#k3s-scale-error");

        if (scaleError) {

          scaleError.hidden = false;
        } else if (content) {
          content.textContent = e.message;
        } else {
          flash("err", e.message);
        }
      }
    }

    async function downloadRootCertificate() {
      try {
        const response = await fetch(appPath("/api/certificates/root"), withAuth());
        if (!response.ok) {
          let message = response.statusText;
          try { message = (await response.json()).error || message; } catch (_) {}
          throw new Error(message);
        }
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement("a");
        link.href = url;
        link.download = "cangling-root-ca.crt";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        flash("ok", "根证书已下载，请按照下方说明加入受信任的根证书颁发机构");
      } catch (error) {

    function uploadJarFiles() {
      const input = $("#jar-files");
      const files = Array.from((input && input.files) || []);
      if (!files.length) return;
      const allowed = new Set(["cis-server-1.0.0.jar", "cis-map-1.0.0.jar", "cis-k8s-1.0.0.jar", "np4-base-server-1.0.0.jar"]);
      const invalid = files.find(file => !allowed.has(file.name));
      if (invalid) { flash("err", `不允许的文件名：${invalid.name}`); input.value = ""; return; }
      const form = new FormData();
      files.forEach(file => form.append("files", file, file.name));
      const xhr = new XMLHttpRequest();
      xhr.open("POST", appPath("/api/jar-upgrade/upload"));
      const token = sessionToken(); if (token) xhr.setRequestHeader("Authorization", "Bearer " + token);
      $("#btn-jar-upload").disabled = true;
      $("#btn-jar-run").disabled = true;
      $("#jar-upload-progress").hidden = false;
      xhr.upload.onprogress = event => {
        if (!event.lengthComputable) return;
        const pct = Math.round(event.loaded * 100 / event.total);
        $("#jar-upload-percent").textContent = pct + "%";
        $("#jar-upload-bar").style.width = pct + "%";
        $("#jar-upload-message").textContent = `正在上传 ${files.length} 个文件`;
      };
      xhr.onload = async () => {
        input.value = "";
        if (xhr.status >= 200 && xhr.status < 300) {
          await renderJarUpgrade();
          flash("ok", `已上传 ${files.length} 个 JAR`);
        } else {
          let message = xhr.responseText; try { message = JSON.parse(message).error; } catch (_) {}
          await renderJarUpgrade(); flash("err", message || "上传失败");
        }
      };
      xhr.onerror = async () => { await renderJarUpgrade(); flash("err", "上传失败：网络连接中断"); };
      xhr.send(form);
    }

    async function runJarUpgrade() {

        const job = await api("/api/jar-upgrade/run", { method: "POST" });
        watchJarUpgrade(job.id);

        flash("err", e.message);
        if (button) button.disabled = false;
      }
    }

    function watchJarUpgrade(jobId) {
      stopJarUpgradePoll();
      jarUpgradePoll.jobId = jobId;
      const poll = async () => {
        try {
          const job = await api("/api/jobs/" + jobId);
          const log = $("#jar-upgrade-log"); if (log) log.textContent = job.message || job.phase;
          if (job.done) {
            stopJarUpgradePoll();
            flash(job.error ? "err" : "ok", job.error || "JAR 升级完成");
            const button = $("#btn-jar-run"); if (button) button.disabled = false;
          }
        } catch (e) {
          stopJarUpgradePoll(); flash("err", e.message);
        }
      };
      jarUpgradePoll.timer = setInterval(poll, 1000);
      poll();
    }

    function stopJarUpgradePoll() {

      jarUpgradePoll.timer = null;

      try {
        const data = await api("/api/images" + imageDirectoryQuery());
        state.images = data;
        const availablePackages = new Set(data.packages.map(p => p.name));
        state.selectedImagePackages = new Set(Array.from(state.selectedImagePackages || []).filter(name => availablePackages.has(name)));
        const availableImages = new Set(data.nodes.flatMap(n => (n.images || []).map(image => typeof image === "string" ? image : image.name)));
        state.selectedNodeImages = new Set(Array.from(state.selectedNodeImages || []).filter(name => availableImages.has(name)));
        const dir = $("#images-directory");
        if (dir) dir.innerHTML = `目录：<code>${esc(data.directory)}</code> · ${data.packages.length} 个镜像包`;
        renderImagePackages();
        renderNodeImages();
        if (data.active_job && !data.active_job.done) watchActiveImageJob(data.active_job.id, data.active_job);
      } catch (e) { flash("err", e.message); }
    }

    function startImageMonitorPoll() {
      stopImageMonitorPoll();
      state.imageMonitorTimer = setInterval(async () => {
        if ((location.hash || "#/") !== "#/images" || state.imageTaskTimer) return;
        try {
          const job = await api("/api/images/active-job");
          if (job && !job.done) watchActiveImageJob(job.id, job);
        } catch (_) {}
      }, 1500);
    }

    function stopImageMonitorPoll() {
      if (state.imageMonitorTimer) { clearInterval(state.imageMonitorTimer); state.imageMonitorTimer = null; }
      if (state.imageTaskTimer) { clearInterval(state.imageTaskTimer); state.imageTaskTimer = null; }
      state.imageTaskId = null;
    }

    function watchActiveImageJob(id, initial = null) {
      if (state.imageTaskId === id && state.imageTaskTimer) return;
      if (state.imageTaskTimer) clearInterval(state.imageTaskTimer);
      state.imageTaskId = id;
      if (initial) renderProgress("images-prog", initial);
      showProgress("images-prog", true);
      const poll = async () => {
        try {
          const job = await api("/api/jobs/" + id);
          renderProgress("images-prog", job);
          if (job.done) {
            clearInterval(state.imageTaskTimer); state.imageTaskTimer = null; state.imageTaskId = null;
            flash(job.error ? "err" : "ok", job.error || job.message);
            if (!job.error) { showProgress("images-prog", false); await loadImages(); }
          }
        } catch (e) {
          clearInterval(state.imageTaskTimer); state.imageTaskTimer = null; state.imageTaskId = null; flash("err", e.message);
        }
      };
      state.imageTaskTimer = setInterval(poll, 500);
      poll();
    }

    function renderImagePackages() {
      const packages = $("#image-packages");
      if (!packages || !state.images) return;
      const allPackages = state.images.packages || [];
      const pages = Math.max(1, Math.ceil(allPackages.length / 10));
      state.imagePackagePage = Math.min(Math.max(1, state.imagePackagePage || 1), pages);
      const start = (state.imagePackagePage - 1) * 10;
      const pageItems = allPackages.slice(start, start + 10);
      packages.innerHTML = pageItems.length ? `
          <table><thead><tr><th><input id="image-packages-all" type="checkbox" /></th><th>镜像包</th><th>大小</th><th>修改时间</th><th></th></tr></thead><tbody>
          ${pageItems.map(p => `<tr><td><input class="image-package-select" type="checkbox" value="${esc(p.name)}" ${(state.selectedImagePackages || new Set()).has(p.name) ? "checked" : ""} /></td><td><code>${esc(p.name)}</code></td><td>${fmtBytes(p.size)}</td><td>${fmtDateTime(p.modified)}</td><td><button class="btn image-import" data-name="${esc(p.name)}">导入所选节点</button></td></tr>`).join("")}
          </tbody></table>` : `<div class="empty">目录中没有 tar、tar.gz 或 tgz 镜像包</div>`;
      document.querySelectorAll(".image-import").forEach(b => b.onclick = () => importImagePackage(b.dataset.name));
      const packageChecks = Array.from(document.querySelectorAll(".image-package-select"));
      packageChecks.forEach(c => c.onchange = () => { if (c.checked) state.selectedImagePackages.add(c.value); else state.selectedImagePackages.delete(c.value); updateImagePackageSelection(); });
      const packageAll = $("#image-packages-all");
      if (packageAll) packageAll.onchange = () => { packageChecks.forEach(c => { c.checked = packageAll.checked; if (c.checked) state.selectedImagePackages.add(c.value); else state.selectedImagePackages.delete(c.value); }); updateImagePackageSelection(); };
      const pager = $("#image-package-pages");
      if (pager) {
        pager.innerHTML = `<span class="hint">共 ${allPackages.length} 个 · 第 ${state.imagePackagePage} / ${pages} 页</span><button class="btn" id="image-page-prev" ${state.imagePackagePage <= 1 ? "disabled" : ""}>上一页</button><button class="btn" id="image-page-next" ${state.imagePackagePage >= pages ? "disabled" : ""}>下一页</button>`;
        $("#image-page-prev").onclick = () => { state.imagePackagePage--; renderImagePackages(); };
        $("#image-page-next").onclick = () => { state.imagePackagePage++; renderImagePackages(); };
      }
      updateImagePackageSelection();
    }

    function renderNodeImages() {
      const root = $("#node-images");
      if (!root || !state.images) return;
      const selected = new Set(Array.from(document.querySelectorAll(".image-node:checked")).map(c => c.value));
      const hadCheckboxes = document.querySelectorAll(".image-node").length > 0;
      const query = (($("#node-image-search") && $("#node-image-search").value) || "").trim().toLowerCase();
      const nodes = state.images.nodes || [];
      if (!nodes.length) { root.innerHTML = `<div class="empty">暂无节点</div>`; return; }
      const normalized = nodes.map(n => (n.images || []).map(image => typeof image === "string" ? {name:image,size:0} : image));
      const imageSets = normalized.map(images => new Set(images.map(image => image.name)));
      const imageSizes = new Map();
      normalized.flat().forEach(image => imageSizes.set(image.name, Math.max(imageSizes.get(image.name) || 0, Number(image.size) || 0)));
      const images = Array.from(imageSizes.keys())
        .filter(image => !query || image.toLowerCase().includes(query))
        .sort((a, b) => a.localeCompare(b));
      const headers = nodes.map(n => {
        const checked = n.status === "online" && (!hadCheckboxes || selected.has(n.node_id));
        const status = n.error ? n.error : n.status === "online" ? `${n.images.length} 个镜像` : "离线";
        return `<th title="${esc(n.address)} · ${esc(status)}"><label><input class="image-node" type="checkbox" value="${esc(n.node_id)}" ${n.status !== "online" ? "disabled" : ""} ${checked ? "checked" : ""} /> ${esc(n.node_name)}</label><div class="hint">${esc(status)}</div></th>`;
      }).join("");
      const rows = images.map(image => `<tr><td><label title="${esc(image)}"><input class="node-image-select" type="checkbox" value="${esc(image)}" ${(state.selectedNodeImages || new Set()).has(image) ? "checked" : ""} /> <code>${esc(shortImageName(image))}</code></label></td><td>${imageSizes.get(image) ? fmtBytes(imageSizes.get(image)) : "—"}</td>${nodes.map((n, i) => {
        if (n.status !== "online" || n.error) return `<td class="hint" title="节点不可用">—</td>`;
        return imageSets[i].has(image)
          ? `<td><span class="image-installed" title="已安装">✓</span></td>`
          : `<td class="hint" title="未安装">—</td>`;
      }).join("")}</tr>`).join("");
      const body = rows || `<tr><td colspan="${nodes.length + 2}" class="empty">没有找到</td></tr>`;
      root.innerHTML = `<div class="image-matrix-wrap"><table class="image-matrix"><thead><tr><th><label><input id="image-nodes-all" type="checkbox" checked /> 镜像名称</label></th><th>大小</th>${headers}</tr></thead><tbody>${body}</tbody></table></div>`;
      const all = $("#image-nodes-all");
      if (all) {
        const enabled = Array.from(document.querySelectorAll(".image-node:not(:disabled)"));
        all.checked = enabled.length > 0 && enabled.every(c => c.checked);
        all.indeterminate = enabled.some(c => c.checked) && !all.checked;
        all.onchange = () => enabled.forEach(c => c.checked = all.checked);
      }
      document.querySelectorAll(".node-image-select").forEach(c => c.onchange = () => { if (c.checked) state.selectedNodeImages.add(c.value); else state.selectedNodeImages.delete(c.value); updateNodeImageDeleteButton(); });
      updateNodeImageDeleteButton();
    }

    function shortImageName(image) {
      const parts = String(image || "").split("/");
      return parts[parts.length - 1] || image;
    }

    function uploadImagePackage() {
      const input = $("#images-file"); const file = input.files && input.files[0];
      if (!file) return;
      const fd = new FormData(); fd.append("file", file, file.name);
      const xhr = new XMLHttpRequest(); xhr.open("POST", appPath("/api/images/upload" + imageDirectoryQuery()));
      state.imageUpload = xhr;
      const token = sessionToken(); if (token) xhr.setRequestHeader("Authorization", "Bearer " + token);
      showProgress("images-prog", true);
      $("#btn-images-upload").disabled = true;
      $("#btn-images-cancel").hidden = false;
      xhr.upload.onprogress = e => renderProgress("images-prog", { message:"正在上传 " + file.name,current:e.loaded,total:e.total,percent:e.lengthComputable ? Math.round(e.loaded * 100 / e.total) : 0,done:false });
      xhr.onload = async () => {
        state.imageUpload = null; $("#btn-images-upload").disabled = false; $("#btn-images-cancel").hidden = true;
        input.value = "";
        if (xhr.status >= 200 && xhr.status < 300) { showProgress("images-prog", false); flash("ok", "镜像包上传完成"); await loadImages(); }
        else { let msg=xhr.responseText; try { msg=JSON.parse(msg).error; } catch {} flash("err", msg || "上传失败"); }
      };
      xhr.onerror = () => { state.imageUpload = null; $("#btn-images-upload").disabled = false; $("#btn-images-cancel").hidden = true; flash("err", "上传失败：网络连接中断"); };
      xhr.onabort = () => { state.imageUpload = null; input.value = ""; $("#btn-images-upload").disabled = false; $("#btn-images-cancel").hidden = true; showProgress("images-prog", false); flash("ok", "已取消上传"); };
      xhr.send(fd);
    }

    function updateImagePackageSelection() {
      const checks = Array.from(document.querySelectorAll(".image-package-select"));
      const selected = state.selectedImagePackages || new Set();
      const button = $("#btn-images-delete");
      if (button) { button.disabled = selected.size === 0; button.textContent = selected.size ? `删除所选 (${selected.size})` : "删除所选"; }
      const all = $("#image-packages-all");
      if (all) { const pageSelected = checks.filter(c => c.checked).length; all.checked = checks.length > 0 && pageSelected === checks.length; all.indeterminate = pageSelected > 0 && pageSelected < checks.length; }
    }

    async function deleteImagePackages() {
      const filenames = Array.from(state.selectedImagePackages || []);
      if (!filenames.length) return;
      if (!(await confirmDialog(`确定删除所选的 ${filenames.length} 个镜像包？`, {danger:true}))) return;
      try {
        const result = await api("/api/images/packages" + imageDirectoryQuery(), {method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({filenames})});
        state.selectedImagePackages.clear(); flash("ok", `已删除 ${result.deleted} 个镜像包`); await loadImages();
      } catch (e) { flash("err", e.message); }
    }

    function updateNodeImageDeleteButton() {
      const button = $("#btn-node-images-delete");
      if (!button) return;
      const count = (state.selectedNodeImages || new Set()).size;
      button.disabled = count === 0;
      button.textContent = count ? `删除所选镜像 (${count})` : "删除所选镜像";
    }

    async function deleteNodeImages() {
      const images = Array.from(state.selectedNodeImages || []);
      const nodeIds = Array.from(document.querySelectorAll(".image-node:checked")).map(c => c.value);
      if (!images.length) { flash("err", "请选择要删除的镜像"); return; }
      if (!nodeIds.length) { flash("err", "请至少选择一个在线节点"); return; }
      if (!(await confirmDialog(`确定从 ${nodeIds.length} 个节点删除所选的 ${images.length} 个镜像？正在使用的镜像可能导致工作负载重启失败。`, {danger:true}))) return;
      try {
        const started = await api("/api/images/node-images", {method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({images,node_ids:nodeIds})});
        showProgress("images-prog", true);
        const timer = setInterval(async () => {
          try {
            const job = await api("/api/jobs/" + started.job_id); renderProgress("images-prog", job);
            if (job.done) { clearInterval(timer); flash(job.error ? "err" : "ok", job.error || job.message); if (!job.error) { state.selectedNodeImages.clear(); await loadImages(); } }
          } catch (e) { clearInterval(timer); flash("err", e.message); }
        }, 500);
      } catch (e) { flash("err", e.message); }
    }

    async function importImagePackage(filename) {
      const nodeIds = Array.from(document.querySelectorAll(".image-node:checked")).map(c => c.value);
      if (!nodeIds.length) { flash("err", "请至少选择一个在线节点"); return; }
      if (!(await confirmDialog(`确定将 ${filename} 导入 ${nodeIds.length} 个节点？`))) return;
      try {
        const directory = ($("#images-dir") && $("#images-dir").value.trim()) || null;
        const started = await api("/api/images/import", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({filename,directory,node_ids:nodeIds})});
        watchActiveImageJob(started.job_id);
      } catch (e) { flash("err", e.message); }
    }

    function renderStorage() {
      state.current = null;
      renderList();
      $("#main").classList.remove("db-fill");
      loadStorage();
    }

    async function loadStorage() {
      try {
        const [list, nodes] = await Promise.all([
          api("/api/storages"),
          api("/api/cluster/nodes").catch(() => []),
        ]);
        state.storages = list || [];
        state.clusterNodes = nodes || [];
        renderStorageLayout();
      } catch (e) {
        $("#main").innerHTML = `<div class="card"><h3>存储</h3><p class="hint">${esc(e.message)}</p></div>`;
      }
    }

    function renderStorageLayout() {
      const rows = (state.storages || []).map(storageRow).join("");
      $("#main").innerHTML = `
        <div class="title-row">
          <div><h2>存储</h2><div class="path">定义外部存储或主机 CIFS/NFS 共享，并挂载 / 启动共享</div></div>
        </div>
        <div id="flash" hidden></div>
        <div class="card">
          <div class="row" style="margin-bottom:12px">
            <button class="btn primary" id="btn-add-storage">＋ 添加存储</button>
          </div>
          <table>
            <thead><tr><th>名称</th><th>类型</th><th>协议</th><th>主机</th><th>服务器 / 共享</th><th>目标目录</th><th>状态</th><th>说明</th><th>操作</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="9" class="empty">暂无存储</td></tr>`}</tbody>
          </table>
        </div>`;
      const add = $("#btn-add-storage");
      if (add) add.onclick = () => openStorageForm();
      const tbody = $("#main table tbody");
      if (tbody) {
        tbody.addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-action]");
          if (!btn) return;
          handleStorageAction(btn.dataset.action, btn.dataset.id);
        });
      }
    }

    function storageRow(s) {
      const protocol = (s.protocol || "—").toUpperCase();
      const kind = s.kind === "host_share" ? `主机 ${protocol} 共享` : "外部存储";
      const serverShare = s.kind === "host_share"
        ? (s.protocol === "nfs" ? esc(s.path || "—") : `${esc(s.share)}（源目录 ${esc(s.path || "—")}）`)
        : `${esc(s.server || "—")} / ${esc(s.share || "—")}`;
      return `<tr>
        <td>${esc(s.name)}</td>
        <td>${kind}</td>
        <td>${protocol}</td>
        <td>${esc(s.host_name || "—")}</td>
        <td>${serverShare}</td>
        <td class="path">${esc(s.target_dir || "—")}</td>
        <td>${storageStatusBadge(s)}</td>
        <td class="hint">${esc(s.message || "—")}</td>
        <td><div class="row" style="justify-content:flex-end">${storageActions(s)}</div></td>
      </tr>`;
    }

    function storageStatusBadge(s) {
      const map = { defined: ["已定义", ""], mounted: ["已挂载", "ok"], shared: ["共享已启动", "ok"], deployed: ["已部署", "ok"], error: ["错误", "bad"] };
      const [label, cls] = map[s.status] || [s.status, ""];
      return `<span class="${cls}">${esc(label)}</span>`;
    }

    function storageActions(s) {
      let btns = `<button type="button" class="btn primary" data-action="deploy" data-id="${esc(s.id)}">部署</button>`;
      btns += `<button type="button" class="btn" data-action="unmount" data-id="${esc(s.id)}">卸载</button>`;
      btns += `<button type="button" class="btn" data-action="edit" data-id="${esc(s.id)}">编辑</button>`;
      btns += `<button type="button" class="btn danger" data-action="delete" data-id="${esc(s.id)}">删除</button>`;
      return btns;
    }

    async function handleStorageAction(action, id) {
      if (action === "edit") { openStorageForm(id); return; }
      if (action === "delete") {
        const ok = await confirmDialog("确定删除该存储定义？");
        if (!ok) return;
        try {
          await api("/api/storages/" + id, { method: "DELETE" });
          await loadStorage();
          flash("ok", "已删除");
        } catch (e) { flash("err", e.message); }
        return;
      }
      if (action === "deploy" || action === "unmount") { openHostActionDialog(action, id); return; }
    }

    function openStorageForm(id) {
      closeDialog();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("form-modal");
      const existing = id ? (state.storages.find(s => s.id === id) || null) : null;
      $("#dialog-title").textContent = existing ? "编辑存储" : "添加存储";
      setDialogAction(existing ? "保存" : "创建", () => saveStorage(id));
      $("#dialog-body").innerHTML = storageFormHtml(existing);
      $("#dialog").hidden = false;

      const kindSel = $("#st-kind");
      if (kindSel) kindSel.onchange = toggleStorageFields;
      const protoSel = $("#st-protocol");
      if (protoSel) protoSel.onchange = toggleStorageFields;
      toggleStorageFields();
      const first = $("#st-name");
      if (first) first.focus();
    }

    function storageFormHtml(s) {
      const v = (k) => esc((s && s[k]) || "");
      const kind = s && s.kind === "host_share" ? `host_share_${s.protocol || "cifs"}` : "external";
      const protocol = s ? (s.protocol || "cifs") : "cifs";
      const nodes = state.clusterNodes || [];
      const hostOpts = `<option value="">本机</option>` + nodes.map(n =>
        `<option value="${esc(n.id)}" ${s && s.host_id === n.id ? "selected" : ""}>${esc(n.name || n.addr)}</option>`).join("");
      return `
      <div class="storage-form">
        <div id="storage-form-flash" hidden></div>
        <div class="form-section">
          <div class="form-section-title">基本信息</div>
          <div class="form-grid">
            <div class="field"><label>名称</label><input id="st-name" type="text" value="${v('name')}" placeholder="如：数据备份" /><p class="hint">用于识别该存储，需保持唯一。</p></div>
            <div class="field"><label>类型</label>
              <select id="st-kind">
                <option value="external" ${kind === "external" ? "selected" : ""}>外部存储（CIFS/NFS）</option>
                <option value="host_share_cifs" ${kind === "host_share_cifs" ? "selected" : ""}>主机 CIFS 共享</option>
                <option value="host_share_nfs" ${kind === "host_share_nfs" ? "selected" : ""}>主机 NFS 共享</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-section" id="st-external">
          <div class="form-section-title">连接信息</div>
          <div class="field"><label>协议</label>
            <select id="st-protocol">
              <option value="cifs" ${protocol === "cifs" ? "selected" : ""}>CIFS/SMB</option>
              <option value="nfs" ${protocol === "nfs" ? "selected" : ""}>NFS</option>
            </select>
          </div>
          <div class="form-grid">
            <div class="field"><label>服务器地址</label><input id="st-server" type="text" value="${v('server')}" placeholder="192.168.1.10" /></div>
            <div class="field"><label>共享路径</label><input id="st-share" type="text" value="${v('share')}" placeholder="/share" /></div>
          </div>
          <div class="field"><label>目标目录（挂载点）</label><input id="st-target-dir" type="text" value="${v('target_dir')}" placeholder="/mnt/storage" /><p class="hint">部署到目标主机时挂载到此目录，会自动创建。</p></div>
          <div class="form-grid">
            <div class="field" id="st-cifs-creds"><label>用户名（选填）</label><input id="st-username" type="text" value="${v('username')}" /></div>
            <div class="field" id="st-cifs-pass"><label>密码（选填）</label><input id="st-password" type="password" placeholder="${s && s.password ? '已设置，留空则不修改' : ''}" /></div>
          </div>
        </div>
        <div class="form-section" id="st-host-share" hidden>
          <div class="form-section-title">共享信息</div>
          <div class="field"><label>所在主机</label><select id="st-host-id">${hostOpts}</select></div>
          <div class="field" id="st-host-share-name"><label>共享名称</label><input id="st-share-h" type="text" value="${v('share')}" placeholder="data" /><p class="hint">CIFS 客户端通过该名称访问共享。</p></div>
          <div class="field"><label>共享目录</label><input id="st-path-h" type="text" value="${v('path')}" placeholder="/data/share" /><p class="hint" id="st-host-path-hint">主机上的绝对路径，将作为 Samba 共享暴露。</p></div>
          <div class="field"><label>目标目录（挂载点）</label><input id="st-target-dir-h" type="text" value="${v('target_dir')}" placeholder="/mnt/storage" /><p class="hint">部署到其它主机时挂载到此目录，会自动创建。</p></div>
          <div class="form-grid" id="st-host-creds">
            <div class="field"><label>存储用户名</label><input id="st-username-h" type="text" value="${v('username')}" placeholder="cangling-storage" autocomplete="off" /></div>
            <div class="field"><label>存储密码</label><input id="st-password-h" type="password" placeholder="${s ? '已设置时留空则不修改' : '请输入 Samba 密码'}" autocomplete="new-password" /></div>
          </div>
          <p class="hint" id="st-host-auth-hint">部署时会创建同名的受限 OS 用户和 Samba 用户，禁用 guest。目标主机通过权限为 600 的凭据文件挂载；容器 root 默认映射为 uid/gid 0。</p>
        </div>
        <div class="form-section">
          <div class="form-section-title">高级选项</div>
          <div class="field"><label>额外选项（选填）</label><textarea id="st-options" placeholder="例如 iocharset=utf8 或 Samba 配置行">${v('options')}</textarea><p class="hint" id="st-options-hint">CIFS/NFS 挂载选项，或 Samba 共享配置行（每行一条）。</p></div>
        </div>
      </div>`;
    }

    function toggleStorageFields() {
      const kindEl = $("#st-kind");
      const kind = kindEl ? kindEl.value : "external";
      const ext = $("#st-external");
      const host = $("#st-host-share");
      if (ext) ext.hidden = kind !== "external";

    async function createCurrentSubdirectory() {
      const input = $("#dir-picker-new-name"), button = $("#dir-picker-create-confirm"), flash = $("#dir-picker-flash");
      const name = input ? input.value.trim() : "";

        await renderDirPicker(dirPicker.path);
        dirPicker.selected = data.path;
        const row = Array.from(document.querySelectorAll("#dir-picker-list .dir-entry")).find(item => item.dataset.path === data.path);
        if (row) row.classList.add("active");
        const createRow = $("#dir-picker-create");if(createRow)createRow.hidden=true;if(input)input.value="";
      } catch (e) {
        if (flash) { flash.textContent = e.message; flash.hidden = false; }

    async function renderDirPicker(path) {
      const list = $("#dir-picker-list");
      if (!list) return;
      const bar = $("#dir-picker-path");
      const flash = $("#dir-picker-flash");
      const up = $("#dir-picker-up");
      const token = ++dirPicker.token;
      if (bar) bar.value = path;
      list.innerHTML = '<div class="dir-picker-loading">加载中…</div>';
      if (flash) { flash.hidden = true; flash.textContent = ""; }
      try {
        const data = await api("/api/browse-directory", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: path || "" }),
        });
        if (token !== dirPicker.token) return;
        dirPicker.path = data.path;
        dirPicker.parent = data.parent || null;
        dirPicker.selected = "";
        if (bar) bar.value = data.path;
        if (up) up.disabled = !dirPicker.parent;
        renderDirEntries(data.entries || []);
      } catch (e) {
        if (token !== dirPicker.token) return;
        if (flash) {
          flash.textContent = e.message;
          flash.hidden = false;
        }
        list.innerHTML = "";
      }
    }

    function renderDirEntries(entries) {
      const list = $("#dir-picker-list");
      if (!list) return;
      list.innerHTML = "";
      if (!entries.length) {
        list.innerHTML = '<div class="dir-picker-empty">（无子目录）</div>';
        return;
      }
      for (const ent of entries) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "dir-entry";
        row.dataset.path = ent.path;
        row.innerHTML =
          '<span class="dir-ico">' + DIR_ICON + '</span>' +
          '<span class="dir-name">' + esc(ent.name) + '</span>' +
          (ent.has_compose ? '<span class="dir-badge">Compose</span>' : '');
        row.addEventListener("click", () => {
          dirPicker.selected = ent.path;
          const active = list.querySelector(".dir-entry.active");
          if (active) active.classList.remove("active");

    function fmtBytes(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + " B";
      if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
      if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
      return (n / 1073741824).toFixed(2) + " GB";
    }

    function xterm256(n) {
      n = n & 255;
      if (n < 16) return n;
      if (n < 232) {
        n -= 16;
        const v = [0, 95, 135, 175, 215, 255];
        return "rgb(" + v[Math.floor(n / 36)] + "," + v[Math.floor((n % 36) / 6)] + "," + v[n % 6] + ")";
      }
      const g = 8 + (n - 232) * 10;
      return "rgb(" + g + "," + g + "," + g + ")";
    }

    function applySgr(st, raw) {
      const parts = raw.length ? raw.split(";") : ["0"];
      for (let p = 0; p < parts.length; p++) {
        const n = parseInt(parts[p], 10);
        const code = isNaN(n) ? 0 : n;
        if (code === 0) { st.b = st.d = st.i = st.u = st.inv = 0; st.fg = st.bg = null; }
        else if (code === 1) { st.b = 1; st.d = 0; }
        else if (code === 2) st.d = 1;
        else if (code === 3) st.i = 1;
        else if (code === 4) st.u = 1;
        else if (code === 7) st.inv = 1;
        else if (code === 21 || code === 22) { st.b = 0; st.d = 0; }
        else if (code === 23) st.i = 0;
        else if (code === 24) st.u = 0;
        else if (code === 27) st.inv = 0;
        else if (code === 39) st.fg = null;
        else if (code === 49) st.bg = null;
        else if (code >= 30 && code <= 37) st.fg = code - 30;
        else if (code >= 90 && code <= 97) st.fg = code - 90 + 8;
        else if (code >= 40 && code <= 47) st.bg = code - 40;
        else if (code >= 100 && code <= 107) st.bg = code - 100 + 8;
        else if (code === 38 || code === 48) {
          const kind = parseInt(parts[++p], 10);
          let color = null;
          if (kind === 5) color = xterm256(parseInt(parts[++p], 10) || 0);
          else if (kind === 2) {
            const r = parseInt(parts[++p], 10) || 0;
            const g = parseInt(parts[++p], 10) || 0;
            const b = parseInt(parts[++p], 10) || 0;
            color = "rgb(" + r + "," + g + "," + b + ")";
          }
          if (code === 38) st.fg = color;
          else st.bg = color;
        }
      }
    }

    function ansiToHtml(raw) {
      raw = String(raw ?? "");
      const st = { b: 0, d: 0, i: 0, u: 0, inv: 0, fg: null, bg: null };
      let out = "";
      const paint = (s) => {
        if (!s) return;
        const cls = [];
        if (st.b) cls.push("ansi-b");
        if (st.d) cls.push("ansi-d");
        if (st.i) cls.push("ansi-i");
        if (st.u) cls.push("ansi-u");
        let fg = st.inv ? (st.bg == null ? "var(--log-bg)" : st.bg) : st.fg;
        let bg = st.inv ? (st.fg == null ? "var(--log-text)" : st.fg) : st.bg;
        let style = "";
        if (typeof fg === "number") cls.push("ansi-fg-" + fg);
        else if (fg) style += "color:" + fg + ";";
        if (typeof bg === "number") cls.push("ansi-bg-" + bg);
        else if (bg) style += "background:" + bg + ";";
        const body = esc(s);
        if (!cls.length && !style) { out += body; return; }
        out += "<span" + (cls.length ? " class=\"" + cls.join(" ") + "\"" : "") +
          (style ? " style=\"" + style + "\"" : "") + ">" + body + "</span>";
      };
      let i = 0, buf = "";
      const flush = () => { paint(buf); buf = ""; };
      while (i < raw.length) {
        const code = raw.charCodeAt(i);
        if (code === 0x1b && i + 1 < raw.length) {
          const n = raw[i + 1];
          if (n === "[") {
            let j = i + 2;
            while (j < raw.length) {
              const cc = raw.charCodeAt(j);
              j++;
              if (cc >= 0x40 && cc <= 0x7e) break;
            }
            flush();
            if (raw[j - 1] === "m") applySgr(st, raw.slice(i + 2, j - 1).replace(/^[?-]/, ""));
            i = j;
            continue;
          }
          if (n === "]") {
            let j = i + 2;
            while (j < raw.length) {
              if (raw.charCodeAt(j) === 0x07) { j++; break; }
              if (raw.charCodeAt(j) === 0x1b && raw[j + 1] === "\\") { j += 2; break; }
              j++;
            }
            flush();
            i = j;
            continue;
          }
          flush();
          i += 2;
          continue;
        }
        if (code === 0x9b) {
          let j = i + 1;
          while (j < raw.length) {
            const cc = raw.charCodeAt(j);
            j++;
            if (cc >= 0x40 && cc <= 0x7e) break;
          }
          flush();
          if (raw[j - 1] === "m") applySgr(st, raw.slice(i + 1, j - 1));
          i = j;
          continue;
        }
        buf += raw[i++];
      }
      flush();
      return out;
    }

    function setLogs(el, text) {
      if (!el) return;
      el.innerHTML = ansiToHtml(text || "（无输出）");

    function showProgress(prefix, on) {
      const wrap = document.getElementById(prefix);
      if (wrap) wrap.hidden = !on;

    function setCanglingJarProgressPhase(phase) {
      const wrap = $("#cangling-jar-prog");
      if (!wrap) return;
      wrap.classList.remove("phase-check", "phase-upload", "phase-sync", "phase-error");
      if (phase) wrap.classList.add("phase-" + phase);
    }

    async function showCanglingJarProgressError(message) {
      setCanglingJarProgressPhase("error");
      renderProgress("cangling-jar-prog", { done: true, message: message || "操作失败", percent: 100, current: 1, total: 1 });
      await new Promise((resolve) => setTimeout(resolve, 900));
    }

    function renderProgress(prefix, job) {
      const wrap = document.getElementById(prefix);
      if (!wrap) return;
      wrap.hidden = false;
      const msg = document.getElementById(prefix + "-msg");
      const pct = document.getElementById(prefix + "-pct");
      const bar = document.querySelector("#" + prefix + "-bar");
      const fill = bar ? bar.querySelector("span") : null;
      const sub = document.getElementById(prefix + "-sub");
      const unknown = !job.total;
      if (bar) bar.classList.toggle("unknown", unknown && !job.done);
      if (msg) msg.textContent = job.message || job.phase || "处理中";
      if (pct) pct.textContent = unknown && !job.done ? "…" : (job.percent || 0) + "%";
      if (fill && !unknown) fill.style.width = (job.percent || 0) + "%";
      if (sub) {
        const msg = job.message || "";
        if (state.busy === "zot-environment") {
          sub.textContent = job.total ? (job.current + " / " + job.total + " 步") : "";
        } else if (job.phase === "import") {
          sub.textContent = job.total ? (job.current + " / " + job.total + " 个节点") : "";
        } else if (job.phase === "zot-environment") {
          sub.textContent = job.total ? (job.current + " / " + job.total + " 个节点") : "";
        } else if (job.phase === "zot-test") {
          sub.textContent = "hello-world 双架构镜像全节点拉取测试";
        } else if (job.phase === "np4-images") {
          sub.textContent = job.total
            ? "第 " + Math.max(job.current - 1, 1) + " / " + Math.max(job.total - 2, 1) + " 个镜像"
            : "";
        } else if (/索引|提交 Git/.test(msg)) {
          sub.textContent = job.total ? (job.current + " / " + job.total + " 个文件") : "";
        } else {
          sub.textContent = job.total
            ? fmtBytes(job.current) + " / " + fmtBytes(job.total)
            : "";
        }
      }
    }

    function watchJob(id, prefix) {
      let timer = setInterval(async () => {
        try {
          const job = await api("/api/jobs/" + id);
          // Every caller renders a meaningful initial state before polling. During a
          // multipart upload the server cannot update the job until it has parsed the
          // job_id field, so its default "pending" response must not overwrite the
          // browser's XMLHttpRequest upload progress on slow connections.
          if (job.phase === "pending" && !job.done) return;
          renderProgress(prefix, job);
          if (job.done) {
            clearInterval(timer);
            timer = null;
          }
        } catch {}
      }, 400);
      return () => { if (timer) clearInterval(timer); };
    }

    async function loadOrphans(boxId) {
      const box = document.getElementById(boxId);
      if (!box) return;
      try {
        const items = await api("/api/orphans");
        if (!items.length) {
          box.innerHTML = "";
          return;
        }
        box.innerHTML = `
          <div class="card">
            <h3>未完成的备份残留</h3>
            <p class="hint">首次备份或升级失败时，磁盘上可能留下没有项目/版本记录的目录，平时列表里看不到。可在此查看并清理。</p>
            <table>
              <thead><tr><th>编号</th><th>大小</th><th>时间</th><th>路径</th><th></th></tr></thead>
              <tbody>${items.map(o => `<tr>
                <td class="path">${esc(o.id)}</td>
                <td>${fmtBytes(o.bytes || 0)}</td>
                <td>${esc(fmtDateTime(o.modified))}</td>
                <td class="path">${esc(o.path)}</td>
                <td><button class="btn danger" data-orphan="${esc(o.id)}">清理</button></td>
              </tr>`).join("")}</tbody>
            </table>
          </div>`;
        for (const b of box.querySelectorAll("[data-orphan]")) {
          b.onclick = async () => {
            if (!(await confirmDialog("确定删除这份残留备份？", { danger: true }))) return;
            try {
              const oid = b.getAttribute("data-orphan") || "";
              await api("/api/orphans/" + encodeURIComponent(oid), { method: "DELETE" });
              await loadOrphans(boxId);
            } catch (e) {
              flash("err", e.message);
            }
          };
        }
      } catch (e) {
        box.innerHTML = `<div class="flash err">${esc(e.message)}</div>`;
      }
    }

    async function createProject() {
      const composeOnly = $("#f-compose-only") ? $("#f-compose-only").checked : false;
      const stopFirst = !composeOnly && ($("#f-stop") ? $("#f-stop").checked : true);
      if (!(await confirmDialog(
        (composeOnly
          ? "首次基线只备份 Compose 文件，不会复制或修改数据库及其他数据。\n"
          : "将全量备份该目录（包含 PostGIS 等数据库文件）。\n" +
            (stopFirst ? "会先停止 Compose，备份完成后再启动。\n" : "请先手动停止当前应用，否则备份可能失败或不完整。\n")) +
        "确定继续？"
      ))) return;
      const btn = $("#btn-create");
      let stop = () => {};
      try {
        btn.disabled = true;
        const job = await api("/api/jobs", { method: "POST" });
        showProgress("create-prog", true);
        renderProgress("create-prog", { message: "正在建立基线快照…", percent: 0, current: 0, total: 0 });
        stop = watchJob(job.id, "create-prog");
        const body = {
          name: $("#f-name").value,
          description: $("#f-desc").value,
          directory: $("#f-dir").value,
          job_id: job.id,
          stop_compose: stopFirst,
          compose_only: composeOnly,
        };
        const p = await api("/api/projects", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        await refreshProjects();
        location.hash = "#/p/" + p.id;
      } catch (e) {
        flash("err", e.message);
        loadOrphans("orphan-box");
      } finally {
        stop();
        btn.disabled = false;
      }
    }

      body.innerHTML = rows || `<tr><td colspan="5" class="empty">未报告运行中的服务</td></tr>`;
      bindComposeServiceButtons();
      const err = $("#compose-err");
      if (err) {

          err.hidden = false;
          err.textContent = compose.error;

          err.hidden = true;
          err.textContent = "";

        composePoll.timer = null;

      stopComposePoll();

    }

    async function refreshComposeStatus() {
      if (!state.current || state.busy || composePoll.inflight) return;
      composePoll.inflight = true;
      try {
        const compose = await api("/api/projects/" + state.current.id + "/compose");
        const prev = JSON.stringify({
          services: (state.compose && state.compose.services) || [],
          error: (state.compose && state.compose.error) || "",
          env_file: (state.compose && state.compose.env_file) || "",
        });
        const next = JSON.stringify({
          services: compose.services || [],
          error: compose.error || "",
          env_file: compose.env_file || "",
        });
        if (prev !== next) applyComposeStatus(compose);
        if (compose.available && state.meta && !(state.meta.docker && state.meta.docker.available)) {
          loadMeta();
        }
      } catch {}
      composePoll.inflight = false;
    }

      if (save) save.hidden = true;
      if (editor) editor.hidden = true;
      if (preview) { preview.hidden = false; preview.textContent = ""; }
    }

    async function loadProjectFiles() {
      if (!state.current || currentProjectTab() !== "files") return;
      const tree = $("#project-files-tree");
      const path = $("#project-files-path");
      const up = $("#project-files-up");
      if (!tree) return;
      if (path) path.textContent = projectFilesDisplayPath();
      if (up) up.disabled = !projectFiles.path;
      tree.innerHTML = `<div class="repo-list-empty">加载中…</div>`;
      try {
        const entries = await api(
          "/api/projects/" + state.current.id + "/files?path=" + encodeURIComponent(projectFiles.path)
        );
        projectFiles.loadedProject = state.current.id;
        renderProjectFiles(entries || []);
      } catch (e) {
        tree.innerHTML = `<div class="repo-list-empty bad">${esc(e.message)}</div>`;
      }
    }

    function renderProjectFiles(entries) {
      const tree = $("#project-files-tree");
      if (!tree) return;
      if (!entries.length) {
        tree.innerHTML = `<div class="repo-list-empty">空目录</div>`;
        return;
      }
      tree.innerHTML = entries.map(entry => `
        <button type="button" class="repo-item" data-project-path="${esc(entry.path)}" data-project-dir="${entry.is_dir ? "1" : "0"}">
          <span class="repo-item-icon">${entry.is_dir ? REPO_ICON_DIR : REPO_ICON_FILE}</span>
          <span class="repo-item-name">${esc(entry.name)}</span>
          <span class="repo-item-size">${entry.is_dir ? "" : fmtBytes(entry.size || 0)}</span>
        </button>`).join("");
      tree.querySelectorAll("[data-project-path]").forEach(button => {
        button.onclick = () => {
          const filePath = button.getAttribute("data-project-path") || "";
          if (button.getAttribute("data-project-dir") === "1") {
            projectFiles.path = filePath;
            resetProjectFileView();
            loadProjectFiles();
          } else {
            openProjectFile(filePath);
          }
        };
      });
    }

    function projectFileMode(path) {
      const name = String(path || "").toLowerCase();
      if (name.endsWith(".yaml") || name.endsWith(".yml")) return "ace/mode/yaml";
      if (name.endsWith(".ini") || name.endsWith(".conf") || name.endsWith(".cfg") || /(^|\/)\.env(\.|$)/.test(name)) {
        return "ace/mode/ini";
      }
      return "ace/mode/text";
    }

    async function mountProjectFileEditor(content, path) {
      await loadAce();
      destroyProjectFileEditor();
      const el = $("#project-file-editor");
      if (!el) return;
      el.hidden = false;
      const editor = window.ace.edit(el, {
        mode: projectFileMode(path),
        theme: aceThemeName(),
        useWorker: false,
        fontSize: 16,
        tabSize: 2,
        useSoftTabs: true,
        wrap: false,
        showPrintMargin: false,
        fadeFoldWidgets: true,
        scrollPastEnd: 0.4,
        fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace',
      });
      editor.setValue(content || "", -1);
      editor.session.getUndoManager().markClean();
      editor.commands.addCommand({
        name: "saveProjectFile",
        bindKey: { win: "Ctrl-S", mac: "Command-S" },
        exec: saveProjectFile,
      });
      editor.focus();
      projectFiles.editor = editor;
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => { if (projectFiles.editor) projectFiles.editor.resize(); });
        ro.observe(el);
        projectFiles.resizeObs = ro;
      }
      requestAnimationFrame(() => editor.resize());
    }

    async function openProjectFile(path) {
      if (!state.current) return;
      resetProjectFileView("/" + path + " · 加载中…");
      try {
        const file = await api(
          "/api/projects/" + state.current.id + "/files/content?path=" + encodeURIComponent(path)
        );
        projectFiles.selected = file.path;
        $("#project-file-title").textContent = "/" + file.path + " · " + fmtBytes(file.size || 0);
        $("#project-file-mode").textContent = file.editable ? "ACE 编辑" : "只读预览";
        $("#project-file-save").hidden = !file.editable;
        if (file.editable) {
          $("#project-file-preview").hidden = true;
          await mountProjectFileEditor(file.content, file.path);
        } else {
          $("#project-file-preview").textContent = file.content || "";
        }
      } catch (e) {
        $("#project-file-preview").textContent = "无法预览：" + e.message;
      }
    }

    function projectFilesUp() {
      if (!projectFiles.path) return;
      const parts = projectFiles.path.split("/").filter(Boolean);
      parts.pop();
      projectFiles.path = parts.join("/");
      resetProjectFileView();
      loadProjectFiles();
    }

    async function saveProjectFile() {
      if (!state.current || !projectFiles.selected || !projectFiles.editor) return;
      const button = $("#project-file-save");
      if (button) { button.disabled = true; button.textContent = "保存中…"; }
      try {
        const file = await api("/api/projects/" + state.current.id + "/files/content", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: projectFiles.selected, content: projectFiles.editor.getValue() }),
        });
        projectFiles.editor.session.getUndoManager().markClean();
        $("#project-file-title").textContent = "/" + file.path + " · " + fmtBytes(file.size || 0);
        if (button) button.textContent = "已保存";
        setTimeout(() => { if (button) button.textContent = "保存"; }, 1200);
      } catch (e) {
        flash("err", "保存文件失败：" + e.message);
        if (button) button.textContent = "保存";
      } finally {
        if (button) button.disabled = false;
      }
    }

    function dbApiBase() {
      const target = dbAdmin.k3s;
      return target ? "/api/k3s/db/" + encodeURIComponent(target.namespace) + "/" + encodeURIComponent(target.pod)
        : "/api/projects/" + state.current.id + "/db";
    }

    function dbContextAvailable() { return !!(dbAdmin.k3s || state.current); }

          <div class="flash err" id="db-err" hidden></div>

            <div class="field"><label>Schema</label><div class="combo" id="db-schema"></div></div>
            <div class="field db-filter-field"><label>表和视图</label><input id="db-filter" type="text" placeholder="过滤表 / 视图" autocomplete="off" spellcheck="false" /></div>
            <div class="field"><label>&nbsp;</label><div class="db-backup-actions"><button type="button" class="btn" id="btn-db-backup">备份数据库</button><button type="button" class="btn" id="btn-db-backups">备份历史</button><button type="button" class="btn" id="btn-db-auto-backup">自动备份</button><button type="button" class="btn" id="btn-db-sql">执行 SQL</button></div></div>

              <div class="db-pager" id="db-pager"><span class="hint">选择左侧表或视图后分页浏览</span></div>

    function renderK3sDatabase(parts) {
      const [namespace, pod, container] = parts;
      dbAdmin.k3s = { namespace, pod, container };
      state.current = null;
      renderList();
      const main = $("#main");
      main.classList.add("db-fill");
      main.innerHTML = `<div class="title-row"><div><h2>K3s 数据库管理</h2><div class="path">${esc(namespace)} / ${esc(pod)} / ${esc(container)}</div></div><a class="btn" href="#/cangling">返回苍灵应用</a></div><div id="flash" hidden></div><div class="card" id="panel-db">${dbPanelContent()}</div>`;
      $("#panel-db > .hint").textContent = "通过 Pod 连接 PostgreSQL，浏览数据库、表和视图，修改记录或执行 SQL。";
      ["btn-db-backup", "btn-db-backups", "btn-db-auto-backup"].forEach(id => $("#" + id).hidden = true);
      dbOnService(container);
    }

    function dbRunningServices() {
      if (dbAdmin.k3s) return [{ name: dbAdmin.k3s.container }];
      return ((state.compose && state.compose.services) || []).filter((s) => /run/i.test(s.state || ""));
    }

    const comboPop = { host: null, items: [], filtered: [], value: "", q: "", hi: 0, onPick: null, bound: false };

    function comboCaret() {
      return '<svg class="combo-caret" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg>';
    }

    function comboBind(host, opts) {
      if (!host) return;
      if (comboPop.host === host) comboClose();
      const items = opts.items || [];
      const value = opts.value || "";
      const placeholder = opts.placeholder || "请选择";
      host.classList.add("combo");
      const shown = value || placeholder;
      host.innerHTML = `<button type="button" class="combo-btn" aria-haspopup="listbox" aria-expanded="false"${items.length ? "" : " disabled"}><span class="combo-val${value ? "" : " ph"}">${esc(shown)}</span>${comboCaret()}</button>`;
      const btn = host.querySelector(".combo-btn");
      if (!btn) return;
      btn.onclick = (e) => {
        e.stopPropagation();
        if (!items.length) return;
        if (comboPop.host === host) { comboClose(); return; }
        comboOpen(host, { items, value, placeholder, onChange: opts.onChange });
      };
    }

    function comboEnsureListeners() {
      if (comboPop.bound) return;
      comboPop.bound = true;
      document.addEventListener("mousedown", (e) => {
        const pop = $("#combo-pop");
        if (!pop || pop.hidden) return;
        if (pop.contains(e.target) || (comboPop.host && comboPop.host.contains(e.target))) return;
        comboClose();
      });
      window.addEventListener("resize", () => { if (comboPop.host) comboPlace(comboPop.host); });
      window.addEventListener("scroll", (e) => {
        if (!comboPop.host) return;
        const pop = $("#combo-pop");
        if (pop && (pop === e.target || pop.contains(e.target))) return;
        comboClose();
      }, true);
    }

    function comboOpen(host, opts) {
      comboEnsureListeners();
      const pop = $("#combo-pop");
      const search = $("#combo-search");
      if (!pop || !search) return;
      comboPop.host = host;
      comboPop.items = opts.items || [];
      comboPop.value = opts.value || "";
      comboPop.q = "";
      comboPop.onPick = opts.onChange || null;
      const btn = host.querySelector(".combo-btn");
      if (btn) {
        btn.classList.add("open");
        btn.setAttribute("aria-expanded", "true");
      }
      search.value = "";
      pop.hidden = false;
      comboRenderList();
      comboPlace(host);
      search.focus();
      search.oninput = () => {
        comboPop.q = search.value;
        comboRenderList();
      };
      search.onkeydown = (e) => {
        if (e.key === "Escape") { e.preventDefault(); comboClose(); return; }
        if (e.key === "ArrowDown") { e.preventDefault(); comboMove(1); return; }
        if (e.key === "ArrowUp") { e.preventDefault(); comboMove(-1); return; }
        if (e.key === "Enter") {
          e.preventDefault();
          const items = comboPop.filtered || [];
          if (items[comboPop.hi] != null) comboPick(items[comboPop.hi]);
        }
      };
    }

    function comboFiltered() {
      const q = (comboPop.q || "").trim().toLowerCase();
      const items = comboPop.items || [];
      if (!q) return items.slice();
      return items.filter((n) => String(n).toLowerCase().includes(q));
    }

    function comboRenderList() {
      const list = $("#combo-list");
      if (!list) return;
      const items = comboFiltered();
      comboPop.filtered = items;
      const cur = items.indexOf(comboPop.value);
      comboPop.hi = cur >= 0 ? cur : 0;
      if (!items.length) {
        list.innerHTML = `<div class="combo-empty">${(comboPop.items || []).length ? "没有匹配项" : "没有可选项"}</div>`;
        return;
      }
      list.innerHTML = items.map((n, i) => {
        const sel = n === comboPop.value ? " sel" : "";
        const hi = i === comboPop.hi ? " active" : "";
        return `<button type="button" class="combo-opt${sel}${hi}" data-v="${esc(n)}" role="option">${esc(n)}</button>`;
      }).join("");
      for (const b of list.querySelectorAll("[data-v]")) {
        b.onmouseenter = () => {
          const opts = [...list.querySelectorAll(".combo-opt")];
          comboPop.hi = opts.indexOf(b);
          opts.forEach((o, idx) => o.classList.toggle("active", idx === comboPop.hi));
        };
        b.onclick = () => comboPick(b.getAttribute("data-v"));
      }
      const act = list.querySelector(".combo-opt.active");
      if (act) act.scrollIntoView({ block: "nearest" });
    }

    function comboMove(delta) {
      const opts = [...document.querySelectorAll("#combo-list .combo-opt")];
      if (!opts.length) return;
      comboPop.hi = (comboPop.hi + delta + opts.length) % opts.length;
      opts.forEach((o, idx) => o.classList.toggle("active", idx === comboPop.hi));
      opts[comboPop.hi].scrollIntoView({ block: "nearest" });
    }

    function comboPick(v) {
      const onPick = comboPop.onPick;
      comboClose();
      if (onPick) onPick(v);
    }

    function comboClose() {
      const pop = $("#combo-pop");
      if (pop) pop.hidden = true;
      if (comboPop.host) {
        const btn = comboPop.host.querySelector(".combo-btn");
        if (btn) {
          btn.classList.remove("open");
          btn.setAttribute("aria-expanded", "false");
        }
      }
      comboPop.host = null;
      comboPop.onPick = null;
    }

    function comboPlace(host) {
      const pop = $("#combo-pop");
      if (!pop || !host) return;
      const r = host.getBoundingClientRect();
      const width = Math.max(r.width, 200);
      const left = Math.max(8, Math.min(r.left, window.innerWidth - width - 8));
      pop.style.width = width + "px";
      pop.style.left = left + "px";
      const spaceBelow = window.innerHeight - r.bottom - 8;
      const spaceAbove = r.top - 8;
      const maxH = Math.min(360, window.innerHeight * 0.6);
      if (spaceBelow < 140 && spaceAbove > spaceBelow) {
        pop.style.top = "auto";
        pop.style.bottom = (window.innerHeight - r.top + 4) + "px";
        pop.style.maxHeight = Math.max(120, Math.min(maxH, spaceAbove)) + "px";
      } else {
        pop.style.bottom = "auto";
        pop.style.top = (r.bottom + 4) + "px";
        pop.style.maxHeight = Math.max(120, Math.min(maxH, spaceBelow)) + "px";
      }
    }

    function dbShowErr(msg) {
      dbAdmin.error = msg || "";
      const box = $("#db-err");
      if (!box) return;
      if (!msg) {
        box.hidden = true;
        box.textContent = "";
        return;
      }
      box.hidden = false;
      box.textContent = msg;
    }

    function bindDbPanel() {
      const names = dbRunningServices().map((s) => s.name).filter(Boolean);
      comboBind($("#db-service"), {
        items: names,
        value: dbAdmin.service,
        placeholder: names.length ? "请选择容器" : "没有运行中的容器",
        onChange: dbOnService,
      });
      comboBind($("#db-engine"), {
        items: ["postgres"],
        value: dbAdmin.engine || "postgres",
        placeholder: "请选择类型",
        onChange: (v) => { dbAdmin.engine = v; },
      });
      comboBind($("#db-database"), {
        items: dbAdmin.databases,
        value: dbAdmin.database,
        placeholder: "请选择数据库",
        onChange: dbOnDatabase,
      });
      comboBind($("#db-schema"), {
        items: dbAdmin.schemas,
        value: dbAdmin.schema,
        placeholder: "请选择 schema",
        onChange: dbOnSchema,
      });
      const sqlBtn = $("#btn-db-sql");
      if (sqlBtn) sqlBtn.onclick = openDbSqlDialog;
      const backupBtn = $("#btn-db-backup");
      if (backupBtn) backupBtn.onclick = dbCreateBackup;
      const backupsBtn = $("#btn-db-backups");
      if (backupsBtn) backupsBtn.onclick = openDbBackups;
      const autoBackupBtn = $("#btn-db-auto-backup");
      if (autoBackupBtn) autoBackupBtn.onclick = openDbBackupSchedule;
      const filter = $("#db-filter");
      if (filter) {
        if (filter.value !== (dbAdmin.filter || "")) filter.value = dbAdmin.filter || "";
        filter.oninput = () => {
          dbAdmin.filter = filter.value;
          dbRenderObjects();
        };
      }
      dbRenderObjects();
      dbRenderRows();
      dbShowErr(dbAdmin.error);
    }

    function dbEnsureLoaded() {
      bindDbPanel();
      if (!dbAdmin.service) {
        const names = dbRunningServices().map((s) => s.name);
        const guess = names.find((n) => /postgis|postgres|pg/i.test(n)) || names[0] || "";
        if (guess) dbOnService(guess);
      }
    }

    function dbQs(extra) {
      const q = new URLSearchParams();
      q.set("service", dbAdmin.service);
      q.set("engine", dbAdmin.engine || "postgres");
      if (dbAdmin.database) q.set("database", dbAdmin.database);
      if (dbAdmin.schema) q.set("schema", dbAdmin.schema);
      if (extra) for (const [k, v] of Object.entries(extra)) if (v != null && v !== "") q.set(k, v);
      return q.toString();
    }

    async function dbOnService(name) {
      dbAdmin.service = name || "";
      dbAdmin.database = "";
      dbAdmin.schema = "";
      dbAdmin.databases = [];
      dbAdmin.schemas = [];
      dbAdmin.objects = [];
      dbAdmin.selected = null;
      dbAdmin.rows = [];
      dbAdmin.columns = [];
      dbAdmin.pk = [];
      dbAdmin.rowIndex = null;
      dbAdmin.total = 0;
      dbAdmin.sqlResult = null;
      dbShowErr("");
      bindDbPanel();
      if (!dbAdmin.service) return;
      try {
        dbAdmin.busy = true;
        const meta = await api(dbApiBase() + "/meta?" + dbQs());
        if (!(meta.engines || []).includes("postgres")) {
          dbShowErr("该容器未检测到 PostgreSQL / psql");
          return;
        }
        const dbs = await api(dbApiBase() + "/databases?" + dbQs());
        dbAdmin.databases = dbs.items || [];
        const def = meta.default_database && dbAdmin.databases.includes(meta.default_database)
          ? meta.default_database
          : dbAdmin.databases[0] || "";
        bindDbPanel();
        if (def) await dbOnDatabase(def);
      } catch (e) {
        dbShowErr(e.message);
        bindDbPanel();
      } finally {
        dbAdmin.busy = false;
      }
    }

    async function dbOnDatabase(name) {
      dbAdmin.database = name || "";
      dbAdmin.schema = "";
      dbAdmin.schemas = [];
      dbAdmin.objects = [];
      dbAdmin.selected = null;
      dbAdmin.rows = [];
      dbAdmin.columns = [];
      dbAdmin.pk = [];
      dbAdmin.rowIndex = null;
      dbAdmin.total = 0;
      bindDbPanel();
      if (!dbAdmin.database) return;
      try {
        const data = await api(dbApiBase() + "/schemas?" + dbQs());
        dbAdmin.schemas = data.items || [];
        const def = dbAdmin.schemas.includes("public") ? "public" : (dbAdmin.schemas[0] || "");
        bindDbPanel();
        if (def) await dbOnSchema(def);
      } catch (e) {
        dbShowErr(e.message);
        bindDbPanel();
      }
    }

    async function dbOnSchema(name) {
      dbAdmin.schema = name || "";
      dbAdmin.objects = [];
      dbAdmin.selected = null;
      dbAdmin.rows = [];
      dbAdmin.columns = [];
      dbAdmin.pk = [];
      dbAdmin.rowIndex = null;
      dbAdmin.total = 0;
      bindDbPanel();
      if (!dbAdmin.schema) return;
      try {
        const data = await api(dbApiBase() + "/objects?" + dbQs());
        dbAdmin.objects = data.items || [];
        dbShowErr("");
      } catch (e) {
        dbShowErr(e.message);
      }
      bindDbPanel();
    }

    function dbObjIcon(kind) {
      if (kind === "view") {
        return '<svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.83.88 9.576.43 8.898a1.62 1.62 0 0 1 0-1.798c.45-.677 1.367-1.931 2.637-3.022C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.12.12 0 0 0 0 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 0 0 0-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.825.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717ZM8 10a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 10Z"/></svg>';

      return '<svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25ZM6.5 6.5v8h7.75a.25.25 0 0 0 .25-.25V6.5Zm8-1.5V1.75a.25.25 0 0 0-.25-.25H6.5V5Zm-13 1.5v7.75c0 .138.112.25.25.25H5v-8ZM5 5V1.5H1.75a.25.25 0 0 0-.25.25V5Z"/></svg>';
