<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>系统更新</title>
  <script>
    (function () {
      var key = "cangling-update-theme";
      var saved = localStorage.getItem(key);
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    /* Primer / GitHub color system */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117;
      --bg-header: #010409;
      --bg-2: #161b22;
      --bg-3: #212830;
      --bg-input: #0d1117;
      --bg-drop: #151b23;
      --bg-drop-over: #388bfd1a;
      --bg-active: #388bfd1a;
      --line: #3d444d;
      --line-muted: #212830;
      --line-hover: #656c76;
      --text: #f0f6fc;
      --muted: #9198a1;
      --subtle: #656c76;
      --on-emphasis: #ffffff;
      --accent: #4493f8;
      --accent-emphasis: #1f6feb;
      --success: #3fb950;
      --success-emphasis: #238636;
      --success-hover: #2ea043;
      --danger: #f85149;
      --danger-emphasis: #da3633;
      --flash-err-bg: #f851491a;
      --flash-err-text: #f85149;
      --flash-err-line: #f8514966;
      --flash-ok-bg: #2ea04326;
      --flash-ok-text: #3fb950;
      --flash-ok-line: #2ea04366;
      --danger-bg: #f851491a;
      --danger-text: #f85149;
      --danger-line: #f8514966;
      --log-bg: #010409;
      --log-text: #f0f6fc;
      --progress-bg: #212830;
      --shadow: 0 0 0 1px #3d444d;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --bg-header: #f6f8fa;
      --bg-2: #ffffff;
      --bg-3: #f6f8fa;
      --bg-input: #ffffff;
      --bg-drop: #f6f8fa;
      --bg-drop-over: #ddf4ff;
      --bg-active: #ddf4ff;
      --line: #d1d9e0;
      --line-muted: #d8dee4;
      --line-hover: #8c959f;
      --text: #1f2328;
      --muted: #59636e;
      --subtle: #818b98;
      --on-emphasis: #ffffff;
      --accent: #0969da;
      --accent-emphasis: #0969da;
      --success: #1a7f37;
      --success-emphasis: #1f883d;
      --success-hover: #1c8139;
      --danger: #d1242f;
      --danger-emphasis: #cf222e;
      --flash-err-bg: #ffebe9;
      --flash-err-text: #d1242f;
      --flash-err-line: #ff818266;
      --flash-ok-bg: #dafbe1;
      --flash-ok-text: #1a7f37;
      --flash-ok-line: #4ac26b66;
      --danger-bg: #ffebe9;
      --danger-text: #d1242f;
      --danger-line: #ff818266;
      --log-bg: #f6f8fa;
      --log-text: #1f2328;
      --progress-bg: #d1d9e0;
      --shadow: 0 1px 0 rgba(31, 35, 40, 0.04);
    }
    * { box-sizing: border-box; border-radius: 4px; }
    html { font-size: 16px; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Noto Sans CJK SC", Helvetica, Arial, sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    .app { display: grid; grid-template-rows: 64px 1fr; height: 100%; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--bg-header);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 28px; height: 28px; flex: 0 0 auto;
      background: var(--success-emphasis);
    }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; font-weight: 650; }
    .brand small { display: block; color: var(--muted); margin-top: 1px; }
    .header-right { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .meta { color: var(--muted); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; display: flex; gap: 16px; flex-wrap: wrap; justify-content: flex-end; }
    .meta b { color: var(--text); font-weight: 600; }
    .ok { color: var(--success); }
    .bad { color: var(--danger); }
    .shell { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
    aside {
      border-right: 1px solid var(--line); background: var(--bg-2);
      display: flex; flex-direction: column; min-height: 0;
    }
    .aside-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; }
    .aside-head h2 { margin: 0; color: var(--muted); font-size: 16px; font-weight: 600; }
    .plist { overflow: auto; padding: 6px 10px 18px; }
    .pitem {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
      color: var(--text); padding: 10px 12px; margin-bottom: 6px;
    }
    .pitem:hover { background: var(--bg-3); }
    .pitem.active { background: var(--bg-active); border-color: var(--accent-emphasis); }
    .pitem .n { font-weight: 600; display: block; }
    .pitem .d { color: var(--muted); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { min-width: 0; overflow: auto; padding: 22px 26px 40px; }
    .btn {
      border: 1px solid var(--line); background: var(--bg-3); color: var(--text);
      padding: 7px 12px;
    }
    .btn:hover { background: var(--bg-2); border-color: var(--line-hover); }
    .btn.primary { background: var(--success-emphasis); color: var(--on-emphasis); border-color: var(--success-emphasis); font-weight: 600; }
    .btn.primary:hover { background: var(--success-hover); border-color: var(--success-hover); }
    .btn.danger { color: var(--danger-text); border-color: var(--danger-line); background: var(--danger-bg); }
    .btn.danger:hover { background: var(--danger-emphasis); color: var(--on-emphasis); border-color: var(--danger-emphasis); }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .card {
      background: var(--bg-2); border: 1px solid var(--line);
      padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 12px; color: var(--muted); font-size: 16px; font-weight: 600; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    label { display: block; color: var(--muted); margin: 0 0 6px; }
    input[type=text], input[type=password], textarea {
      width: 100%; background: var(--bg-input); color: var(--text); border: 1px solid var(--line);
      padding: 9px 11px; outline: none;
    }
    input[type=text]:focus, input[type=password]:focus, textarea:focus { border-color: var(--accent-emphasis); box-shadow: 0 0 0 3px var(--bg-active); }
    textarea { min-height: 72px; resize: vertical; }
    .field { margin-bottom: 12px; }
    .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .title-row h2 { margin: 0 0 4px; font-size: 26px; font-weight: 650; }
    .path { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); padding: 3px 9px;
      color: var(--muted); background: var(--bg-3);
    }
    .pill.latest { color: var(--on-emphasis); background: var(--success-emphasis); border-color: var(--success-emphasis); font-weight: 600; }
    .drop {
      border: 1px dashed var(--line); padding: 28px 16px; text-align: center;
      color: var(--muted); background: var(--bg-drop);
    }
    .drop.over { border-color: var(--accent-emphasis); color: var(--text); background: var(--bg-drop-over); }
    .filelist { margin: 12px 0 0; padding: 0; list-style: none; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .filelist li { padding: 4px 0; color: var(--text); }
    .progress-wrap { margin-top: 14px; }
    .progress-wrap[hidden] { display: none !important; }
    .progress-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .progress-sub { color: var(--muted); margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
    .progress { height: 10px; background: var(--progress-bg); overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 0; background: var(--success-emphasis); transition: width 0.15s linear; }
    .progress.unknown > span { width: 32%; animation: prog-slide 1.1s ease-in-out infinite; }
    @keyframes prog-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .empty { color: var(--muted); padding: 28px 8px; text-align: center; }
    .flash { margin: 0 0 14px; padding: 10px 12px; }
    .flash.err { background: var(--flash-err-bg); color: var(--flash-err-text); border: 1px solid var(--flash-err-line); }
    .flash.ok { background: var(--flash-ok-bg); color: var(--flash-ok-text); border: 1px solid var(--flash-ok-line); }
    pre.logs {
      margin: 0; max-height: 280px; overflow: auto; background: var(--log-bg);
      padding: 12px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; color: var(--log-text);
      border: 1px solid var(--line);
    }
    .hint { color: var(--muted); line-height: 1.5; }
    .gate {
      min-height: 100%; display: grid; place-items: center; padding: 24px;
    }
    .gate .card { width: min(420px, 100%); }
    .gate[hidden], .app[hidden] { display: none !important; }
    #who { color: var(--text); }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 240px; }
    }
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="card">
      <h3 id="gate-title">登录</h3>
      <p class="hint" id="gate-hint">2 小时无操作将自动退出。忘记密码请在主机执行 <code>cangling-update reset-password</code>。</p>
      <div id="gate-flash" hidden></div>
      <div class="field"><label>用户名</label><input id="gate-user" type="text" autocomplete="username" /></div>
      <div class="field"><label>密码</label><input id="gate-pass" type="password" autocomplete="current-password" /></div>
      <div class="field" id="gate-pass2-wrap" hidden>
        <label>确认密码</label><input id="gate-pass2" type="password" autocomplete="new-password" />
      </div>
      <div class="row">
        <button class="btn primary" id="gate-submit" type="button">登录</button>
        <button type="button" class="btn" id="gate-theme">浅色</button>
      </div>
    </div>
  </div>
  <div class="app" id="app" hidden>
    <header>
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>系统更新</h1>
          <small>主机 Docker Compose 升级台</small>
        </div>
      </div>
      <div class="header-right">
        <div class="meta" id="meta">加载中…</div>
        <span id="who"></span>
        <button type="button" class="btn" id="btn-logout">退出</button>
        <button type="button" class="btn" id="theme-toggle" aria-label="切换深色或浅色主题">浅色</button>
      </div>
    </header>
    <div class="shell">
      <aside>
        <div class="aside-head">
          <h2>项目</h2>
          <button class="btn primary" id="btn-new">新建</button>
        </div>
        <div class="plist" id="plist"><div class="empty">暂无项目</div></div>
      </aside>
      <main id="main"></main>
    </div>
  </div>
  <script>
    const state = { meta: null, projects: [], current: null, versions: [], compose: null, files: [], busy: null, user: null, needsSetup: false };
    const KIND = { baseline: "基线", update: "升级", "pre-rollback": "回滚前快照" };
    const COMPOSE = { plugin: "插件", standalone: "独立程序", missing: "未安装" };
    const IDLE_MS = 2 * 60 * 60 * 1000;
    let lastActivity = Date.now();

    const $ = (sel, el = document) => el.querySelector(sel);
    const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function touchActivity() { lastActivity = Date.now(); }
    ["click", "keydown", "mousemove", "scroll"].forEach((ev) => {
      window.addEventListener(ev, touchActivity, { passive: true });
    });
    setInterval(() => {
      if (state.user && Date.now() - lastActivity >= IDLE_MS) {
        logout("已超过 2 小时无操作，请重新登录");
      }
    }, 15000);

    async function api(path, opts = {}) {
      const res = await fetch(path, { credentials: "same-origin", ...opts });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
      if (res.status === 401) {
        showGate((data && data.error) || "请先登录或登录已过期");
        throw new Error((data && data.error) || "请先登录或登录已过期");
      }
      if (!res.ok) throw new Error((data && data.error) || res.statusText);
      touchActivity();
      return data;
    }

    function flash(kind, msg) {
      const box = $("#flash");
      if (!box) return;
      box.className = "flash " + kind;
      box.textContent = msg;
      box.hidden = false;
    }

    function gateFlash(kind, msg) {
      const box = $("#gate-flash");
      box.className = "flash " + kind;
      box.textContent = msg;
      box.hidden = !msg;
    }

    function showGate(message) {
      state.user = null;
      $("#app").hidden = true;
      $("#gate").hidden = false;
      $("#who").textContent = "";
      renderGate();
      if (message) gateFlash("err", message);
    }

    function renderGate() {
      const setup = state.needsSetup;
      $("#gate-title").textContent = setup ? "初始化管理员" : "登录";
      $("#gate-hint").innerHTML = setup
        ? "首次使用请设置管理员账号。之后 2 小时无操作将自动退出。"
        : "2 小时无操作将自动退出。忘记密码请在主机执行 <code>cangling-update reset-password</code>。";
      $("#gate-pass2-wrap").hidden = !setup;
      $("#gate-submit").textContent = setup ? "创建并进入" : "登录";
      $("#gate-pass").autocomplete = setup ? "new-password" : "current-password";
    }

    async function enterApp(user) {
      state.user = user;
      state.needsSetup = false;
      $("#gate").hidden = true;
      $("#app").hidden = false;
      $("#who").textContent = user.username;
      touchActivity();
      try {
        state.meta = await api("/api/meta");
        const m = state.meta;
        const dockerOk = m.docker.available;
        $("#meta").innerHTML =
          `<span>${esc(m.os)} / <b>${esc(m.arch)}</b></span>` +
          `<span>docker <b class="${dockerOk ? "ok" : "bad"}">${dockerOk ? esc(m.docker.version || "正常") : "未检测到"}</b> · compose ${esc(COMPOSE[m.docker.compose] || m.docker.compose)}</span>` +
          `<span>数据库 <b>${esc(m.db_path)}</b></span>`;
      } catch (e) {
        $("#meta").innerHTML = `<span class="bad">${esc(e.message)}</span>`;
      }
      await refreshProjects();
      route();
    }

    async function submitGate() {
      const username = $("#gate-user").value.trim();
      const password = $("#gate-pass").value;
      try {
        if (state.needsSetup) {
          const again = $("#gate-pass2").value;
          if (password !== again) throw new Error("两次输入的密码不一致");
          const user = await api("/api/auth/setup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          await enterApp(user);
        } else {
          const user = await api("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          await enterApp(user);
        }
      } catch (e) {
        gateFlash("err", e.message);
      }
    }

    async function logout(message) {
      try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } catch {}
      state.user = null;
      state.projects = [];
      state.current = null;
      showGate(message || "已退出");
    }

    async function boot() {
      try {
        const st = await fetch("/api/auth/status", { credentials: "same-origin" }).then((r) => r.json());
        state.needsSetup = !!st.needs_setup;
        if (st.user) {
          await enterApp(st.user);
          return;
        }
      } catch {}
      showGate();
    }

    async function refreshProjects() {
      state.projects = await api("/api/projects");
      renderList();
    }

    function renderList() {
      const root = $("#plist");
      if (!state.projects.length) {
        root.innerHTML = `<div class="empty">暂无项目</div>`;
        return;
      }
      root.innerHTML = "";
      for (const p of state.projects) {
        const b = document.createElement("button");
        b.className = "pitem" + (state.current && state.current.id === p.id ? " active" : "");
        b.innerHTML = `<span class="n">${esc(p.name)}</span><span class="d">${esc(p.directory)}</span>`;
        b.onclick = () => { location.hash = "#/p/" + p.id; };
        root.appendChild(b);
      }
    }

    function route() {
      const hash = location.hash || "#/";
      if (hash === "#/new") return renderNew();
      const m = hash.match(/^#\/p\/([^/]+)$/);
      if (m) return openProject(m[1]);
      renderHome();
    }

    function renderHome() {
      state.current = null;
      renderList();
      $("#main").innerHTML = `
        <div class="title-row">
          <div>
            <h2>主机升级</h2>
            <div class="path">绑定 Docker Compose 目录，导入镜像包或 JAR，并保留可回滚版本。</div>
          </div>
        </div>
        <div class="card">
          <h3>使用说明</h3>
          <p class="hint">
            1. 新建项目，指向本机上已存在且包含 compose.yaml / docker-compose.yml 的绝对路径目录。<br/>
            2. 上传 <code>.tar.gz</code> 镜像包和/或 <code>.jar</code>。镜像会 <code>docker load</code> 并打成 <code>:latest</code>；JAR 按文件名替换 compose 里挂载的文件（如 <code>./jars/cis-server-1.0.0.jar</code>），并强制重建对应服务。<br/>
            3. 可在版本列表中恢复任意历史快照，同时会重新加载该版本保存的镜像包。目录备份为 tar.gz，保留原文件权限和属主。
          </p>
          <button class="btn primary" onclick="location.hash='#/new'">新建项目</button>
        </div>`;
    }

    function renderNew() {
      state.current = null;
      renderList();
      $("#main").innerHTML = `
        <div class="title-row"><div><h2>新建项目</h2><div class="path">绑定本机上的 Compose 应用目录</div></div></div>
        <div id="flash" hidden></div>
        <div class="card">
          <div class="field"><label>名称</label><input id="f-name" type="text" placeholder="边缘网关" /></div>
          <div class="field"><label>说明</label><textarea id="f-desc" placeholder="选填"></textarea></div>
          <div class="field"><label>主机目录（绝对路径）</label><input id="f-dir" type="text" placeholder="/opt/apps/gateway" /></div>
          <div class="hint" id="dir-hint">目录必须已存在于本机，并且包含 Compose 文件。</div>
          <div class="progress-wrap" id="create-prog" hidden>
            <div class="progress-meta"><span id="create-prog-msg">准备中</span><span id="create-prog-pct">0%</span></div>
            <div class="progress" id="create-prog-bar"><span></span></div>
            <div class="progress-sub" id="create-prog-sub"></div>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="btn" id="btn-check">检查目录</button>
            <button class="btn primary" id="btn-create">创建</button>
          </div>
        </div>`;
      $("#btn-check").onclick = checkDir;
      $("#btn-create").onclick = createProject;
    }

    async function checkDir() {
      try {
        const directory = $("#f-dir").value.trim();
        const r = await api("/api/validate-directory", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ directory }),
        });
        $("#dir-hint").innerHTML = r.ok
          ? `已找到 <b>${esc(r.compose_file)}</b> · 镜像：${r.images.length ? r.images.map(esc).join(", ") : "（未声明）"} · JAR：${r.jar_mounts && r.jar_mounts.length ? r.jar_mounts.map(j => esc(j.basename)).join(", ") : "（无）"}`
          : `<span class="bad">${esc(r.warning || "不是 Compose 目录")}</span>`;
      } catch (e) {
        $("#dir-hint").innerHTML = `<span class="bad">${esc(e.message)}</span>`;
      }
    }

    function fmtBytes(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + " B";
      if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
      if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
      return (n / 1073741824).toFixed(2) + " GB";
    }

    function showProgress(prefix, on) {
      const wrap = document.getElementById(prefix);
      if (wrap) wrap.hidden = !on;
    }

    function renderProgress(prefix, job) {
      const wrap = document.getElementById(prefix);
      if (!wrap) return;
      wrap.hidden = false;
      const msg = document.getElementById(prefix + "-msg");
      const pct = document.getElementById(prefix + "-pct");
      const bar = document.querySelector("#" + prefix + "-bar");
      const fill = bar ? bar.querySelector("span") : null;
      const sub = document.getElementById(prefix + "-sub");
      const unknown = !job.total;
      if (bar) bar.classList.toggle("unknown", unknown && !job.done);
      if (msg) msg.textContent = job.message || job.phase || "处理中";
      if (pct) pct.textContent = unknown && !job.done ? "…" : (job.percent || 0) + "%";
      if (fill && !unknown) fill.style.width = (job.percent || 0) + "%";
      if (sub) {
        sub.textContent = job.total
          ? fmtBytes(job.current) + " / " + fmtBytes(job.total)
          : "";
      }
    }

    function watchJob(id, prefix) {
      let timer = setInterval(async () => {
        try {
          const job = await api("/api/jobs/" + id);
          renderProgress(prefix, job);
          if (job.done) {
            clearInterval(timer);
            timer = null;
          }
        } catch {}
      }, 400);
      return () => { if (timer) clearInterval(timer); };
    }

    async function createProject() {
      const btn = $("#btn-create");
      let stop = () => {};
      try {
        btn.disabled = true;
        const job = await api("/api/jobs", { method: "POST" });
        showProgress("create-prog", true);
        renderProgress("create-prog", { message: "正在建立基线快照…", percent: 0, current: 0, total: 0 });
        stop = watchJob(job.id, "create-prog");
        const body = {
          name: $("#f-name").value,
          description: $("#f-desc").value,
          directory: $("#f-dir").value,
          job_id: job.id,
        };
        const p = await api("/api/projects", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        await refreshProjects();
        location.hash = "#/p/" + p.id;
      } catch (e) {
        flash("err", e.message);
      } finally {
        stop();
        btn.disabled = false;
      }
    }

    async function openProject(id) {
      try {
        state.current = await api("/api/projects/" + id);
        const [versions, compose] = await Promise.all([
          api("/api/projects/" + id + "/versions"),
          api("/api/projects/" + id + "/compose").catch(e => ({ error: e.message, services: [], images: [] })),
        ]);
        state.versions = versions;
        state.compose = compose;
        state.files = [];
        renderList();
        renderProject();
      } catch (e) {
        $("#main").innerHTML = `<div class="flash err">${esc(e.message)}</div>`;
      }
    }

    function renderProject() {
      const p = state.current;
      const c = state.compose || {};
      const services = (c.services || []).map(s =>
        `<tr><td>${esc(s.name)}</td><td>${esc(s.image)}</td><td>${esc(s.state)}</td><td>${esc(s.status)}</td></tr>`
      ).join("");
      const versions = state.versions.map(v => `
        <tr>
          <td><span class="pill ${v.is_current ? "latest" : ""}">${esc(v.label)}${v.is_current ? " 当前" : ""}</span></td>
          <td>${esc(KIND[v.kind] || v.kind)}</td>
          <td>${esc(v.note || "—")}</td>
          <td>${[
            ...(v.images || []).map(i => esc(i.file) + (i.latest_tags && i.latest_tags.length ? " → " + i.latest_tags.map(esc).join(", ") : "")),
            ...(v.jars || []).map(j => esc(j.file) + (j.services && j.services.length ? " → " + j.services.map(esc).join(", ") : " → " + esc(j.dest || "")))
          ].join("<br/>") || "—"}</td>
          <td>${esc((v.created_at || "").replace("T", " ").slice(0, 19))}</td>
          <td>${v.is_current ? "" : `<button class="btn" data-restore="${esc(v.id)}" ${state.busy ? "disabled" : ""}>${state.busy === "restore" ? "恢复中…" : "恢复"}</button>`}</td>
        </tr>`).join("");

      $("#main").innerHTML = `
        <div class="title-row">
          <div>
            <h2>${esc(p.name)}</h2>
            <div class="path">${esc(p.directory)} · ${esc(c.compose_file || "未找到 Compose 文件")}</div>
          </div>
          <div class="row">
            <span class="pill">${p.current_version_no ? "v" + p.current_version_no : "无版本"} 当前</span>
            <button class="btn" id="btn-refresh" ${state.busy ? "disabled" : ""}>刷新</button>
            <button class="btn danger" id="btn-del" ${state.busy ? "disabled" : ""}>删除项目</button>
          </div>
        </div>
        <div id="flash" hidden></div>
        <div class="progress-wrap" id="op-prog" hidden>
          <div class="progress-meta"><span id="op-prog-msg">准备中</span><span id="op-prog-pct">0%</span></div>
          <div class="progress" id="op-prog-bar"><span></span></div>
          <div class="progress-sub" id="op-prog-sub"></div>
        </div>
        <div class="card">
          <h3>导入镜像 / JAR / 发布新版本</h3>
          <p class="hint">可上传 <code>docker save</code> 镜像包，或直接上传 <code>.jar</code>（文件名需与 compose 挂载一致，例如 <code>cis-server-1.0.0.jar</code>）。系统先备份目录；JAR 会覆盖挂载路径并强制重建对应服务。</p>
          <div class="drop" id="drop">将 .tar.gz / .tgz / .tar / .jar 拖到此处，或点击选择
            <input id="file" type="file" accept=".tar,.tar.gz,.tgz,.jar,application/gzip,application/java-archive" multiple hidden />
          </div>
          <ul class="filelist" id="filelist"></ul>
          <div class="field" style="margin-top:12px"><label>备注</label><input id="note" type="text" placeholder="本次升级改了什么" /></div>
          <label class="hint"><input type="checkbox" id="restart" checked /> 导入成功后重启 Compose（JAR 会强制重建对应服务）</label>
          <div class="progress-wrap" id="prog" hidden>
            <div class="progress-meta"><span id="prog-msg">准备中</span><span id="prog-pct">0%</span></div>
            <div class="progress" id="prog-bar"><span></span></div>
            <div class="progress-sub" id="prog-sub"></div>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="btn primary" id="btn-update" ${state.busy ? "disabled" : ""}>导入并发布为最新版</button>
            <button class="btn" id="btn-snap" ${state.busy ? "disabled" : ""}>仅备份当前目录</button>
          </div>
        </div>
        <div class="card">
          <h3>Compose</h3>
          <div class="row" style="margin-bottom:12px">
            <button class="btn" id="btn-up" ${state.busy ? "disabled" : ""}>启动</button>
            <button class="btn" id="btn-restart" ${state.busy ? "disabled" : ""}>重启</button>
            <button class="btn" id="btn-down" ${state.busy ? "disabled" : ""}>停止</button>
            <button class="btn" id="btn-logs" ${state.busy ? "disabled" : ""}>日志</button>
          </div>
          ${c.error ? `<div class="flash err">${esc(c.error)}</div>` : ""}
          <div class="hint" style="margin-bottom:8px">声明镜像：${c.images && c.images.length ? c.images.map(esc).join(", ") : "—"}</div>
          <div class="hint" style="margin-bottom:8px">JAR 挂载：${c.jar_mounts && c.jar_mounts.length ? c.jar_mounts.map(j => esc(j.service) + " ← " + esc(j.host_path)).join("；") : "—"}</div>
          <table>
            <thead><tr><th>服务</th><th>镜像</th><th>状态</th><th>详情</th></tr></thead>
            <tbody>${services || `<tr><td colspan="4" class="empty">未报告运行中的服务</td></tr>`}</tbody>
          </table>
          <pre class="logs" id="logs" hidden></pre>
        </div>
        <div class="card">
          <h3>版本</h3>
          <table>
            <thead><tr><th>版本</th><th>类型</th><th>备注</th><th>镜像</th><th>时间</th><th></th></tr></thead>
            <tbody>${versions || `<tr><td colspan="6" class="empty">暂无版本</td></tr>`}</tbody>
          </table>
        </div>`;

      const drop = $("#drop");
      const file = $("#file");
      drop.onclick = () => { if (!state.busy) file.click(); };
      drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
      drop.ondragleave = () => drop.classList.remove("over");
      drop.ondrop = (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        if (!state.busy) addFiles(e.dataTransfer.files);
      };
      file.onchange = () => addFiles(file.files);
      $("#btn-update").onclick = () => runUpdate(false);
      $("#btn-snap").onclick = () => runUpdate(true);
      $("#btn-refresh").onclick = () => openProject(p.id);
      $("#btn-del").onclick = deleteProject;
      $("#btn-up").onclick = () => compose("up");
      $("#btn-down").onclick = () => compose("down");
      $("#btn-restart").onclick = () => compose("restart");
      $("#btn-logs").onclick = loadLogs;
      for (const b of document.querySelectorAll("[data-restore]")) {
        b.onclick = () => restore(b.getAttribute("data-restore"));
      }
    }

    function addFiles(list) {
      for (const f of list) state.files.push(f);
      const ul = $("#filelist");
      ul.innerHTML = state.files.map(f => `<li>${esc(f.name)} · ${(f.size / 1048576).toFixed(1)} MB</li>`).join("");
    }

    function setBusy(kind) {
      state.busy = kind;
      const ids = ["btn-update", "btn-snap", "btn-up", "btn-down", "btn-restart", "btn-logs", "btn-del", "btn-refresh"];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el) el.disabled = true;
      }
      for (const el of document.querySelectorAll("[data-restore]")) {
        el.disabled = true;
        if (kind === "restore") el.textContent = "恢复中…";
      }
    }

    function clearBusy() {
      state.busy = null;
    }

    async function runUpdate(snapshotOnly) {
      if (state.busy) {
        flash("err", "正在处理中，请勿重复操作");
        return;
      }
      if (!snapshotOnly && !state.files.length) {
        flash("err", "请至少选择一个镜像包或 JAR，或使用「仅备份当前目录」。");
        return;
      }
      let stop = () => {};
      setBusy("update");
      try {
        const job = await api("/api/jobs", { method: "POST" });
        const fd = new FormData();
        fd.append("note", $("#note").value || (snapshotOnly ? "目录快照" : ""));
        fd.append("restart", snapshotOnly ? "false" : ($("#restart").checked ? "true" : "false"));
        fd.append("job_id", job.id);
        if (!snapshotOnly) for (const f of state.files) fd.append("files", f, f.name);

        const totalBytes = snapshotOnly ? 0 : state.files.reduce((s, f) => s + (f.size || 0), 0);
        showProgress("prog", true);
        renderProgress("prog", {
          message: snapshotOnly ? "正在备份当前目录…" : "正在上传文件…",
          percent: 0,
          current: 0,
          total: totalBytes,
        });
        stop = watchJob(job.id, "prog");

        const data = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable || snapshotOnly) return;
            renderProgress("prog", {
              message: "正在上传文件…",
              percent: Math.round(e.loaded / e.total * 100),
              current: e.loaded,
              total: e.total,
            });
          };
          xhr.onload = () => {
            let payload = {};
            try { payload = JSON.parse(xhr.responseText || "{}"); } catch { payload = { error: xhr.responseText }; }
            if (xhr.status === 401) {
              showGate((payload && payload.error) || "请先登录或登录已过期");
              reject(new Error((payload && payload.error) || "请先登录"));
              return;
            }
            if (xhr.status >= 400) reject(new Error(payload.error || xhr.statusText));
            else resolve(payload);
          };
          xhr.onerror = () => reject(new Error("上传失败"));
          xhr.open("POST", "/api/projects/" + state.current.id + "/updates");
          xhr.send(fd);
        });
        flash("ok", `已将 ${data.version.label} 发布为最新版。`);
        state.files = [];
        clearBusy();
        await openProject(state.current.id);
        flash("ok", `已将 ${data.version.label} 发布为最新版。`);
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);
      } finally {
        stop();
      }
    }

    async function restore(versionId) {
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      if (!confirm("确定恢复此版本？恢复前会先备份当前目录。")) return;
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      setBusy("restore");
      flash("ok", "正在恢复，请稍候…");
      let stop = () => {};
      try {
        const job = await api("/api/jobs", { method: "POST" });
        showProgress("op-prog", true);
        renderProgress("op-prog", { message: "正在备份当前目录…", percent: 0, current: 0, total: 0 });
        stop = watchJob(job.id, "op-prog");
        const data = await api("/api/projects/" + state.current.id + "/rollback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            version_id: versionId,
            restart: $("#restart") ? $("#restart").checked : true,
            job_id: job.id,
          }),
        });
        clearBusy();
        await openProject(state.current.id);
        flash("ok", "已恢复 " + data.version.label + "，并标记为当前最新版。");
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);
      } finally {
        stop();
      }
    }

    async function compose(action) {
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      try {
        const data = await api("/api/projects/" + state.current.id + "/compose/" + action, { method: "POST" });
        const logs = $("#logs");
        logs.hidden = false;
        logs.textContent = data.logs || "（无输出）";
        await openProject(state.current.id);
      } catch (e) {
        flash("err", e.message);
      }
    }

    async function loadLogs() {
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      try {
        const data = await api("/api/projects/" + state.current.id + "/compose/logs?tail=200");
        const logs = $("#logs");
        logs.hidden = false;
        logs.textContent = data.logs || "（无输出）";
      } catch (e) {
        flash("err", e.message);
      }
    }

    async function deleteProject() {
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      if (!confirm("确定删除此项目及其版本备份？主机上的 Compose 目录不会被删除。")) return;
      try {
        await api("/api/projects/" + state.current.id, { method: "DELETE" });
        location.hash = "#/";
        await refreshProjects();
        renderHome();
      } catch (e) {
        flash("err", e.message);
      }
    }

    const THEME_KEY = "cangling-update-theme";
    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }
    function renderTheme() {
      const label = currentTheme() === "dark" ? "浅色" : "深色";
      const a = $("#theme-toggle");
      const b = $("#gate-theme");
      if (a) a.textContent = label;
      if (b) b.textContent = label;
    }
    function toggleTheme() {
      const next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);
      renderTheme();
    }
    $("#theme-toggle").onclick = toggleTheme;
    $("#gate-theme").onclick = toggleTheme;
    renderTheme();

    $("#btn-new").onclick = () => location.hash = "#/new";
    $("#btn-logout").onclick = () => logout();
    $("#gate-submit").onclick = submitGate;
    ["gate-user", "gate-pass", "gate-pass2"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("keydown", (e) => { if (e.key === "Enter") submitGate(); });
    });
    window.addEventListener("hashchange", route);
    boot();
  </script>
</body>
</html>
