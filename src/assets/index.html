<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>系统更新</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23238636'/%3E%3Cpath fill='%23fff' d='M16 6.4 23.2 14h-4.3v5.2h-5.8V14H8.8z'/%3E%3Crect x='8' y='21.4' width='16' height='2.5' rx='1.2' fill='%23fff'/%3E%3Crect x='10.4' y='24.8' width='11.2' height='2.2' rx='1.1' fill='%23fff' opacity='.72'/%3E%3C/svg%3E" />
  <script>
    (function () {
      var key = "cangling-update-theme";
      var saved = localStorage.getItem(key);
      var theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    /* Primer / GitHub color system */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117;
      --bg-header: #010409;
      --bg-2: #161b22;
      --bg-3: #212830;
      --bg-input: #0d1117;
      --bg-drop: #151b23;
      --bg-drop-over: #388bfd1a;
      --bg-active: #388bfd1a;
      --line: #3d444d;
      --line-muted: #212830;
      --line-hover: #656c76;
      --text: #f0f6fc;
      --muted: #9198a1;
      --subtle: #656c76;
      --on-emphasis: #ffffff;
      --accent: #4493f8;
      --accent-emphasis: #1f6feb;
      --success: #3fb950;
      --success-emphasis: #238636;
      --success-hover: #2ea043;
      --danger: #f85149;
      --danger-emphasis: #da3633;
      --flash-err-bg: #f851491a;
      --flash-err-text: #f85149;
      --flash-err-line: #f8514966;
      --flash-ok-bg: #2ea04326;
      --flash-ok-text: #3fb950;
      --flash-ok-line: #2ea04366;
      --danger-bg: #f851491a;
      --danger-text: #f85149;
      --danger-line: #f8514966;
      --log-bg: #010409;
      --log-text: #f0f6fc;
      --progress-bg: #212830;
      --shadow: 0 0 0 1px #3d444d;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --bg-header: #f6f8fa;
      --bg-2: #ffffff;
      --bg-3: #f6f8fa;
      --bg-input: #ffffff;
      --bg-drop: #f6f8fa;
      --bg-drop-over: #ddf4ff;
      --bg-active: #ddf4ff;
      --line: #d1d9e0;
      --line-muted: #d8dee4;
      --line-hover: #8c959f;
      --text: #1f2328;
      --muted: #59636e;
      --subtle: #818b98;
      --on-emphasis: #ffffff;
      --accent: #0969da;
      --accent-emphasis: #0969da;
      --success: #1a7f37;
      --success-emphasis: #1f883d;
      --success-hover: #1c8139;
      --danger: #d1242f;
      --danger-emphasis: #cf222e;
      --flash-err-bg: #ffebe9;
      --flash-err-text: #d1242f;
      --flash-err-line: #ff818266;
      --flash-ok-bg: #dafbe1;
      --flash-ok-text: #1a7f37;
      --flash-ok-line: #4ac26b66;
      --danger-bg: #ffebe9;
      --danger-text: #d1242f;
      --danger-line: #ff818266;
      --log-bg: #f6f8fa;
      --log-text: #1f2328;
      --progress-bg: #d1d9e0;
      --shadow: 0 1px 0 rgba(31, 35, 40, 0.04);
    }
    * { box-sizing: border-box; border-radius: 6px; }
    /* 结构分割线保持直角，按钮/面板仍保留圆角 */
    header, aside, .tabs, table, th, td,
    .db-split, .db-objects, .db-data, .db-rowfilter, .db-pager,
    .modal-head, .modal-foot {
      border-radius: 0;
    }
    * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: var(--line-hover); }
    ::-webkit-scrollbar-corner { background: transparent; }
    html { font-size: 16px; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Noto Sans CJK SC", Helvetica, Arial, sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    a.brand { text-decoration: none; color: inherit; }
    .app { display: grid; grid-template-rows: 64px minmax(0, 1fr); height: 100%; overflow: hidden; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--bg-header);
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .nav-toggle { display: none; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 32px; height: 32px; flex: 0 0 auto;
      color: var(--success-emphasis);
    }
    .mark svg { width: 100%; height: 100%; display: block; }
    .mark-lg { width: 40px; height: 40px; }
    .gate-brand { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
    .gate-brand h3 { margin: 0; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; font-weight: 650; }
    .brand small { display: block; color: var(--muted); margin-top: 1px; }
    .app-ver {
      display: inline-block; margin-left: 8px; padding: 1px 8px;
      border: 1px solid var(--line); background: var(--bg-3); color: var(--muted);
      font-size: 16px; font-weight: 500; vertical-align: middle;
    }
    .header-right { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; justify-content: flex-end; }
    header .btn {
      height: 34px; display: inline-flex; align-items: center; box-sizing: border-box;
    }
    .meta {
      color: var(--muted); display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap; justify-content: flex-end;
    }
    .meta > span, #who {
      display: inline-flex; align-items: center; height: 34px; padding: 0 10px;
      border: 1px solid var(--line); background: var(--bg-3); line-height: 1;
      box-sizing: border-box;
    }
    .meta b { color: var(--text); font-weight: 600; }
    .ok { color: var(--success); }
    .bad { color: var(--danger); }
    .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; }
    aside {
      border-right: 1px solid var(--line); background: var(--bg-2);
      display: flex; flex-direction: column; min-height: 0;
    }
    .aside-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; }
    .aside-head h2 { margin: 0; color: var(--muted); font-size: 16px; font-weight: 600; }
    .plist { overflow: auto; padding: 6px 10px 18px; }
    .pitem {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
      color: var(--text); padding: 10px 12px; margin-bottom: 6px;
    }
    .pitem:hover { background: var(--bg-3); }
    .pitem.active { background: var(--bg-active); border-color: var(--accent-emphasis); }
    .pitem .n { font-weight: 600; display: block; }
    .pitem .d { color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cluster-nav {
      width: calc(100% - 32px); margin: 14px 16px 0; text-align: left;
      display: flex; align-items: center; gap: 8px; font-weight: 600;
    }
    .cluster-nav.active { border-color: var(--accent-emphasis); background: var(--bg-active); }
    .cluster-table { width: 100%; border-collapse: collapse; }
    .cluster-table th, .cluster-table td {
      text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .cluster-table th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.online { background: var(--success); }
    .dot.offline { background: var(--danger); }
    .task-log {
      margin: 0; white-space: pre-wrap; word-break: break-all;
      max-height: 320px; overflow: auto; background: var(--bg-input);
      padding: 10px; font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .check { display: flex; align-items: center; gap: 6px; margin: 4px 0; color: var(--text); }
    main {
      min-width: 0; min-height: 0; overflow: auto; padding: 22px 26px 40px;
      display: flex; flex-direction: column;
    }
    main.db-fill { overflow: hidden; padding-bottom: 16px; }
    main.db-fill #orphan-box { display: none; }
    .title-row, .tabs, .progress-wrap, #flash { flex-shrink: 0; }
    .btn {
      border: 1px solid var(--line); background: var(--bg-3); color: var(--text);
      padding: 7px 12px;
    }
    .btn:hover { background: var(--bg-2); border-color: var(--line-hover); }
    .btn.primary { background: var(--success-emphasis); color: var(--on-emphasis); border-color: var(--success-emphasis); font-weight: 600; }
    .btn.primary:hover { background: var(--success-hover); border-color: var(--success-hover); }
    .btn.danger { color: var(--danger-text); border-color: var(--danger-line); background: var(--danger-bg); }
    .btn.danger:hover { background: var(--danger-emphasis); color: var(--on-emphasis); border-color: var(--danger-emphasis); }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.working:disabled {
      opacity: 1;
      animation: btn-working 0.9s ease-in-out infinite;
    }
    @keyframes btn-working { 50% { opacity: 0.55; } }
    .compose-op { color: var(--accent); font-weight: 600; }
    .compose-op[hidden] { display: none !important; }
    .card {
      background: var(--bg-2); border: 1px solid var(--line);
      padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 12px; color: var(--muted); font-size: 16px; font-weight: 600; }
    .card.tab-panel { border: none; border-radius: 0; box-shadow: none; }
    .tabs {
      display: flex; flex-wrap: wrap; gap: 0;
      border-bottom: 1px solid var(--line); margin: 0 0 16px; padding: 0;
    }
    .tab {
      display: inline-flex; align-items: center; gap: 8px;
      border: 0; border-bottom: 2px solid transparent; border-radius: 0;
      background: transparent; color: var(--muted);
      padding: 10px 16px; margin-bottom: -1px; font-weight: 600;
    }
    .tab-ico { flex: 0 0 auto; display: block; }
    .tab:hover { color: var(--text); background: transparent; }
    .tab.active {
      color: var(--text); border-bottom-color: var(--accent-emphasis); background: transparent;
    }
    .tab.active:hover { background: transparent; }
    .tab:focus-visible { outline: 2px solid var(--accent-emphasis); outline-offset: -2px; }
    .tab-panel[hidden] { display: none !important; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    label { display: block; color: var(--muted); margin: 0 0 6px; }
    input[type=text], input[type=password], textarea {
      width: 100%; background: var(--bg-input); color: var(--text); border: 1px solid var(--line);
      padding: 9px 11px; outline: none;
    }
    input[type=text]:focus, input[type=password]:focus, textarea:focus { border-color: var(--accent-emphasis); box-shadow: 0 0 0 3px var(--bg-active); }
    textarea { min-height: 72px; resize: vertical; }
    .field { margin-bottom: 12px; }
    .title-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    .title-row h2 {
      margin: 0 0 4px; font-size: 26px; font-weight: 650;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .title-row h2 .pill { font-size: 16px; }
    .path { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); padding: 3px 9px;
      color: var(--muted); background: var(--bg-3);
    }
    .pill.latest { color: var(--on-emphasis); background: var(--success-emphasis); border-color: var(--success-emphasis); font-weight: 600; }
    .drop {
      border: 1px dashed var(--line); padding: 28px 16px; text-align: center;
      color: var(--muted); background: var(--bg-drop);
    }
    .drop.over { border-color: var(--accent-emphasis); color: var(--text); background: var(--bg-drop-over); }
    .filelist { margin: 12px 0 0; padding: 0; list-style: none; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .filelist li { padding: 4px 0; color: var(--text); }
    .progress-wrap { margin-top: 14px; }
    .progress-wrap[hidden] { display: none !important; }
    .progress-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .progress-sub { color: var(--muted); margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
    .progress { height: 10px; background: var(--progress-bg); overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 0; background: var(--success-emphasis); transition: width 0.15s linear; }
    .progress.unknown > span { width: 32%; animation: prog-slide 1.1s ease-in-out infinite; }
    @keyframes prog-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .card > table th, .card > table td { vertical-align: middle; }
    .card > table tbody tr:hover { background: var(--bg-active); }
    th { color: var(--muted); font-weight: 700; }
    th:last-child, td:last-child:not(.empty) { text-align: right; }
    td:last-child .row { justify-content: flex-end; }
    .card > table th, .db-data th { position: sticky; top: 0; z-index: 1; background: var(--bg-2); }
    .empty { color: var(--muted); padding: 28px 8px; text-align: center; }
    .db-loading { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .db-loading .spin {
      width: 16px; height: 16px; flex: 0 0 auto;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    select {
      background: var(--bg-input); color: var(--text); border: 1px solid var(--line);
      padding: 7px 10px; height: 34px; min-width: 140px;
    }
    select:focus { border-color: var(--accent-emphasis); outline: none; box-shadow: 0 0 0 3px var(--bg-active); }
    .combo { position: relative; min-width: 0; }
    .combo-btn {
      width: 100%; height: 34px; display: flex; align-items: center; gap: 6px;
      padding: 0 8px 0 11px; border: 1px solid var(--line); background: var(--bg-input);
      color: var(--text); text-align: left;
    }
    .combo-btn:hover { border-color: var(--line-hover); background: var(--bg-3); }
    .combo-btn:focus, .combo-btn.open {
      border-color: var(--accent-emphasis); outline: none; box-shadow: 0 0 0 3px var(--bg-active);
    }
    .combo-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .combo-val {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px;
    }
    .combo-val.ph { color: var(--muted); font-family: inherit; font-size: 14px; }
    .combo-caret { flex: 0 0 auto; width: 16px; height: 16px; color: var(--muted); display: block; }
    #combo-pop {
      position: fixed; z-index: 35; min-width: 180px; max-width: min(480px, calc(100vw - 16px));
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg-2); border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(1, 4, 9, 0.45);
    }
    :root[data-theme="light"] #combo-pop { box-shadow: 0 8px 24px rgba(31, 35, 40, 0.18); }
    #combo-pop[hidden] { display: none !important; }
    #combo-search {
      flex: 0 0 auto; width: 100%; height: 34px; border: 0; border-bottom: 1px solid var(--line);
      border-radius: 0; padding: 7px 10px; background: var(--bg-input);
    }
    #combo-search:focus { outline: none; box-shadow: none; border-color: var(--line); }
    #combo-list { overflow: auto; flex: 1; min-height: 0; padding: 4px; }
    .combo-opt {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      color: var(--text); padding: 7px 10px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px;
    }
    .combo-opt:hover, .combo-opt.active { background: var(--bg-active); }
    .combo-opt.sel { font-weight: 600; }
    .combo-empty { color: var(--muted); padding: 16px 10px; text-align: center; }
    #panel-db:not([hidden]) {
      flex: 1 1 auto; min-height: 0; margin-bottom: 0; overflow: hidden;
      display: flex; flex-direction: column;
    }
    #panel-db > .hint, #panel-db > .flash { flex: 0 0 auto; }
    .db-toolbar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin-bottom: 12px; flex: 0 0 auto; }
    .db-toolbar .field { margin: 0; min-width: 150px; flex: 0 1 170px; }
    .db-toolbar .combo { width: 100%; }
    .db-toolbar label { margin-bottom: 4px; font-size: 13px; }
    .db-toolbar .db-filter-field { flex: 1 1 200px; min-width: 180px; }
    .db-toolbar > .field:last-child { flex: 0 0 auto; min-width: 0; }
    .db-toolbar .db-filter-field input {
      width: 100%; height: 34px; padding: 7px 10px;
    }
    .db-split {
      display: grid; grid-template-columns: 240px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      border: 1px solid var(--line); min-height: 0; flex: 1 1 auto; background: var(--bg-2);
      overflow: hidden;
    }
    .db-objects { overflow: auto; border-right: 1px solid var(--line); min-height: 0; }
    .db-obj {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      border: 0; border-radius: 0; background: transparent; color: var(--text);
      padding: 8px 10px; border-bottom: 1px solid var(--line-muted);
    }
    .db-obj:hover { background: var(--bg-3); }
    .db-obj.active { background: var(--bg-active); }
    .db-obj .ico { flex: 0 0 auto; width: 16px; height: 16px; color: var(--muted); display: block; }
    .db-obj.active .ico { color: var(--accent); }
    .db-obj .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .db-obj .k { color: var(--muted); font-size: 12px; margin-right: 6px; }
    .repo-browser {
      display: grid; grid-template-columns: 260px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      border: 1px solid var(--line); min-height: 480px; background: var(--bg-2); overflow: hidden;
    }
    .repo-tree { overflow: auto; border-right: 1px solid var(--line); min-height: 0; }
    .repo-tree-item {
      display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
      border: 0; border-radius: 0; background: transparent; color: var(--text);
      padding: 6px 10px; border-bottom: 1px solid var(--line-muted); font-size: 13px;
    }
    .repo-tree-item:hover { background: var(--bg-3); }
    .repo-tree-item.active { background: var(--bg-active); }
    .repo-tree-item .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .repo-files { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .repo-files-head { padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); font-size: 13px; flex: 0 0 auto; }
    .repo-files-list { flex: 0 0 auto; max-height: 40%; overflow: auto; border-bottom: 1px solid var(--line); }
    .repo-entry {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      border: 0; border-radius: 0; background: transparent; color: var(--text);
      padding: 7px 12px; border-bottom: 1px solid var(--line-muted);
    }
    .repo-entry:hover { background: var(--bg-3); }
    .repo-entry .n { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .repo-entry .s { color: var(--muted); font-size: 12px; flex: 0 0 auto; }
    #repo-file-view { flex: 1 1 auto; overflow: auto; min-height: 0; }
    .db-browse {
      display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
    }
    .db-rowfilter {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px;
      padding: 8px 10px; border-bottom: 1px solid var(--line);
      flex: 0 0 auto; background: var(--bg-2);
    }
    .db-rowfilter[hidden] { display: none; }
    .db-rowfilter label { margin: 0; font-size: 12px; color: var(--muted); }
    .db-rowfilter .combo { flex: 0 1 180px; min-width: 120px; }
    .db-rowfilter .combo#db-fop { flex: 0 0 110px; min-width: 0; }
    .db-rowfilter input[type=text] { flex: 1 1 160px; min-width: 120px; width: auto; padding: 7px 10px; height: 34px; }

      const headers = Object.assign({}, opts.headers || {});

    async function api(path, opts = {}) {
      const res = await fetch(path, withAuth(opts));
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
      if (res.status === 401) {
        showGate((data && data.error) || "请先登录或登录已过期");
        throw new Error((data && data.error) || "请先登录或登录已过期");
      }
      if (!res.ok) throw new Error((data && data.error) || res.statusText);
      touchActivity();
      return data;
    }

          if (password !== again) throw new Error("两次输入的密码不一致");
          const user = await api("/api/auth/setup", {
            method: "POST",

            body: JSON.stringify({ username, password }),
          });
          if (user && user.token) setSessionToken(user.token);
          await enterApp(user);

          });

    async function submitChangePassword() {
      const box = $("#pw-flash");
      const show = (kind, msg) => {
        box.className = "flash " + kind;
        box.textContent = msg;
        box.hidden = false;
      };
      const oldPassword = $("#pw-old").value;
      const newPassword = $("#pw-new").value;
      const again = $("#pw-new2").value;
      if (newPassword !== again) {
        show("err", "两次输入的新密码不一致");
        return;
      }
      const btn = $("#dialog-extra");
      if (btn) btn.disabled = true;
      try {
        const data = await api("/api/auth/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ old_password: oldPassword, new_password: newPassword }),
        });
        const synced = (data && data.synced) || [];
        const failed = (data && data.failed) || [];
        let msg = "密码已修改，请重新登录。";
        if (synced.length) msg += " 已同步节点：" + synced.join("、") + "。";
        if (failed.length) msg += " 同步失败：" + failed.map((f) => f.node).join("、") + "。";
        show("ok", msg);
        $("#pw-old").value = "";
        $("#pw-new").value = "";
        $("#pw-new2").value = "";
        setDialogAction("重新登录", () => logout("密码已修改，请重新登录"));
        if (btn) btn.disabled = false;
      } catch (e) {
        show("err", e.message);
        if (btn) btn.disabled = false;
      }
    }

      const p = (x) => String(x).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function renderClusterLayout(st) {
      const roleName = { standalone: "单机", master: "主节点", worker: "工作节点" }[st.role] || st.role;
      if (st.role === "standalone") {
        $("#main").innerHTML = `
          <div class="title-row"><div><h2>集群</h2><div class="path">多机部署与节点管理</div></div></div>
          <div class="card">

              工作节点不填 <code>--master</code> 时，会通过 UDP 广播（端口 5401）自动发现主节点；也可用 <code>--master http://主节点:5400</code> 显式指定。

        return;

        : "";
      const initCard = st.role === "master"
        ? `<div class="card">
            <h3>初始化 / 检查修复</h3>
            <div class="row" style="margin-bottom:8px">
              <input id="cluster-name" type="text" placeholder="集群名称" value="${esc(st.name || "")}" style="max-width:240px" />

              <button class="btn" id="btn-check-cluster">检查并修复</button>
            </div>

            <div id="cluster-init-body"></div>
          </div>`
        : "";
      $("#main").innerHTML = `
        <div class="title-row">
          <div><h2>集群</h2><div class="path">本机角色：${roleName}${st.name ? " · " + esc(st.name) : ""}${st.master_url ? " · master " + esc(st.master_url) : ""}</div></div>
        </div>
        <div id="flash" hidden></div>
        <div class="card"><h3>概览</h3><p class="hint" id="cluster-overview"></p><p class="hint" id="cluster-binaries-hint" hidden></p></div>
        <div class="card"><h3>节点列表</h3><div id="nodes-body"></div></div>
        ${initCard}
        ${workerNote}`;
      const initBtn = $("#btn-init-cluster");
      if (initBtn) initBtn.onclick = startClusterInit;
      const checkBtn = $("#btn-check-cluster");
      if (checkBtn) checkBtn.onclick = startClusterCheck;
    }

    function updateClusterOverview(st) {
      const el = $("#cluster-overview");
      if (!el) return;
      let text = `节点 ${st.node_count} 个 · 在线 ${st.online} 个 · 离线 ${st.node_count - st.online} 个`;
      if (st.version) text += ` · 主程序 v${st.version}`;
      const bins = st.binaries || [];
      if (bins.length) {
        const parts = bins.map(b => b.available
          ? `${b.label} 已就绪`
          : `${b.label} 缺失`);
        text += ` · 升级包 ${parts.join(" / ")}`;
      }
      el.textContent = text;
      const hint = $("#cluster-binaries-hint");
      if (hint) {
        const missing = bins.filter(b => !b.available);
        if (st.role === "master" && missing.length) {
          hint.hidden = false;
          hint.innerHTML = `缺少 ${missing.map(b => esc(b.label)).join("、")} 升级包，该架构的工作节点无法自动升级。把对应二进制放到程序目录 <code>updates/</code>（<code>cangling-update-linux-amd64</code> / <code>cangling-update-linux-arm64</code>），或在主节点执行 <code>cangling-update update</code> / <code>update --import 文件</code>。`;
        } else {
          hint.hidden = true;
          hint.textContent = "";
        }
      }
    }

    async function loadInitStatus() {
      const body = $("#cluster-init-body");
      if (!body || initPoll.inflight) return;
      initPoll.inflight = true;
      try {
        const init = await api("/api/cluster/init/status");
        state.initStatus = init;
        renderInitStatus(init);
      } catch (e) {
        body.innerHTML = `<p class="hint">${esc(e.message)}</p>`;
      } finally {
        initPoll.inflight = false;
      }
    }

    function renderInitStatus(init) {
      const body = $("#cluster-init-body");
      if (!body) return;
      if (!init.running && !init.started_at) {
        stopInitPoll();
        body.innerHTML = `<p class="hint">尚未初始化。填写集群名称后点击「初始化集群」。</p>`;
        return;
      }
      if (!init.running) stopInitPoll();
      const badgeMap = { pending: "待执行", running: "进行中", ok: "成功", failed: "失败" };
      const clsMap = { ok: "ok", failed: "bad", running: "", pending: "" };
      const rows = (init.steps || []).map(s => `
        <tr>
          <td class="path">${esc(s.node)}</td>
          <td>${s.role === "master" ? "主节点" : "工作节点"}</td>
          <td>${esc(s.package)}</td>
          <td><span class="${clsMap[s.state] || ""}">${badgeMap[s.state] || esc(s.state)}</span></td>
          <td>${s.elapsed_ms ? s.elapsed_ms + " ms" : "—"}</td>
          <td>${s.output ? `<pre class="task-log" style="max-height:140px">${esc(s.output)}</pre>` : "—"}</td>
        </tr>`).join("");
      body.innerHTML = `
        ${init.error ? `<p class="hint"><span class="bad">${esc(init.error)}</span></p>` : ""}
        ${init.running ? `<p class="hint">${init.mode === "check" ? "正在检查并修复" : "正在初始化"}集群「${esc(init.cluster_name)}」…</p>` : ""}

          <thead><tr><th>节点</th><th>角色</th><th>软件</th><th>状态</th><th>耗时</th><th>输出</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6" class="hint">暂无步骤</td></tr>`}</tbody>
        </table>`;
    }

    async function startClusterInit() {
      const nameEl = $("#cluster-name");
      const name = (nameEl && nameEl.value || "").trim();
      if (!name) { flash("err", "请填写集群名称"); return; }
      const btn = $("#btn-init-cluster");
      if (btn) btn.disabled = true;
      try {
        await api("/api/cluster/init", {
          method: "POST",
          headers: { "Content-Type": "application/json" },

    async function downloadRepoPkg(key) {
      const [tab, pkg] = key.split("|");
      const out = $("#repo-run-out");
      if (out) out.innerHTML = `<pre class="task-log">正在打包 ${esc(pkg)} …</pre>`;
      try {
        const res = await fetch(`/api/repo/${encodeURIComponent(tab)}/${encodeURIComponent(pkg)}/download`, withAuth());
        if (res.status === 401) {
          showGate("请先登录或登录已过期");
          throw new Error("请先登录或登录已过期");
        }
        if (!res.ok) {
          const text = await res.text();
          let msg = text;
          try { msg = JSON.parse(text).error || text; } catch {}
          throw new Error(msg || res.statusText);
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${pkg}.tar.gz`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        if (out) out.innerHTML = `<p class="hint ok">已开始下载 ${esc(pkg)}.tar.gz</p>`;
      } catch (e) {
        if (out) out.innerHTML = `<pre class="task-log">下载失败：${esc(e.message)}</pre>`;
      }
    }

    async function installRepoPkg(key) {
      const [tab, pkg] = key.split("|");
      const out = $("#repo-run-out");
      if (!out) return;
      out.innerHTML = `<pre class="task-log">正在下载并安装 ${esc(pkg)} …</pre>`;
      document.querySelectorAll("#repo-tab-body [data-install], #repo-tab-body [data-download]").forEach(b => { b.disabled = true; });
      try {
        const r = await api("/api/repo/install", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tab, package: pkg }),
        });
        const body = ((r.stdout || "") + (r.stderr || "")).trim();
        const exit = r.exit_code == null ? "无" : r.exit_code;
        out.innerHTML = `<pre class="task-log">${esc(body || "（无输出）")}</pre>
          <p class="hint">安装脚本 <code>${esc(r.installer)}</code> · 退出码 ${exit} · 耗时 ${r.elapsed_ms} ms${r.timed_out ? " · 已超时" : ""}</p>`;
      } catch (e) {
        out.innerHTML = `<pre class="task-log">安装失败：${esc(e.message)}</pre>`;
      } finally {
        document.querySelectorAll("#repo-tab-body [data-install], #repo-tab-body [data-download]").forEach(b => { b.disabled = false; });
      }
    }

    function fmtBytes(n) {
      n = Number(n) || 0;
      if (n < 1024) return n + " B";
      if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
      if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
      return (n / 1073741824).toFixed(2) + " GB";
    }

    function xterm256(n) {
      n = n & 255;
      if (n < 16) return n;
      if (n < 232) {
        n -= 16;
        const v = [0, 95, 135, 175, 215, 255];
        return "rgb(" + v[Math.floor(n / 36)] + "," + v[Math.floor((n % 36) / 6)] + "," + v[n % 6] + ")";
      }
      const g = 8 + (n - 232) * 10;
      return "rgb(" + g + "," + g + "," + g + ")";
    }

    function applySgr(st, raw) {
      const parts = raw.length ? raw.split(";") : ["0"];
      for (let p = 0; p < parts.length; p++) {
        const n = parseInt(parts[p], 10);
        const code = isNaN(n) ? 0 : n;
        if (code === 0) { st.b = st.d = st.i = st.u = st.inv = 0; st.fg = st.bg = null; }
        else if (code === 1) { st.b = 1; st.d = 0; }
        else if (code === 2) st.d = 1;
        else if (code === 3) st.i = 1;
        else if (code === 4) st.u = 1;
        else if (code === 7) st.inv = 1;
        else if (code === 21 || code === 22) { st.b = 0; st.d = 0; }
        else if (code === 23) st.i = 0;
        else if (code === 24) st.u = 0;
        else if (code === 27) st.inv = 0;
        else if (code === 39) st.fg = null;
        else if (code === 49) st.bg = null;
        else if (code >= 30 && code <= 37) st.fg = code - 30;
        else if (code >= 90 && code <= 97) st.fg = code - 90 + 8;
        else if (code >= 40 && code <= 47) st.bg = code - 40;
        else if (code >= 100 && code <= 107) st.bg = code - 100 + 8;
        else if (code === 38 || code === 48) {
          const kind = parseInt(parts[++p], 10);
          let color = null;
          if (kind === 5) color = xterm256(parseInt(parts[++p], 10) || 0);
          else if (kind === 2) {
            const r = parseInt(parts[++p], 10) || 0;
            const g = parseInt(parts[++p], 10) || 0;
            const b = parseInt(parts[++p], 10) || 0;
            color = "rgb(" + r + "," + g + "," + b + ")";
          }
          if (code === 38) st.fg = color;
          else st.bg = color;
        }
      }
    }

    function ansiToHtml(raw) {
      raw = String(raw ?? "");
      const st = { b: 0, d: 0, i: 0, u: 0, inv: 0, fg: null, bg: null };
      let out = "";
      const paint = (s) => {
        if (!s) return;
        const cls = [];
        if (st.b) cls.push("ansi-b");
        if (st.d) cls.push("ansi-d");
        if (st.i) cls.push("ansi-i");
        if (st.u) cls.push("ansi-u");
        let fg = st.inv ? (st.bg == null ? "var(--log-bg)" : st.bg) : st.fg;
        let bg = st.inv ? (st.fg == null ? "var(--log-text)" : st.fg) : st.bg;
        let style = "";
        if (typeof fg === "number") cls.push("ansi-fg-" + fg);
        else if (fg) style += "color:" + fg + ";";
        if (typeof bg === "number") cls.push("ansi-bg-" + bg);
        else if (bg) style += "background:" + bg + ";";
        const body = esc(s);
        if (!cls.length && !style) { out += body; return; }
        out += "<span" + (cls.length ? " class=\"" + cls.join(" ") + "\"" : "") +
          (style ? " style=\"" + style + "\"" : "") + ">" + body + "</span>";
      };
      let i = 0, buf = "";
      const flush = () => { paint(buf); buf = ""; };
      while (i < raw.length) {
        const code = raw.charCodeAt(i);
        if (code === 0x1b && i + 1 < raw.length) {
          const n = raw[i + 1];
          if (n === "[") {
            let j = i + 2;
            while (j < raw.length) {
              const cc = raw.charCodeAt(j);
              j++;
              if (cc >= 0x40 && cc <= 0x7e) break;
            }
            flush();
            if (raw[j - 1] === "m") applySgr(st, raw.slice(i + 2, j - 1).replace(/^[?-]/, ""));
            i = j;
            continue;
          }
          if (n === "]") {
            let j = i + 2;
            while (j < raw.length) {
              if (raw.charCodeAt(j) === 0x07) { j++; break; }
              if (raw.charCodeAt(j) === 0x1b && raw[j + 1] === "\\") { j += 2; break; }
              j++;
            }
            flush();
            i = j;
            continue;
          }
          flush();
          i += 2;
          continue;
        }
        if (code === 0x9b) {
          let j = i + 1;
          while (j < raw.length) {
            const cc = raw.charCodeAt(j);
            j++;
            if (cc >= 0x40 && cc <= 0x7e) break;
          }
          flush();
          if (raw[j - 1] === "m") applySgr(st, raw.slice(i + 1, j - 1));
          i = j;
          continue;
        }
        buf += raw[i++];
      }
      flush();
      return out;
    }

    function setLogs(el, text) {
      if (!el) return;
      el.innerHTML = ansiToHtml(text || "（无输出）");

    function showProgress(prefix, on) {
      const wrap = document.getElementById(prefix);
      if (wrap) wrap.hidden = !on;
    }

    function renderProgress(prefix, job) {
      const wrap = document.getElementById(prefix);
      if (!wrap) return;
      wrap.hidden = false;
      const msg = document.getElementById(prefix + "-msg");
      const pct = document.getElementById(prefix + "-pct");
      const bar = document.querySelector("#" + prefix + "-bar");
      const fill = bar ? bar.querySelector("span") : null;
      const sub = document.getElementById(prefix + "-sub");
      const unknown = !job.total;
      if (bar) bar.classList.toggle("unknown", unknown && !job.done);
      if (msg) msg.textContent = job.message || job.phase || "处理中";
      if (pct) pct.textContent = unknown && !job.done ? "…" : (job.percent || 0) + "%";
      if (fill && !unknown) fill.style.width = (job.percent || 0) + "%";
      if (sub) {
        const msg = job.message || "";
        if (/索引|提交 Git/.test(msg)) {
          sub.textContent = job.total ? (job.current + " / " + job.total + " 个文件") : "";
        } else {
          sub.textContent = job.total
            ? fmtBytes(job.current) + " / " + fmtBytes(job.total)
            : "";
        }
      }
    }

    function watchJob(id, prefix) {
      let timer = setInterval(async () => {
        try {
          const job = await api("/api/jobs/" + id);
          renderProgress(prefix, job);
          if (job.done) {
            clearInterval(timer);
            timer = null;
          }
        } catch {}
      }, 400);
      return () => { if (timer) clearInterval(timer); };
    }

    async function loadOrphans(boxId) {
      const box = document.getElementById(boxId);
      if (!box) return;
      try {
        const items = await api("/api/orphans");
        if (!items.length) {
          box.innerHTML = "";
          return;
        }
        box.innerHTML = `
          <div class="card">
            <h3>未完成的备份残留</h3>
            <p class="hint">首次备份或升级失败时，磁盘上可能留下没有项目/版本记录的目录，平时列表里看不到。可在此查看并清理。</p>
            <table>
              <thead><tr><th>编号</th><th>大小</th><th>时间</th><th>路径</th><th></th></tr></thead>
              <tbody>${items.map(o => `<tr>
                <td class="path">${esc(o.id)}</td>
                <td>${fmtBytes(o.bytes || 0)}</td>
                <td>${esc(fmtDateTime(o.modified))}</td>
                <td class="path">${esc(o.path)}</td>
                <td><button class="btn danger" data-orphan="${esc(o.id)}">清理</button></td>
              </tr>`).join("")}</tbody>
            </table>
          </div>`;
        for (const b of box.querySelectorAll("[data-orphan]")) {
          b.onclick = async () => {
            if (!(await confirmDialog("确定删除这份残留备份？", { danger: true }))) return;
            try {
              const oid = b.getAttribute("data-orphan") || "";
              await api("/api/orphans/" + encodeURIComponent(oid), { method: "DELETE" });
              await loadOrphans(boxId);
            } catch (e) {
              flash("err", e.message);
            }
          };
        }
      } catch (e) {
        box.innerHTML = `<div class="flash err">${esc(e.message)}</div>`;
      }
    }

    async function createProject() {
      const stopFirst = $("#f-stop") ? $("#f-stop").checked : true;
      if (!(await confirmDialog(
        "将全量备份该目录（包含 PostGIS 等数据库文件）。\n" +
        (stopFirst ? "会先停止 Compose，备份完成后再启动。\n" : "请先手动停止当前应用，否则备份可能失败或不完整。\n") +
        "确定继续？"
      ))) return;
      const btn = $("#btn-create");
      let stop = () => {};
      try {
        btn.disabled = true;
        const job = await api("/api/jobs", { method: "POST" });
        showProgress("create-prog", true);
        renderProgress("create-prog", { message: "正在建立基线快照…", percent: 0, current: 0, total: 0 });
        stop = watchJob(job.id, "create-prog");
        const body = {
          name: $("#f-name").value,
          description: $("#f-desc").value,
          directory: $("#f-dir").value,
          job_id: job.id,
          stop_compose: stopFirst,
        };
        const p = await api("/api/projects", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        await refreshProjects();
        location.hash = "#/p/" + p.id;

        flash("err", e.message);
        loadOrphans("orphan-box");

        stop();
        btn.disabled = false;
      }
    }

    function applyComposeStatus(compose) {
      state.compose = compose;
      const body = $("#compose-svc-body");

      const rows = composeServiceRows(compose.services);
      body.innerHTML = rows || `<tr><td colspan="5" class="empty">未报告运行中的服务</td></tr>`;
      bindComposeServiceButtons();
      const err = $("#compose-err");
      if (err) {
        if (compose.error) {
          err.hidden = false;
          err.textContent = compose.error;

          err.hidden = true;
          err.textContent = "";

      syncEnvButton(compose);

    function syncEnvButton(compose) {
      const row = $("#btn-edit-compose") && $("#btn-edit-compose").parentElement;
      if (!row) return;
      let btn = $("#btn-edit-env");
      if (compose.env_file) {
        if (!btn) {
          btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn";
          btn.id = "btn-edit-env";
          btn.textContent = "环境变量";
          btn.onclick = openEnvEditor;
          const op = $("#compose-op");
          row.insertBefore(btn, op || null);
        }
        btn.disabled = !!state.busy;
        btn.hidden = false;
      } else if (btn) {
        btn.remove();
      }

    function stopComposePoll() {
      if (composePoll.timer) {
        clearInterval(composePoll.timer);
        composePoll.timer = null;
      }
    }

    function startComposePoll() {
      stopComposePoll();
      if (!state.current) return;
      composePoll.timer = setInterval(refreshComposeStatus, 2000);
    }

    async function refreshComposeStatus() {
      if (!state.current || state.busy || composePoll.inflight) return;
      composePoll.inflight = true;
      try {
        const compose = await api("/api/projects/" + state.current.id + "/compose");
        const prev = JSON.stringify({
          services: (state.compose && state.compose.services) || [],
          error: (state.compose && state.compose.error) || "",
          env_file: (state.compose && state.compose.env_file) || "",
        });
        const next = JSON.stringify({
          services: compose.services || [],
          error: compose.error || "",
          env_file: compose.env_file || "",
        });
        if (prev !== next) applyComposeStatus(compose);
        if (compose.available && state.meta && !(state.meta.docker && state.meta.docker.available)) {
          loadMeta();
        }
      } catch {}
      composePoll.inflight = false;
    }

    }

    function applyProjectTab(tab) {
      if (tab) state.projectTab = tab;
      comboClose();
      const cur = currentProjectTab();
      const main = $("#main");
      if (main) main.classList.toggle("db-fill", cur === "db");
      for (const btn of document.querySelectorAll("[data-tab]")) {
        const on = btn.getAttribute("data-tab") === cur;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-selected", on ? "true" : "false");
        btn.tabIndex = on ? 0 : -1;
      }
      for (const panel of document.querySelectorAll("[data-panel]")) {
        panel.hidden = panel.getAttribute("data-panel") !== cur;
      }
      if (cur === "db") dbEnsureLoaded();
    }

    function dbRunningServices() {
      return ((state.compose && state.compose.services) || []).filter((s) => /run/i.test(s.state || ""));
    }

    const comboPop = { host: null, items: [], filtered: [], value: "", q: "", hi: 0, onPick: null, bound: false };

    function comboCaret() {
      return '<svg class="combo-caret" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg>';
    }

    function comboBind(host, opts) {
      if (!host) return;
      if (comboPop.host === host) comboClose();
      const items = opts.items || [];
      const value = opts.value || "";
      const placeholder = opts.placeholder || "请选择";
      host.classList.add("combo");
      const shown = value || placeholder;
      host.innerHTML = `<button type="button" class="combo-btn" aria-haspopup="listbox" aria-expanded="false"${items.length ? "" : " disabled"}><span class="combo-val${value ? "" : " ph"}">${esc(shown)}</span>${comboCaret()}</button>`;
      const btn = host.querySelector(".combo-btn");
      if (!btn) return;
      btn.onclick = (e) => {
        e.stopPropagation();
        if (!items.length) return;
        if (comboPop.host === host) { comboClose(); return; }
        comboOpen(host, { items, value, placeholder, onChange: opts.onChange });
      };
    }

    function comboEnsureListeners() {
      if (comboPop.bound) return;
      comboPop.bound = true;
      document.addEventListener("mousedown", (e) => {
        const pop = $("#combo-pop");
        if (!pop || pop.hidden) return;
        if (pop.contains(e.target) || (comboPop.host && comboPop.host.contains(e.target))) return;
        comboClose();
      });
      window.addEventListener("resize", () => { if (comboPop.host) comboPlace(comboPop.host); });
      window.addEventListener("scroll", (e) => {
        if (!comboPop.host) return;
        const pop = $("#combo-pop");
        if (pop && (pop === e.target || pop.contains(e.target))) return;
        comboClose();
      }, true);
    }

    function comboOpen(host, opts) {
      comboEnsureListeners();
      const pop = $("#combo-pop");
      const search = $("#combo-search");
      if (!pop || !search) return;
      comboPop.host = host;
      comboPop.items = opts.items || [];
      comboPop.value = opts.value || "";
      comboPop.q = "";
      comboPop.onPick = opts.onChange || null;
      const btn = host.querySelector(".combo-btn");
      if (btn) {
        btn.classList.add("open");
        btn.setAttribute("aria-expanded", "true");
      }
      search.value = "";
      pop.hidden = false;
      comboRenderList();
      comboPlace(host);
      search.focus();
      search.oninput = () => {
        comboPop.q = search.value;
        comboRenderList();
      };
      search.onkeydown = (e) => {
        if (e.key === "Escape") { e.preventDefault(); comboClose(); return; }
        if (e.key === "ArrowDown") { e.preventDefault(); comboMove(1); return; }
        if (e.key === "ArrowUp") { e.preventDefault(); comboMove(-1); return; }
        if (e.key === "Enter") {
          e.preventDefault();
          const items = comboPop.filtered || [];
          if (items[comboPop.hi] != null) comboPick(items[comboPop.hi]);
        }
      };
    }

    function comboFiltered() {
      const q = (comboPop.q || "").trim().toLowerCase();
      const items = comboPop.items || [];
      if (!q) return items.slice();
      return items.filter((n) => String(n).toLowerCase().includes(q));
    }

    function comboRenderList() {
      const list = $("#combo-list");
      if (!list) return;
      const items = comboFiltered();
      comboPop.filtered = items;
      const cur = items.indexOf(comboPop.value);
      comboPop.hi = cur >= 0 ? cur : 0;
      if (!items.length) {
        list.innerHTML = `<div class="combo-empty">${(comboPop.items || []).length ? "没有匹配项" : "没有可选项"}</div>`;
        return;
      }
      list.innerHTML = items.map((n, i) => {
        const sel = n === comboPop.value ? " sel" : "";
        const hi = i === comboPop.hi ? " active" : "";
        return `<button type="button" class="combo-opt${sel}${hi}" data-v="${esc(n)}" role="option">${esc(n)}</button>`;
      }).join("");
      for (const b of list.querySelectorAll("[data-v]")) {
        b.onmouseenter = () => {
          const opts = [...list.querySelectorAll(".combo-opt")];
          comboPop.hi = opts.indexOf(b);
          opts.forEach((o, idx) => o.classList.toggle("active", idx === comboPop.hi));
        };
        b.onclick = () => comboPick(b.getAttribute("data-v"));
      }
      const act = list.querySelector(".combo-opt.active");
      if (act) act.scrollIntoView({ block: "nearest" });
    }

    function comboMove(delta) {
      const opts = [...document.querySelectorAll("#combo-list .combo-opt")];
      if (!opts.length) return;
      comboPop.hi = (comboPop.hi + delta + opts.length) % opts.length;
      opts.forEach((o, idx) => o.classList.toggle("active", idx === comboPop.hi));
      opts[comboPop.hi].scrollIntoView({ block: "nearest" });
    }

    function comboPick(v) {
      const onPick = comboPop.onPick;
      comboClose();
      if (onPick) onPick(v);
    }

    function comboClose() {
      const pop = $("#combo-pop");
      if (pop) pop.hidden = true;
      if (comboPop.host) {
        const btn = comboPop.host.querySelector(".combo-btn");
        if (btn) {
          btn.classList.remove("open");
          btn.setAttribute("aria-expanded", "false");
        }
      }
      comboPop.host = null;
      comboPop.onPick = null;
    }

    function comboPlace(host) {
      const pop = $("#combo-pop");
      if (!pop || !host) return;
      const r = host.getBoundingClientRect();
      const width = Math.max(r.width, 200);
      const left = Math.max(8, Math.min(r.left, window.innerWidth - width - 8));
      pop.style.width = width + "px";
      pop.style.left = left + "px";
      const spaceBelow = window.innerHeight - r.bottom - 8;
      const spaceAbove = r.top - 8;
      const maxH = Math.min(360, window.innerHeight * 0.6);
      if (spaceBelow < 140 && spaceAbove > spaceBelow) {
        pop.style.top = "auto";
        pop.style.bottom = (window.innerHeight - r.top + 4) + "px";
        pop.style.maxHeight = Math.max(120, Math.min(maxH, spaceAbove)) + "px";
      } else {
        pop.style.bottom = "auto";
        pop.style.top = (r.bottom + 4) + "px";
        pop.style.maxHeight = Math.max(120, Math.min(maxH, spaceBelow)) + "px";
      }
    }

    function dbShowErr(msg) {
      dbAdmin.error = msg || "";
      const box = $("#db-err");
      if (!box) return;
      if (!msg) {
        box.hidden = true;
        box.textContent = "";
        return;
      }
      box.hidden = false;
      box.textContent = msg;
    }

    function bindDbPanel() {
      const names = dbRunningServices().map((s) => s.name).filter(Boolean);
      comboBind($("#db-service"), {
        items: names,
        value: dbAdmin.service,
        placeholder: names.length ? "请选择容器" : "没有运行中的容器",
        onChange: dbOnService,
      });
      comboBind($("#db-engine"), {
        items: ["postgres"],
        value: dbAdmin.engine || "postgres",
        placeholder: "请选择类型",
        onChange: (v) => { dbAdmin.engine = v; },
      });
      comboBind($("#db-database"), {
        items: dbAdmin.databases,
        value: dbAdmin.database,
        placeholder: "请选择数据库",
        onChange: dbOnDatabase,
      });
      comboBind($("#db-schema"), {
        items: dbAdmin.schemas,
        value: dbAdmin.schema,
        placeholder: "请选择 schema",
        onChange: dbOnSchema,
      });
      const sqlBtn = $("#btn-db-sql");
      if (sqlBtn) sqlBtn.onclick = openDbSqlDialog;
      const filter = $("#db-filter");
      if (filter) {
        if (filter.value !== (dbAdmin.filter || "")) filter.value = dbAdmin.filter || "";
        filter.oninput = () => {
          dbAdmin.filter = filter.value;
          dbRenderObjects();
        };
      }
      dbRenderObjects();
      dbRenderRows();
      dbShowErr(dbAdmin.error);
    }

    function dbEnsureLoaded() {
      bindDbPanel();
      if (!dbAdmin.service) {
        const names = dbRunningServices().map((s) => s.name);
        const guess = names.find((n) => /postgis|postgres|pg/i.test(n)) || names[0] || "";
        if (guess) dbOnService(guess);
      }
    }

    function dbQs(extra) {
      const q = new URLSearchParams();
      q.set("service", dbAdmin.service);
      q.set("engine", dbAdmin.engine || "postgres");
      if (dbAdmin.database) q.set("database", dbAdmin.database);
      if (dbAdmin.schema) q.set("schema", dbAdmin.schema);
      if (extra) for (const [k, v] of Object.entries(extra)) if (v != null && v !== "") q.set(k, v);
      return q.toString();
    }

    async function dbOnService(name) {
      dbAdmin.service = name || "";
      dbAdmin.database = "";
      dbAdmin.schema = "";
      dbAdmin.databases = [];
      dbAdmin.schemas = [];
      dbAdmin.objects = [];
      dbAdmin.selected = null;
      dbAdmin.rows = [];
      dbAdmin.columns = [];
      dbAdmin.pk = [];
      dbAdmin.rowIndex = null;
      dbAdmin.total = 0;
      dbAdmin.sqlResult = null;
      dbShowErr("");
      bindDbPanel();
      if (!dbAdmin.service) return;
      try {
        dbAdmin.busy = true;
        const meta = await api("/api/projects/" + state.current.id + "/db/meta?" + dbQs());
        if (!(meta.engines || []).includes("postgres")) {
          dbShowErr("该容器未检测到 PostgreSQL / psql");
          return;
        }
        const dbs = await api("/api/projects/" + state.current.id + "/db/databases?" + dbQs());
        dbAdmin.databases = dbs.items || [];
        const def = meta.default_database && dbAdmin.databases.includes(meta.default_database)
          ? meta.default_database
          : dbAdmin.databases[0] || "";
        bindDbPanel();
        if (def) await dbOnDatabase(def);
      } catch (e) {
        dbShowErr(e.message);
        bindDbPanel();
      } finally {
        dbAdmin.busy = false;
      }
    }

    async function dbOnDatabase(name) {
      dbAdmin.database = name || "";
      dbAdmin.schema = "";
      dbAdmin.schemas = [];
      dbAdmin.objects = [];
      dbAdmin.selected = null;
      dbAdmin.rows = [];
      dbAdmin.columns = [];
      dbAdmin.pk = [];
      dbAdmin.rowIndex = null;
      dbAdmin.total = 0;
      bindDbPanel();
      if (!dbAdmin.database) return;
      try {
        const data = await api("/api/projects/" + state.current.id + "/db/schemas?" + dbQs());
        dbAdmin.schemas = data.items || [];
        const def = dbAdmin.schemas.includes("public") ? "public" : (dbAdmin.schemas[0] || "");
        bindDbPanel();
        if (def) await dbOnSchema(def);
      } catch (e) {
        dbShowErr(e.message);
        bindDbPanel();
      }
    }

    async function dbOnSchema(name) {
      dbAdmin.schema = name || "";
      dbAdmin.objects = [];
      dbAdmin.selected = null;
      dbAdmin.rows = [];
      dbAdmin.columns = [];
      dbAdmin.pk = [];
      dbAdmin.rowIndex = null;
      dbAdmin.total = 0;
      bindDbPanel();
      if (!dbAdmin.schema) return;
      try {
        const data = await api("/api/projects/" + state.current.id + "/db/objects?" + dbQs());
        dbAdmin.objects = data.items || [];
        dbShowErr("");
      } catch (e) {
        dbShowErr(e.message);
      }
      bindDbPanel();
    }

    function dbObjIcon(kind) {
      if (kind === "view") {
        return '<svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.83.88 9.576.43 8.898a1.62 1.62 0 0 1 0-1.798c.45-.677 1.367-1.931 2.637-3.022C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.12.12 0 0 0 0 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 0 0 0-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.825.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717ZM8 10a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 10Z"/></svg>';
      }
      return '<svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25ZM6.5 6.5v8h7.75a.25.25 0 0 0 .25-.25V6.5Zm8-1.5V1.75a.25.25 0 0 0-.25-.25H6.5V5Zm-13 1.5v7.75c0 .138.112.25.25.25H5v-8ZM5 5V1.5H1.75a.25.25 0 0 0-.25.25V5Z"/></svg>';
    }

    function dbFilteredObjects() {
      const q = (dbAdmin.filter || "").trim().toLowerCase();
      const items = dbAdmin.objects || [];
      if (!q) return items;
      return items.filter((o) => {
        const kind = o.kind === "view" ? "视图" : "表";
        return (o.name || "").toLowerCase().includes(q) || kind.includes(q) || (o.kind || "").toLowerCase().includes(q);
      });
    }

    function dbRenderObjects() {
      const box = $("#db-objects");
      if (!box) return;
      const all = dbAdmin.objects || [];
      if (!all.length) {
        box.innerHTML = `<div class="empty">${dbAdmin.schema ? "该 schema 下没有表或视图" : "请选择容器和 schema"}</div>`;
        return;
      }
      const items = dbFilteredObjects();
      const q = (dbAdmin.filter || "").trim();
      if (!items.length) {
        box.innerHTML = `<div class="empty">没有匹配「${esc(q)}」的表或视图</div>`;
        return;
      }
      box.innerHTML = items.map((o) => {
        const on = dbAdmin.selected && dbAdmin.selected.name === o.name;
        const kind = o.kind === "view" ? "视图" : "表";
        return `<button type="button" class="db-obj${on ? " active" : ""}" data-db-obj="${esc(o.name)}" data-db-kind="${esc(o.kind)}" title="${esc(kind)}">${dbObjIcon(o.kind)}<span class="n">${esc(o.name)}</span></button>`;
      }).join("");
      for (const b of box.querySelectorAll("[data-db-obj]")) {
        b.onclick = () => dbOpenObject(b.getAttribute("data-db-obj"), b.getAttribute("data-db-kind"));
      }
    }

    async function dbOpenObject(name, kind) {
      dbAdmin.selected = { name, kind };
      dbAdmin.offset = 0;
      dbAdmin.rowIndex = null;
      dbAdmin.filterCol = "";
      dbAdmin.filterValue = "";
      dbRenderObjects();
      await dbLoadRows();
    }

    async function dbLoadRows() {
      if (!dbAdmin.selected || !state.current) return;
      const box = $("#db-data");
      if (box) box.innerHTML = `<div class="empty db-loading"><span class="spin"></span>加载中…</div>`;
      try {
        const data = await api("/api/projects/" + state.current.id + "/db/rows?" + dbQs({
          name: dbAdmin.selected.name,
          offset: String(dbAdmin.offset),
          limit: String(dbAdmin.limit),
          filter_col: dbAdmin.filterCol,
          filter_op: dbAdmin.filterOp,
          filter_value: dbAdmin.filterValue,
        }));
        dbAdmin.columns = data.columns || [];
        dbAdmin.rows = data.rows || [];
        dbAdmin.pk = data.pk || [];
        dbAdmin.total = data.total || 0;
        dbAdmin.offset = data.offset || 0;
        dbAdmin.limit = data.limit || dbAdmin.limit;
        if (dbAdmin.rowIndex != null && dbAdmin.rowIndex >= dbAdmin.rows.length) dbAdmin.rowIndex = null;
        dbShowErr("");
      } catch (e) {
        dbShowErr(e.message);
      }
      dbRenderRows();
      dbRenderFilter();
    }

    const dbFilterOps = [
      ["contains", "包含"],
      ["eq", "等于"],
      ["neq", "不等于"],
      ["prefix", "开头是"],
      ["suffix", "结尾是"],
    ];
    function dbOpLabel(op) {
      return (dbFilterOps.find(([v]) => v === op) || ["contains", "包含"])[1];
    }
    function dbOpValue(label) {
      return (dbFilterOps.find(([, t]) => t === label) || ["contains", "包含"])[0];
    }

    function dbRenderFilter() {
      const box = $("#db-rowfilter");
      if (!box) return;
      const cols = dbAdmin.columns || [];
      if (!dbAdmin.selected || !cols.length) {
        box.hidden = true;
        box.innerHTML = "";
        box.dataset.cols = "";
        return;
      }
      const signature = dbAdmin.selected.name + "\u0000" + cols.join("\u0001");
      if (box.dataset.cols === signature) return;
      box.dataset.cols = signature;
      if (!cols.includes(dbAdmin.filterCol)) dbAdmin.filterCol = cols[0] || "";
      box.innerHTML = `
        <label>字段</label>
        <div class="combo" id="db-fcol"></div>
        <label>条件</label>
        <div class="combo" id="db-fop"></div>
        <input id="db-fval" type="text" placeholder="过滤值（留空清除过滤）" value="${esc(dbAdmin.filterValue)}" autocomplete="off" spellcheck="false" />
        <button type="button" class="btn" id="db-fapply">过滤</button>
        <button type="button" class="btn ghost" id="db-fclear">清除</button>
      `;
      box.hidden = false;
      comboBind($("#db-fcol"), {
        items: cols,
        value: dbAdmin.filterCol,
        placeholder: "字段",
        onChange: (v) => {
          dbAdmin.filterCol = v;
          const el = $("#db-fcol .combo-val");
          if (el) { el.textContent = v; el.classList.remove("ph"); }
        },
      });
      comboBind($("#db-fop"), {
        items: dbFilterOps.map(([, t]) => t),
        value: dbOpLabel(dbAdmin.filterOp),
        placeholder: "条件",
        onChange: (v) => {
          dbAdmin.filterOp = dbOpValue(v);
          const el = $("#db-fop .combo-val");
          if (el) { el.textContent = v; el.classList.remove("ph"); }
        },
      });
      const val = $("#db-fval");
      const apply = $("#db-fapply");
      const clear = $("#db-fclear");
      const doApply = () => {
        dbAdmin.filterValue = val.value;
        dbAdmin.offset = 0;
        dbAdmin.rowIndex = null;
        dbLoadRows();
      };
      if (val) val.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); doApply(); } };
      if (apply) apply.onclick = doApply;
      if (clear) clear.onclick = () => {
        dbAdmin.filterValue = "";
        dbAdmin.offset = 0;
        dbAdmin.rowIndex = null;
        val.value = "";
        dbLoadRows();
      };
    }

    function dbCell(v) {
      if (v == null) return "";
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    function dbRenderRows() {
      const box = $("#db-data");
      const pager = $("#db-pager");
      if (!box) return;
      if (!dbAdmin.selected) {
        box.innerHTML = `<div class="empty">点击左侧表或视图查看数据</div>`;
        if (pager) pager.innerHTML = `<span class="hint">选择左侧表或视图后分页浏览</span>`;
        return;
      }
      const cols = dbAdmin.columns || [];
      const rows = dbAdmin.rows || [];
      if (!cols.length) {
        box.innerHTML = `<div class="empty">${esc(dbAdmin.selected.name)} 无数据</div>`;
      } else {
        box.innerHTML = `<table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
          rows.map((r, ri) => `<tr data-db-row="${ri}" class="${dbAdmin.rowIndex === ri ? "active" : ""}">${cols.map((_, i) => {
            const t = dbCell(r[i]);
            return `<td title="${esc(t)}">${esc(t.length > 120 ? t.slice(0, 120) + "…" : t)}</td>`;
          }).join("")}</tr>`).join("") || `<tr><td class="empty" colspan="${cols.length}">无行</td></tr>`
        }</tbody></table>`;
        for (const tr of box.querySelectorAll("[data-db-row]")) {
          tr.onclick = () => {
            dbAdmin.rowIndex = Number(tr.getAttribute("data-db-row"));
            dbRenderRows();
          };
          tr.ondblclick = () => {
            dbAdmin.rowIndex = Number(tr.getAttribute("data-db-row"));
            openDbEditDialog();
          };
        }
      }
      if (pager) {
        const from = dbAdmin.total ? dbAdmin.offset + 1 : 0;
        const to = Math.min(dbAdmin.offset + (rows.length || 0), dbAdmin.total);
        const canEdit = dbAdmin.selected.kind !== "view" && dbAdmin.rowIndex != null;
        const rowHint = dbAdmin.selected.kind === "view" ? "视图不能直接修改" : "选中一行后操作";
        pager.innerHTML = `
          <button type="button" class="btn" id="db-prev" ${dbAdmin.offset <= 0 ? "disabled" : ""}>上一页</button>
          <span class="hint">${esc(dbAdmin.selected.name)} · ${from}-${to} / ${dbAdmin.total}${dbAdmin.pk && dbAdmin.pk.length ? " · 主键 " + esc(dbAdmin.pk.join(", ")) : ""}</span>
          <button type="button" class="btn" id="db-edit-row" ${canEdit ? "" : "disabled"} title="${esc(rowHint)}">编辑</button>
          <button type="button" class="btn danger" id="db-del-row" ${canEdit ? "" : "disabled"} title="${esc(rowHint)}">删除</button>
          <button type="button" class="btn" id="db-next" ${dbAdmin.offset + dbAdmin.limit >= dbAdmin.total ? "disabled" : ""}>下一页</button>`;
        const prev = $("#db-prev");
        const next = $("#db-next");
        const edit = $("#db-edit-row");
        const del = $("#db-del-row");
        if (prev) prev.onclick = () => { dbAdmin.offset = Math.max(0, dbAdmin.offset - dbAdmin.limit); dbAdmin.rowIndex = null; dbLoadRows(); };
        if (next) next.onclick = () => { dbAdmin.offset += dbAdmin.limit; dbAdmin.rowIndex = null; dbLoadRows(); };
        if (edit) edit.onclick = openDbEditDialog;
        if (del) del.onclick = dbDeleteRow;
      }
    }

    function dbRowObject(row) {
      const obj = {};
      (dbAdmin.columns || []).forEach((c, i) => { obj[c] = row[i]; });
      return obj;
    }

    function dbParseField(text, asNull, original) {
      if (asNull) return null;
      if (original !== null && typeof original === "object") {
        try { return JSON.parse(text); } catch { return text; }
      }
      if (typeof original === "boolean") {
        if (text === "true" || text === "TRUE") return true;
        if (text === "false" || text === "FALSE") return false;
      }
      if (typeof original === "number" && text !== "" && Number.isFinite(Number(text))) return Number(text);
      return text;
    }

    function dbSelectedRowKeys() {

        html += `<div class="db-data" style="max-height:none;border:1px solid var(--line)"><table><thead><tr>${
          cols.map((c) => `<th>${esc(c)}</th>`).join("")

          rows.map((r) => `<tr>${cols.map((_, i) => {

    async function runUpdate(snapshotOnly) {
      if (state.busy) {
        flash("err", "正在处理中，请勿重复操作");
        return;
      }
      if (!snapshotOnly && !state.files.length) {
        flash("err", "请至少选择一个镜像包或 JAR，或使用「仅备份当前目录」。");
        return;
      }
      const stopFirst = $("#f-stop") ? $("#f-stop").checked : true;
      if (!(await confirmDialog(
        "将全量备份当前目录（包含数据库数据）。\n" +
        (stopFirst ? "会先停止 Compose，再备份。\n" : "请先手动停止当前应用，否则备份可能失败或不完整。\n") +
        "确定继续？"
      ))) {
        return;
      }
      let stop = () => {};
      setBusy("update");
      try {
        const job = await api("/api/jobs", { method: "POST" });
        const fd = new FormData();
        fd.append("note", $("#note").value || (snapshotOnly ? "目录快照" : ""));
        fd.append("stop_compose", stopFirst ? "true" : "false");
        fd.append("restart", snapshotOnly
          ? (stopFirst ? "true" : "false")
          : ($("#restart") && $("#restart").checked ? "true" : "false"));
        fd.append("job_id", job.id);
        if (!snapshotOnly) for (const f of state.files) fd.append("files", f, f.name);

        const totalBytes = snapshotOnly ? 0 : state.files.reduce((s, f) => s + (f.size || 0), 0);
        showProgress("prog", true);
        renderProgress("prog", {
          message: snapshotOnly ? "正在备份当前目录…" : "正在上传文件…",
          percent: 0,
          current: 0,
          total: totalBytes,
        });
        stop = watchJob(job.id, "prog");

        const data = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable || snapshotOnly) return;
            renderProgress("prog", {
              message: "正在上传文件…",
              percent: Math.round(e.loaded / e.total * 100),
              current: e.loaded,
              total: e.total,
            });
          };
          xhr.onload = () => {
            let payload = {};
            try { payload = JSON.parse(xhr.responseText || "{}"); } catch { payload = { error: xhr.responseText }; }
            if (xhr.status === 401) {
              showGate((payload && payload.error) || "请先登录或登录已过期");
              reject(new Error((payload && payload.error) || "请先登录"));
              return;
            }
            if (xhr.status >= 400) reject(new Error(payload.error || xhr.statusText));
            else resolve(payload);
          };
          xhr.onerror = () => reject(new Error("上传失败"));
          xhr.open("POST", "/api/projects/" + state.current.id + "/updates");
          xhr.send(fd);
        });
        flash("ok", `已将 ${data.version.label} 发布为最新版。`);
        state.files = [];
        state.projectTab = "versions";
        clearBusy();
        await openProject(state.current.id);
        flash("ok", `已将 ${data.version.label} 发布为最新版。`);
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);
      } finally {
        stop();
      }
    }

    async function compose(action) {
      const spec = COMPOSE_ACTION[action];
      if (!spec || !state.current) return;
      if (state.busy) {
        flash("err", "正在处理中，请勿重复操作");
        return;
      }
      setBusy("compose");
      const btn = document.getElementById(spec.btn);
      if (btn) {
        btn.textContent = spec.busy;
        btn.classList.add("working");
      }
      showComposeOp(spec.run);
      flash("ok", spec.run);
      try {
        await api("/api/projects/" + state.current.id + "/compose/" + action, { method: "POST" });
        try {
          state.compose = await api("/api/projects/" + state.current.id + "/compose");
        } catch {}
        clearBusy();
        renderProject();
        flash("ok", spec.done);
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);

      if (!state.current || !name) return;
      if (state.busy) {
        flash("err", "正在处理中，请稍后再重启该服务");
        return;
      }
      if (!(await confirmDialog("确定重启服务 " + name + "？其它容器不受影响。"))) return;
      const btn = document.querySelector('[data-svc-restart="' + CSS.escape(name) + '"]');
      const idle = btn ? btn.textContent : "重启";
      if (btn) {
        btn.disabled = true;
        btn.textContent = "重启中…";
        btn.classList.add("working");
      }
      flash("ok", "正在重启 " + name + "…");
      try {
        await api(
          "/api/projects/" + state.current.id + "/compose/restart/" + encodeURIComponent(name),
          { method: "POST" }
        );
        flash("ok", "已重启 " + name);
        await refreshComposeStatus();
      } catch (e) {
        flash("err", e.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = idle;
          btn.classList.remove("working");
        }
      }
    }

        ? { background: "#0d1117", foreground: "#f0f6fc", cursor: "#f0f6fc", selectionBackground: "#388bfd66" }
        : { background: "#ffffff", foreground: "#1f2328", cursor: "#1f2328", selectionBackground: "#0969da33" };

    function loadXterm() {
      if (window.Terminal && window.FitAddon) return Promise.resolve();
      if (dialog.xtermReady) return dialog.xtermReady;
      dialog.xtermReady = new Promise((resolve, reject) => {
        if (!document.getElementById("xterm-css")) {
          const css = document.createElement("link");
          css.id = "xterm-css";
          css.rel = "stylesheet";
          css.href = "/vendor/xterm.css";
          document.head.appendChild(css);
        }
        const s1 = document.createElement("script");
        s1.src = "/vendor/xterm.js";
        s1.onload = () => {
          const s2 = document.createElement("script");
          s2.src = "/vendor/xterm-addon-fit.js";
          s2.onload = resolve;
          s2.onerror = () => reject(new Error("无法加载 xterm-addon-fit.js"));
          document.head.appendChild(s2);
        };
        s1.onerror = () => reject(new Error("无法加载 xterm.js"));
        document.head.appendChild(s1);
      });
      return dialog.xtermReady;
    }
