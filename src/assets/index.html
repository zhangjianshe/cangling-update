      const box = $("#compose-edit-flash");
      if (!box) return;
      if (!msg) {
        box.hidden = true;
        box.textContent = "";
        return;
      }
      box.className = "flash compose-edit-flash " + kind;
      box.textContent = msg;
      box.hidden = false;
    }

    function composeDirty() {
      return !!(composeEdit.editor && composeEdit.editor.getValue() !== composeEdit.disk);
    }

    function fileEditSpec() {
      return FILE_EDIT[composeEdit.kind] || FILE_EDIT.compose;
    }

    function aceThemeName() {
      return currentTheme() === "light" ? "ace/theme/github" : "ace/theme/github_dark";
    }

    function applyAceTheme() {
      if (composeEdit.editor) composeEdit.editor.setTheme(aceThemeName());
      if (dialog.sqlEditor) dialog.sqlEditor.setTheme(aceThemeName());
    }

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) {
          resolve();
          return;
        }
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("无法加载 " + src));
        document.head.appendChild(s);
      });
    }

    function loadAce() {
      if (window.ace) return Promise.resolve();
      if (dialog.aceReady) return dialog.aceReady;
      dialog.aceReady = (async () => {
        await loadScriptOnce("/vendor/ace/ace.js");
        if (!window.ace) throw new Error("无法加载 Ace 编辑器");
        window.ace.config.set("basePath", "/vendor/ace");
        window.ace.config.set("loadWorkerFromBlob", false);
        await Promise.all([
          loadScriptOnce("/vendor/ace/mode-yaml.js"),
          loadScriptOnce("/vendor/ace/mode-ini.js"),
          loadScriptOnce("/vendor/ace/mode-sql.js"),
          loadScriptOnce("/vendor/ace/theme-github.js"),
          loadScriptOnce("/vendor/ace/theme-github_dark.js"),
          loadScriptOnce("/vendor/ace/ext-searchbox.js"),
        ]);
      })();
      return dialog.aceReady;
    }

    function destroyAceEditor() {
      if (composeEdit.resizeObs) {
        try { composeEdit.resizeObs.disconnect(); } catch {}
        composeEdit.resizeObs = null;
      }
      if (composeEdit.editor) {
        try { composeEdit.editor.destroy(); } catch {}
        composeEdit.editor = null;
      }
    }

    function destroySqlEditor() {
      if (dialog.sqlEditor) {
        try { dbAdmin.sql = dialog.sqlEditor.getValue() || ""; } catch {}
      }
      if (dialog.sqlResizeObs) {
        try { dialog.sqlResizeObs.disconnect(); } catch {}
        dialog.sqlResizeObs = null;
      }
      if (dialog.sqlEditor) {
        try { dialog.sqlEditor.destroy(); } catch {}
        dialog.sqlEditor = null;
      }
    }

    function mountSqlEditor() {
      destroySqlEditor();
      const el = $("#db-sql-ace");
      if (!el || !window.ace) return;
      const editor = window.ace.edit(el, {
        mode: "ace/mode/sql",
        theme: aceThemeName(),
        useWorker: false,
        fontSize: 16,
        tabSize: 2,
        useSoftTabs: true,
        wrap: false,
        showPrintMargin: false,
        fadeFoldWidgets: true,
        scrollPastEnd: 0.4,
        fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace',
      });
      editor.commands.addCommand({
        name: "runSql",
        bindKey: { win: "Ctrl-Enter", mac: "Command-Enter" },
        exec: () => dbRunSql(),
      });
      editor.setValue(dbAdmin.sql || "", -1);
      editor.clearSelection();
      editor.focus();
      dialog.sqlEditor = editor;
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          if (dialog.sqlEditor) dialog.sqlEditor.resize();
        });
        ro.observe(el);
        dialog.sqlResizeObs = ro;
      }
    }

    function mountAceEditor() {
      destroyAceEditor();
      const el = $("#compose-ace");
      if (!el || !window.ace) return;
      const spec = fileEditSpec();
      const editor = window.ace.edit(el, {
        mode: spec.mode,
        theme: aceThemeName(),
        useWorker: false,
        fontSize: 16,
        tabSize: 2,
        useSoftTabs: true,
        wrap: false,
        showPrintMargin: false,
        fadeFoldWidgets: true,
        scrollPastEnd: 0.4,
        fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace',
      });
      editor.commands.addCommand({
        name: "saveFile",
        bindKey: { win: "Ctrl-S", mac: "Command-S" },
        exec: () => saveComposeFile(),
      });
      editor.focus();
      composeEdit.editor = editor;
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          if (composeEdit.editor) composeEdit.editor.resize();
        });
        ro.observe(el);
        composeEdit.resizeObs = ro;
      }
    }

    function setComposeSource(text) {
      if (composeEdit.editor) composeEdit.editor.setValue(text ?? "", -1);
    }

    function applyComposeFile(data, selectedId) {
      const spec = fileEditSpec();
      composeEdit.etag = data.etag || "";
      composeEdit.disk = data.content || "";
      composeEdit.filename = data.filename || spec.defaultName;
      composeEdit.selected = selectedId || null;
      if (selectedId == null) setComposeSource(data.content || "");
      const meta = $("#compose-edit-meta");
      if (meta) {
        const mismatch = data.exists && data.revisions && data.revisions.length && !data.matches_latest
          ? "磁盘内容与最近一次保存不一致"
          : "";
        const rev = data.current_rev_no ? "r" + data.current_rev_no : "尚无历史";
        meta.innerHTML = `<span class="path">${esc(data.path || composeEdit.filename)}</span>` +
          `<span>${esc(rev)}</span>` +
          (!data.exists && spec.missing ? `<span>${esc(spec.missing)}</span>` : "") +
          (mismatch ? `<span class="bad">${esc(mismatch)}</span>` : "");
      }
      renderComposeRevisions(data, selectedId);
    }

    function renderComposeRevisions(data, selectedId) {
      const box = $("#compose-rev-list");
      if (!box) return;
      const revs = data.revisions || [];
      if (!revs.length) {
        box.innerHTML = `<div class="empty">保存后会出现历史版本</div>`;
        return;
      }
      box.innerHTML = revs.map((r) => {
        const onDisk = r.etag === data.etag;
        const active = selectedId ? r.id === selectedId : onDisk;
        return `<button type="button" class="rev-item${active ? " active" : ""}" data-rev="${esc(r.id)}">
          <span class="rev-h">r${r.rev_no} ${esc(COMPOSE_REV_KIND[r.kind] || r.kind)}${onDisk ? ` <span class="pill latest">当前</span>` : ""}</span>
          <span class="rev-n">${esc(r.note || "（无备注）")}</span>
          <span class="rev-t">${esc(fmtDateTime(r.created_at))} · ${fmtBytes(r.bytes || 0)}</span>
          ${onDisk ? "" : `<span class="row" style="margin-top:6px;justify-content:flex-start"><span class="btn" data-restore-rev="${esc(r.id)}">恢复此版本</span></span>`}
        </button>`;
      }).join("");
      for (const b of box.querySelectorAll("[data-rev]")) {
        b.onclick = (e) => {
          if (e.target.closest("[data-restore-rev]")) return;
          loadComposeRevision(b.getAttribute("data-rev"));
        };
      }
      for (const b of box.querySelectorAll("[data-restore-rev]")) {
        b.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          restoreComposeRevision(b.getAttribute("data-restore-rev"));
        };
      }
    }

    async function openComposeEditor() {
      return openFileEditor("compose");
    }

    async function openEnvEditor() {
      return openFileEditor("env");
    }

    async function openFileEditor(kind) {
      if (!state.current) return;
      if (state.busy) {
        flash("err", "正在处理中，请勿重复操作");
        return;
      }
      try {
        await loadAce();
        if (document.fonts && document.fonts.load) {
          await document.fonts.load('16px "Iosevka Term"');
        }
      } catch (e) {
        flash("err", e.message);
        return;
      }
      closeDialog();
      composeEdit.kind = kind === "env" ? "env" : "compose";
      const spec = fileEditSpec();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("compose-modal");
      $("#dialog-title").textContent = spec.title;
      $("#dialog-extra").hidden = true;
      $("#dialog-body").innerHTML = `
        <div class="compose-edit">
          <div class="compose-edit-top">
            <div id="compose-edit-meta" class="compose-edit-meta hint">加载中…</div>
            <div class="flash compose-edit-flash" id="compose-edit-flash" hidden></div>
          </div>
          <div class="compose-edit-main">
            <div id="compose-ace"></div>
          </div>
          <div class="compose-edit-actions">
            <label class="compose-note-wrap">备注<input id="compose-note" type="text" placeholder="本次改了什么（可选）" /></label>
            <label class="check"><input type="checkbox" id="compose-recreate" /> 保存后执行 Compose Up</label>
            <button type="button" class="btn primary" id="btn-compose-save">保存</button>
            <button type="button" class="btn" id="btn-compose-close">关闭</button>
          </div>
          <div class="compose-edit-hist">
            <h4>文件版本</h4>
            <div id="compose-rev-list"><div class="empty">加载中…</div></div>
          </div>
        </div>`;
      $("#dialog").hidden = false;
      dialog.confirmClose = async () => {
        if (!composeDirty()) return true;
        return await confirmDialog("有未保存的修改，确定关闭？", { danger: true });
      };
      mountAceEditor();
      $("#btn-compose-save").onclick = saveComposeFile;
      $("#btn-compose-close").onclick = requestCloseDialog;
      try {
        const data = await api(spec.file(state.current.id));
        applyComposeFile(data, null);
        if (composeEdit.editor) composeEdit.editor.focus();
      } catch (e) {
        composeEditFlash("err", e.message);
      }
    }

    async function loadComposeRevision(revId) {
      if (!state.current || !revId || composeEdit.busy) return;
      if (composeDirty() && !(await confirmDialog("编辑器里有未保存的修改，确定加载此版本到编辑器？", { danger: true }))) return;
      try {
        const rev = await api(fileEditSpec().rev(state.current.id, revId));
        setComposeSource(rev.content || "");
        composeEdit.selected = rev.id;
        const items = document.querySelectorAll(".rev-item");
        for (const el of items) {
          el.classList.toggle("active", el.getAttribute("data-rev") === rev.id);
        }
        if (rev.etag === composeEdit.etag) {
          composeEditFlash("", "");
        } else {
          composeEditFlash("ok", "已载入 r" + rev.rev_no + "，保存或点「恢复此版本」才会写入磁盘");
        }
      } catch (e) {
        composeEditFlash("err", e.message);
      }
    }

    async function saveComposeFile() {
      if (!state.current || composeEdit.busy || !composeEdit.editor) return;
      composeEdit.busy = true;
      const btn = $("#btn-compose-save");
      if (btn) btn.disabled = true;
      composeEditFlash("ok", "正在保存…");
      try {
        const data = await api(fileEditSpec().file(state.current.id), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: composeEdit.editor.getValue(),
            note: ($("#compose-note") && $("#compose-note").value) || "",
            recreate: $("#compose-recreate") ? $("#compose-recreate").checked : false,
            expected_etag: composeEdit.etag,
          }),
        });
        applyComposeFile(data, null);
        if ($("#compose-note")) $("#compose-note").value = "";
        let msg = data.unchanged ? "内容和磁盘一致，未写入新版本" : "已保存 r" + (data.current_rev_no || "");
        if (data.recreate_log) msg += "。已尝试启动 Compose。";
        composeEditFlash("ok", msg);
        refreshComposeStatus();
      } catch (e) {
        composeEditFlash("err", e.message);
      } finally {
        composeEdit.busy = false;
        if (btn) btn.disabled = false;
      }
    }

    async function restoreComposeRevision(revId) {
      if (!state.current || !revId || composeEdit.busy) return;
      if (composeDirty() && !(await confirmDialog("编辑器里有未保存的修改，确定用此历史版本覆盖磁盘上的文件？", { danger: true }))) return;
      else if (!composeDirty() && !(await confirmDialog(fileEditSpec().restoreMsg, { danger: true }))) return;
      composeEdit.busy = true;
      composeEditFlash("ok", "正在恢复…");
      try {
        const data = await api(
          fileEditSpec().restore(state.current.id, revId),
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              recreate: $("#compose-recreate") ? $("#compose-recreate").checked : false,
            }),
          }
        );
        applyComposeFile(data, null);
        composeEditFlash("ok", "已恢复并保存为 r" + (data.current_rev_no || "") + (data.recreate_log ? "。已尝试启动 Compose。" : ""));
        refreshComposeStatus();
      } catch (e) {
        composeEditFlash("err", e.message);
      } finally {
        composeEdit.busy = false;
      }
    }

    async function openServiceLogs(name) {
      if (!state.current || !name) return;
      closeDialog();
      $("#dialog-title").textContent = "日志 · " + name;
      $("#dialog-body").innerHTML = `<pre class="logs" id="dialog-logs">加载中…</pre>`;
      $("#dialog").hidden = false;
      const load = async () => {
        const el = $("#dialog-logs");
        if (!el) return;
        try {
          const data = await api(
            "/api/projects/" + state.current.id + "/compose/logs?tail=500&service=" + encodeURIComponent(name)
          );
          setLogs(el, data.logs);
          el.scrollTop = el.scrollHeight;
        } catch (e) {
          setLogs(el, e.message);
        }
      };
      setDialogAction("刷新", load);
      await load();
    }

    async function openTerm(name) {
      if (!state.current || !name) return;
      closeDialog();
      try {
        await loadXterm();
        if (document.fonts && document.fonts.load) {
          await document.fonts.load('15px "Iosevka Term"');
          await document.fonts.load('bold 15px "Iosevka Term"');
        }
      } catch (e) {
        flash("err", e.message);
        return;
      }
      $("#dialog-title").textContent = "终端 · " + name;
      $("#dialog-extra").hidden = true;
      $("#dialog-body").innerHTML = `<div class="term" id="term"></div>`;
      $("#dialog").hidden = false;
      const term = new window.Terminal({
        cursorBlink: true,
        fontSize: 15,
        fontFamily: '"Iosevka Term", "Iosevka Terminal", ui-monospace, monospace',
        theme: termTheme(),
      });
      const Fit = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);
      const fit = Fit ? new Fit() : null;
      if (fit) term.loadAddon(fit);
      term.open($("#term"));
      if (fit) fit.fit();
      dialog.term = term;
      dialog.fit = fit;

      const proto = location.protocol === "https:" ? "wss" : "ws";
      const qs = "?cols=" + (term.cols || 80) + "&rows=" + (term.rows || 24) +
        (sessionToken() ? "&token=" + encodeURIComponent(sessionToken()) : "");
      const ws = new WebSocket(
        proto + "://" + location.host + "/api/projects/" + state.current.id +
        "/compose/exec/" + encodeURIComponent(name) + qs
      );
      ws.binaryType = "arraybuffer";
      dialog.ws = ws;
      ws.onmessage = (ev) => {
        if (typeof ev.data === "string") term.write(ev.data);
        else term.write(new Uint8Array(ev.data));
      };
      ws.onerror = () => term.writeln("\r\n连接失败");
      ws.onclose = () => term.writeln("\r\n连接已关闭");
      term.onData((data) => {
        if (ws.readyState === 1) ws.send(data);
      });
      const sendResize = () => {
        if (fit) fit.fit();
        if (ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      };
      dialog.onResize = sendResize;
      window.addEventListener("resize", sendResize);
      setTimeout(sendResize, 50);
      term.focus();
    }

    async function deleteProject() {
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      if (!(await confirmDialog("确定删除此项目及其版本备份？主机上的 Compose 目录不会被删除。", { danger: true }))) return;
      try {
        await api("/api/projects/" + state.current.id, { method: "DELETE" });
        location.hash = "#/";
        await refreshProjects();
        renderHome();
      } catch (e) {
        flash("err", e.message);
      }
    }

    const THEME_KEY = "cangling-update-theme";
    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }
    function renderTheme() {
      const label = currentTheme() === "dark" ? "浅色" : "深色";
      const a = $("#theme-toggle");
      const b = $("#gate-theme");
      if (a) a.textContent = label;
      if (b) b.textContent = label;
    }
    function toggleTheme() {
      const next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);
      renderTheme();
      applyAceTheme();
    }
    $("#theme-toggle").onclick = toggleTheme;
    $("#gate-theme").onclick = toggleTheme;
    renderTheme();

    async function requestCloseDialog() {
      if (dialog.confirmClose && !(await dialog.confirmClose())) return;
      closeDialog();
    }

    function confirmDialog(message, opts = {}) {
      return new Promise((resolve) => {
        const overlay = $("#confirm-overlay");
        const msg = $("#confirm-msg");
        const ok = $("#confirm-ok");
        const cancel = $("#confirm-cancel");
        if (!overlay || !msg || !ok || !cancel) { resolve(false); return; }
        msg.textContent = message;
        ok.className = "btn" + (opts.danger ? " danger" : " primary");
        ok.textContent = opts.confirmText || "确定";
        cancel.textContent = opts.cancelText || "取消";
        cancel.hidden = !!opts.hideCancel;
        overlay.hidden = false;
        const onKey = (e) => {
          if (e.key === "Escape") { e.preventDefault(); done(false); }
        };
        const done = (v) => {
          overlay.hidden = true;
          document.removeEventListener("keydown", onKey);
          resolve(v);
        };
        document.addEventListener("keydown", onKey);
        ok.onclick = () => done(true);
        cancel.onclick = () => done(false);
        if (opts.hideCancel) ok.focus(); else cancel.focus();
      });
    }
    $("#dialog-close").onclick = requestCloseDialog;
    $("#dialog-foot-close").onclick = requestCloseDialog;
    $("#btn-new").onclick = () => location.hash = "#/new";
    $("#btn-cluster").onclick = () => location.hash = "#/cluster";
    $("#btn-repo").onclick = () => location.hash = "#/repo";
    $("#btn-logout").onclick = () => logout();
    $("#btn-pass").onclick = openChangePassword;
    function setNav(open) {
      const aside = document.querySelector("aside");
      const scrim = $("#nav-scrim");
      if (aside) aside.classList.toggle("open", open);
      if (scrim) scrim.hidden = !open;
      const t = $("#nav-toggle");
      if (t) t.setAttribute("aria-expanded", open ? "true" : "false");
    }
    $("#nav-toggle").onclick = () => {
      const aside = document.querySelector("aside");
      setNav(!(aside && aside.classList.contains("open")));
    };
    $("#nav-scrim").onclick = () => setNav(false);
    $("#gate-submit").onclick = submitGate;
    ["gate-user", "gate-pass", "gate-pass2"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("keydown", (e) => { if (e.key === "Enter") submitGate(); });
    });
    window.addEventListener("hashchange", route);
    boot();
  </script>
</body>
</html>
