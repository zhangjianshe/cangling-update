    function dbFilteredObjects() {
      const q = (dbAdmin.filter || "").trim().toLowerCase();
      const items = dbAdmin.objects || [];
      if (!q) return items;
      return items.filter((o) => {
        const kind = o.kind === "view" ? "视图" : "表";
        return (o.name || "").toLowerCase().includes(q) || kind.includes(q) || (o.kind || "").toLowerCase().includes(q);
      });
    }

    function dbRenderObjects() {
      const box = $("#db-objects");
      if (!box) return;
      const all = dbAdmin.objects || [];
      if (!all.length) {
        box.innerHTML = `<div class="empty">${dbAdmin.schema ? "该 schema 下没有表或视图" : "请选择容器和 schema"}</div>`;
        return;
      }
      const items = dbFilteredObjects();
      const q = (dbAdmin.filter || "").trim();
      if (!items.length) {
        box.innerHTML = `<div class="empty">没有匹配「${esc(q)}」的表或视图</div>`;
        return;
      }
      box.innerHTML = items.map((o) => {
        const on = dbAdmin.selected && dbAdmin.selected.name === o.name;
        const kind = o.kind === "view" ? "视图" : "表";
        return `<button type="button" class="db-obj${on ? " active" : ""}" data-db-obj="${esc(o.name)}" data-db-kind="${esc(o.kind)}" title="${esc(kind)}">${dbObjIcon(o.kind)}<span class="n">${esc(o.name)}</span></button>`;
      }).join("");
      for (const b of box.querySelectorAll("[data-db-obj]")) {
        b.onclick = () => dbOpenObject(b.getAttribute("data-db-obj"), b.getAttribute("data-db-kind"));
      }
    }

    async function dbOpenObject(name, kind) {
      dbAdmin.selected = { name, kind };
      dbAdmin.offset = 0;
      dbAdmin.rowIndex = null;
      dbAdmin.filterCol = "";
      dbAdmin.filterValue = "";
      dbRenderObjects();
      await dbLoadRows();
    }

    async function dbLoadRows() {
      if (!dbAdmin.selected || !dbContextAvailable()) return;
      const box = $("#db-data");
      if (box) box.innerHTML = `<div class="empty db-loading"><span class="spin"></span>加载中…</div>`;
      try {
        const data = await api(dbApiBase() + "/rows?" + dbQs({
          name: dbAdmin.selected.name,
          offset: String(dbAdmin.offset),
          limit: String(dbAdmin.limit),
          filter_col: dbAdmin.filterCol,
          filter_op: dbAdmin.filterOp,
          filter_value: dbAdmin.filterValue,
        }));
        dbAdmin.columns = data.columns || [];
        dbAdmin.rows = data.rows || [];
        dbAdmin.pk = data.pk || [];
        dbAdmin.total = data.total || 0;
        dbAdmin.offset = data.offset || 0;
        dbAdmin.limit = data.limit || dbAdmin.limit;
        dbAdmin.selectedRows.clear();
        if (dbAdmin.rowIndex != null && dbAdmin.rowIndex >= dbAdmin.rows.length) dbAdmin.rowIndex = null;
        dbShowErr("");
      } catch (e) {
        dbShowErr(e.message);
      }
      dbRenderRows();
      dbRenderFilter();
    }

    const dbFilterOps = [
      ["contains", "包含"],
      ["eq", "等于"],
      ["neq", "不等于"],
      ["prefix", "开头是"],
      ["suffix", "结尾是"],
    ];
    function dbOpLabel(op) {
      return (dbFilterOps.find(([v]) => v === op) || ["contains", "包含"])[1];
    }
    function dbOpValue(label) {
      return (dbFilterOps.find(([, t]) => t === label) || ["contains", "包含"])[0];
    }

    function dbRenderFilter() {
      const box = $("#db-rowfilter");
      if (!box) return;
      const cols = dbAdmin.columns || [];
      if (!dbAdmin.selected || !cols.length) {
        box.hidden = true;
        box.innerHTML = "";
        box.dataset.cols = "";
        return;
      }
      const signature = dbAdmin.selected.name + "\u0000" + cols.join("\u0001");
      if (box.dataset.cols === signature) return;
      box.dataset.cols = signature;
      if (!cols.includes(dbAdmin.filterCol)) dbAdmin.filterCol = cols[0] || "";
      box.innerHTML = `
        <label>字段</label>
        <div class="combo" id="db-fcol"></div>
        <label>条件</label>
        <div class="combo" id="db-fop"></div>
        <input id="db-fval" type="text" placeholder="过滤值（留空清除过滤）" value="${esc(dbAdmin.filterValue)}" autocomplete="off" spellcheck="false" />
        <button type="button" class="btn" id="db-fapply">过滤</button>
        <button type="button" class="btn ghost" id="db-fclear">清除</button>
      `;
      box.hidden = false;
      comboBind($("#db-fcol"), {
        items: cols,
        value: dbAdmin.filterCol,
        placeholder: "字段",
        onChange: (v) => {
          dbAdmin.filterCol = v;
          const el = $("#db-fcol .combo-val");
          if (el) { el.textContent = v; el.classList.remove("ph"); }
        },
      });
      comboBind($("#db-fop"), {
        items: dbFilterOps.map(([, t]) => t),
        value: dbOpLabel(dbAdmin.filterOp),
        placeholder: "条件",
        onChange: (v) => {
          dbAdmin.filterOp = dbOpValue(v);
          const el = $("#db-fop .combo-val");
          if (el) { el.textContent = v; el.classList.remove("ph"); }
        },
      });
      const val = $("#db-fval");
      const apply = $("#db-fapply");
      const clear = $("#db-fclear");
      const doApply = () => {
        dbAdmin.filterValue = val.value;
        dbAdmin.offset = 0;
        dbAdmin.rowIndex = null;
        dbLoadRows();
      };
      if (val) val.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); doApply(); } };
      if (apply) apply.onclick = doApply;
      if (clear) clear.onclick = () => {
        dbAdmin.filterValue = "";
        dbAdmin.offset = 0;
        dbAdmin.rowIndex = null;
        val.value = "";
        dbLoadRows();
      };
    }

    function dbCell(v) {
      if (v == null) return "";
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    function dbRenderRows() {
      const box = $("#db-data");
      const pager = $("#db-pager");
      if (!box) return;
      if (!dbAdmin.selected) {
        box.innerHTML = `<div class="empty">点击左侧表或视图查看数据</div>`;
        if (pager) pager.innerHTML = `<span class="hint">选择左侧表或视图后分页浏览</span>`;
        return;
      }
      const cols = dbAdmin.columns || [];
      const rows = dbAdmin.rows || [];
      if (!cols.length) {
        box.innerHTML = `<div class="empty">${esc(dbAdmin.selected.name)} 无数据</div>`;
      } else {
        const editable = dbAdmin.selected.kind !== "view";
        const selectedCount = dbAdmin.selectedRows.size;
        const allSelected = editable && rows.length > 0 && selectedCount === rows.length;
        box.innerHTML = `<table><thead><tr><th class="db-select-cell"><input id="db-select-all" type="checkbox" ${allSelected ? "checked" : ""} ${editable && rows.length ? "" : "disabled"} title="选择本页全部行" /></th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
          rows.map((r, ri) => `<tr data-db-row="${ri}" class="${dbAdmin.rowIndex === ri ? "active" : ""}"><td class="db-select-cell"><input type="checkbox" data-db-check="${ri}" ${dbAdmin.selectedRows.has(ri) ? "checked" : ""} ${editable ? "" : "disabled"} aria-label="选择第 ${ri + 1} 行" /></td>${cols.map((_, i) => {
            const t = dbCell(r[i]);
            return `<td title="${esc(t)}">${esc(t.length > 120 ? t.slice(0, 120) + "…" : t)}</td>`;
          }).join("")}</tr>`).join("") || `<tr><td class="empty" colspan="${cols.length + 1}">无行</td></tr>`
        }</tbody></table>`;
        const selectAll = $("#db-select-all");
        if (selectAll) selectAll.onchange = () => {
          dbAdmin.selectedRows = selectAll.checked ? new Set(rows.map((_, i) => i)) : new Set();
          dbRenderRows();
        };
        for (const cb of box.querySelectorAll("[data-db-check]")) {
          cb.onclick = (event) => event.stopPropagation();
          cb.onchange = () => {
            const index = Number(cb.getAttribute("data-db-check"));
            if (cb.checked) dbAdmin.selectedRows.add(index);
            else dbAdmin.selectedRows.delete(index);
            dbRenderRows();
          };
        }
        for (const tr of box.querySelectorAll("[data-db-row]")) {
          tr.onclick = () => {
            dbAdmin.rowIndex = Number(tr.getAttribute("data-db-row"));
            dbRenderRows();
          };
          tr.ondblclick = () => {
            dbAdmin.rowIndex = Number(tr.getAttribute("data-db-row"));
            openDbEditDialog();
          };
        }
      }
      if (pager) {
        const from = dbAdmin.total ? dbAdmin.offset + 1 : 0;
        const to = Math.min(dbAdmin.offset + (rows.length || 0), dbAdmin.total);
        const canEdit = dbAdmin.selected.kind !== "view" && dbAdmin.rowIndex != null;
        const canDelete = dbAdmin.selected.kind !== "view" && dbAdmin.selectedRows.size > 0;
        const rowHint = dbAdmin.selected.kind === "view" ? "视图不能直接修改" : "点击一行后编辑";
        const deleteHint = dbAdmin.selected.kind === "view" ? "视图不能直接删除" : "勾选一行或多行后删除";
        pager.innerHTML = `
          <button type="button" class="btn" id="db-prev" ${dbAdmin.offset <= 0 ? "disabled" : ""}>上一页</button>
          <span class="hint">${esc(dbAdmin.selected.name)} · ${from}-${to} / ${dbAdmin.total}${dbAdmin.pk && dbAdmin.pk.length ? " · 主键 " + esc(dbAdmin.pk.join(", ")) : ""}</span>
          <button type="button" class="btn" id="db-edit-row" ${canEdit ? "" : "disabled"} title="${esc(rowHint)}">编辑</button>
          <button type="button" class="btn danger" id="db-del-row" ${canDelete ? "" : "disabled"} title="${esc(deleteHint)}">删除${dbAdmin.selectedRows.size ? "（" + dbAdmin.selectedRows.size + "）" : ""}</button>
          <button type="button" class="btn" id="db-next" ${dbAdmin.offset + dbAdmin.limit >= dbAdmin.total ? "disabled" : ""}>下一页</button>`;
        const prev = $("#db-prev");
        const next = $("#db-next");
        const edit = $("#db-edit-row");
        const del = $("#db-del-row");
        if (prev) prev.onclick = () => { dbAdmin.offset = Math.max(0, dbAdmin.offset - dbAdmin.limit); dbAdmin.rowIndex = null; dbLoadRows(); };
        if (next) next.onclick = () => { dbAdmin.offset += dbAdmin.limit; dbAdmin.rowIndex = null; dbLoadRows(); };
        if (edit) edit.onclick = openDbEditDialog;
        if (del) del.onclick = dbDeleteRow;
      }
    }

    function dbRowObject(row) {
      const obj = {};
      (dbAdmin.columns || []).forEach((c, i) => { obj[c] = row[i]; });
      return obj;
    }

    function dbParseField(text, asNull, original) {
      if (asNull) return null;
      if (original !== null && typeof original === "object") {
        try { return JSON.parse(text); } catch { return text; }
      }
      if (typeof original === "boolean") {
        if (text === "true" || text === "TRUE") return true;
        if (text === "false" || text === "FALSE") return false;
      }
      if (typeof original === "number" && text !== "" && Number.isFinite(Number(text))) return Number(text);
      return text;
    }

    function openDbEditDialog() {
      if (!dbContextAvailable() || !dbAdmin.selected || dbAdmin.rowIndex == null) {
        dbShowErr("请先选择一行");
        return;
      }
      if (dbAdmin.selected.kind === "view") {
        dbShowErr("视图不能直接编辑");
        return;
      }
      const row = dbAdmin.rows[dbAdmin.rowIndex];
      if (!row) return;
      const cols = dbAdmin.columns || [];
      const pk = dbAdmin.pk || [];
      closeDialog();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("narrow");
      $("#dialog-title").textContent = "编辑行 · " + dbAdmin.selected.name;
      setDialogAction("保存", dbSaveRow);
      $("#dialog-body").innerHTML = `<div class="db-edit-form">${
        cols.map((c, i) => {
          const v = row[i];
          const isNull = v == null;
          const text = isNull ? "" : dbCell(v);
          const isPk = pk.includes(c);
          return `<div class="db-edit-row">
            <label>${esc(c)}${isPk ? " <span class=\"k\">主键</span>" : ""}</label>
            <textarea data-col="${esc(c)}" ${isNull ? "disabled" : ""}>${esc(text)}</textarea>
            <label class="check"><input type="checkbox" data-null="${esc(c)}" ${isNull ? "checked" : ""} /> NULL</label>
          </div>`;
        }).join("")
      }</div>`;
      $("#dialog").hidden = false;
      for (const cb of document.querySelectorAll("[data-null]")) {
        cb.onchange = () => {
          const col = cb.getAttribute("data-null");
          const ta = document.querySelector(`textarea[data-col="${CSS.escape(col)}"]`);
          if (ta) ta.disabled = cb.checked;
        };
      }
    }

    function dbRowKeys(row) {
      if (!row) return null;
      const cols = dbAdmin.columns || [];
      const pk = dbAdmin.pk || [];
      const keys = {};
      const keyCols = pk.length ? pk : cols;
      for (const c of keyCols) {
        const i = cols.indexOf(c);
        keys[c] = i >= 0 ? row[i] : null;
      }
      return keys;
    }

    function dbSelectedRowKeys() {
      if (!dbAdmin.selected || dbAdmin.rowIndex == null) return null;
      return dbRowKeys(dbAdmin.rows[dbAdmin.rowIndex]);
    }

    async function dbDeleteRow() {
      if (!dbContextAvailable() || !dbAdmin.selected || dbAdmin.selectedRows.size === 0) {
        dbShowErr("请先勾选要删除的行");
        return;
      }
      if (dbAdmin.selected.kind === "view") {
        dbShowErr("视图不能直接删除");
        return;
      }
      const selected = [...dbAdmin.selectedRows].sort((a, b) => a - b);
      const rows = selected.map((index) => dbRowKeys(dbAdmin.rows[index])).filter(Boolean);
      if (!rows.length) return;
      if (!(await confirmDialog("确定删除 " + dbAdmin.selected.name + " 中选中的 " + rows.length + " 行？此操作不可恢复。", { danger: true }))) return;
      const btn = $("#db-del-row");
      if (btn) btn.disabled = true;
      try {
        const data = await api(dbApiBase() + "/row", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            service: dbAdmin.service,
            engine: dbAdmin.engine,
            database: dbAdmin.database,
            schema: dbAdmin.schema,
            table: dbAdmin.selected.name,
            keys: {},
            rows,
          }),
        });
        dbAdmin.rowIndex = null;
        dbAdmin.selectedRows.clear();
        dbShowErr("");
        await dbLoadRows();
        if ((dbAdmin.rows || []).length === 0 && dbAdmin.offset > 0) {
          dbAdmin.offset = Math.max(0, dbAdmin.offset - dbAdmin.limit);
          await dbLoadRows();
        }
        flash("ok", "已删除 " + (data.deleted || 1) + " 行");
      } catch (e) {
        dbShowErr(e.message);
        const live = $("#db-del-row");
        if (live) live.disabled = false;
      }
    }

    async function dbSaveRow() {
      if (!dbContextAvailable() || !dbAdmin.selected || dbAdmin.rowIndex == null) return;
      const original = dbAdmin.rows[dbAdmin.rowIndex];
      const cols = dbAdmin.columns || [];
      const keys = dbSelectedRowKeys();
      const values = {};
      if (!keys) return;
      for (const c of cols) {
        const i = cols.indexOf(c);
        const ta = document.querySelector(`textarea[data-col="${CSS.escape(c)}"]`);
        const cb = document.querySelector(`input[data-null="${CSS.escape(c)}"]`);
        values[c] = dbParseField(ta ? ta.value : "", !!(cb && cb.checked), original[i]);
      }
      const extra = $("#dialog-extra");
      if (extra) extra.disabled = true;
      try {
        const data = await api(dbApiBase() + "/row", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            service: dbAdmin.service,
            engine: dbAdmin.engine,
            database: dbAdmin.database,
            schema: dbAdmin.schema,
            table: dbAdmin.selected.name,
            keys,
            values,
          }),
        });
        closeDialog();
        dbShowErr("");
        await dbLoadRows();
        flash("ok", "已更新 " + (data.updated || 1) + " 行");
      } catch (e) {
        const form = $(".db-edit-form");
        let err = form && form.querySelector(".flash.err");
        if (!err && form) {
          err = document.createElement("div");
          err.className = "flash err";
          form.prepend(err);
        }
        if (err) err.textContent = e.message;
        else dbShowErr(e.message);
      }
      if (extra) extra.disabled = false;
    }

    function dbBackupRequestBody() {
      return {
        service: dbAdmin.service,
        engine: dbAdmin.engine || "postgres",
        database: dbAdmin.database,
      };
    }

    function dbRequireBackupTarget() {
      if (!dbAdmin.service) {
        dbShowErr("请先选择 PostgreSQL 容器");
        return false;
      }
      if (!dbAdmin.database) {
        dbShowErr("请先选择数据库");
        return false;
      }
      return true;
    }

    function showDbJobDialog(title, job) {
      closeDialog();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("form-modal");
      $("#dialog-title").textContent = title;
      $("#dialog-body").innerHTML = `<div style="padding:20px">
        <div class="progress-wrap" id="db-backup-job">
          <div class="progress-meta"><span id="db-backup-job-msg">准备中</span><span id="db-backup-job-pct">0%</span></div>
          <div class="progress" id="db-backup-job-bar"><span></span></div>
          <div class="flash err" id="db-backup-job-error" hidden></div>
        </div>
      </div>`;
      $("#dialog").dataset.dbJobId = job.id;
      $("#dialog").hidden = false;
      renderProgress("db-backup-job", job);
    }

    async function waitDbJob(job, done) {
      let current = job;
      while (current && !current.done) {
        await new Promise((resolve) => setTimeout(resolve, 500));
        current = await api("/api/jobs/" + current.id);
        if ($("#dialog").dataset.dbJobId === current.id) {
          renderProgress("db-backup-job", current);
        }
      }
      if (!current || $("#dialog").dataset.dbJobId !== current.id) return;
      if (current && current.error) {
        const error = $("#db-backup-job-error");
        if (error) {
          error.textContent = current.error;
          error.hidden = false;
        }
        setDialogAction("返回备份历史", openDbBackups);
        return;
      }
      if (done) await done(current);
    }

    async function dbCreateBackup() {
      if (!dbRequireBackupTarget()) return;
      if (!(await confirmDialog(`确定备份数据库 ${dbAdmin.database}？备份过程中数据库可以继续运行。`))) return;
      try {
        const job = await api(dbApiBase() + "/backups", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dbBackupRequestBody()),
        });
        showDbJobDialog("备份数据库 · " + dbAdmin.database, job);
        await waitDbJob(job, async () => {
          setDialogAction("查看备份历史", openDbBackups);
        });
      } catch (e) {
        dbShowErr(e.message);
      }
    }

    function dbBackupCounts(backup) {
      const objects = backup.objects || [];
      const tables = objects.filter((object) => object.kind === "table").length;
      const views = objects.filter((object) => object.kind === "view" || object.kind === "materialized-view").length;
      const sequences = objects.filter((object) => object.kind === "sequence").length;
      return `${tables} 张表 · ${views} 个视图 · ${sequences} 个序列`;
    }

    function dbBackupKind(kind) {
      return ({ manual: "手工备份", scheduled: "自动备份", "pre-restore": "恢复前安全备份", "pre-update": "升级前备份" })[kind] || "手工备份";
    }

    async function openDbBackupSchedule() {
      if (!dbRequireBackupTarget()) return;
      closeDialog();
      const modal = $("#dialog-modal");
      if (modal) modal.classList.add("db-auto-modal");
      $("#dialog-title").textContent = "自动备份 · " + dbAdmin.database;
      $("#dialog-body").innerHTML = `<div style="padding:20px"><div class="empty db-loading"><span class="spin"></span>加载中…</div></div>`;
      $("#dialog").hidden = false;
      try {
        const [schedule, storages] = await Promise.all([
          api(dbApiBase() + "/backup-schedule"),
          api("/api/storages"),
        ]);
        const storageOptions = (storages || []).filter((item) => item.target_dir).map((item) =>
          `<option value="${esc(item.id)}" ${item.id === schedule.storageId ? "selected" : ""}>${esc(item.name)} · ${esc(item.target_dir)}</option>`
        ).join("");
        const statusText = schedule.lastStatus
          ? `${schedule.lastStatus === "success" ? "成功" : schedule.lastStatus === "failed" ? "失败" : "执行中"}${schedule.lastFinishedAt ? " · " + fmtDateTime(schedule.lastFinishedAt) : ""}<br />${esc(schedule.lastMessage || "")}`
          : "尚未执行自动备份";
        $("#dialog-body").innerHTML = `<div class="db-auto-form">
          <p class="hint">每天按服务器本地时间执行。程序错过设定时间后，会在当天恢复运行时补执行一次。</p>
          <label class="check"><input id="db-auto-enabled" type="checkbox" ${schedule.enabled ? "checked" : ""} /> 启用自动备份</label>
          <div class="db-auto-settings">
            <div class="field"><label for="db-auto-time">执行时间</label><input id="db-auto-time" type="time" value="${esc(schedule.timeOfDay || "03:00")}" /></div>
            <div class="field"><label for="db-auto-retain">保留份数</label><input id="db-auto-retain" type="number" min="1" max="365" value="${schedule.retainCount || 7}" /></div>
            <div class="field field-wide"><label for="db-auto-storage">同时复制到存储</label><select id="db-auto-storage"><option value="">仅保存在本机</option>${storageOptions}</select></div>
          </div>
          <label class="check"><input id="db-auto-before-update" type="checkbox" ${schedule.backupBeforeUpdate !== false ? "checked" : ""} /> 项目升级前自动备份数据库</label>
          <div class="flash" style="margin-top:14px">最近执行：${statusText}</div>
          <div class="db-auto-actions"><button type="button" class="btn" id="db-auto-run">立即执行一次</button></div>
          <div class="flash err" id="db-auto-error" hidden></div>
        </div>`;
        const payload = () => ({
          enabled: $("#db-auto-enabled").checked,
          service: dbAdmin.service,
          database: dbAdmin.database,
          timeOfDay: $("#db-auto-time").value || "03:00",
          retainCount: Number($("#db-auto-retain").value || 7),
          storageId: $("#db-auto-storage").value,
          backupBeforeUpdate: $("#db-auto-before-update").checked,
        });
        const save = async () => api(dbApiBase() + "/backup-schedule", {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload()),
        });
        setDialogAction("保存", async () => {
          try { await save(); closeDialog(); flash("ok", "自动备份设置已保存"); }
          catch (e) { const box = $("#db-auto-error"); box.textContent = e.message; box.hidden = false; }
        });
        $("#db-auto-run").onclick = async () => {
          try {
            await save();
            const job = await api(dbApiBase() + "/backup-schedule/run", { method: "POST" });
            showDbJobDialog("执行自动备份 · " + dbAdmin.database, job);
            await waitDbJob(job, async () => setDialogAction("查看备份历史", openDbBackups));
          } catch (e) { const box = $("#db-auto-error"); box.textContent = e.message; box.hidden = false; }
        };
      } catch (e) {
        $("#dialog-body").innerHTML = `<div class="flash err" style="margin:20px">${esc(e.message)}</div>`;
      }
    }

    async function openDbBackups() {
      if (!dbRequireBackupTarget()) return;
      closeDialog();
      $("#dialog-title").textContent = "数据库备份历史 · " + dbAdmin.database;
      $("#dialog-body").innerHTML = `<div class="db-backup-list"><div class="empty db-loading"><span class="spin"></span>加载中…</div></div>`;
      $("#dialog").hidden = false;
      try {
        const items = await api(
          dbApiBase() + "/backups?" + dbQs(),
        );
        const box = $("#dialog-body .db-backup-list");
        if (!items.length) {
          box.innerHTML = `<div class="empty">当前数据库还没有逻辑备份</div>`;
          setDialogAction("立即备份", dbCreateBackup);
          return;
        }
        box.innerHTML = items.map((backup) => `<div class="db-backup-item">

    const TEMP_UPLOAD_CHUNK_BYTES = 8 * 1024 * 1024;

    function tempUploadStorageKey(file) {
      return "cangling-temp-upload:" + state.current.id + ":" + file.name + ":" + file.size + ":" + file.lastModified;
    }

    function tempUploadId(file) {
      const key = tempUploadStorageKey(file);
      let id = "";
      try { id = localStorage.getItem(key) || ""; } catch (_) {}
      if (!id) {
        id = self.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
              const r = Math.random() * 16 | 0;
              return (c === "x" ? r : (r & 3 | 8)).toString(16);
            });
        try { localStorage.setItem(key, id); } catch (_) {}
      }
      return { id, key };
    }

    function tempUploadUrl(file, uploadId, offset) {
      const params = new URLSearchParams({
        upload_id: uploadId,
        name: file.name,
        total: String(file.size),
      });
      if (offset != null) params.set("offset", String(offset));
      return "/api/projects/" + state.current.id + "/temp-upload?" + params.toString();
    }

    function sendTempUploadChunk(url, chunk, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", appPath(url));
        const token = sessionToken();
        if (token) xhr.setRequestHeader("Authorization", "Bearer " + token);
        xhr.setRequestHeader("Content-Type", "application/octet-stream");
        xhr.upload.onprogress = (event) => {
          if (event.lengthComputable) onProgress(event.loaded);
        };
        xhr.onload = () => {
          let payload = {};
          try { payload = JSON.parse(xhr.responseText || "{}"); } catch (_) { payload = { error: xhr.responseText }; }
          if (xhr.status === 401) {
            showGate(payload.error || "请先登录或登录已过期");
            reject(new Error(payload.error || "请先登录"));
          } else if (xhr.status >= 400) {
            reject(new Error(payload.error || xhr.statusText || "上传失败"));
          } else {
            resolve(payload);
          }
        };
        xhr.onerror = () => reject(new Error("网络连接中断；重新选择同一文件后可继续上传"));
        xhr.send(chunk);
      });
    }

    async function runTempUpload() {
      if (state.busy) {
        flash("err", "正在处理中，请勿重复操作");
        return;
      }
      if (!state.tempFiles.length) {
        flash("err", "请至少选择一个要上传到 temp 目录的文件");
        return;
      }
      setBusy("temp-upload");
      const files = state.tempFiles.slice();
      const totalBytes = files.reduce((sum, file) => sum + file.size, 0);
      let completedBytes = 0;
      try {
        showProgress("temp-prog", true);
        for (let index = 0; index < files.length; index++) {
          const file = files[index];
          const upload = tempUploadId(file);
          let status = await api(tempUploadUrl(file, upload.id));
          let offset = Number(status.uploaded || 0);
          if (offset > file.size) throw new Error(file.name + " 的服务器续传位置无效");
          while (!status.complete) {
            const end = Math.min(offset + TEMP_UPLOAD_CHUNK_BYTES, file.size);
            const chunk = file.slice(offset, end);
            status = await sendTempUploadChunk(
              tempUploadUrl(file, upload.id, offset),
              chunk,
              sent => {
                const current = completedBytes + offset + sent;
                renderProgress("temp-prog", {
                  message: `正在上传 ${file.name}（${index + 1}/${files.length}）`,
                  percent: totalBytes ? Math.round(current * 100 / totalBytes) : 100,
                  current,
                  total: totalBytes,
                });
              }
            );
            offset = Number(status.uploaded || 0);
          }
          completedBytes += file.size;
          try { localStorage.removeItem(upload.key); } catch (_) {}
          renderProgress("temp-prog", {
            message: `已上传 ${file.name}（${index + 1}/${files.length}）`,
            percent: totalBytes ? Math.round(completedBytes * 100 / totalBytes) : 100,
            current: completedBytes,
            total: totalBytes,
          });
        }
        state.tempFiles = [];
        clearBusy();
        renderProject();
        flash("ok", `已上传 ${files.length} 个文件到 ${state.current.directory}/temp，不执行版本发布`);
      } catch (error) {
        clearBusy();
        const button = $("#btn-temp-upload");
        if (button) button.disabled = false;
        flash("err", error.message + "；重新选择同一文件后将从已接收位置继续");
      }
    }

    async function runUpdate(snapshotOnly) {
      if (state.busy) {
        flash("err", "正在处理中，请勿重复操作");
        return;
      }
      const repoUpdateSelected = !snapshotOnly && !state.files.length && state.np4RepoFiles.length > 0;
      if (!snapshotOnly && !state.files.length && !repoUpdateSelected) {
        flash("err", "请至少选择一个镜像包或 JAR，或使用「仅备份当前目录」。");
        return;
      }
      const stopFirst = $("#f-stop") ? $("#f-stop").checked : false;
      if (!(await confirmDialog(
        "将全量备份当前目录（包含数据库数据）。\n" +
        (stopFirst ? "会先停止 Compose，再备份。\n" : "请先手动停止当前应用，否则备份可能失败或不完整。\n") +
        "确定继续？"
      ))) {
        return;
      }
      const restart = snapshotOnly
        ? stopFirst
        : !!($("#restart") && $("#restart").checked);
      if (repoUpdateSelected) {
        await runNp4RepoAction("publish", stopFirst, restart);
        return;
      }
      let stop = () => {};
      setBusy("update");
      try {
        const job = await api("/api/jobs", { method: "POST" });
        const fd = new FormData();
        fd.append("note", $("#note").value || (snapshotOnly ? "目录快照" : ""));
        fd.append("stop_compose", stopFirst ? "true" : "false");
        fd.append("restart", restart ? "true" : "false");
        fd.append("job_id", job.id);
        if (!snapshotOnly) for (const f of state.files) fd.append("files", f, f.name);

        const totalBytes = snapshotOnly ? 0 : state.files.reduce((s, f) => s + (f.size || 0), 0);
        showProgress("prog", true);
        renderProgress("prog", {
          message: snapshotOnly ? "正在备份当前目录…" : "正在上传文件…",
          percent: 0,
          current: 0,
          total: totalBytes,
        });
        stop = watchJob(job.id, "prog");

        const data = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable || snapshotOnly) return;
            renderProgress("prog", {
              message: "正在上传文件…",
              percent: Math.round(e.loaded / e.total * 100),
              current: e.loaded,
              total: e.total,
            });
          };
          xhr.onload = () => {
            let payload = {};
            try { payload = JSON.parse(xhr.responseText || "{}"); } catch { payload = { error: xhr.responseText }; }
            if (xhr.status === 401) {
              showGate((payload && payload.error) || "请先登录或登录已过期");
              reject(new Error((payload && payload.error) || "请先登录"));
              return;
            }
            if (xhr.status >= 400) reject(new Error(payload.error || xhr.statusText));
            else resolve(payload);
          };
          xhr.onerror = () => reject(new Error("上传失败"));
          xhr.open("POST", appPath("/api/projects/" + state.current.id + "/updates"));
          xhr.send(fd);
        });
        flash("ok", `已将 ${data.version.label} 发布为最新版。`);
        state.files = [];
        state.projectTab = "versions";
        clearBusy();
        await openProject(state.current.id);
        flash("ok", `已将 ${data.version.label} 发布为最新版。`);
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);
      } finally {
        stop();
      }
    }

    async function runReplace() {
      if (state.busy) {
        flash("err", "正在处理中，请勿重复操作");
        return;
      }
      const repoUpdateSelected = !state.files.length && state.np4RepoFiles.length > 0;
      if (!state.files.length && !repoUpdateSelected) {
        flash("err", "请至少选择一个镜像包或 JAR。");
        return;
      }
      const hasJar = state.files.some(file => /\.jar$/i.test(file.name || ""));
      if (!(await confirmDialog(
        (hasJar
          ? "替换前只备份本次将被覆盖的旧 JAR，并写入版本历史供恢复。\n"
          : "仅替换 Docker 镜像不会生成目录恢复点。\n") +
        "将覆盖已选的镜像包 / JAR，并重启容器。\n" +
        "确定继续？",
        { danger: true }
      ))) {
        return;
      }
      if (repoUpdateSelected) {
        await runNp4RepoAction("replace", false, true);
        return;
      }
      let stop = () => {};
      setBusy("replace");
      try {
        const job = await api("/api/jobs", { method: "POST" });
        const fd = new FormData();
        fd.append("note", $("#note").value || "替换并重启");
        fd.append("restart", "true");
        fd.append("stop_compose", $("#f-stop") && $("#f-stop").checked ? "true" : "false");
        fd.append("job_id", job.id);
        for (const f of state.files) fd.append("files", f, f.name);

        const totalBytes = state.files.reduce((s, f) => s + (f.size || 0), 0);
        showProgress("prog", true);
        renderProgress("prog", {
          message: "正在上传文件…",
          percent: 0,
          current: 0,
          total: totalBytes,
        });
        stop = watchJob(job.id, "prog");

        const data = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable) return;
            renderProgress("prog", {
              message: "正在上传文件…",
              percent: Math.round(e.loaded / e.total * 100),
              current: e.loaded,
              total: e.total,
            });
          };
          xhr.onload = () => {
            let payload = {};
            try { payload = JSON.parse(xhr.responseText || "{}"); } catch { payload = { error: xhr.responseText }; }
            if (xhr.status === 401) {
              showGate((payload && payload.error) || "请先登录或登录已过期");
              reject(new Error((payload && payload.error) || "请先登录"));
              return;
            }
            if (xhr.status >= 400) reject(new Error(payload.error || xhr.statusText));
            else resolve(payload);
          };
          xhr.onerror = () => reject(new Error("上传失败"));
          xhr.open("POST", appPath("/api/projects/" + state.current.id + "/replace"));
          xhr.send(fd);
        });
        const nImg = (data.loaded && data.loaded.length) || 0;
        const nJar = (data.jars && data.jars.length) || 0;
        state.files = [];
        clearBusy();
        await openProject(state.current.id);
        flash("ok", `已替换${nImg ? " " + nImg + " 个镜像包" : ""}${nJar ? " " + nJar + " 个 JAR" : ""}，容器已重启。`);
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);
      } finally {
        stop();
      }
    }

    async function restore(versionId) {
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      const stopFirst = $("#f-stop") ? $("#f-stop").checked : false;
      const restoreVersion = state.versions.find(version => version.id === versionId);
      const jarOnly = restoreVersion && restoreVersion.kind === "pre-replace";
      const composeOnly = restoreVersion && restoreVersion.kind === "baseline-compose";
      if (!(await confirmDialog(
        (jarOnly
          ? "确定恢复这组 JAR？恢复前只备份当前对应的 JAR，不会复制或改动目录中的其他数据。\n"
          : composeOnly
            ? "确定恢复此 Compose 基线？目标操作只覆盖 Compose 文件，不会删除或覆盖其他数据；恢复前仍会全量备份当前目录作为安全快照。\n"
          : "确定恢复此版本？恢复前会先全量备份当前目录。\n") +
        (stopFirst ? "会先停止 Compose，再备份并恢复。\n" : "请先手动停止当前应用。\n") +
        "确定继续？",
        { danger: true }
      ))) return;
      if (state.busy) {
        flash("err", "正在恢复中，请勿重复操作");
        return;
      }
      setBusy("restore");
      flash("ok", "正在恢复，请稍候…");
      let stop = () => {};
      try {
        const job = await api("/api/jobs", { method: "POST" });
        showProgress("op-prog", true);
        renderProgress("op-prog", { message: "正在备份当前目录…", percent: 0, current: 0, total: 0 });
        stop = watchJob(job.id, "op-prog");
        const data = await api("/api/projects/" + state.current.id + "/rollback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            version_id: versionId,
            restart: $("#restart") ? $("#restart").checked : false,
            stop_compose: stopFirst,
            job_id: job.id,
          }),
        });
        clearBusy();
        state.projectTab = "versions";
        await openProject(state.current.id);
        flash("ok", "已恢复 " + data.version.label + "，并标记为当前最新版。");
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);
      } finally {
        stop();
      }
    }

    const COMPOSE_ACTION = {
      up: { btn: "btn-up", idle: "启动", busy: "启动中…", run: "正在启动 Compose…", done: "已启动" },
      restart: { btn: "btn-restart", idle: "重启", busy: "重启中…", run: "正在重启 Compose…", done: "已重启" },
      down: { btn: "btn-down", idle: "停止", busy: "停止中…", run: "正在停止 Compose…", done: "已停止" },

    function showComposeOp(msg) {
      const op = $("#compose-op");
      if (!op) return;
      if (!msg) {
        op.hidden = true;
        op.textContent = "";
        return;
      }
      op.hidden = false;
      op.textContent = msg;
    }

    async function compose(action) {
      const spec = COMPOSE_ACTION[action];
      if (!spec || !state.current) return;
      if (state.busy) {
        flash("err", "正在处理中，请勿重复操作");
        return;
      }
      setBusy("compose");
      const btn = document.getElementById(spec.btn);
      if (btn) {
        btn.textContent = spec.busy;
        btn.classList.add("working");
      }
      showComposeOp(spec.run);
      flash("ok", spec.run);
      try {
        await api("/api/projects/" + state.current.id + "/compose/" + action, { method: "POST" });
        try {
          state.compose = await api("/api/projects/" + state.current.id + "/compose");
        } catch {}
        clearBusy();
        renderProject();
        flash("ok", spec.done);
      } catch (e) {
        clearBusy();
        if (state.current) renderProject();
        flash("err", e.message);
      }
    }

    async function restartService(name) {
      if (!state.current || !name) return;
      if (state.busy) {
        flash("err", "正在处理中，请稍后再重启该服务");
        return;
      }
      if (!(await confirmDialog("确定重启服务 " + name + "？其它容器不受影响。"))) return;
      const btn = document.querySelector('[data-svc-restart="' + CSS.escape(name) + '"]');
      const idle = btn ? btn.textContent : "重启";
      if (btn) {
        btn.disabled = true;
        btn.textContent = "重启中…";
        btn.classList.add("working");
      }
      flash("ok", "正在重启 " + name + "…");
      try {
        await api(
          "/api/projects/" + state.current.id + "/compose/restart/" + encodeURIComponent(name),
          { method: "POST" }
        );
        flash("ok", "已重启 " + name);
        await refreshComposeStatus();
      } catch (e) {
        flash("err", e.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = idle;
          btn.classList.remove("working");
        }
      }
    }

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) {
          resolve();
          return;
        }
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("无法加载 " + src));
        document.head.appendChild(s);
      });
    }

    function loadAce() {
      if (dialog.aceReady) return dialog.aceReady;
      if (window.ace) return Promise.resolve();
      dialog.aceReady = (async () => {
        await loadScriptOnce(appPath("/vendor/ace/ace.js"));
        if (!window.ace) throw new Error("无法加载 Ace 编辑器");
        window.ace.config.set("basePath", appPath("/vendor/ace"));
        window.ace.config.set("loadWorkerFromBlob", false);
        await Promise.all([
          loadScriptOnce(appPath("/vendor/ace/mode-yaml.js")),
          loadScriptOnce(appPath("/vendor/ace/mode-json.js")),
          loadScriptOnce(appPath("/vendor/ace/mode-nginx.js")),
          loadScriptOnce(appPath("/vendor/ace/mode-ini.js")),
          loadScriptOnce(appPath("/vendor/ace/mode-sql.js")),
          loadScriptOnce(appPath("/vendor/ace/theme-github.js")),
          loadScriptOnce(appPath("/vendor/ace/theme-github_dark.js")),
          loadScriptOnce(appPath("/vendor/ace/ext-searchbox.js")),
        ]);
      })();
      return dialog.aceReady;
    }

    function setComposeSource(text) {
      if (composeEdit.editor) composeEdit.editor.setValue(text ?? "", -1);
    }

    function applyComposeFile(data, selectedId) {
      const spec = fileEditSpec();
      composeEdit.etag = data.etag || "";
      composeEdit.disk = data.content || "";
      composeEdit.filename = data.filename || spec.defaultName;
      composeEdit.selected = selectedId || null;
      if (selectedId == null) setComposeSource(data.content || "");
      const meta = $("#compose-edit-meta");
      if (meta) {
        const mismatch = data.exists && data.revisions && data.revisions.length && !data.matches_latest
          ? "磁盘内容与最近一次保存不一致"
          : "";
        const rev = data.current_rev_no ? "r" + data.current_rev_no : "尚无历史";
        meta.innerHTML = `<span class="path">${esc(data.path || composeEdit.filename)}</span>` +
          `<span>${esc(rev)}</span>` +
          (!data.exists && spec.missing ? `<span>${esc(spec.missing)}</span>` : "") +
          (mismatch ? `<span class="bad">${esc(mismatch)}</span>` : "");
      }
      renderComposeRevisions(data, selectedId);
    }

    function renderComposeRevisions(data, selectedId) {
      const box = $("#compose-rev-list");
      if (!box) return;
      const revs = data.revisions || [];
      if (!revs.length) {
        box.innerHTML = `<div class="empty">保存后会出现历史版本</div>`;
        return;
      }
      box.innerHTML = revs.map((r) => {
        const onDisk = r.etag === data.etag;
        const active = selectedId ? r.id === selectedId : onDisk;
        return `<button type="button" class="rev-item${active ? " active" : ""}" data-rev="${esc(r.id)}">
          <span class="rev-h">r${r.rev_no} ${esc(COMPOSE_REV_KIND[r.kind] || r.kind)}${onDisk ? ` <span class="pill latest">当前</span>` : ""}</span>
          <span class="rev-n">${esc(r.note || "（无备注）")}</span>
          <span class="rev-t">${esc(fmtDateTime(r.created_at))} · ${fmtBytes(r.bytes || 0)}</span>
          ${onDisk ? "" : `<span class="row" style="margin-top:6px;justify-content:flex-start"><span class="btn" data-restore-rev="${esc(r.id)}">恢复此版本</span></span>`}
        </button>`;
      }).join("");
      for (const b of box.querySelectorAll("[data-rev]")) {
        b.onclick = (e) => {
          if (e.target.closest("[data-restore-rev]")) return;
          loadComposeRevision(b.getAttribute("data-rev"));
        };
      }
      for (const b of box.querySelectorAll("[data-restore-rev]")) {
        b.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          restoreComposeRevision(b.getAttribute("data-restore-rev"));
        };
      }
    }

    async function loadComposeRevision(revId) {
      if (!state.current || !revId || composeEdit.busy) return;
      if (composeDirty() && !(await confirmDialog("编辑器里有未保存的修改，确定加载此版本到编辑器？", { danger: true }))) return;
      try {

    function confirmDialog(message, opts = {}) {
      return new Promise((resolve) => {
        const overlay = $("#confirm-overlay");
        const msg = $("#confirm-msg");
        const ok = $("#confirm-ok");
        const cancel = $("#confirm-cancel");
        if (!overlay || !msg || !ok || !cancel) { resolve(false); return; }
        msg.textContent = message;
        ok.className = "btn" + (opts.danger ? " danger" : " primary");
        ok.textContent = opts.confirmText || "确定";
        cancel.textContent = opts.cancelText || "取消";
        cancel.hidden = !!opts.hideCancel;
        overlay.hidden = false;
        const onKey = (e) => {
          if (e.key === "Escape") { e.preventDefault(); done(false); }
        };
        const done = (v) => {
          overlay.hidden = true;
          document.removeEventListener("keydown", onKey);
          resolve(v);
        };
        document.addEventListener("keydown", onKey);
        ok.onclick = () => done(true);
        cancel.onclick = () => done(false);
        if (opts.hideCancel) ok.focus(); else cancel.focus();
      });
    }

    };
    $("#btn-meta").onclick = (e) => {
      e.stopPropagation();
      setUserMenuOpen(false);
      const panel = $("#meta-panel");
      setMetaPanelOpen(panel && panel.hidden);
    };
    document.addEventListener("click", (e) => {
      const wrap = document.querySelector(".user-menu-wrap");
      if (wrap && !wrap.contains(e.target)) {
        setMetaPanelOpen(false);
        setUserMenuOpen(false);
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        setMetaPanelOpen(false);
        setUserMenuOpen(false);
      }
    });
    $("#btn-logout").onclick = () => { setUserMenuOpen(false); logout(); };
    $("#btn-pass").onclick = () => { setUserMenuOpen(false); openChangePassword(); };
    $("#btn-self-update").onclick = () => { setUserMenuOpen(false); openSelfUpdate(); };
    $("#gate-submit").onclick = submitGate;
    ["gate-user", "gate-pass", "gate-pass2"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("keydown", (e) => { if (e.key === "Enter") submitGate(); });
    });
    window.addEventListener("hashchange", route);
    boot();
  </script>
</body>
</html>
