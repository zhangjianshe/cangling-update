apiVersion: v1
kind: ConfigMap
metadata: {name: cangling-nginx, namespace: cangling}
data:
  nginx.conf: |
    worker_processes 2;
    error_log /var/log/nginx/error.log warn;
    events { worker_connections 2048; multi_accept on; use epoll; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      client_max_body_size 10G;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      upstream cis_mqtt { server cangling-broker:7501; }
      upstream cis_server { server cis-server:8078; }
      upstream cis_map { server cis-map:8079; keepalive 32; }
      upstream cangling_map { server cangling-map:3000; keepalive 16; }
      upstream cis_base { server np4-base:8080; keepalive 32; ip_hash; }
      upstream cangling_tile { server cangling-tile:7601; }
      server {
        listen 7600;
        server_name _;
        location ^~ /msg/ { proxy_pass http://cis_mqtt/; }
        location ^~ /events/mqtt { proxy_pass http://cis_mqtt/mqtt; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
        location ^~ /ib/events/mqtt { proxy_pass http://cis_mqtt/mqtt; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
        location ^~ /ib/socket/ { proxy_pass http://cis_server/socket/; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
        location ^~ /ib/api/v1/map3/ { proxy_pass http://cis_map/api/v1/map3/; }
        location ^~ /ib/api/v1/map4/ { proxy_pass http://cis_map/api/v1/map4/; }
        location ^~ /api/v1/map3/ { proxy_pass http://cis_map/api/v1/map3/; }
        location ^~ /api/v1/map4/ { proxy_pass http://cis_map/api/v1/map4/; }
        location ^~ /ib/geoserver/ {
          proxy_set_header X-Forwarded-Prefix /ib/geoserver;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://cangling_map/;
          proxy_buffering off;
        }
        location ^~ /geoserver/ {
          proxy_set_header X-Forwarded-Prefix /geoserver;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://cangling_map/;
          proxy_buffering off;
        }
        location = /cangling-tile { return 308 /cangling-tile/; }
        location ^~ /cangling-tile/ {
          proxy_set_header X-Forwarded-Prefix /cangling-tile;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://cangling_tile/;
          proxy_buffering off;
        }
        location = /cangling-broker { return 308 /cangling-broker/; }
        location ^~ /cangling-broker/ {
          proxy_set_header X-Forwarded-Prefix /cangling-broker;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_pass http://cis_mqtt/;
          proxy_request_buffering off;
          proxy_buffering off;
        }
        location ^~ /tilecache/ { proxy_pass http://cangling_tile/; }
        location /np4-images/ { root /var/www; }
        location ^~ /ib/ { proxy_pass http://cis_server/; proxy_request_buffering off; proxy_buffering off; }
        location / { proxy_pass http://cis_base/; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cangling-nginx, namespace: cangling}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: cangling-nginx}}
  template:
    metadata: {labels: {app: cangling-nginx}}
    spec:
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: n01}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: hub.cangling.cn/cangling/nginx-rtmp:v4.2.35
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 7600, hostPort: 7600}]
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: html, mountPath: /var/www/html}
            - {name: images, mountPath: /var/www/np4-images}
            - {name: logs, mountPath: /var/log/nginx}
      volumes:
        - {name: config, configMap: {name: cangling-nginx}}
        - {name: html, hostPath: {path: /opt/cangling-nginx/html, type: Directory}}
        - {name: images, hostPath: {path: /mnt/cangling/cangling-share/storage/np4-resource-images, type: Directory}}
        - {name: logs, hostPath: {path: /opt/cangling/local/nginx-log, type: DirectoryOrCreate}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cangling-map
  namespace: cangling
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cangling-map
  template:
    metadata:
      labels:
        app: cangling-map
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        kubernetes.io/hostname: n01
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cangling-map
          image: hub.cangling.cn/cangling/cangling-map:0.1.11
          imagePullPolicy: IfNotPresent
          env:
            - {name: MAP_SERVER_ADDRESS, value: "0.0.0.0:3000"}
            - {name: CATALOG_DATABASE_URL, value: "sqlite:///data/catalog.db?mode=rwc"}
            - {name: WMTS_CACHE_BACKEND, value: cangling-tile}
            - {name: CANGLING_TILE_URL, value: "http://cangling-tile:7601"}
            - {name: CANGLING_TILE_TOKEN, valueFrom: {secretKeyRef: {name: cangling-secret, key: CANGLING_TILE_AUTH_TOKEN}}}
            - {name: MAP_CACHE_ROOT, value: /cache}
            - {name: MAP_RENDER_BACKEND, value: cpu}
            - {name: RUST_LOG, value: "map_server=info,cangling_gdal_core=info,tower_http=info"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "4", memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: cache, mountPath: /cache}
            - {name: geodata, mountPath: /geodata, readOnly: true}
      volumes:
        - {name: data, hostPath: {path: /opt/cangling/local/cangling-map/data, type: Directory}}
        - {name: cache, hostPath: {path: /opt/cangling/local/cangling-map/cache, type: Directory}}
        - {name: geodata, hostPath: {path: /opt/cangling/local/cangling-map/geodata, type: DirectoryOrCreate}}
---
apiVersion: v1
kind: Service
metadata:
  name: cangling-map
  namespace: cangling
spec:
  selector:
    app: cangling-map
  ports:
    - {name: http, port: 3000, targetPort: http}
