apiVersion: v1
kind: Namespace
metadata:
  name: cangling
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cangling-manager
  namespace: cangling
---
# 实验环境：cis-server/cis-k8s 需要创建和调度业务资源，后续应按实际 API 收敛权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cangling-manager-experiment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: cangling-manager
    namespace: cangling
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cangling-env
  namespace: cangling
data:
  TZ: Asia/Shanghai
  HOST: "192.168.3.121"
  DATA_PATH: /mnt/cangling/cangling-share/storage
  DOMAIN_NAME: np4.mapway.cn
  VOLUME_DEFAULT_PATH: /mnt/cangling/storage/volumes
  HOST_KAFKA: "192.168.3.121"
  JDBC_DRIVER_NAME: org.postgresql.Driver
  JDBC_URL_PREFIX: jdbc:postgresql
  JDBC_DEFAULT_DB: postgres
  JDBC_SCHEMA: cl,public
  CL_BROKER_HOST: cangling-broker
  CL_BROKER_PORT: "7500"
  CL_BROKER_WEBPORT: "7501"
  CL_BROKER_MQTT_WSPORT: "0"
  KAFKA_PORT: "12001"
  POSTGIS_USER: cangling
  LDAP_PORT: "389"
  WEB_PORT: "7600"
  K8S_PORT: "7109"
  MAP_PORT: "7110"
  AI_WEB: http://192.168.3.121:7600
  HOST_GEOSERVER_URL: http://cangling-map:3000
  AI_MAP: http://cis-map:8079/
  MAP_FRONT: ""
  AI_IMAGE_PREFIX: ""
  MQTT_WEB_SERVER: ""
  GEOSERVER_FRONT: http://192.168.3.121:7600/geoserver
  AI_K8S_NAMESPACE: np4
  AI_THEME: ib-theme
  PROJECT_DIR_NAME: ib
  IB_CACHE_PATH: /opt/cangling/local/ibcache
  IM_THEME: base
  SERVER_URL: https://app.cangling.cn/
  AI_IM_PATH: /mnt/cangling/storage/imdata
  CL_BASE_PATH: /mnt/cangling/cangling-share/storage/cldata
  CL_SERVER_URL: http://192.168.3.121:7600/
  ENABLE_DOC: "false"
  POSTGIS_MVT_USER: cangling
  TILE_CACHE_URL: http://cangling-tile:7601
  TILE_CACHE_CONFIG_DIR: /app/config
  TILE_CACHE_MEMORY_CACHE_BYTES: "536870912"
  TILE_CACHE_ROOT: /app/tiledata
  CIS_MONGO_MIGRATION_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: cangling-secret
  namespace: cangling
type: Opaque
stringData:
  POSTGIS_PWD: "cangling-postgis"
  POSTGIS_MVT_PWD: "cangling-postgis"
  CANGLING_TILE_ADMIN_PASSWORD: "Ji2*p8Uh"
  CANGLING_TILE_AUTH_TOKEN: "632ad553d15944e900de07df883b3eadefbf4a21"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cis-postgis, namespace: cangling}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: cis-postgis}}
  template:
    metadata: {labels: {app: cis-postgis}}
    spec:
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: n01}
      containers:
        - name: postgis
          image: hub.cangling.cn/cangling/postgis:17-3.5
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_DB, value: cis}
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
            - {name: POSTGRES_USER, value: cangling}
            - {name: POSTGRES_PASS, valueFrom: {secretKeyRef: {name: cangling-secret, key: POSTGIS_PWD}}}
            - {name: ALLOW_IP_RANGE, value: "0.0.0.0/0"}
            - {name: POSTGRES_MULTIPLE_EXTENSIONS, value: "postgis,hstore,postgis_topology,postgis_raster,pgrouting"}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, cangling]}, initialDelaySeconds: 15, periodSeconds: 10}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: localtime, mountPath: /etc/localtime, readOnly: true}
      volumes:
        - {name: data, hostPath: {path: /opt/cangling-core/postgis, type: Directory}}
        - {name: localtime, hostPath: {path: /etc/localtime, type: File}}
---
apiVersion: v1
kind: Service
metadata: {name: cis-postgis, namespace: cangling}
spec: {selector: {app: cis-postgis}, ports: [{name: postgres, port: 5432, targetPort: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cangling-broker, namespace: cangling}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: cangling-broker}}
  template:
    metadata: {labels: {app: cangling-broker}}
    spec:
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: n01}
      containers:
        - name: broker
          image: hub.cangling.cn/cangling/cangling-broker:0.1.60
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: cangling-env}}, {secretRef: {name: cangling-secret}}]
          ports: [{name: broker, containerPort: 7500}, {name: web, containerPort: 7501}]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, hostPath: {path: /opt/cangling-core/broker, type: DirectoryOrCreate}}]
---
apiVersion: v1
kind: Service
metadata: {name: cangling-broker, namespace: cangling}
spec: {selector: {app: cangling-broker}, ports: [{name: broker, port: 7500}, {name: web, port: 7501}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cangling-tile, namespace: cangling}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: cangling-tile}}
  template:
    metadata: {labels: {app: cangling-tile}}
    spec:
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: n01}
      containers:
        - name: tile
          image: hub.cangling.cn/cangling/cangling-tile:0.1.20
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: cangling-env}}, {secretRef: {name: cangling-secret}}]
          ports: [{containerPort: 7601}]
          volumeMounts:
            - {name: tiledata, mountPath: /app/tiledata}
            - {name: config, mountPath: /app/config}
      volumes:
        - {name: tiledata, hostPath: {path: /opt/cangling/local/tiledata, type: Directory}}
        - {name: config, hostPath: {path: /opt/cangling-core/tile-config, type: Directory}}
---
apiVersion: v1
kind: Service
metadata: {name: cangling-tile, namespace: cangling}
spec: {selector: {app: cangling-tile}, ports: [{port: 7601, targetPort: 7601}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cis-server, namespace: cangling}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: cis-server}}
  template:
    metadata: {labels: {app: cis-server}}
    spec:
      enableServiceLinks: false
      serviceAccountName: cangling-manager
      nodeSelector: {kubernetes.io/hostname: n01}
      containers:
        - name: cis-server
          image: hub.cangling.cn/cangling/gdal-base:v4.2.35
          imagePullPolicy: IfNotPresent
          command: [java, -jar, /app/app.jar]
          envFrom: [{configMapRef: {name: cangling-env}}, {secretRef: {name: cangling-secret}}]
          ports: [{containerPort: 8078}]
          readinessProbe: {tcpSocket: {port: 8078}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 12}
          volumeMounts: &javaMounts
            - {name: passwd, mountPath: /etc/passwd, readOnly: true}
            - {name: ibcache, mountPath: /var/ibcache}
            - {name: np4, mountPath: /mnt/prod/np4}
            - {name: modules, mountPath: /app/module}
            - {name: backup, mountPath: /ibbackup}
            - {name: cldata, mountPath: /app/imdata}
            - {name: jar, mountPath: /app/app.jar, readOnly: true}
      volumes: &serverVolumes
        - {name: passwd, hostPath: {path: /etc/passwd, type: File}}
        - {name: ibcache, hostPath: {path: /opt/cangling/local/ibcache, type: Directory}}
        - {name: np4, hostPath: {path: /mnt/cangling/cangling-share/storage/np4, type: Directory}}
        - {name: modules, hostPath: {path: /mnt/cangling/cangling-share/storage/algo_tools, type: Directory}}
        - {name: backup, hostPath: {path: /opt/cangling/local/ibbackup, type: Directory}}
        - {name: cldata, hostPath: {path: /mnt/cangling/cangling-share/storage/cldata, type: Directory}}
        - {name: jar, hostPath: {path: /opt/cangling-np4/jars/cis-server-1.0.0.jar, type: File}}
---
